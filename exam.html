<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل اللجنة الامتحانية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: sticky search bar, category rail beside a single column of issue cards; rail becomes a chip row on phones */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#13262B; --muted:#5A6E72; --line:#D9E2E0;
  --accent:#0E6B66; --accent-soft:#DDEFEC; --mark:#FFE58A; --err-bg:#FBEEEE; --err-fg:#9B2C2C;
  --ok:#23804A; --ok-bg:#E3F3E8; --sug:#1D5D9B; --sug-bg:#E2EDF9; --part:#A8620E; --part-bg:#FCEFDD; --no:#B8342A; --no-bg:#FBE6E4;
  --display:"Reem Kufi","Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#162427; --ink:#E4EEEC; --muted:#93A8A6; --line:#26393C;
  --accent:#4FC2B8; --accent-soft:#16383A; --mark:#6B5A12; --err-bg:#3A1F1F; --err-fg:#F2AAAA;
  --ok:#6FD08F; --ok-bg:#183223; --sug:#86B8EE; --sug-bg:#172A3F; --part:#F0B565; --part-bg:#3A2A14; --no:#F28F86; --no-bg:#3D1C19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#162427; --ink:#E4EEEC; --muted:#93A8A6; --line:#26393C;
  --accent:#4FC2B8; --accent-soft:#16383A; --mark:#6B5A12; --err-bg:#3A1F1F; --err-fg:#F2AAAA;
  --ok:#6FD08F; --ok-bg:#183223; --sug:#86B8EE; --sug-bg:#172A3F; --part:#F0B565; --part-bg:#3A2A14; --no:#F28F86; --no-bg:#3D1C19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.search{flex:1 1 320px;position:relative;min-width:0}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 40px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:6px}
.search button:focus-visible{outline:2px solid var(--accent)}
select{font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
select:focus-visible{outline:2px solid var(--accent)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:24px 60px}
nav.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.cats .lbl{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 10px 6px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:right;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.cat:hover{background:var(--accent-soft)}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.cat[aria-pressed="true"] .n{color:var(--surface);background:transparent}
.cat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cat .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);background:var(--bg);padding:0 8px;border-radius:999px}
.cat.zero{opacity:.45}
main{min-width:0}
section.group{margin-bottom:34px}
section.group h2{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
section.group h2 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.cards{display:flex;flex-direction:column;gap:12px}
article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-inline-start:4px solid var(--st)}
article[data-s="محلولة"]{--st:var(--ok)} article[data-s="حل مقترح"]{--st:var(--sug)}
article[data-s="حل جزئي"]{--st:var(--part)} article[data-s="بلا حل"]{--st:var(--no)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pill{font-weight:600;font-size:12px;padding:1px 10px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.sug{background:var(--sug-bg);color:var(--sug)}
.pill.part{background:var(--part-bg);color:var(--part)} .pill.no{background:var(--no-bg);color:var(--no)}
.num{font-variant-numeric:tabular-nums}
.q{font-weight:600;font-size:15.5px;margin:0 0 10px}
.err{background:var(--err-bg);color:var(--err-fg);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 10px}
.err::before{content:"رسالة النظام: ";font-weight:600}
.sol{margin:0}
.sol .k,.note .k{font-weight:700;color:var(--accent)}
.note{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-block:16px 30px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  nav.cats{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.cats .lbl{display:none}
  .cat{width:auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
  .bar{position:static}
  .search{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){article{transition:border-color .15s}}
</style>
<style>
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.topic{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.topic .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.topic[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.topic[aria-selected="true"] .n{color:var(--surface)}
.topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.cats .lbl{margin-top:10px}
@media (max-width:820px){body[data-view="guides"] nav.cats{display:none}}
.vid{margin:10px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft);padding:10px 12px}
.vid .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.vid .vt{font-weight:700;color:var(--accent);font-size:13.5px;display:flex;gap:6px;align-items:center}
.vid p{margin:0;font-size:14px}
.vid .vn{margin-top:4px;font-size:12.5px;color:var(--muted)}
.vid button{font:inherit;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:1px 12px;cursor:pointer}
.vid button:hover{background:var(--accent);color:var(--surface)}
.vid button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .n{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;background:var(--surface);color:var(--muted);padding:0 8px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow:hidden}
.ghead{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:linear-gradient(to left,var(--accent-soft),transparent 70%)}
.ghead h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;line-height:1.5;text-wrap:balance}
.ghead .gs{margin:2px 0 0;color:var(--ink);font-weight:500}
.ghead .src{margin:8px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.ghead .src svg{flex:0 0 auto;margin-top:4px;color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.toc a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:2px 10px;border-radius:999px;background:var(--bg)}
.toc a:hover,.toc a:focus-visible{border-color:var(--accent);outline:none}
.sec{padding:16px 20px;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h3 .t{font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:0 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.sec p{margin:0 0 8px}
.sec blockquote{margin:0 0 8px;padding:0 14px 0 0;border-right:2px solid var(--line)}
.sec blockquote p{margin:0 0 4px}
.sec .subh{font-weight:700;color:var(--accent);margin-top:6px}
.sec img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:8px auto;background:#fff}
.tw{overflow-x:auto;margin:6px 0 10px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tw th{background:var(--accent);color:var(--surface);font-weight:600;text-align:right;padding:6px 10px}
.tw tr:not(:first-child) th{background:transparent;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line)}
.tw td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
.tw tr:nth-child(even) td{background:var(--bg)}
.srcline{font-size:12px;color:var(--muted);margin:6px 0 0}
.hits{font-size:12.5px;color:var(--muted);padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
@media (max-width:820px){.bar .tabs{width:100%}.tab{flex:1;justify-content:center}}
</style>
<style>
.sysnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sysnav a,.sysnav span{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--accent);background:var(--surface)}
.sysnav span{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.sysnav a:hover,.sysnav a:focus-visible{border-color:var(--accent);outline:none}
.newpill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--new-bg);color:var(--new);border:1px solid var(--new);white-space:nowrap;line-height:1.7}
.newpill.upd{background:var(--upd-bg);color:var(--upd);border-color:var(--upd)}
.cat .r{display:flex;gap:6px;align-items:center}
.cat[aria-pressed="true"] .newpill{background:var(--surface)}
nav.cats .lbl{margin-top:12px;font-weight:600}
.onlynew{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer}
.onlynew input{accent-color:var(--new);width:16px;height:16px}
article.isnew{box-shadow:0 0 0 2px var(--new-bg)}
.also{font-size:12px;color:var(--muted);margin-top:8px}
.also b{font-weight:600;color:var(--ink)}
.vid a.btn{font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:1px 12px;text-decoration:none}
.vid a.btn:hover{background:var(--accent);color:var(--surface)}
.log{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.log table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
.log th{background:var(--bg);text-align:right;padding:6px 10px;font-weight:600}
.log td{border-top:1px solid var(--line);padding:6px 10px;vertical-align:top}
.log tr.cur td{background:var(--new-bg)}
.ghead .gmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tabhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:3}
.tabhead .crumb{font-size:12px;color:var(--muted)}
.tabhead .tt{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.segb .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.segb[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.segb[aria-selected="true"] .n{color:var(--surface)}
.segb.zero{opacity:.5}
.segb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.tabhead{position:static}}
/* sidebar styled like the application's dark side menu */
nav.cats{background:var(--side-bg);border-radius:14px;padding:10px 8px;gap:0!important;max-height:calc(100vh - 110px);overflow-y:auto}
nav.cats .cat{color:var(--side-fg);padding:7px 10px;font-size:13.5px}
nav.cats .cat:hover{background:var(--side-hover)}
nav.cats .cat[aria-pressed="true"]{background:var(--side-act);color:#fff}
nav.cats .cat .n{background:var(--side-pill);color:var(--side-act);font-weight:600}
nav.cats .cat[aria-pressed="true"] .n{background:#fff;color:var(--side-act)}
nav.cats .cat.zero{opacity:.5}
nav.cats .cat .nm{display:flex;flex-direction:column;align-items:flex-start;text-align:right}
nav.cats .cat .acc{font-size:11px;color:var(--side-mut);font-weight:400}
nav.cats .cat[aria-pressed="true"] .acc{color:#f3d6da}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:13.5px;font-weight:700;color:var(--side-head);background:none;border:0;padding:12px 10px 6px;cursor:pointer;text-align:right}
.grp:focus-visible{outline:2px solid var(--side-head);border-radius:6px}
.grp .r{display:flex;gap:8px;align-items:center}
.grp .chev{transition:transform .15s;display:inline-block;font-size:12px;opacity:.8}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp .gn{font-size:11.5px;font-weight:500;color:var(--side-mut);margin-inline-start:6px}
.gitems{display:flex;flex-direction:column;gap:1px;padding-inline-start:6px}
.gitems[hidden]{display:none!important}
nav.cats .allbtn{margin-bottom:4px}
:root{--side-bg:#1F2433;--side-fg:#E7EAF0;--side-head:#C5CCD8;--side-mut:#9AA3B2;--side-hover:#2C3345;--side-act:#8E2433;--side-pill:#FBEFF0}
@media (max-width:820px){
  nav.cats{flex-direction:column!important;overflow-y:visible!important;max-height:none!important;position:static!important;padding:8px!important}
  body[data-view="guides"] nav.cats{display:flex!important}
  nav.cats .cat{width:100%!important;white-space:normal!important;border:0!important;flex:none!important}
  nav.cats .cat:not([aria-pressed="true"]){background:none!important}
}
:root{--new:#B4530F;--new-bg:#FFF1E2;--upd:#6A3FA0;--upd-bg:#F2ECFA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--new:#F5A35C;--new-bg:#3A2614;--upd:#C3A6F0;--upd-bg:#2A2140}}
:root[data-theme="dark"]{--new:#F5A35C;--new-bg:#3A2614;--upd:#C3A6F0;--upd-bg:#2A2140}
</style>

<header class="top"><div class="wrap">
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
  <nav class="sysnav" id="sysnav" aria-label="الأنظمة"></nav>
</div></header>

<div class="bar"><div class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث بأي كلمة أو جزء من كلمة..." autocomplete="off" aria-label="بحث">
    <button id="clr" type="button" aria-label="مسح البحث" hidden>×</button>
  </div>
  <select id="fs" aria-label="الحالة"><option value="">كل الحالات</option></select>
  <select id="fg" aria-label="المجموعة"><option value="">كل المجموعات</option></select>
  <label class="onlynew"><input type="checkbox" id="onlynew"> الجديد فقط</label>
  <span class="count" id="count"></span>
</div></div>

<div class="wrap layout">
  <nav class="cats" id="cats" aria-label="تبويبات النظام"></nav>
  <main id="list"></main>
</div>

<footer><div class="wrap">
  <div style="font-weight:600;color:var(--ink);margin-bottom:4px">سجل التحديثات</div>
  <div class="log" id="log"></div>
  <p id="foot" style="margin-top:10px"></p>

rror": "", "solution": "السبب غالباً تكرار التسجيل وإلغائه، أو تسجيل الطالب على مواد أكثر مما يمتحن فيه. لا يوجد إصلاح تلقائي: احذف كل تسجيلات المواد من نظام اللجنة الامتحانية، ثم سجّل الطالب على المواد المطلوبة فقط، ثم ولّد قوائم الدرجات والفترة من جديد.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["grade_lists"], "elsewhere": [], "vid": []}, {"n": 20, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "إدارة الامتحانات والنتائج", "problem": "الدرجات الإضافية، وإعادة الفترة الامتحانية، ومتى تصل النتائج إلى SIS.", "error": "", "solution": "الدرجات الإضافية لا تُدخل أثناء الإدخال الأول؛ غيّر حالة الفترة إلى (إدخال درجات إضافية) أولاً. إعادة الفترة الامتحانية لتصحيح خطأ تحذف الدرجات الإضافية. والنتائج لا تنتقل إلى SIS إلا بعد إعلانها، لذلك قد تختلف الدرجة بين النظامين قبل الإعلان.", "source": "الورشة الوزارية 23-9-2026 + شرح فيديو", "status": "محلولة", "notes": "انظر شرح تدقيق الدرجات والموافقات.", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["exams", "results"], "elsewhere": [], "vid": [{"g": "audit", "i": 7, "name": "تدقيق الدرجات والموافقات", "step": "الدرجات الإضافية", "text": "", "note": ""}]}, {"n": 21, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "المواد وقوائم الدرجات", "problem": "طلبة مرحلة أعلى يظهرون في قوائم مرحلة أدنى، أو يختفون منها.", "error": "", "solution": "السبب فلتر المرحلة. الأفضل اختيار (الكل) في فلتر المرحلة بدل مرحلة محددة، خصوصاً لطلبة التحميل والعبور.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["grade_lists"], "elsewhere": [], "vid": []}, {"n": 22, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "تعليمات وكتب رسمية", "problem": "من يرى الإحصائيات والتقارير؟", "error": "", "solution": "حسب الصلاحية: مدير التسجيل يرى إحصائيات النقل. ورئيس القسم والعميد ورئاسة الجامعة يرون تقارير الدرجات والحضور ونسب الإنجاز للدراسات الأولية والعليا، مع فلاتر الفصل والمرحلة ونوع الدراسة والبرنامج، ويمكن تصديرها للمطابقة.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["reports"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إحصائيات الترحيل"}], "vid": []}, {"n": 23, "date": "27/10/2026 10:01 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "التراجع عن الترحيل. ثلاث حالات طُرحت: (1) رُحّل الدور الأول ثم الثاني، وبعد التراجع لمعالجة طالب صار ترحيل الدور الأول غير متاح. (2) رُحّلت المرحلة الثانية نهائياً بدوريها قبل المرحلة الأولى، والآن لا يمكن ترحيل المرحلة الأولى. (3) طلب التراجع عن تحويل نتائج الطلاب إلى SIS.", "error": "", "solution": "لم يُجب عليها في المجموعة. وفي الورشة الوزارية (21-9-2026) أُعلن أن التراجع عن الجاهزية والترحيل صار ممكناً لطالب محدد أو للقسم كاملاً، من حساب اللجنة الامتحانية. ومن فيديو التراجع والجاهزية: أُضيف زر (التراجع عن تهيئة السنة الدراسية) في إدارة الترحيل.", "source": "الورشة الوزارية + شرح فيديو", "status": "حل مقترح", "notes": "سابقاً ذُكر في مجموعة مسجلي الطلبة أن الترحيل المكتمل لا يمكن التراجع عنه، وما أعلنته الورشة أحدث. تكررت الحالة الثانية في 1-11. وحالة قريبة: في النظام السنوي حُذفت فترة المرحلة الرابعة لمعالجة خطأ، فتعذّر إنشاء فترة المرحلة الثالثة لمواد التحميل، وعند إعادة فترة الرابعة طلب النظام تنفيذ promotion:revert أولاً. الدعم: الفريق المختص يعالجها.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 ليلاً", "tabs": ["promo"], "elsewhere": [], "vid": [{"g": "promotion", "i": 5, "name": "ترحيل الطلبة إلى 2026-2027", "step": "التراجع", "text": "التراجع عن الجاهزية والترحيل ممكن لطالب محدد أو للقسم كاملاً من حساب اللجنة الامتحانية، حسب الورشة الوزارية.", "note": "", "href": "sis.html#s-promotion-5", "sysname": "نظام إدارة معلومات الطالب SIS"}, {"g": "fix", "i": 6, "name": "تصحيح درجات طالب بعد الإعلان أو الترحيل", "step": "الخطوة 6", "text": "الفيديو يذكر التراجع عن ترحيل طلاب الفترة لتطبيق تصحيح، ثم إعادة الترحيل. التراجع يحذف السير الدراسية المرتبطة بتلك الفترة حتى يُعاد الترحيل.", "note": ""}]}, {"n": 25, "date": "27/10/2026 10:31 م", "group": "مجموعة SIS", "cat": "التخرج", "problem": "طالب متخرج من الدور الأول تظهر حالته (جديد) عند الترحيل، وتحديث النتيجة لم يغيّرها.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم + شرح فيديو", "status": "حل مقترح", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["promo"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إدارة التخرج"}, {"sys": "نظام إدارة معلومات الطالب SIS", "tab": "بيانات التخرج"}], "vid": [{"g": "poly", "i": 5, "name": "تسجيل طلبة البوليتكنك", "step": "الخطوة 5", "text": "تأكد أن حالة الطالب حُدّثت إلى متخرج: من إدارة التخرج اختر الطالب، ثم (تحديث حالة التسجيل) إلى (متخرج).", "note": "الشرح لم يتناول هذه الحالة بعينها، فإن بقيت المشكلة راسل الدعم.", "href": "sis.html#s-poly-5", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 27, "date": "28/10/2026 12:18 ص", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "ظهرت (درجات معلقة) لمادة، وعدد الطلبة المعلقين كبير (157 طالباً). هل يلزم إعادة الفترة؟", "error": "حالة الدرجة: معلق", "solution": "الدعم: ارجع إلى خطوة إدخال الدرجات لتعديل الدرجات المعلقة وإضافتها. عضو شرح الطريقة الأسهل دون حذف الفترة: أوقف المعالجات وأرسل الفترة إلى التدقيق والمصادقة، ثم استخدم زر (إعادة الفترة الامتحانية) بجانب تغيير الحالة فيلغي المعالجات ويرجعها للتدقيق، ثم اضغط تحديث (رفرش) للامتحان فيعيد حساب النتائج، ثم أنهِ التدقيق وصادق. السبب غالباً أن الدرجات حُفظت دون إكمال العملية فلم تُحتسب النتيجة. التصحيح لا يحتاج تدقيقاً، والفترة الثانية كذلك.", "source": "فريق الدعم", "status": "محلولة", "notes": "الخطوات التفصيلية من عضو. الصورة: IMG-20261028-WA0000.jpg", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["exams"], "elsewhere": [], "vid": []}, {"n": 32, "date": "28/10/2026 12:54 م", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "لا يمكن حذف الطلبة من المادة الدراسية لأنهم مرتبطون بنظام اللجنة الامتحانية.", "error": "", "solution": "يجب فك ارتباط الطالب من اللجنة أولاً، وذلك بحذف الطلبة من قوائم درجات المادة في نظام إدارة الامتحانات، ثم الحذف من المادة.", "source": "فريق الدعم", "status": "محلولة", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}], "vid": []}, {"n": 33, "date": "28/10/2026 1:01 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "طلاب نتيجتهم ناجح من الدور الأول، لكن عند الترحيل تظهر (راسب).", "error": "", "solution": "الدعم: يمكن تغيير حالة النتيجة من خانة (إعادة احتساب النتيجة).", "source": "فريق الدعم", "status": "حل جزئي", "notes": "لم يؤكد صاحب السؤال أن الحل نجح.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["promo", "results"], "elsewhere": [], "vid": []}, {"n": 34, "date": "28/10/2026 2:40 م", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "طالب في الدور الثاني درجته 46 ومشمول بقرار المعالجة، ولا يظهر عند فتح المعالجات.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["treatment"], "elsewhere": [], "vid": []}, {"n": 35, "date": "28/10/2026 4:10 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "عند الترحيل يظهر أن هناك طلبة لا يمكن ترحيلهم، مع أن نتيجتهم ناجح في الامتحانات وفي SIS، ولم تُفعَّل لهم سيرة جديدة.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["promo"], "elsewhere": [], "vid": []}, {"n": 38, "date": "28/10/2026 8:15 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "عند ترحيل الدور الأول لعام 2025-2026 يظهر تنبيه بسبب طلبة لا توجد لهم نتائج مواد، وهم ليسوا ضمن الهيكل لأنهم نُقلوا أو باشروا في كليات أخرى. تكررت عند أكثر من مستخدم.", "error": "لا يمكن تنفيذ الدور الأول حاليًا ... لا توجد نتائج مواد مسجلة لهم في هذه السنة", "solution": "أرسل الأرقام الامتحانية لهؤلاء الطلبة إلى الدعم على الخاص، وهم يعالجون الحالة. الدعم أكد لاحقاً أن المشكلة حُلّت. والإجراء المعتمد الآن: ارفع تذكرة بعنوان (حذف سيرة طالب منقول) فيها أسماء الطلبة وأرقامهم الامتحانية، والدعم يحذف السيرة.", "source": "فريق الدعم", "status": "محلولة", "notes": "قريبة منها في مجموعة مسجلي الطلبة: ترحيل لا يكتمل بسبب طالبة غيّرت جهة قبولها. ومثلها (2-11): طلبة نقل لهم سيرتان في السنة نفسها، والدعم حذف السير المرسلة إليه.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 ليلاً", "tabs": ["promo"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "النقل"}], "vid": []}, {"n": 39, "date": "28/10/2026 9:05 م", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "طلبة العام الدراسي 2026/2027 لم تُولَّد لهم قوائم في نظام اللجنة الامتحانية.", "error": "", "solution": "الدعم: الفريق المختص يعمل على معالجة الموضوع.", "source": "فريق الدعم + شرح فيديو", "status": "بلا حل", "notes": "قيد المعالجة لدى الفريق.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}], "vid": [{"g": "init", "i": 6, "name": "تهيئة العام الدراسي", "step": "الخطوة 5", "text": "تأكد أن كل مواد 2026-2027 بحالة (مكتمل): وصف المقرر، والتدريسي وتوزيعه، والمسؤول عن الدرجات في IQ Learn، والتقييم، وعدد الوحدات.", "note": "اقتراح من الشرح، والدعم قال إن الفريق يعالج المشكلة.", "href": "sis.html#s-init-6", "sysname": "نظام إدارة معلومات الطالب SIS"}, {"g": "coursedata", "i": 0, "name": "استكمال معلومات المواد", "step": "نظرة عامة", "text": "خطوات إكمال كل تبويب في نافذة المادة حتى تصبح حالتها مكتملة، مع ما يخص بولونيا (التقييم التكويني وساعات ECTS) وما يخص الفصلي والسنوي (السعي).", "note": "", "href": "sis.html#s-coursedata-0", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 47, "date": "29/10/2026 11:38 ص", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "طلبة بولونيا (ناجح جزئي) أو راسبون في مادة أو أكثر يمنعون ترحيل الدور الأول. هل تُحوّل حالتهم إلى ناجح، أم يُرحَّلون مع الدور الثاني مثل الراسبين، وماذا نختار لهم: غير جاهز أم متجاهل أم قيد الانتظار؟", "error": "توجد مادة واحدة أو أكثر نتيجتها غير مسجلة كناجح / لا يمكن تنفيذ الدور الأول حالياً: الدور الأول يرحّل الطلبة الناجحين بكل المواد فقط. يوجد 54 طالباً جاهزين غير ناجحين يمنعون تنفيذ هذا الدور.", "solution": "اختر لهم (قيد الانتظار). وفي مجموعة المقررين (3-11) ظهرت الرسالة الثانية، والحل الذي نجح: من إدارة الترحيل في SIS حوّل حالة هؤلاء الطلبة إلى (غير جاهز للترحيل)، ثم رحّل الدور الأول.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "طُرح مرتين. الصورة: IMG-20261031-WA0001.jpg الصورة: IMG-20261103-WA0028.jpg", "kind": "problem", "added": "31/10/2026", "updated": "05/11/2026", "tabs": ["promo"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إدارة الترحيل"}, {"sys": "نظام بولونيا", "tab": "في نظام SIS"}, {"sys": "نظام بولونيا", "tab": "في نظام اللجنة الامتحانية"}], "vid": [{"g": "promotion", "i": 0, "name": "ترحيل الطلبة إلى 2026-2027", "step": "نظرة عامة", "text": "بعد تفعيل الدور الثاني في الترحيل صار يُرحَّل الجميع دفعة واحدة: الناجحون والراسبون والمؤجلون.", "note": "", "href": "sis.html#s-promotion-0", "sysname": "نظام إدارة معلومات الطالب SIS"}, {"g": "promotion", "i": 3, "name": "ترحيل الطلبة إلى 2026-2027", "step": "الخطوة 2", "text": "ترحيل الدور الأول في بولونيا يشترط النجاح في كل المواد، وأي طالب لديه مادة متبقية أو مؤجل يمنعه.", "note": "", "href": "sis.html#s-promotion-3", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 49, "date": "29/10/2026 12:13 م", "group": "مسجلو الطلبة + مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "نتيجة الطالب تظهر (غير معروف). في مجموعة مسجلي الطلبة: طالب راسب بالغياب في جميع المواد ولا يظهر في إدارة الامتحانات، وزملاؤه بالحالة نفسها تظهر نتيجتهم (راسب). في مجموعة SIS: طالب نتيجته ناجح وله مواد ودرجات، لكنه يظهر (غير معروف) في الترحيل وفي SIS، ولم تنفع إعادة احتساب النتائج.", "error": "غير معروف", "solution": "للحالة الأولى: الطالب لا يظهر في إدارة الامتحانات لكنه موجود في SIS. عند الترحيل، إذا كانت حالته الدراسية (راسب بالغياب) تصبح (راسب) وتُفتح له سيرة جديدة في المرحلة نفسها. للحالة الثانية اقترح عضو: ادخل على (معالجة نتائج الطلبة) وغيّر النتيجة إلى (ناجح) ثم احفظ التغييرات.", "source": "عضو في المجموعة", "status": "حل جزئي", "notes": "صاحب سؤال مجموعة SIS لم يؤكد هل نجح الحل.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["results", "promo"], "elsewhere": [], "vid": []}, {"n": 51, "date": "29/10/2026 12:24 م", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "طالبة أُضيفت جديدة على الملحق ورُفعت كل درجاتها، لكنها دور ثانٍ والمادة غير موجودة ضمن مواد الدور الثاني.", "error": "", "solution": "لم يُجب في المجموعة.", "source": "", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["exams"], "elsewhere": [], "vid": []}, {"n": 52, "date": "29/10/2026 12:27 م", "group": "مسجلو الطلبة", "cat": "إدارة الامتحانات والنتائج", "problem": "لا يمكن تغيير حالة الامتحان بعد إعلان النتائج (والدور الأول مُرحَّل).", "error": "تعذر تغيير حالة الامتحان: يجب أن تكون الفترة الامتحانية في حالة \"تدقيق الدرجات\". الحالة الحالية: إعلان النتائج.", "solution": "يجب عمل (إعادة الفترة الامتحانية). قبل التأكيد اقرأ الملاحظة التي تظهر، لأن العملية تحذف كل درجات المعالجة لتلك المرحلة. وإذا كان الترحيل مكتملاً فلا يمكن التراجع. وأي تعديل على الدرجات في نافذة إدارة الامتحانات يتطلب التراجع عن الترحيل أولاً.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "تحذير: إعادة الفترة الامتحانية تحذف درجات المعالجة.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["exams"], "elsewhere": [], "vid": [{"g": "fix", "i": 0, "name": "تصحيح درجات طالب بعد الإعلان أو الترحيل", "step": "متى تستخدم هذه الطريقة", "text": "إذا كان الخطأ في درجات طالب أو عدد قليل من الطلاب، فيمكن تصحيح سجلاتهم وحدها دون إعادة الفترة الامتحانية التي تحذف درجات المعالجة.", "note": ""}]}, {"n": 53, "date": "29/10/2026 12:43 م", "group": "مسجلو الطلبة", "cat": "إدارة الامتحانات والنتائج", "problem": "طالب في المرحلة الثالثة (نظام بولونيا) رسب في مادة واحدة في الدور الأول، وفي الدور الثاني كان في المستشفى يوم الامتحان (عذر مشروع). هل يعيد المادة امتحاناً فقط أم امتحاناً وحضوراً؟", "error": "", "solution": "الراسب الباقي في المرحلة نفسها يحضر محاضرات المواد التي رسب فيها. أما إذا كانت مادة واحدة فهو ناجح بالعبور، ولا يُطالب بحضور المحاضرات، ويؤدي الامتحانات الفصلية والنهائية فقط.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["general"], "elsewhere": [{"sys": "نظام بولونيا", "tab": "في نظام اللجنة الامتحانية"}], "vid": []}, {"n": 57, "date": "29/10/2026 6:05 م", "group": "مجموعة SIS + مقررو الأقسام", "cat": "إدارة الامتحانات والنتائج", "problem": "تعذر إنشاء فترة امتحانية للدور الثاني لأن طلبة مؤهلين للمحاولة الثانية ليس لديهم سجل امتحان في الدور الأول. من الحالات: طالب مؤجل، وطلاب راسبون بالغياب، وطلاب أدوا الدور الأول ونجحوا. وفي مجموعة مقرري الأقسام: طالبان (مرحلة ثانية مسائي) أُجّل لهما الكورس الأول وسيرتهما (تأجيل)، والنظام يرفض الدور الثاني لأن لهما مواد بلا سعي أو درجة دفتر. هل تُحذف موادهما؟ وحالة أخرى (1-11): مواد أُضيفت تلقائياً لطلبة ناجحين دور أول بعد إعلان الجاهزية، فتظهر أسماؤهم بخلل وتمنع إنشاء الدور الثاني. هل تُحذف موادهم؟", "error": "تعذر إنشاء الفترة الامتحانية للدور 2 أو إعادة احتسابها، لوجود طلبة مسجلين فيها دون وجود سجل امتحان لهم في الدور 1 / الطالب ليس لديه سجل درجات في الدور الأول", "solution": "ادخل إلى الفترة الامتحانية للدور الأول واضغط تحديث (رفرش) للمواد التي ظهرت عندك، ثم أدخل درجات الدور الأول للطالب أو اجعله غائباً حسب حالته، وبعدها يمكن إضافة الدور الثاني.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "تواصل الدعم أيضاً مع أصحاب السؤال على الخاص. سؤال حذف مواد الطالبين المؤجلين لم يُجب. الصورة: IMG-20261030-WA0009.jpg سؤال حذف المواد المضافة تلقائياً لم يُجب أيضاً.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 ليلاً", "tabs": ["exams"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إدارة الترحيل"}], "vid": [{"g": "complete", "i": 3, "name": "استكمال تسجيل الطلاب (سنة الترحيل)", "step": "إدارة تسجيل المواد", "text": "للطالب المؤجل الذي له مواد بلا درجات: إدارة تسجيل المواد تسمح بحذف المواد من سيرته، بشرط ألا تكون له نتائج في نظام اللجنة الامتحانية.", "note": "اقتراح مبني على الشرح، ولم يُجرَّب على هذه الحالة.", "href": "sis.html#s-complete-3", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 62, "date": "30/10/2026 9:46 ص", "group": "مسجلو الطلبة", "cat": "الترحيل", "problem": "الترحيل في الكلية لا يكتمل بسبب طالبة عُمل لها تغيير جهة قبول، وجامعتها الجديدة أكملت ترحيلها.", "error": "", "solution": "اجعل الطالبة (غير جاهز) ثم رحّل. هذه حالة دور ثانٍ، ولا تُرحَّل في الدور الأول.", "source": "عضو في المجموعة", "status": "حل مقترح", "notes": "قريبة منها مشكلة (لا يمكن تنفيذ الدور الأول حالياً) بسبب طلبة منقولين.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["promo"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "تغيير جهة القبول"}], "vid": []}, {"n": 63, "date": "30/10/2026 10:45 ص", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "قسم تحوّل في 2025-2026 من النظام السنوي إلى بولونيا، وبقيت مواد في المرحلة الأولى تولدت من ترحيل 2024-2025، وهي تخفض نسبة الإنجاز في نظام اللجنة الامتحانية.", "error": "", "solution": "لم يُجب في المجموعة.", "source": "شرح فيديو", "status": "حل مقترح", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}, {"sys": "نظام بولونيا", "tab": "في نظام SIS"}, {"sys": "نظام بولونيا", "tab": "الطلبة من الأنظمة السابقة"}], "vid": [{"g": "init", "i": 5, "name": "تهيئة العام الدراسي", "step": "الخطوة 4", "text": "المادة التي لم تعد ضمن البرنامج يُحذف توزيعها أولاً، ثم تُحذف المادة من السنة الدراسية.", "note": "الشرح يتكلم عن حذف مواد 2026-2027 الملغاة، وتطبيقه على مواد 2025-2026 لم يُجرَّب.", "href": "sis.html#s-init-5", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 69, "date": "31/10/2026 2:52 ص", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "هل يتطلب ترحيل الدور الأول إعلان نتائج الدور الثاني بعد انتهاء فترة الاعتراض؟", "error": "لا يمكن متابعة الترحيل حتى تصل جميع فترات الاختبارات المرتبطة إلى مرحلة إعلان النتائج.", "solution": "نعم، يجب أن تكتمل كل الفترات الامتحانية المرتبطة بمصادقاتها، سواء دور أول أو ثانٍ، قبل متابعة الترحيل.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "الصورة: IMG-20261030-WA0010.jpg تكررت في مجموعة المقررين (2-11): فترات بقيت في مرحلة (درجات المعالجة) و(اعتراضات) فمنعت الترحيل، والحل إعلان نتائج كل فترة. الصورتان: IMG-20261102-WA0005.jpg و IMG-20261102-WA0006.jpg", "kind": "problem", "added": "31/10/2026", "updated": "05/11/2026", "tabs": ["promo"], "elsewhere": [], "vid": [{"g": "init", "i": 9, "name": "تهيئة العام الدراسي", "step": "الخطوة 8", "text": "الترحيل يكون بعد إكمال كل معلومات الدور الثاني ونتائجه، حتى للطالب الناجح من الدور الأول.", "note": "", "href": "sis.html#s-init-9", "sysname": "نظام إدارة معلومات الطالب SIS"}, {"g": "promotion", "i": 2, "name": "ترحيل الطلبة إلى 2026-2027", "step": "الخطوة 1", "text": "الترحيل الحالي يتم بالدور الثاني: جاهزية في SIS ثم تنفيذ في نظام اللجنة الامتحانية.", "note": "", "href": "sis.html#s-promotion-2", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 70, "date": "31/10/2026 10:26 ص", "group": "مسجلو الطلبة", "cat": "المواد وقوائم الدرجات", "problem": "كيف تتغير (الحالة النهائية للنتيجة) للمادة من (قيد الدراسة) إلى (قيد الانتظار)؟ المواد لسنة 2026-2027. ثلاثة طلاب بهذه الحالة لم تظهر أسماؤهم عند توليد قوائم درجات المرحلة الثانية، الكورس الأول.", "error": "", "solution": "تبقى المادة (قيد الدراسة) وتتغير عند رفع النتيجة النهائية للكورس. رد آخر: تتغير عند توليد قوائم الدرجات. سبب عدم ظهور الطلاب الثلاثة في القوائم لم يُحل. لاحقاً رجّح عضو أن هؤلاء الطلاب غير مُدخلين في الامتحان أو ليس لهم درجات فيه، وقال إن النظام لا يربط المواد بالسير تلقائياً.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل جزئي", "notes": "صاحب السؤال أوضح أن الترحيل ربط المواد بالسير تلقائياً، وأن المشكلة ظهرت عند توليد قوائم الدرجات. الصورة: IMG-20261031-WA0004.jpg", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}, {"sys": "نظام إدارة معلومات الطالب SIS", "tab": "استكمال تسجيل الطلاب"}], "vid": [{"g": "complete", "i": 3, "name": "استكمال تسجيل الطلاب (سنة الترحيل)", "step": "إدارة تسجيل المواد", "text": "إذا كانت المواد غير مربوطة بسير هؤلاء الطلاب، فإدارة تسجيل المواد في خاصية استكمال التسجيل تضيفها إلى السيرة، ما دام الطالب بلا نتائج مسجلة.", "note": "اقتراح مبني على الشرح.", "href": "sis.html#s-complete-3", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 71, "date": "31/10/2026 11:30 ص", "group": "مقررو الأقسام", "cat": "إدارة الامتحانات والنتائج", "problem": "الرجوع لتعديل الدرجات (السعي أو العملي أو النهائي) بعد الوصول إلى مرحلة درجات المعالجة. مثال: رُفعت السعيات والنهائي وانتهى التدقيق ومصادقة رئيس القسم والعميد، ثم اكتُشف أن درجات العملي لم تُرفع.", "error": "", "solution": "طريقتان طُرحتا في المجموعة: (1) أرسل كل المواد إلى التدقيق بعد المعالجة وأنهِ تدقيقها حتى لو لم تُضف درجات معالجة، ثم من حساب رئيس اللجنة الامتحانية ادخل الفترة واضغط (إعادة الامتحان). بعد الإعادة تصادق فقط الفترة التي عدّلتها. وإذا لم يُرحَّل الطلاب بعد فيمكن تغيير سير الامتحان إلى إدخال الدرجات. (2) بعد التحديث الأخير لا تحتاج للتراجع: احذف الطالب الذي فيه الخطأ من الفترة الامتحانية، ثم عدّل سعيه في قائمة الدرجات، ثم أعد إضافته بأيقونة السهمين البرتقالية وأضف له النهائي والقرار.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "أثناء المعالجة لا يمكن تعديل السعي؛ التحديث سمح فقط بحذف درجة الطالب في الامتحان. إذا لم يتحول شيء بعد التدقيق، فتأكد من حساب رئيس اللجنة أن كل المواد انتهى تدقيقها، ثم انشر النتيجة ورحّل.", "kind": "problem", "added": "01/11/2026", "updated": "03/11/2026", "tabs": ["treatment", "exams"], "elsewhere": [], "vid": [{"g": "fix", "i": 3, "name": "تصحيح درجات طالب بعد الإعلان أو الترحيل", "step": "الخطوة 3", "text": "شرح الفيديو للطريقة نفسها: احذف سجل الطالب من الفترة، ثم (إضافة الطلبة الناقصين)، ثم أدخل درجاته المصححة واحفظ. وإن كان الطلاب قد رُحّلوا فتراجع عن الترحيل ثم أعده.", "note": ""}]}, {"n": 74, "date": "31/10/2026 2:18 م", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "طالب نُسي (محمّل بمادة، أو أُضيف متأخراً مثل طلبة المنح) بعد إكمال الفترة والترحيل. يمكن إضافة المادة وتوليد قوائم الدرجات، لكن المادة غير موجودة في الفترة الامتحانية، والتحديث متاح للمواد فقط وليس للفترة كلها. وحالة أخرى: طالبتان أجنبيتان لم تتولد موادهما في الدور الثاني، ولا يمكن حذف الدور الثاني لأن الترحيل الثاني نُفذ.", "error": "دور الترحيل 2 استهلك بالفعل حالات هذه الجولة (دور فترة الاختبارات 2). نفّذ promotion.revert أولاً ثم أعد المحاولة. / سجل الامتحان له سجل في محاولة لاحقة؛ احذف المحاولة اللاحقة أولاً.", "solution": "للدور الأول نجحت هذه الطريقة: أضف للطالب سيرة دراسية وولّد قوائم الدرجات وأدخل السعي، ثم في إدارة الامتحانات ادخل كل مادة في الدور الأول واضغط أيقونة السهمين المتعاكسين، فتظهر رسالة (سيتم إعادة احتساب الامتحان وإضافة قوائم خارج سير العمل) وتتولد القوائم. هذه القوائم لا تُرسل للتدقيق، والوزارة أبلغت بإكمال العمل دونه. أما الدور الثاني فلا تظهر فيه المادة إذا لم يكن فيها طالب آخر محمّل، والمتاح حالياً عمل تراجع للطلاب المشمولين بالفترة لإعادة فتحها، وصاحبة المشكلة جربته ولم ينجح. الدعم: الفريق المختص يعالج الموضوع. وحل الطلبة المضافين بعد إكمال الترحيل (2-11): اضغط (إعادة الاحتساب) مرة واحدة. إذا لم يظهروا فمن (قوائم درجات الطلاب) اختر المرحلة واضغط (توليد قوائم درجات). بعد إدخال درجات الدور الأول: مصادقة، ثم فتح المعالجة، ثم مصادقة ثانية، ثم نشر نتائج الدور الأول، ثم فتح الدور الثاني.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل جزئي", "notes": "اقتُرح على المطورين إضافة إعادة احتساب على مستوى الدور كله، أو تدقيق فردي للمواد المضافة. الصورة: IMG-20261101-WA0001.jpg الصور: IMG-20261102-WA0023.jpg و IMG-20261102-WA0024.jpg و IMG-20261102-WA0032.jpg", "kind": "problem", "added": "01/11/2026", "updated": "03/11/2026 ليلاً", "tabs": ["exams", "grade_lists"], "elsewhere": [], "vid": [{"g": "fix", "i": 3, "name": "تصحيح درجات طالب بعد الإعلان أو الترحيل", "step": "الخطوة 3", "text": "زر (إضافة الطلبة الناقصين) يجلب الطلبة المؤهلين للفترة وغير الموجودين فيها، ويضيفهم خارج سير العمل.", "note": "قد لا يحل حالة المادة التي لم تتولد في الدور الثاني."}, {"g": "audit", "i": 8, "name": "تدقيق الدرجات والموافقات", "step": "طلبة أُضيفوا متأخراً", "text": "إعادة الاحتساب، ثم توليد قوائم الدرجات إذا لزم، ثم المصادقة والمعالجة ونشر الدور الأول قبل فتح الدور الثاني.", "note": ""}]}, {"n": 76, "date": "31/10/2026 5:34 م", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طلبة مستضافون من الدراسة المسائية إلى الصباحية: بعد الترحيل النهائي وتغيير برنامجهم إلى الصباحي، اختفت أسماؤهم من سجل درجات السنة السابقة في نظام الدرجات، مع بقاء معلوماتهم في SIS.", "error": "", "solution": "حسب التعليمات لا يُوافق على الاستضافة ولا تُثبَّت إلا بعد إكمال الترحيل النهائي لعام 2025/2026. إجراء الاستضافة (تسكين الطالب): من ملف الطالب ← معلومات القبول ← زر (البرنامج الدراسي)، اختر السنة الدراسية والبرنامج المستضاف فيه ثم احفظ، فتظهر حالة المعلومات (استضافة في نوع دراسة مختلف). رأي عضو: الطالب يبقى على قبوله المسائي لأن امتحاناته ونتائجه تُثبت على المسائي.", "source": "عضو في المجموعة", "status": "حل جزئي", "notes": "صاحب السؤال كان قد أكمل الترحيل قبل الاستضافة، وسبب اختفاء الأسماء من سجل الدرجات لم يُحل. الصورة: IMG-20261031-WA0016.jpg", "kind": "problem", "added": "01/11/2026", "updated": "", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "الاستضافة"}], "vid": []}, {"n": 78, "date": "31/10/2026 9:31 م", "group": "مقررو الأقسام", "cat": "المواد وقوائم الدرجات", "problem": "طالب درجته 50 يظهر راسباً ويُحوَّل إلى الدور الثاني. السبب أن (أقل درجة للنجاح) في إعدادات المادة كانت 51، والحقل باهت ولا يقبل التعديل.", "error": "", "solution": "الطريقة التي طُرحت: من إدارة الامتحانات احذف قيد الطلاب من امتحان هذه المادة، ثم من SIS احذف تسجيلهم على المادة، وعدّل أقل درجة للنجاح إلى 50، ثم ولّد قوائم الدرجات من جديد (ستعود السعيات)، ثم ارجع للامتحان واعمل (إعادة احتساب) وأضف النهائي.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "الطريقة للمادة المعنية فقط، ولم يؤكد صاحب السؤال نجاحها. للوقاية: راجع أقل درجة للنجاح عند إضافة المادة.", "kind": "problem", "added": "01/11/2026", "updated": "02/11/2026", "tabs": ["exams"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}], "vid": [{"g": "build", "i": 11, "name": "الدليل الشامل: البرنامج والقاعات", "step": "المواد الدراسية للبرنامج", "text": "عند إضافة المادة يكون نوع النتيجة درجة من 100 والدرجة الصغرى للنجاح 50، فراجع هذا الحقل قبل ربط الطلاب بالمادة.", "note": "", "href": "sis.html#s-build-11", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 82, "date": "01/11/2026 10:39 م", "group": "مجموعة SIS + مقررو الأقسام", "cat": "إدارة الامتحانات والنتائج", "problem": "لا يكتمل (إنهاء التدقيق) لمادة.", "error": "تعذر إنهاء التدقيق (جديد): توجد سجلات امتحانية بدون سجل تدقيق", "solution": "لم يُنشر الحل في المجموعة. حسب شرح التدقيق: زر (إنهاء التدقيق) لا يعمل إلا بعد أن تتحول حالة كل طلاب المادة من (قيد الانتظار) إلى (موافق). وفي مجموعة المقررين: صفِّ السجلات التي حالتها (قيد الانتظار) أو (مرفوض) وتأكد أنه لا يوجد طالب بلا تدقيق، والعملية من حساب رئيس اللجنة التدقيقية. الطلبة الذين صُححت درجاتهم يظهرون (جدد) بلا تدقيق، فلا بد من الموافقة عليهم أيضاً.", "source": "شرح فيديو + شرح فيديو", "status": "حل جزئي", "notes": "صاحب السؤال أفاد أن الطلبة المصححين لم تتعدل حالتهم عنده. الصورة: IMG-20261102-WA0001.jpg", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "05/11/2026", "tabs": ["exams"], "elsewhere": [], "vid": [{"g": "audit", "i": 4, "name": "تدقيق الدرجات والموافقات", "step": "الخطوة 4", "text": "إنهاء التدقيق بعد أن يصبح كل الطلاب (موافق).", "note": ""}]}, {"n": 83, "date": "02/11/2026 9:55 ص", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "طلبة ناجحون دور أول لا يظهرون عند تفعيل الفلتر.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم + شرح فيديو", "status": "بلا حل", "notes": "تحقق من الفلاتر: البرنامج والنظام الدراسي (فصلي أو بولونيا) والدراسة (صباحي أو مسائي). الصور: IMG-20261102-WA0003.jpg و IMG-20261102-WA0004.jpg", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["promo"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إدارة الترحيل"}], "vid": [{"g": "promotion", "i": 3, "name": "ترحيل الطلبة إلى 2026-2027", "step": "الخطوة 2", "text": "حدد البرنامج والنظام الدراسي والدراسة بدقة لظهور الطلبة.", "note": "", "href": "sis.html#s-promotion-3", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 86, "date": "02/11/2026 12:01 م", "group": "مجموعة SIS", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طالب نُقل فاختفى من قوائم اللجنة الامتحانية، والقسم لم يكمل درجاته لعام 2025-2026.", "error": "", "solution": "لم يُجب عليها في المجموعة.", "source": "صاحب السؤال", "status": "بلا حل", "notes": "للوقاية: لا تثبّت النقل إلا بعد إكمال نتائج الطالب وسيرته في الكلية الأصلية.", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "النقل"}], "vid": []}, {"n": 88, "date": "02/11/2026 6:04 م", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "لا يمكن إدخال درجات القرار للدور الثاني.", "error": "", "solution": "من حساب رئيس اللجنة: إدارة الامتحان، ادخل الدور الأول وغيّر سير الامتحان إلى (إدخال درجات إضافية)، ثم أدخل درجات القرار. صاحب السؤال جرّبها ونجحت.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["exams", "treatment"], "elsewhere": [], "vid": [{"g": "audit", "i": 7, "name": "تدقيق الدرجات والموافقات", "step": "الدرجات الإضافية", "text": "الدرجات الإضافية تحتاج تغيير حالة الفترة إلى (إدخال درجات إضافية) أولاً.", "note": ""}]}, {"n": 90, "date": "03/11/2026 12:49 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "طالب دفع أجور الهوية متأخراً وأُدخلت درجاته وهو (جاهز للترحيل)، وعند ترحيله تظهر (تم الترحيل بنجاح) ولا يُرحَّل. وكذلك الطلبة المضافون حديثاً.", "error": "Missing target-year StudentStudyProgram", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم", "status": "بلا حل", "notes": "معنى الرسالة: لا يوجد للطالب برنامج دراسي في سنة الترحيل. الدعم طلب حساب رئيس اللجنة واسم أحد الطلبة. الصورة: IMG-20261103-WA0003.jpg", "kind": "problem", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["promo"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إدارة الترحيل"}], "vid": []}, {"n": 108, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "هل يجوز أن تزيد فقرات التكويني على 40؟", "error": "", "solution": "لا. في الطريقة المعتمدة الآن في SIS يُدخل التكويني من 40 مباشرة، ولا يجبره النظام لاحقاً. يمكن اعتماد 4 فقرات أو أكثر بشرط أن مجموع أوزانها 40 بالضبط، وإلا يرفض النظام الإدخال ويُظهر تحذيراً.", "source": "فيديو التقييم التكويني في SIS", "status": "محلولة", "notes": "التفاصيل والمثال المحلول في شرح (حساب التقييم التكويني وإعداد ملف الإكسل).", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["grade_lists"], "elsewhere": [{"sys": "نظام بولونيا", "tab": "التقييم التكويني وملف الإكسل"}, {"sys": "نظام بولونيا", "tab": "توزيع درجة المادة"}], "vid": []}, {"n": 110, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "المعالجة (القرار) للدرجات بين 45 و49.", "error": "", "solution": "يعالجها أستاذ المادة حصراً، دون تدخل الوزارة أو الجامعة أو الكلية أو القسم، بتكليف الطالب بعمل إضافي (مشروع أو تقرير أو واجب) خلال أسبوع من تبليغه، ويُوثَّق باستمارة خاصة. ولا تتجاوز درجات المعالجة 5 درجات. وفي نظام اللجنة الامتحانية تُطبَّق بعد تحويل حالة الامتحان إلى (الدرجات الإضافية).", "source": "دليل اعتماد مسار بولونيا V13، وورشة الدليل الشامل لتطبيق بولونيا 2026-2027", "status": "محلولة", "notes": "دليل V13 يقول إن الخمس درجات لجميع المقررات التي رسب بها الطالب، وورشة 2026-2027 قالت 5 درجات لكل فصل. اعتمدوا التعميم الأحدث من الجامعة إن صدر.", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["treatment"], "elsewhere": [{"sys": "نظام بولونيا", "tab": "التقديرات والمعالجة"}, {"sys": "نظام بولونيا", "tab": "في نظام اللجنة الامتحانية"}], "vid": []}, {"n": 112, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "شرط دخول الامتحان النهائي.", "error": "", "solution": "استيفاء نصاب الدوام، والحصول على 35% على الأقل من التكويني، أي 14 من 40. ومن لم يحققها يُعد راسباً في المادة ويعيدها دواماً وامتحاناً في فصل لاحق. والمشاركة في النهائي شرط للنجاح حتى لمن استوفى الدوام والتكويني.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["exams"], "elsewhere": [{"sys": "نظام بولونيا", "tab": "الامتحان النهائي والمحاولات"}, {"sys": "نظام بولونيا", "tab": "التقييم التكويني وملف الإكسل"}], "vid": []}, {"n": 113, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "المحاولات الامتحانية في بولونيا.", "error": "", "solution": "لكل فصل محاولتان، والثانية لمن رسب في الأولى. وللمادة الواحدة 4 محاولات ضمن الحد الأعلى للفصول، وبعد الرابعة يُرقَّن القيد. في المحاولات اللاحقة تُحتسب له درجتا التكويني ونصف الفصل اللتان استوفاهما، ويمتحن النهائي فقط. ومن غاب عن المحاولة الأولى بعذر يقرّه مجلس الكلية يحتفظ بهما أيضاً. وبعد 4 محاولات يمكن التسجيل لمحاولتين إضافيتين بأجور: طلبة القنوات المجانية بأجور التعليم الحكومي الخاص الصباحي، والدارسون على نفقتهم بأجور المادة مضافاً إليها 25%.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["exams"], "elsewhere": [{"sys": "نظام بولونيا", "tab": "الامتحان النهائي والمحاولات"}], "vid": []}];
const GUIDES = [{"id": "promotion", "short": "ترحيل الطلبة (الدور الثاني)", "title": "ترحيل الطلبة إلى 2026-2027", "subtitle": "جاهزية في نظام SIS، ثم تنفيذ الترحيل بالدور الثاني في نظام اللجنة الامتحانية", "source": "أُعدّ من فيديو: ترحيل الطلبة من 2025-2026 إلى 2026-2027 (4 دقائق تقريباً)، ومن الورشة الوزارية 21-9-2026، ومن فيديو: التراجع عن التهيئة وإعلان جاهزية القسم للترحيل", "sections": [{"title": "نظرة عامة", "time": "00:25", "html": "<p>فُعّل خيار <strong>الدور الثاني<\/strong> في الترحيل، فصار يُرحَّل الطلبة جميعاً دفعة واحدة: الناجحون والراسبون والمؤجلون. سابقاً كان الترحيل للناجحين فقط.<\/p><div class=\"tw\"><table><tr><th>#<\/th><th>الخطوة<\/th><th>النظام والحساب<\/th><\/tr><tr><td>1<\/td><td>مطابقة النتائج مع الماستر شيت<\/td><td>نظام اللجنة الامتحانية<\/td><\/tr><tr><td>2<\/td><td>تغيير حالة الطلبة إلى جاهز للترحيل<\/td><td>SIS، مقرر القسم، إدارة الترحيل<\/td><\/tr><tr><td>3<\/td><td>ترحيل الطلاب بالدور الثاني<\/td><td>نظام اللجنة الامتحانية (GB)<\/td><\/tr><tr><td>4<\/td><td>مراجعة السير الجديدة<\/td><td>SIS<\/td><\/tr><\/table><\/div>", "text": "فُعّل خيار الدور الثاني في الترحيل، فصار يُرحَّل الطلبة جميعاً دفعة واحدة: الناجحون والراسبون والمؤجلون. سابقاً كان الترحيل للناجحين فقط. # الخطوة النظام والحساب 1 مطابقة النتائج مع الماستر شيت نظام اللجنة الامتحانية 2 تغيير حالة الطلبة إلى جاهز للترحيل SIS، مقرر القسم، إدارة الترحيل 3 ترحيل الطلاب بالدور الثاني نظام اللجنة الامتحانية (GB) 4 مراجعة السير الجديدة SIS"}, {"title": "قبل البدء", "time": "01:06", "html": "<blockquote><p><strong>◂<\/strong> طابق نتائج الطلبة مع الماستر شيت في نظام اللجنة الامتحانية، حسب نظام القسم: بولونيا أو سنوي أو فصلي أو مقررات.<\/p><p><strong>◂<\/strong> في النظام الفصلي تُضاف مواد المرحلة ومواد العبور تلقائياً عند الترحيل، فجهّز المواد وكلّف التدريسيين قبل الترحيل.<\/p><\/blockquote><blockquote><p><strong>الأفضل:<\/strong> أكمل معلومات كل مواد 2026-2027 (الوحدات وتكليف التدريسيين) قبل الترحيل، لأن الترحيل يربط الطلبة بها.<\/p><\/blockquote>", "text": "◂ طابق نتائج الطلبة مع ا
