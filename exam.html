ية قبل انتهاء امتحانات الدور الثاني. ويمكن أيضاً الانتظار حتى تنتهي، ثم تحويل الطلبة كلهم إلى (جاهز للترحيل) وترحيلهم مرة واحدة. من المجموعة: إذا ظهرت رسالة (خطأ في القسم: الهيكل التنظيمي ليس قسماً) فأنت داخل بحساب ليس حساب قسم. الترحيل وإعلان الجاهزية يتمّان من حساب مقرر القسم ."}, {"title": "الخطوة 2: الترحيل في نظام اللجنة الامتحانية", "time": "01:55", "html": "<blockquote><p><strong>1.<\/strong> ادخل نظام اللجنة الامتحانية (GB) واختر <strong>ترحيل الطلاب<\/strong>.<\/p><p><strong>2.<\/strong> حدد <strong>الدور الثاني<\/strong>.<\/p><p><strong>3.<\/strong> تظهر إحصائية: المنتقلون لمرحلة أعلى، والباقون في مرحلتهم، والمؤهلون للتخرج.<\/p><p><strong>4.<\/strong> اضغط <strong>تأكيد<\/strong>.<\/p><\/blockquote><blockquote><p><strong>الفلاتر في واجهة ترحيل الطلاب:<\/strong> حدد <strong>البرنامج<\/strong> و<strong>النظام الدراسي<\/strong> (فصلي أو بولونيا) و<strong>الدراسة<\/strong> (صباحي أو مسائي) بدقة، وإلا لن يظهر الطلبة.<\/p><\/blockquote><blockquote><p><strong>بولونيا والدور الأول:<\/strong> ترحيل الدور الأول يشترط أن يكون الطالب ناجحاً في <strong>كل<\/strong> المواد. وجود طالب لديه مادة متبقية أو طالب مؤجل ضمن المحددين يمنع الترحيل وتظهر رسالة. لذلك حدد في SIS الناجحين تماماً فقط، أو انتظر نتائج الدور الثاني وأرحّل الجميع.<\/p><\/blockquote>", "text": "1. ادخل نظام اللجنة الامتحانية (GB) واختر ترحيل الطلاب . 2. حدد الدور الثاني . 3. تظهر إحصائية: المنتقلون لمرحلة أعلى، والباقون في مرحلتهم، والمؤهلون للتخرج. 4. اضغط تأكيد . الفلاتر في واجهة ترحيل الطلاب: حدد البرنامج و النظام الدراسي (فصلي أو بولونيا) و الدراسة (صباحي أو مسائي) بدقة، وإلا لن يظهر الطلبة. بولونيا والدور الأول: ترحيل الدور الأول يشترط أن يكون الطالب ناجحاً في كل المواد. وجود طالب لديه مادة متبقية أو طالب مؤجل ضمن المحددين يمنع الترحيل وتظهر رسالة. لذلك حدد في SIS الناجحين تماماً فقط، أو انتظر نتائج الدور الثاني وأرحّل الجميع."}, {"title": "النتيجة حسب النظام التعليمي", "time": "02:30", "html": "<p>بعد الترحيل تُنشأ لكل طالب سيرة دراسية جديدة للفصل الأول 2026-2027.<\/p><div class=\"tw\"><table><tr><th>النظام<\/th><th>ما يحدث<\/th><\/tr><tr><td>الفصلي<\/td><td>تُضاف مواد المرحلة ومواد العبور تلقائياً مع التأشير عليها. الراسب أو المؤجل تُنشأ له سيرة في المرحلة نفسها.<\/td><\/tr><tr><td>بولونيا<\/td><td>تُنشأ السيرة فقط، وتسجيل المواد يتم بعدها وفق دليل مسار بولونيا.<\/td><\/tr><tr><td>السنوي وبقية الأنظمة<\/td><td>يربط النظام الطلاب الناجحين بمواد مراحلهم تلقائياً.<\/td><\/tr><\/table><\/div><blockquote><p><strong>اختلاف بين الفيديوهات:<\/strong> فيديو الترحيل يذكر أن طالب بولونيا يسجل بنفسه على المواد، وفيديو ما بعد الترحيل يجعل تسجيلهم على المواد ومواد المحاولات من عمل القسم.<\/p><\/blockquote><div class=\"tw\"><table><tr><th>الحالة<\/th><th>بولونيا<\/th><th>الفصلي القديم<\/th><\/tr><tr><td>طالب لديه مواد في الدور الثاني<\/td><td>يظهر (ناجح دور أول) إذا كان تقييمه التكويني 14 فأكثر، ويُعد مؤهلاً للمرحلة الأعلى<\/td><td>يظهر (راسب)<\/td><\/tr><\/table><\/div>", "text": "بعد الترحيل تُنشأ لكل طالب سيرة دراسية جديدة للفصل الأول 2026-2027. النظام ما يحدث الفصلي تُضاف مواد المرحلة ومواد العبور تلقائياً مع التأشير عليها. الراسب أو المؤجل تُنشأ له سيرة في المرحلة نفسها. بولونيا تُنشأ السيرة فقط، وتسجيل المواد يتم بعدها وفق دليل مسار بولونيا. السنوي وبقية الأنظمة يربط النظام الطلاب الناجحين بمواد مراحلهم تلقائياً. اختلاف بين الفيديوهات: فيديو الترحيل يذكر أن طالب بولونيا يسجل بنفسه على المواد، وفيديو ما بعد الترحيل يجعل تسجيلهم على المواد ومواد المحاولات من عمل القسم. الحالة بولونيا الفصلي القديم طالب لديه مواد في الدور الثاني يظهر (ناجح دور أول) إذا كان تقييمه التكويني 14 فأكثر، ويُعد مؤهلاً للمرحلة الأعلى يظهر (راسب)"}, {"title": "التراجع (التهيئة، والجاهزية، والترحيل)", "time": "", "html": "<p><strong>التراجع عن تهيئة السنة الدراسية:<\/strong> زر جديد في <strong>إدارة الترحيل<\/strong>. استعمله إذا هيّأت 2026-2027 ثم اكتشفت خطأ، مثل مادة ناقصة عند طالب أو طالب ناقص. تراجع، وصحّح، ثم هيّئ من جديد.<\/p><p>حسب الورشة الوزارية: يمكن التراجع عن الجاهزية والترحيل لطالب محدد أو للقسم كاملاً من حساب اللجنة الامتحانية، لإصلاح الأخطاء.<\/p><blockquote><p><strong>انظر أيضاً:<\/strong> شرح (تصحيح درجات طالب بعد الإعلان أو الترحيل) في دليل نظام اللجنة الامتحانية.<\/p><\/blockquote><blockquote><p><strong>التراجع عن الترحيل:<\/strong> يعيد الطالب إلى مرحلته السابقة ويحذف المواد التي سُجّلت له تلقائياً مع الترحيل (من الورشة الوزارية 23-9-2026).<\/p><\/blockquote>", "text": "التراجع عن تهيئة السنة الدراسية: زر جديد في إدارة الترحيل . استعمله إذا هيّأت 2026-2027 ثم اكتشفت خطأ، مثل مادة ناقصة عند طالب أو طالب ناقص. تراجع، وصحّح، ثم هيّئ من جديد. حسب الورشة الوزارية: يمكن التراجع عن الجاهزية والترحيل لطالب محدد أو للقسم كاملاً من حساب اللجنة الامتحانية، لإصلاح الأخطاء. انظر أيضاً: شرح (تصحيح درجات طالب بعد الإعلان أو الترحيل) في دليل نظام اللجنة الامتحانية. التراجع عن الترحيل: يعيد الطالب إلى مرحلته السابقة ويحذف المواد التي سُجّلت له تلقائياً مع الترحيل (من الورشة الوزارية 23-9-2026)."}, {"title": "بعد الترحيل", "time": "", "html": "<p>القاعات والشعب وتوزيع الطلبة وتسجيل مواد بولونيا والجدول الأسبوعي: في شرح (إجراءات ما بعد الترحيل).<\/p>", "text": "القاعات والشعب وتوزيع الطلبة وتسجيل مواد بولونيا والجدول الأسبوعي: في شرح (إجراءات ما بعد الترحيل)."}], "tabs": ["promo"], "added": "03/11/2026 مساءً", "updated": "03/11/2026 ليلاً"}, {"id": "audit", "short": "تدقيق الدرجات والموافقات", "title": "تدقيق الدرجات والموافقات", "subtitle": "من إدخال الدرجات إلى مصادقة العميد في نظام اللجنة الامتحانية", "source": "أُعدّ من فيديو: التدقيق وإرسال الدرجات (3 دقائق تقريباً)، ومن ملخصي الورشة الوزارية 23-9-2026 (مترجمَين)", "sections": [{"title": "المسار كاملاً", "time": "00:00", "html": "<div class=\"tw\"><table><tr><th>#<\/th><th>الحالة<\/th><th>من يعمل عليها<\/th><\/tr><tr><td>1<\/td><td>إدخال الدرجات<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>2<\/td><td>تدقيق<\/td><td>رئيس اللجنة التدقيقية والمدققون (أو مسؤول المرحلة)<\/td><\/tr><tr><td>3<\/td><td>إنهاء التدقيق<\/td><td>رئيس اللجنة التدقيقية<\/td><\/tr><tr><td>4<\/td><td>موافقة رئيس اللجنة الامتحانية<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>5<\/td><td>مصادقة رئيس القسم<\/td><td>رئيس القسم<\/td><\/tr><tr><td>6<\/td><td>المصادقة النهائية<\/td><td>العميد<\/td><\/tr><tr><td>7<\/td><td>إعلان النتائج<\/td><td>اللجنة الامتحانية<\/td><\/tr><\/table><\/div><p>بعد مصادقة العميد تُقفل الدرجات ولا تُعدّل يدوياً إلا إذا رُفضت وأُعيدت. والنتائج لا تنتقل إلى SIS إلا بعد <strong>إعلان النتائج<\/strong>.<\/p>", "text": "# الحالة من يعمل عليها 1 إدخال الدرجات رئيس اللجنة الامتحانية 2 تدقيق رئيس اللجنة التدقيقية والمدققون (أو مسؤول المرحلة) 3 إنهاء التدقيق رئيس اللجنة التدقيقية 4 موافقة رئيس اللجنة الامتحانية رئيس اللجنة الامتحانية 5 مصادقة رئيس القسم رئيس القسم 6 المصادقة النهائية العميد 7 إعلان النتائج اللجنة الامتحانية بعد مصادقة العميد تُقفل الدرجات ولا تُعدّل يدوياً إلا إذا رُفضت وأُعيدت. والنتائج لا تنتقل إلى SIS إلا بعد إعلان النتائج ."}, {"title": "الخطوة 1: إدخال الدرجات", "time": "00:15", "html": "<p>في حساب رئيس اللجنة الامتحانية تكون حالة المادة <strong>(إدخال الدرجات)<\/strong>، فيمكن تعديل الدرجات وحفظها.<\/p><blockquote><p><strong>◂<\/strong> الحضور افتراضياً (حاضر)، ويمكن تغييره إلى غائب بعذر أو بدون عذر.<\/p><p><strong>◂<\/strong> الغياب بعذر يحتاج أمراً إدارياً يُرفق.<\/p><p><strong>◂<\/strong> السعي والنهائي والعملي يجب أن تكون ضمن حدودها، والنظام يرفض الدرجة غير الصحيحة.<\/p><\/blockquote>", "text": "في حساب رئيس اللجنة الامتحانية تكون حالة المادة (إدخال الدرجات) ، فيمكن تعديل الدرجات وحفظها. ◂ الحضور افتراضياً (حاضر)، ويمكن تغييره إلى غائب بعذر أو بدون عذر. ◂ الغياب بعذر يحتاج أمراً إدارياً يُرفق. ◂ السعي والنهائي والعملي يجب أن تكون ضمن حدودها، والنظام يرفض الدرجة غير الصحيحة."}, {"title": "الخطوة 2: الإرسال إلى التدقيق", "time": "00:30", "html": "<p>بعد إكمال الإدخال اضغط <strong>إلى التدقيق<\/strong>، فتتحول حالة المادة إلى <strong>(تدقيق)<\/strong> وتنتقل الدرجات إلى اللجنة التدقيقية.<\/p>", "text": "بعد إكمال الإدخال اضغط إلى التدقيق ، فتتحول حالة المادة إلى (تدقيق) وتنتقل الدرجات إلى اللجنة التدقيقية."}, {"title": "الخطوة 3: موافقة المدقق على الطلاب", "time": "00:45", "html": "<blockquote><p><strong>1.<\/strong> ادخل بحساب رئيس اللجنة التدقيقية أو مسؤول المرحلة.<\/p><p><strong>2.<\/strong> حدد الطلاب.<\/p><p><strong>3.<\/strong> غيّر حالتهم من <strong>(قيد الانتظار)<\/strong> إلى <strong>(موافق)<\/strong>.<\/p><\/blockquote><blockquote><p><strong>قبل الموافقة:<\/strong> طابق الدرجات مع السجلات الورقية. ويمكن تصفية القوائم حسب البرنامج أو المرحلة أو المادة.<\/p><\/blockquote>", "text": "1. ادخل بحساب رئيس اللجنة التدقيقية أو مسؤول المرحلة. 2. حدد الطلاب. 3. غيّر حالتهم من (قيد الانتظار) إلى (موافق) . قبل الموافقة: طابق الدرجات مع السجلات الورقية. ويمكن تصفية القوائم حسب البرنامج أو المرحلة أو المادة."}, {"title": "الخطوة 4: إنهاء التدقيق", "time": "01:05", "html": "<p>عندما يصبح كل طلاب المادة (موافق) يضغط رئيس اللجنة التدقيقية <strong>إنهاء التدقيق<\/strong>. بعدها تظهر ملفات Excel للتنزيل وتختفي خيارات التعديل عنده.<\/p>", "text": "عندما يصبح كل طلاب المادة (موافق) يضغط رئيس اللجنة التدقيقية إنهاء التدقيق . بعدها تظهر ملفات Excel للتنزيل وتختفي خيارات التعديل عنده."}, {"title": "الخطوة 5: موافقة رئيس اللجنة الامتحانية", "time": "01:45", "html": "<blockquote><p><strong>1.<\/strong> في حساب رئيس اللجنة الامتحانية تظهر الحالة (إنهاء التدقيق).<\/p><p><strong>2.<\/strong> اضغط أيقونة <strong>نقل الحالة إلى الموافقات<\/strong>.<\/p><p><strong>3.<\/strong> يظهر خياران: رفض أو موافقة. عند التأكد التام اضغط <strong>موافقة<\/strong> وأكّد <strong>(توثيق الامتحان الرسمي - موافقة رئيس اللجنة الامتحانية)<\/strong>.<\/p><p><strong>4.<\/strong> تظهر رسالة (تم التعديل بنجاح) وتتحول الحالة إلى <strong>(يجب موافقة السيد رئيس القسم)<\/strong>.<\/p><\/blockquote><blockquote><p><strong>الرفض:<\/strong> يحتاج سبباً، ويعيد المادة إلى اللجنة لتعديلها وإرسالها من جديد.<\/p><\/blockquote>", "text": "1. في حساب رئيس اللجنة الامتحانية تظهر الحالة (إنهاء التدقيق). 2. اضغط أيقونة نقل الحالة إلى الموافقات . 3. يظهر خياران: رفض أو موافقة. عند التأكد التام اضغط موافقة وأكّد (توثيق الامتحان الرسمي - موافقة رئيس اللجنة الامتحانية) . 4. تظهر رسالة (تم التعديل بنجاح) وتتحول الحالة إلى (يجب موافقة السيد رئيس القسم) . الرفض: يحتاج سبباً، ويعيد المادة إلى اللجنة لتعديلها وإرسالها من جديد."}, {"title": "الخطوة 6: رئيس القسم ثم العميد", "time": "02:45", "html": "<p>يصادق رئيس القسم على الدرجات فتُحال إلى العميد للمصادقة النهائية، وبذلك تكتمل العملية.<\/p>", "text": "يصادق رئيس القسم على الدرجات فتُحال إلى العميد للمصادقة النهائية، وبذلك تكتمل العملية."}, {"title": "الدرجات الإضافية وإعادة الفترة", "time": "", "html": "<blockquote><p><strong>◂<\/strong> لا تُدخل الدرجات الإضافية أثناء مرحلة إدخال الدرجات الأولى. غيّر حالة الفترة الامتحانية إلى <strong>(إدخال درجات إضافية)<\/strong> أولاً.<\/p><p><strong>◂<\/strong> درجات القرار للدور الثاني: من حساب رئيس اللجنة، ادخل الدور الأول في إدارة الامتحان وغيّر سير الامتحان إلى <strong>(إدخال درجات إضافية)<\/strong> (حل جُرّب في المجموعة).<\/p><p><strong>◂<\/strong> إعادة الفترة الامتحانية لتصحيح خطأ <strong>تحذف الدرجات الإضافية<\/strong>، فنسّق مع اللجنة ورئيس القسم قبلها.<\/p><p><strong>◂<\/strong> أي تغيير في الدرجات يعيد النظام احتساب النتيجة بعده.<\/p><\/blockquote>", "text": "◂ لا تُدخل الدرجات الإضافية أثناء مرحلة إدخال الدرجات الأولى. غيّر حالة الفترة الامتحانية إلى (إدخال درجات إضافية) أولاً. ◂ درجات القرار للدور الثاني: من حساب رئيس اللجنة، ادخل الدور الأول في إدارة الامتحان وغيّر سير الامتحان إلى (إدخال درجات إضافية) (حل جُرّب في المجموعة). ◂ إعادة الفترة الامتحانية لتصحيح خطأ تحذف الدرجات الإضافية ، فنسّق مع اللجنة ورئيس القسم قبلها. ◂ أي تغيير في الدرجات يعيد النظام احتساب النتيجة بعده."}, {"title": "طلبة أُضيفوا متأخراً", "time": "", "html": "<blockquote><p><strong>1.<\/strong> أضف الطالب وسيرته، ثم في الفترة الامتحانية اضغط <strong>إعادة الاحتساب<\/strong> مرة واحدة.<\/p><p><strong>2.<\/strong> إذا ظهرت رسالة (لا توجد سجلات امتحان ناقصة، ولم تتم إضافة أي سجل) ولم يظهر الطالب: من <strong>قوائم درجات الطلاب<\/strong> اختر المرحلة واضغط <strong>توليد قوائم درجات<\/strong>، ثم أعد الاحتساب.<\/p><p><strong>3.<\/strong> أدخل درجات الدور الأول.<\/p><p><strong>4.<\/strong> صادق، ثم افتح المعالجة، ثم صادق مرة ثانية، ثم انشر نتائج الدور الأول.<\/p><p><strong>5.<\/strong> بعدها افتح الدور الثاني.<\/p><\/blockquote><blockquote><p><strong>إذا ظهرت:<\/strong> (سجل الامتحان له سجل في محاولة لاحقة؛ احذف المحاولة اللاحقة أولاً) عند إدخال المعالجة، فالترتيب أعلاه لم يُتّبع: المعالجة تأتي بعد المصادقة وقبل فتح الدور الثاني.<\/p><\/blockquote>", "text": "1. أضف الطالب وسيرته، ثم في الفترة الامتحانية اضغط إعادة الاحتساب مرة واحدة. 2. إذا ظهرت رسالة (لا توجد سجلات امتحان ناقصة، ولم تتم إضافة أي سجل) ولم يظهر الطالب: من قوائم درجات الطلاب اختر المرحلة واضغط توليد قوائم درجات ، ثم أعد الاحتساب. 3. أدخل درجات الدور الأول. 4. صادق، ثم افتح المعالجة، ثم صادق مرة ثانية، ثم انشر نتائج الدور الأول. 5. بعدها افتح الدور الثاني. إذا ظهرت: (سجل الامتحان له سجل في محاولة لاحقة؛ احذف المحاولة اللاحقة أولاً) عند إدخال المعالجة، فالترتيب أعلاه لم يُتّبع: المعالجة تأتي بعد المصادقة وقبل فتح الدور الثاني."}], "tabs": ["exams", "treatment", "results"], "added": "03/11/2026 ليلاً", "updated": ""}, {"id": "fix", "short": "تصحيح درجات طالب بعد الإعلان أو الترحيل", "title": "تصحيح درجات طالب بعد إعلان النتائج أو بعد الترحيل", "subtitle": "حذف سجل الطالب من الفترة الامتحانية، ثم إعادة إضافته وإدخال درجاته، ثم إعادة الترحيل، دون حذف الفترة كلها", "source": "أُعدّ من ملخص فيديو تعليمي عن تصحيح الأخطاء في الفترة الامتحانية. الملخص مترجم، فقد تختلف أسماء الأزرار قليلاً عما في النظام", "sections": [{"title": "متى تستخدم هذه الطريقة", "time": "", "html": "<p>عندما تكتشف خطأ في درجات طالب بعد إدخال الدرجات والمصادقة عليها وإعلان النتائج، أو حتى بعد ترحيل الطلاب. الطريقة تصحح سجل الطالب وحده، بدل حذف الفترة الامتحانية كاملة وإعادة إنشائها.<\/p><div class=\"tw\"><table><tr><th>#<\/th><th>الإجراء<\/th><th>متى<\/th><\/tr><tr><td>1<\/td><td>تحديد الطالب الذي فيه الخطأ<\/td><td>دائماً<\/td><\/tr><tr><td>2<\/td><td>حذف سجل الطالب من الفترة الامتحانية<\/td><td>دائماً<\/td><\/tr><tr><td>3<\/td><td>إضافة الطلبة الناقصين<\/td><td>دائماً<\/td><\/tr><tr><td>4<\/td><td>إدخال الدرجات المصححة والحضور<\/td><td>دائماً<\/td><\/tr><tr><td>5<\/td><td>حفظ سجل الطالب<\/td><td>دائماً<\/td><\/tr><tr><td>6<\/td><td>التراجع عن ترحيل الطلاب لهذه الفترة<\/td><td>إذا كان الترحيل قد نُفذ<\/td><\/tr><tr><td>7<\/td><td>إعادة الترحيل<\/td><td>إذا كان الترحيل قد نُفذ<\/td><\/tr><\/table><\/div>", "text": "عندما تكتشف خطأ في درجات طالب بعد إدخال الدرجات والمصادقة عليها وإعلان النتائج، أو حتى بعد ترحيل الطلاب. الطريقة تصحح سجل الطالب وحده، بدل حذف الفترة الامتحانية كاملة وإعادة إنشائها. # الإجراء متى 1 تحديد الطالب الذي فيه الخطأ دائماً 2 حذف سجل الطالب من الفترة الامتحانية دائماً 3 إضافة الطلبة الناقصين دائماً 4 إدخال الدرجات المصححة والحضور دائماً 5 حفظ سجل الطالب دائماً 6 التراجع عن ترحيل الطلاب لهذه الفترة إذا كان الترحيل قد نُفذ 7 إعادة الترحيل إذا كان الترحيل قد نُفذ"}, {"title": "الخطوة 1: تحديد الطالب", "time": "", "html": "<p>افتح الفترة الامتحانية وابحث عن الطالب الذي دخلت درجاته خطأ.<\/p>", "text": "افتح الفترة الامتحانية وابحث عن الطالب الذي دخلت درجاته خطأ."}, {"title": "الخطوة 2: حذف سجل الطالب من الفترة الامتحانية", "time": "", "html": "<p>احذف سجل الطالب من الفترة.<\/p><blockquote><p><strong>تحذير:<\/strong> الحذف يزيل كل ما يخص الطالب في هذه الفترة: الدرجات، والحضور، والقرارات، والاعتراضات. سجّل درجاته الصحيحة قبل الحذف لتعيد إدخالها.<\/p><\/blockquote>", "text": "احذف سجل الطالب من الفترة. تحذير: الحذف يزيل كل ما يخص الطالب في هذه الفترة: الدرجات، والحضور، والقرارات، والاعتراضات. سجّل درجاته الصحيحة قبل الحذف لتعيد إدخالها."}, {"title": "الخطوة 3: إضافة الطلبة الناقصين", "time": "", "html": "<p>اضغط <strong>إضافة الطلبة الناقصين<\/strong>. هذا الإجراء يجلب الطلبة المؤهلين لهذه الفترة وغير الموجودين فيها، ومنهم الطالب الذي حذفته للتصحيح. يُضاف الطالب خارج سير العمل المعتاد.<\/p><blockquote><p><strong>ملاحظة من مجموعات واتساب:<\/strong> وصف أحد مقرري الأقسام إجراءً مشابهاً بعد التحديث الأخير: حذف الطالب من الفترة ثم إعادة إضافته بأيقونة السهمين البرتقالية. ويبدو أنه الإجراء نفسه.<\/p><\/blockquote>", "text": "اضغط إضافة الطلبة الناقصين . هذا الإجراء يجلب الطلبة المؤهلين لهذه الفترة وغير الموجودين فيها، ومنهم الطالب الذي حذفته للتصحيح. يُضاف الطالب خارج سير العمل المعتاد. ملاحظة من مجموعات واتساب: وصف أحد مقرري الأقسام إجراءً مشابهاً بعد التحديث الأخير: حذف الطالب من الفترة ثم إعادة إضافته بأيقونة السهمين البرتقالية. ويبدو أنه الإجراء نفسه."}, {"title": "الخطوة 4: إدخال الدرجات المصححة", "time": "", "html": "<p>سجل الطالب المضاف يحمل <strong>علامة تصحيح<\/strong> تبين أنه عُدّل خارج سير العمل المعتاد. افتحه وأدخل الدرجات الصحيحة والحضور.<\/p>", "text": "سجل الطالب المضاف يحمل علامة تصحيح تبين أنه عُدّل خارج سير العمل المعتاد. افتحه وأدخل الدرجات الصحيحة والحضور."}, {"title": "الخطوة 5: الحفظ", "time": "", "html": "<p>احفظ سجل الطالب. يُدمج في الفترة كأنه كان موجوداً منذ توليد القوائم.<\/p>", "text": "احفظ سجل الطالب. يُدمج في الفترة كأنه كان موجوداً منذ توليد القوائم."}, {"title": "الخطوة 6: التراجع عن ترحيل الطلاب (إذا رُحّلوا)", "time": "", "html": "<p>إذا كان ترحيل الطلاب لهذه الفترة قد نُفذ، تراجع عن ترحيلهم حتى يمكن تطبيق التعديل.<\/p><blockquote><p><strong>تحذير:<\/strong> التراجع يحذف السير الدراسية المرتبطة بهذه الفترة للطلاب المشمولين، ولا تعود إلا بإعادة الترحيل.<\/p><\/blockquote>", "text": "إذا كان ترحيل الطلاب لهذه الفترة قد نُفذ، تراجع عن ترحيلهم حتى يمكن تطبيق التعديل. تحذير: التراجع يحذف السير الدراسية المرتبطة بهذه الفترة للطلاب المشمولين، ولا تعود إلا بإعادة الترحيل."}, {"title": "الخطوة 7: إعادة الترحيل", "time": "", "html": "<p>أعد ترحيل الطلاب، فتنتقل الدرجات المصححة إلى سيرهم الدراسية.<\/p>", "text": "أعد ترحيل الطلاب، فتنتقل الدرجات المصححة إلى سيرهم الدراسية."}, {"title": "ملاحظات", "time": "", "html": "<blockquote><p><strong>◂<\/strong> الطريقة تعمل حتى بعد إكمال ترحيل الدور الأول، وتفيد في الأدوار اللاحقة أو الترحيل المتكرر.<\/p><p><strong>◂<\/strong> علامة التصحيح تبقى على السجل، فيمكن معرفة السجلات التي عُدّلت خارج سير العمل عند التدقيق.<\/p><p><strong>◂<\/strong> في مجموعات واتساب ذُكرت حالة لم تنفع فيها هذه الطريقة: مادة لم تتولد أصلاً في الدور الثاني لأنه لا يوجد فيها طالب محمّل.<\/p><\/blockquote>", "text": "◂ الطريقة تعمل حتى بعد إكمال ترحيل الدور الأول، وتفيد في الأدوار اللاحقة أو الترحيل المتكرر. ◂ علامة التصحيح تبقى على السجل، فيمكن معرفة السجلات التي عُدّلت خارج سير العمل عند التدقيق. ◂ في مجموعات واتساب ذُكرت حالة لم تنفع فيها هذه الطريقة: مادة لم تتولد أصلاً في الدور الثاني لأنه لا يوجد فيها طالب محمّل."}], "tabs": ["exams", "promo"], "added": "03/11/2026", "updated": ""}, {"id": "bo_formative", "short": "التقييم التكويني وملف الإكسل", "title": "حساب التقييم التكويني وإعداد ملف الإكسل", "subtitle": "الفرق بين الطريقة السابقة والمعتمدة الآن في SIS، مع مثال محلول", "source": "أُعدّ من فيديو: شروط ومعادلة فقرات التقييم التكويني وفق بولونيا ونظام SIS (3:43 دقيقة)، ودليل اعتماد مسار بولونيا في الجامعات العراقية (الإصدار V13)", "sections": [{"title": "ما الذي تغيّر؟", "time": "00:11", "html": "<div class=\"tw\"><table><tr><th><\/th><th>الطريقة السابقة<\/th><th>المعتمدة الآن<\/th><\/tr><tr><td>مجموع الفقرات<\/td><td>يُسمح بأكثر من 100<\/td><td>40 فقط، لا يُسمح بتجاوزه<\/td><\/tr><tr><td>الجبر<\/td><td>النظام يحوّل المجموع تلقائياً إلى 40<\/td><td>لا جبر؛ الدرجة تُدخل من 40 مباشرة<\/td><\/tr><tr><td>عدد الفقرات<\/td><td>غالباً 7 فقرات أو أكثر<\/td><td>4 فقرات أو أكثر، بشرط أن مجموع أوزانها 40<\/td><\/tr><\/table><\/div>", "text": "الطريقة السابقة المعتمدة الآن مجموع الفقرات يُسمح بأكثر من 100 40 فقط، لا يُسمح بتجاوزه الجبر النظام يحوّل المجموع تلقائياً إلى 40 لا جبر؛ الدرجة تُدخل من 40 مباشرة عدد الفقرات غالباً 7 فقرات أو أكثر 4 فقرات أو أكثر، بشرط أن مجموع أوزانها 40"}, {"title": "الفقرات المسموحة", "time": "", "html": "<p>التقييم التكويني لا يعتمد على امتحانات شهرية، بل على أنشطة يحددها أستاذ المادة ويقرّها مجلس الكلية، مثل: الاختبارات القصيرة (كويزات)، والتقارير، والواجبات، والتطبيقات والمشاريع، والزيارات الميدانية، والمناقشات.<\/p><blockquote><p><strong>الجامعات التقنية:<\/strong> للمواد العملية يدخل التقرير الأسبوعي للمختبر وامتحان المختبر ضمن التكويني بنسبة 15%، ويُقسم الامتحان النهائي بين العملي والنظري مناصفة أو حسب ما يقرره القسم.<\/p><\/blockquote>", "text": "التقييم التكويني لا يعتمد على امتحانات شهرية، بل على أنشطة يحددها أستاذ المادة ويقرّها مجلس الكلية، مثل: الاختبارات القصيرة (كويزات)، والتقارير، والواجبات، والتطبيقات والمشاريع، والزيارات الميدانية، والمناقشات. الجامعات التقنية: للمواد العملية يدخل التقرير الأسبوعي للمختبر وامتحان المختبر ضمن التكويني بنسبة 15%، ويُقسم الامتحان النهائي بين العملي والنظري مناصفة أو حسب ما يقرره القسم."}, {"title": "المعادلة", "time": "01:29", "html": "<p>لكل فقرة: <strong>الدرجة المجبورة = (مجموع درجات الطالب في الفقرة ÷ مجموع درجات الفقرة) × وزن الفقرة<\/strong><\/p><p>ثم تُجمع درجات الفقرات كلها، فيكون الناتج التقييم التكويني من 40، ويُقرَّب إلى أقرب عدد صحيح.<\/p>", "text": "لكل فقرة: الدرجة المجبورة = (مجموع درجات الطالب في الفقرة ÷ مجموع درجات الفقرة) × وزن الفقرة ثم تُجمع درجات الفقرات كلها، فيكون الناتج التقييم التكويني من 40، ويُقرَّب إلى أقرب عدد صحيح."}, {"title": "مثال محلول", "time": "01:00", "html": "<div class=\"tw\"><table><tr><th>البند<\/th><th>القيمة<\/th><\/tr><tr><td>فقرة الاختبارات: وزنها<\/td><td>20 درجة<\/td><\/tr><tr><td>عدد الاختبارات<\/td><td>4، كل واحد من 20 (مجموع الفقرة 80)<\/td><\/tr><tr><td>درجات الطالب<\/td><td>11 + 7 + 20 + 16 = 54<\/td><\/tr><tr><td>الدرجة المجبورة للفقرة<\/td><td>(54 ÷ 80) × 20 = 13.5<\/td><\/tr><\/table><\/div><p>وبالطريقة نفسها تُحسب بقية الفقرات. في هذا المثال كان مجموع الطالب 27.5 فقرّبه النظام إلى <strong>28 من 40<\/strong>. وبما أن 28 أكبر من 14 فالطالب مؤهل للامتحان النهائي.<\/p>", "text": "البند القيمة فقرة الاختبارات: وزنها 20 درجة عدد الاختبارات 4، كل واحد من 20 (مجموع الفقرة 80) درجات الطالب 11 + 7 + 20 + 16 = 54 الدرجة المجبورة للفقرة (54 ÷ 80) × 20 = 13.5 وبالطريقة نفسها تُحسب بقية الفقرات. في هذا المثال كان مجموع الطالب 27.5 فقرّبه النظام إلى 28 من 40 . وبما أن 28 أكبر من 14 فالطالب مؤهل للامتحان النهائي."}, {"title": "إعداد ملف الإكسل خطوة بخطوة", "time": "02:17", "html": "<blockquote><p><strong>1.<\/strong> اكتب فقرات التكويني أعمدةً، ولكل فقرة وزنها، مثلاً المشاريع 10، والتقارير 10، والواجبات 10، والاختبارات 10.<\/p><p><strong>2.<\/strong> إذا كانت درجات الفقرة الأصلية من غير وزنها، حوّلها داخل الإكسل بالمعادلة أعلاه حتى تصير من وزن الفقرة.<\/p><p><strong>3.<\/strong> اجمع الفقرات: الناتج يجب أن يكون من 40 مباشرة، دون أي جبر لاحق.<\/p><p><strong>4.<\/strong> قرّب الناتج إلى عدد صحيح.<\/p><p><strong>5.<\/strong> يُجمع التكويني (40) مع امتحان نصف الفصل (10) فيظهر سعي الطالب الكلي (50).<\/p><\/blockquote><blockquote><p><strong>تحذير النظام:<\/strong> عند إدخال 4 فقرات أو أكثر يرفض النظام الإدخال ويُظهر تحذيراً إذا تجاوز مجموع الأوزان 40.<\/p><\/blockquote>", "text": "1. اكتب فقرات التكويني أعمدةً، ولكل فقرة وزنها، مثلاً المشاريع 10، والتقارير 10، والواجبات 10، والاختبارات 10. 2. إذا كانت درجات الفقرة الأصلية من غير وزنها، حوّلها داخل الإكسل بالمعادلة أعلاه حتى تصير من وزن الفقرة. 3. اجمع الفقرات: الناتج يجب أن يكون من 40 مباشرة، دون أي جبر لاحق. 4. قرّب الناتج إلى عدد صحيح. 5. يُجمع التكويني (40) مع امتحان نصف الفصل (10) فيظهر سعي الطالب الكلي (50). تحذير النظام: عند إدخال 4 فقرات أو أكثر يرفض النظام الإدخال ويُظهر تحذيراً إذا تجاوز مجموع الأوزان 40."}, {"title": "بعد الإدخال: الأهلية للنهائي", "time": "", "html": "<blockquote><p><strong>◂<\/strong> من حصل على 14 من 40 فأكثر (35%) ولم يرسب بالغياب يحق له دخول الامتحان النهائي.<\/p><p><strong>◂<\/strong> من حصل على أقل من 14 يُستبعد تلقائياً في نظام اللجنة الامتحانية (غير مؤهل) ويعيد المادة دواماً وامتحاناً.<\/p><p><strong>◂<\/strong> من استوفى 14 من 40 يحتفظ بسعيه في الدور الثاني والسنة القادمة، ويمتحن النهائي فقط.<\/p><\/blockquote>", "text": "◂ من حصل على 14 من 40 فأكثر (35%) ولم يرسب بالغياب يحق له دخول الامتحان النهائي. ◂ من حصل على أقل من 14 يُستبعد تلقائياً في نظام اللجنة الامتحانية (غير مؤهل) ويعيد المادة دواماً وامتحاناً. ◂ من استوفى 14 من 40 يحتفظ بسعيه في الدور الثاني والسنة القادمة، ويمتحن النهائي فقط."}], "tabs": ["grade_lists", "exams"], "added": "06/11/2026", "updated": ""}, {"id": "bo_gb", "short": "رفع درجات بولونيا في G.B", "title": "رفع درجات بولونيا في نظام اللجنة الامتحانية (G.B)", "subtitle": "السعي، والنهائي، والتدقيق، والمصادقات، ودرجات القرار، في خمس مراحل", "source": "أُعدّ من دليل خطوات رفع درجات السعي والامتحان النهائي والمعالجات والمصادقات الهرمية (G.B)", "sections": [{"title": "الدورة كاملة", "time": "", "html": "<div class=\"tw\"><table><tr><th>المرحلة<\/th><th>ماذا يحدث<\/th><th>المسؤول<\/th><\/tr><tr><td>1<\/td><td>تهيئة قوائم الدرجات ورفع السعي (تكويني 40 + منتصف 10)<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>2<\/td><td>إنشاء الامتحان النهائي ورفع درجاته (50)<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>3<\/td><td>التدقيق والمصادقات وإعلان النتائج الأولية<\/td><td>اللجنة التدقيقية ثم رئيس اللجنة ثم رئيس القسم ثم العميد<\/td><\/tr><tr><td>4<\/td><td>تطبيق درجات المعالجة (القرار: 5 درجات)<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>5<\/td><td>إعادة التدقيق والمصادقة النهائية وطباعة النتائج المعدلة<\/td><td>اللجنة التدقيقية والعميد<\/td><\/tr><\/table><\/div>", "text": "المرحلة ماذا يحدث المسؤول 1 تهيئة قوائم الدرجات ورفع السعي (تكويني 40 + منتصف 10) رئيس اللجنة الامتحانية 2 إنشاء الامتحان النهائي ورفع درجاته (50) رئيس اللجنة الامتحانية 3 التدقيق والمصادقات وإعلان النتائج الأولية اللجنة التدقيقية ثم رئيس اللجنة ثم رئيس القسم ثم العميد 4 تطبيق درجات المعالجة (القرار: 5 درجات) رئيس اللجنة الامتحانية 5 إعادة التدقيق والمصادقة النهائية وطباعة النتائج المعدلة اللجنة التدقيقية والعميد"}, {"title": "المرحلة 1: السعي", "time": "", "html": "<blockquote><p><strong>1.<\/strong> ادخل بحساب رئيس اللجنة الامتحانية، واختر نوع الدراسة (صباحي أو مسائي) والمرحلة والنظام (<strong>بولونيا<\/strong> أو الفصلي).<\/p><p><strong>2.<\/strong> صدّر ملف إكسل لكل مادة على حدة حتى لا تتداخل البيانات، وسمِّ الملف باسم المادة. طابق أسماء الطلبة وتسلسلاتهم وعددهم.<\/p><p><strong>3.<\/strong> املأ التكويني (من 40) والمنتصف (من 10) فيصير السعي من 50، ثم استورد الملف وتأكد أنه لا توجد خانة فارغة.<\/p><\/blockquote>", "text": "1. ادخل بحساب رئيس اللجنة الامتحانية، واختر نوع الدراسة (صباحي أو مسائي) والمرحلة والنظام ( بولونيا أو الفصلي). 2. صدّر ملف إكسل لكل مادة على حدة حتى لا تتداخل البيانات، وسمِّ الملف باسم المادة. طابق أسماء الطلبة وتسلسلاتهم وعددهم. 3. املأ التكويني (من 40) والمنتصف (من 10) فيصير السعي من 50، ثم استورد الملف وتأكد أنه لا توجد خانة فارغة."}, {"title": "المرحلة 2: الامتحان النهائي", "time": "", "html": "<blockquote><p><strong>1.<\/strong> من <strong>إدارة الامتحانات ← إضافة امتحان<\/strong>: حدد السنة الدراسية والدور (الأول) ونوع الدراسة واللجنة الامتحانية وكل المراحل المشمولة.<\/p><p><strong>2.<\/strong> راجع قائمة المؤهلين. من تكوينيه أقل من 14 يُستبعد تلقائياً (غير مؤهل). إذا كان هناك نقص فأضف السعي أولاً، ثم اضغط <strong>تحديث عدد حساب درجات القسم<\/strong>.<\/p><p><strong>3.<\/strong> افتح كل مادة وأدخل درجة النهائي (من 50) مباشرة، أو بتصدير ملف إكسل واستيراده.<\/p><\/blockquote>", "text": "1. من إدارة الامتحانات ← إضافة امتحان : حدد السنة الدراسية والدور (الأول) ونوع الدراسة واللجنة الامتحانية وكل المراحل المشمولة. 2. راجع قائمة المؤهلين. من تكوينيه أقل من 14 يُستبعد تلقائياً (غير مؤهل). إذا كان هناك نقص فأضف السعي أولاً، ثم اضغط تحديث عدد حساب درجات القسم . 3. افتح كل مادة وأدخل درجة النهائي (من 50) مباشرة، أو بتصدير ملف إكسل واستيراده."}, {"title": "المرحلة 3: التدقيق والمصادقات", "time": "", "html": "<blockquote><p><strong>1.<\/strong> في كل مادة اختر <strong>إرسال إلى اللجنة التدقيقية<\/strong>، فتصير الحالة (إلى التدقيق) ويُقفل التعديل.<\/p><p><strong>2.<\/strong> رئيس اللجنة التدقيقية يطابق الدرجات مع الماستر شيت الورقي، ويحدد الدرجات كلها ويختار (موافق)، ثم (انتهاء التدقيق).<\/p><p><strong>3.<\/strong> انقل حالة الامتحان إلى (الموافقات): رئيس اللجنة، ثم رئيس القسم، ثم العميد بعد مراجعة نسب النجاح والغياب.<\/p><p><strong>4.<\/strong> من تبويب (طباعة النتائج) تُعلن النتائج الأولية بكشوف جماعية أو فردية.<\/p><\/blockquote><blockquote><p><strong>للتفصيل:<\/strong> شرح (تدقيق الدرجات والموافقات) في دليل نظام اللجنة الامتحانية.<\/p><\/blockquote>", "text": "1. في كل مادة اختر إرسال إلى اللجنة التدقيقية ، فتصير الحالة (إلى التدقيق) ويُقفل التعديل. 2. رئيس اللجنة التدقيقية يطابق الدرجات مع الماستر شيت الورقي، ويحدد الدرجات كلها ويختار (موافق)، ثم (انتهاء التدقيق). 3. انقل حالة const ST = {"محلولة":"ok","حل مقترح":"sug","حل جزئي":"part","بلا حل":"no"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Arabic-tolerant normalisation: drop diacritics/tatweel, unify alef, ya, ta marbuta, hamza seats
const MAP = {"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه","ـ":""};
function norm(s){
  let out = "", idx = [];
  for (let i = 0; i < s.length; i++){
    let ch = s[i];
    if (/[ً-ْٰ]/.test(ch)) continue;
    ch = (MAP[ch] !== undefined ? MAP[ch] : ch).toLowerCase();
    for (const c of ch){ out += c; idx.push(i); }
  }
  return {out, idx};
}
DATA.forEach(d => { d.hay = norm([d.problem, d.error, d.solution, d.notes, d.cat, d.group].join(" ")).out; });

function highlight(text, terms){
  if (!text) return "";
  if (!terms.length) return esc(text);
  const {out, idx} = norm(text);
  const marks = new Array(text.length).fill(false);
  for (const t of terms){
    let p = out.indexOf(t);
    while (p !== -1){
      const a = idx[p], b = idx[p + t.length - 1];
      for (let i = a; i <= b; i++) marks[i] = true;
      p = out.indexOf(t, p + 1);
    }
  }
  let html = "", open = false;
  for (let i = 0; i < text.length; i++){
    if (marks[i] && !open){ html += "<mark>"; open = true; }
    if (!marks[i] && open){ html += "</mark>"; open = false; }
    html += esc(text[i]);
  }
  return html + (open ? "</mark>" : "");
}

const badge = it => it.updated === META.latest ? "upd" : (it.added === META.latest ? "new" : "");
const pill = b => b === "new" ? `<span class="newpill">جديد</span>` : b === "upd" ? `<span class="newpill upd">محدّث</span>` : "";
DATA.forEach(d => { d.hay = norm([d.problem, d.error, d.solution, d.notes, d.cat, d.group, ...(d.vid || []).map(v => v.text + " " + v.note)].join(" ")).out; d.b = badge(d); });
GUIDES.forEach(g => { g.b = badge(g); g.sections.forEach(s => { s.hay = norm(g.title + " " + s.title + " " + s.text).out; }); });

function markEl(root, terms){
  if (!terms.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue; if (!text.trim()) continue;
    const h = highlight(text, terms);
    if (h.indexOf("<mark>") === -1) continue;
    const span = document.createElement("span"); span.innerHTML = h;
    node.replaceWith(...span.childNodes);
  }
}

function issueBase(T){
  const fs = $("#fs").value, fg = $("#fg").value, nw = $("#onlynew").checked;

function guideHits(T){
  const nw = $("#onlynew").checked;
  return GUIDES.filter(g => !nw || g.b).map(g => ({g, secs: g.sections.filter(s => T.every(t => s.hay.includes(t)))}));

function render(){
  const raw = $("#q").value.trim(), T = terms();
  $("#clr").hidden = !raw;
  const all = issueBase(T), gh = guideHits(T);
  const probs = all.filter(d => d.kind !== "info"), infos = all.filter(d => d.kind === "info");
  const inTab = (it, tab) => !tab || it.tabs.includes(tab);
  const gIn = tab => gh.filter(x => x.secs.length && inTab(x.g, tab));
  const counts = tab => ({issues: probs.filter(d => inTab(d, tab)).length, guides: gIn(tab).length, other: infos.filter(d => inTab(d, tab)).length});
  if (autoView){
    const c = counts(curTab);
    if (!c[view]) view = ["issues", "guides", "other"].find(v => c[v]) || view;
    autoView = false;
  }
  $("#fs").hidden = $("#fg").hidden = view === "guides";
  document.body.dataset.view = view;

  const cnt = tab => all.filter(d => inTab(d, tab)).length + gIn(tab).length;

    const gNew = all.filter(d => d.b && inG(d)).length + gh.filter(x => x.secs.length && x.g.b && inG(x.g)).length;

function renderIssues(base, raw, T, isOther){
  const tabsToShow = curTab ? [curTab] : TABORDER;
  let html = "", shown = 0;
  for (const tab of tabsToShow){
    // in "all" mode each problem is listed once, under its first tab in this system
    const items = base.filter(d => curTab ? d.tabs.includes(tab) : d.tabs[0] === tab);
    if (!items.length) continue;
    shown += items.length;
    html += `<section class="group"><h2>${esc(TABNAME[tab])} <span>${items.length}</span></h2><div class="cards">${items.map(d => card(d, T, tab)).join("")}</div></section>`;
  }
  $("#count").textContent = `يظهر ${shown} من ${DATA.length}`;
  $("#list").innerHTML = html || `<div class="empty">لا توجد ${isOther ? LB.other : "مشكلة"}${raw ? ` فيها «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}${$("#onlynew").checked ? " ضمن الجديد" : ""}.</div>`;
}
function renderGuides(gh, raw, T){
  const list = gh.filter(x => (!curTab || x.g.tabs.includes(curTab)) && x.secs.length);
  const shownSecs = list.reduce((a, x) => a + x.secs.length, 0);
  $("#count").textContent = T.length ? `${shownSecs} خطوة مطابقة` : `${list.length} من ${GUIDES.length} شروحات`;
  if (!list.length){
    $("#list").innerHTML = `<div class="empty">لا يوجد شرح${raw ? ` فيه «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}.</div>`;
    return;
  }
  let html = "";
  for (const {g, secs} of list){
    html += `<section class="guide" id="g-${g.id}"><div class="ghead"><h2>${esc(g.title)}</h2><p class="gs">${esc(g.subtitle)}</p>
      <p class="src">${PLAY}<span>${esc(g.source)}</span></p>
      <div class="gmeta">${pill(g.b)}${g.tabs.map(t => `<span class="newpill upd" style="background:var(--bg);color:var(--muted);border-color:var(--line)">${esc(TABNAME[t])}</span>`).join("")}</div></div>`;
    if (T.length) html += `<div class="hits">${secs.length} من ${g.sections.length} أقسام تطابق البحث</div>`;
    else html += `<nav class="toc" aria-label="محتويات الشرح">${secs.map(s => `<a href="#s-${g.id}-${g.sections.indexOf(s)}">${esc(s.title.replace(/:.*/, ""))}</a>`).join("")}</nav>`;
    secs.forEach(s => {
      const i = g.sections.indexOf(s);
      html += `<div class="sec" id="s-${g.id}-${i}"><h3><span class="st">${esc(s.title)}</span>${s.time ? `<span class="t">في الفيديو ${esc(s.time)}</span>` : ""}</h3>${s.html}</div>`;
    });
    html += `</section>`;
  }
  const L = $("#list"); L.innerHTML = html;
  markEl(L, T);
  L.querySelectorAll(".toc a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1));
    if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
  }));
}
setup(); render(); fromHash();
</script>
</html>
