1UpW8CACwLd4VKtKkMAxDAJuOaRZGfWBqnGRNTlm9pi7cw+LhPguGlNHrp29irAjGS11g5iCgdDwcz9+dix7TGmMR38FzV86EuAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==\"/><\/p><blockquote><p><strong>قبل البدء:<\/strong> المادة لا تظهر للتدريسي إلا بعد تهيئة القسم للعام 2026-2027 واكتمال المادة في SIS (حالتها مكتمل): توزيع التقييم التكويني، والحصص المجدولة، وتكليف التدريسي. والطلبة لا يظهرون حتى تُضاف الشعب ويُنشر الجدول الأسبوعي.<\/p><\/blockquote>", "text": "يشرح الفيديو ما يحتاجه التدريسي للعمل على منصة IQ\nLearn: الدخول إلى المنصة، والوصول إلى المقرر، ثم إضافة المحاضرات\nبأشكالها المختلفة والتحكم بمن يراها ومتى. الخطوات أدناه بترتيب الفيديو،\nومع كل خطوة توقيتها. قبل البدء: المادة لا تظهر للتدريسي إلا بعد تهيئة القسم للعام 2026-2027 واكتمال المادة في SIS (حالتها مكتمل): توزيع التقييم التكويني، والحصص المجدولة، وتكليف التدريسي. والطلبة لا يظهرون حتى تُضاف الشعب ويُنشر الجدول الأسبوعي."}, {"title": "الخطوة 1: تسجيل الدخول", "time": "00:27", "html": "<blockquote>\n<p><strong>1.<\/strong> فتح متصفح Google والبحث عن منصة\nIQ Learn، فتظهر نافذة تسجيل الدخول.<\/p>\n<p><strong>2.<\/strong> إدخال البريد الإلكتروني الخاص\nبالتدريسي وكلمة المرور.<\/p>\n<p><strong>3.<\/strong> تحديد حساب الجامعة، ثم الضغط على\n<strong>تسجيل الدخول<\/strong>.<\/p>\n<\/blockquote>", "text": "1. فتح متصفح Google والبحث عن منصة\nIQ Learn، فتظهر نافذة تسجيل الدخول. 2. إدخال البريد الإلكتروني الخاص\nبالتدريسي وكلمة المرور. 3. تحديد حساب الجامعة، ثم الضغط على تسجيل الدخول ."}, {"title": "الخطوة 2: تحويل لغة الواجهة إلى العربية", "time": "00:41", "html": "<p>من القائمة العليا تُختار اللغة العربية لتسهيل\nالتصفح.<\/p>", "text": "من القائمة العليا تُختار اللغة العربية لتسهيل\nالتصفح."}, {"title": "الخطوة 3: التعرف على لوحة التحكم", "time": "00:47", "html": "<p>تعرض لوحة التحكم بيانات التدريسي:<\/p><blockquote>\n<p><strong>◂<\/strong> الكلية والقسم.<\/p>\n<p><strong>◂<\/strong> عدد الطلبة.<\/p>\n<p><strong>◂<\/strong> المقررات والشعب المسندة\nإليه.<\/p>\n<\/blockquote>", "text": "تعرض لوحة التحكم بيانات التدريسي: ◂ الكلية والقسم. ◂ عدد الطلبة. ◂ المقررات والشعب المسندة\nإليه."}, {"title": "الخطوة 4: اختيار المقرر الدراسي", "time": "00:54", "html": "<blockquote>\n<p><strong>1.<\/strong> الضغط على تبويب <strong>المواد\nالدراسية<\/strong>. تظهر المقررات مقسمة إلى حالية وسابقة\nوتجريبية.<\/p>\n<p><strong>2.<\/strong> اختيار المقرر المطلوب للمرحلة\nالأولى أو الثانية.<\/p>\n<p><strong>3.<\/strong> تظهر رسالة الترحيب الخاصة\nبالمقرر، وفيها وصف مختصر له ومعلومات التواصل مع أستاذ المادة.<\/p>\n<\/blockquote><p>عند الدخول اختر دور <strong>تدريسي<\/strong>، ثم المادة وفصلها.<\/p>", "text": "1. الضغط على تبويب المواد\nالدراسية . تظهر المقررات مقسمة إلى حالية وسابقة\nوتجريبية. 2. اختيار المقرر المطلوب للمرحلة\nالأولى أو الثانية. 3. تظهر رسالة الترحيب الخاصة\nبالمقرر، وفيها وصف مختصر له ومعلومات التواصل مع أستاذ المادة. عند الدخول اختر دور تدريسي ، ثم المادة وفصلها."}, {"title": "الخطوة 5: رسالة الترحيب", "time": "02:41", "html": "<p>أول خيار في المادة هو الترحيب: فعّل وضع التحرير وأضف فقرة ترحيب بالطلبة، مع وصف المادة ومعلومات التدريسي وساعات التواصل.<\/p><blockquote>\n<p><strong>1.<\/strong> الضغط على النقاط الثلاث بجانب\nرسالة الترحيب في صفحة المقرر.<\/p>\n<p><strong>2.<\/strong> اختيار <strong>تغيير\nالإعدادات<\/strong> وتعديل الوصف ومعلومات التواصل.<\/p>\n<\/blockquote>", "text": "أول خيار في المادة هو الترحيب: فعّل وضع التحرير وأضف فقرة ترحيب بالطلبة، مع وصف المادة ومعلومات التدريسي وساعات التواصل. 1. الضغط على النقاط الثلاث بجانب\nرسالة الترحيب في صفحة المقرر. 2. اختيار تغيير\nالإعدادات وتعديل الوصف ومعلومات التواصل."}, {"title": "الخطوة 6: المنهج الدراسي", "time": "01:16", "html": "<p>في قسم <strong>المنهج الدراسي<\/strong> تظهر المحاضرات\nالسابقة والملفات المرفقة بصيغة PDF ورسائل الوصف.<\/p><p>بيانات المادة (عدد الوحدات، الكلية، القسم، رمز المادة، الفصل) تُستدعى تلقائياً من نظام SIS.<\/p>", "text": "في قسم المنهج الدراسي تظهر المحاضرات\nالسابقة والملفات المرفقة بصيغة PDF ورسائل الوصف. بيانات المادة (عدد الوحدات، الكلية، القسم، رمز المادة، الفصل) تُستدعى تلقائياً من نظام SIS."}, {"title": "الخطوة 7: تفعيل وضع التحرير", "time": "01:23", "html": "<p>لا يمكن إضافة أي محتوى قبل تفعيل <strong>وضع\nالتحرير<\/strong> من أعلى يسار الصفحة. بعد تفعيله يظهر خيار <strong>إضافة\nنشاط أو مورد<\/strong>.<\/p>", "text": "لا يمكن إضافة أي محتوى قبل تفعيل وضع\nالتحرير من أعلى يسار الصفحة. بعد تفعيله يظهر خيار إضافة\nنشاط أو مورد ."}, {"title": "الخطوة 8: المحتوى: 15 أسبوعاً", "time": "01:04", "html": "<p>في قسم المحتوى تظهر 15 أسبوعاً دراسياً. فعّل التحرير وارفع محاضرة كل أسبوع وملخصه: PDF أو PowerPoint أو Word أو فيديو أو رابط. ويمكن إضافة مجلدات وواجبات واختبارات قصيرة ومنتديات داخل الأسابيع.<\/p>", "text": "في قسم المحتوى تظهر 15 أسبوعاً دراسياً. فعّل التحرير وارفع محاضرة كل أسبوع وملخصه: PDF أو PowerPoint أو Word أو فيديو أو رابط. ويمكن إضافة مجلدات وواجبات واختبارات قصيرة ومنتديات داخل الأسابيع."}, {"title": "الخطوة 9: اختيار نوع النشاط أو المورد", "time": "01:37", "html": "<p>تتيح المنصة عدة أنواع، أهمها:<\/p><div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>النوع<\/strong><\/th>\n<th><strong>الاستخدام<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ملف<\/th>\n<th>رفع محاضرة بصيغة PDF أو Word أو Excel (الخطوة 10)<\/th>\n<\/tr>\n<tr>\n<th>رابط<\/th>\n<th>رابط خارجي، مثل شرح فيديو على يوتيوب (الخطوة 11)<\/th>\n<\/tr>\n<tr>\n<th>صفحة<\/th>\n<th>نص المحاضرة مكتوباً داخل المنصة (الخطوة 14)<\/th>\n<\/tr>\n<tr>\n<th>منتدى<\/th>\n<th>مساحة نقاش مع الطلبة<\/th>\n<\/tr>\n<tr>\n<th>اختبار<\/th>\n<th>تقييم الطلبة إلكترونياً<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRjJwAABXRUJQVlA4ICZwAABQDQKdASpMBL4CPnk8mkmkoz+hIpHaS/APCWdu4XXiP/X93ZEDblpf8L+a/pd+Hy3kl/z/Af6v/j+W37t+/+h3/i+q/+z+oR/lvLN9XH9m/4HqC/nH+o/dj3fv/D+7vu2/v3qAf2b0tPVD9DXzoP/H+6///+U7/cf+f2G/+X6AH//9qn+Af//2//SH6bf2T+7/sV4F/3n++ft1/dfUf8b+b/v39x/b//Ce1x/y+Ir0j+U/6f+d9Sf5H9s/0f+A/dn+7fM/9a/zP96/d//NeivwN/q/7v+73+Q+QX8i/nf+Y/wX5HesTseNg/3n/i9QX1r+mf8f/BflN6L391/pPUX84/xf+29wD+e/3j/s/4b2n/6ng0fhv+H+33w p><strong>3.<\/strong> إضافة صورة توضيحية عند الحاجة، أو\nاختيار <strong>صورة للتزيين فقط<\/strong> للتحكم بطريقة\nظهورها.<\/p>\n<p><strong>4.<\/strong> الحفظ.<\/p>\n<\/blockquote>", "text": "1. اختيار رابط من\nقائمة إضافة نشاط أو مورد. 2. لصق رابط الفيديو (من يوتيوب مثلاً)\nوكتابة عنوان المحاضرة. 3. إضافة صورة توضيحية عند الحاجة، أو\nاختيار صورة للتزيين فقط للتحكم بطريقة\nظهورها. 4. الحفظ."}, {"title": "الخطوة 12: تقييد الوصول للمجموعات", "time": "02:20", "html": "<p>من إعدادات <strong>تقييد الوصول<\/strong> في المحاضرة\nتُحدد المجموعات المسموح لها برؤيتها، مثل Group A أو Group B. يفيد هذا\nعندما تختلف المحاضرات بين الشعب.<\/p>", "text": "من إعدادات تقييد الوصول في المحاضرة\nتُحدد المجموعات المسموح لها برؤيتها، مثل Group A أو Group B. يفيد هذا\nعندما تختلف المحاضرات بين الشعب."}, {"title": "الخطوة 13: إخفاء المحاضرات وإظهارها", "time": "02:27", "html": "<p>يمكن إخفاء أي محاضرة عن الطلبة ثم إظهارها في موعدها،\nبحسب الخطة الأسبوعية للمقرر.<\/p>", "text": "يمكن إخفاء أي محاضرة عن الطلبة ثم إظهارها في موعدها،\nبحسب الخطة الأسبوعية للمقرر."}, {"title": "الخطوة 14: إضافة صفحة نصية", "time": "02:34", "html": "<p>اختيار <strong>صفحة<\/strong> من قائمة إضافة نشاط أو\nمورد، وكتابة نص المحاضرة كاملاً فيها ليقرأه الطالب مباشرة دون تنزيل ملف.\nالمثال في الفيديو صفحة بعنوان (استكشاف الأخطاء وإصلاحها).<\/p>", "text": "اختيار صفحة من قائمة إضافة نشاط أو\nمورد، وكتابة نص المحاضرة كاملاً فيها ليقرأه الطالب مباشرة دون تنزيل ملف.\nالمثال في الفيديو صفحة بعنوان (استكشاف الأخطاء وإصلاحها)."}, {"title": "الخطوة 15: الدرجات والتقييم التكويني", "time": "01:23", "html": "<p>في قسم الدرجات يظهر التقييم التكويني الموزع من 40 درجة (الاختبارات، التقرير، الامتحانات، الحلقة النقاشية) كما أُدخل في SIS. يرفع التدريسي درجات السعي من المنصة مباشرة، وبعد مصادقة رئيس القسم تنتقل تلقائياً إلى نظام اللجنة الامتحانية.<\/p>", "text": "في قسم الدرجات يظهر التقييم التكويني الموزع من 40 درجة (الاختبارات، التقرير، الامتحانات، الحلقة النقاشية) كما أُدخل في SIS. يرفع التدريسي درجات السعي من المنصة مباشرة، وبعد مصادقة رئيس القسم تنتقل تلقائياً إلى نظام اللجنة الامتحانية."}, {"title": "الخطوة 16: إكمال المصادقة الثنائية (2FA)", "time": "02:48", "html": "<p>يكتمل توثيق الحساب بإنهاء المصادقة الثنائية\nالخطوات.<\/p><blockquote>\n<p><strong>تنبيه:<\/strong> ورد هذا البند في آخر الفيديو،\nلكنه عملياً جزء من تسجيل الدخول. إذا طلبت المنصة رمز التحقق عند الدخول في\nالخطوة 1، أكمله هناك قبل المتابعة.<\/p>\n<\/blockquote>", "text": "يكتمل توثيق الحساب بإنهاء المصادقة الثنائية\nالخطوات. تنبيه: ورد هذا البند في آخر الفيديو،\nلكنه عملياً جزء من تسجيل الدخول. إذا طلبت المنصة رمز التحقق عند الدخول في\nالخطوة 1، أكمله هناك قبل المتابعة."}, {"title": "قائمة تدقيق للتدريسي", "time": "", "html": "<div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>#<\/strong><\/th>\n<th><strong>البند<\/strong><\/th>\n<th><strong>المكان في المنصة<\/strong><\/th>\n<th><strong>تم<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>الدخول بالبريد الجامعي وكلمة المرور وحساب\nالجامعة<\/th>\n<th>نافذة تسجيل الدخول<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>إكمال المصادقة الثنائية<\/th>\n<th>نافذة تسجيل الدخول<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>تحويل الواجهة إلى العربية<\/th>\n<th>القائمة العليا<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>مراجعة الكلية والقسم والمقررات والشعب<\/th>\n<th>لوحة التحكم<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>فتح المقرر المطلوب<\/th>\n<th>المواد الدراسية<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>مراجعة رسالة الترحيب وتحديثها<\/th>\n<th>صفحة المقرر<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>تفعيل وضع التحرير<\/th>\n<th>أعلى يسار الصفحة<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>8<\/th>\n<th>رفع ملفات المحاضرات مع الوصف والإشعار<\/th>\n<th>إضافة نشاط أو مورد<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>9<\/th>\n<th>إضافة روابط الفيديو والصفحات النصية<\/th>\n<th>إضافة نشاط أو مورد<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>10<\/th>\n<th>ضبط تقييد الوصول للمجموعات<\/th>\n<th>إعدادات المحاضرة<\/th const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Arabic-tolerant normalisation: drop diacritics/tatweel, unify alef, ya, ta marbuta, hamza seats
const MAP = {"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه","ـ":""};
function norm(s){
  let out = "", idx = [];
  for (let i = 0; i < s.length; i++){
    let ch = s[i];
    if (/[ً-ْٰ]/.test(ch)) continue;
    ch = (MAP[ch] !== undefined ? MAP[ch] : ch).toLowerCase();
    for (const c of ch){ out += c; idx.push(i); }
  }
  return {out, idx};
}
DATA.forEach(d => { d.hay = norm([d.problem, d.error, d.solution, d.notes, d.cat, d.group].join(" ")).out; });

function highlight(text, terms){
  if (!text) return "";
  if (!terms.length) return esc(text);
  const {out, idx} = norm(text);
  const marks = new Array(text.length).fill(false);
  for (const t of terms){
    let p = out.indexOf(t);
    while (p !== -1){
      const a = idx[p], b = idx[p + t.length - 1];
      for (let i = a; i <= b; i++) marks[i] = true;
      p = out.indexOf(t, p + 1);
    }
  }
  let html = "", open = false;
  for (let i = 0; i < text.length; i++){
    if (marks[i] && !open){ html += "<mark>"; open = true; }
    if (!marks[i] && open){ html += "</mark>"; open = false; }
    html += esc(text[i]);
  }
  return html + (open ? "</mark>" : "");
}

DATA.forEach(d => { d.hay = norm([d.problem, d.error, d.solution, d.notes, d.cat, d.group, ...(d.vid || []).map(v => v.text + " " + v.note)].join(" ")).out; d.b = badge(d); });

function markEl(root, terms){
  if (!terms.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue; if (!text.trim()) continue;
    const h = highlight(text, terms);
    if (h.indexOf("<mark>") === -1) continue;
    const span = document.createElement("span"); span.innerHTML = h;
    node.replaceWith(...span.childNodes);
  }
}

  $("#foot").innerHTML = META.log.map(l => `مجموعة «${esc(l[0])}»: آخر رسالة معالجة ${esc(l[1])}`).join(" · ") + "<br>لا يحتوي الدليل على أسماء الطلبة أو أرقامهم ولا أرقام الهواتف أو التذاكر.";
  const st = load();
  if (st.q) $("#q").value = st.q;
  if (st.s) $("#fs").value = st.s;
  if (st.g) $("#fg").value = st.g;
  if (st.t && TABNAME[st.t]) curTab = st.t;
  if (["guides", "other"].includes(st.v)) view = st.v;
  if (st.n) $("#onlynew").checked = true;
  if (st.o) OPEN = st.o;
  else if (window.innerWidth <= 820) SYS.tree.forEach(([g]) => OPEN[g] = false);   // phones: start collapsed
  let t;
  $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { render(); save(); }, 120); });
  ["#fs", "#fg", "#onlynew"].forEach(s => $(s).addEventListener("change", () => { render(); save(); }));
  $("#clr").addEventListener("click", () => { $("#q").value = ""; render(); save(); $("#q").focus(); });
  document.addEventListener("click", e => {
    const b = e.target.closest(".vid button"); if (!b) return;
    goSection(b.dataset.g, b.dataset.i);
  });
  window.addEventListener("hashchange", fromHash);
}

function goSection(g, i){
  view = "guides"; curTab = ""; $("#q").value = ""; $("#onlynew").checked = false; render(); save();
  const el = document.getElementById(`s-${g}-${i}`);
  if (el){
    document.querySelectorAll("#list img").forEach(x => x.loading = "eager");
    const go = () => el.scrollIntoView({block: "start"});
    go(); setTimeout(go, 350); setTimeout(go, 900);
    el.style.background = "var(--accent-soft)"; setTimeout(() => el.style.background = "", 2200);
  }
}
function fromHash(){
  const m = /^#s-([a-z]+)-(\d+)$/.exec(location.hash);
  if (m && GUIDES.some(g => g.id === m[1])) goSection(m[1], m[2]);
}

function issueBase(T){
  const fs = $("#fs").value, fg = $("#fg").value, nw = $("#onlynew").checked;
  return DATA.filter(d => (!fs || d.status === fs) && (!fg || d.group.includes(fg)) && (!nw || d.b) && T.every(t => d.hay.includes(t)));
}
function guideHits(T){
  const nw = $("#onlynew").checked;
  return GUIDES.filter(g => !nw || g.b).map(g => ({g, secs: g.sections.filter(s => T.every(t => s.hay.includes(t)))}));
}

function render(){
  const raw = $("#q").value.trim(), T = terms();
  $("#clr").hidden = !raw;
  const all = issueBase(T), gh = guideHits(T);
  const probs = all.filter(d => d.kind !== "info"), infos = all.filter(d => d.kind === "info");
  const inTab = (it, tab) => !tab || it.tabs.includes(tab);
  const gIn = tab => gh.filter(x => x.secs.length && inTab(x.g, tab));
  const counts = tab => ({issues: probs.filter(d => inTab(d, tab)).length, guides: gIn(tab).length, other: infos.filter(d => inTab(d, tab)).length});
  if (autoView){
    const c = counts(curTab);
    if (!c[view]) view = ["issues", "guides", "other"].find(v => c[v]) || view;
    autoView = false;
  }
  $("#fs").hidden = $("#fg").hidden = view === "guides";
  document.body.dataset.view = view;
  // rail: app tabs grouped like the application's menu; counts include problems, usage guides and other cases
  const cnt = tab => all.filter(d => inTab(d, tab)).length + gIn(tab).length;
  const newCnt = tab => all.filter(d => inTab(d, tab) && d.b).length + gIn(tab).filter(x => x.g.b).length;
  let rh = `<button class="cat allbtn" data-c="" aria-pressed="${!curTab}"><span>${esc(SYS.home)}</span><span class="r"><span class="n">${cnt("")}</span></span></button>`;
  for (const [grp, tabs] of SYS.tree){
    const ids = tabs.map(t => t[0]);
    const inG = it => it.tabs.some(t => ids.includes(t));
    const gItems = all.filter(inG).length + gh.filter(x => x.secs.length && inG(x.g)).length;
    const gNew = all.filter(d => d.b && inG(d)).length + gh.filter(x => x.secs.length && x.g.b && inG(x.g)).length;
    const open = OPEN[grp] !== false;
    rh += `<button class="grp" type="button" data-grp="${esc(grp)}" aria-expanded="${open}"><span>${esc(grp)}<span class="gn">${gItems}</span></span><span class="r">${gNew ? `<span class="newpill">${gNew} جديد</span>` : ""}<span class="chev">▾</span></span></button><div class="gitems"${open ? "" : " hidden"}>`;
    for (const [id, name, acc] of tabs){
      const n = cnt(id), nn = newCnt(id);
      rh += `<button class="cat${n === 0 ? " zero" : ""}" data-c="${id}" aria-pressed="${curTab === id}"><span class="nm"><span>${esc(name)}</span>${acc ? `<span class="acc">${esc(acc)}</span>` : ""}</span><span class="r">${nn ? `<span class="newpill">${nn} جديد</span>` : ""}<span class="n">${n}</span></span></button>`;
    }
    rh += `</div>`;
  }
  const nav = $("#cats"), keep = nav.scrollTop;
  nav.innerHTML = rh; nav.scrollTop = keep;
  if (view === "guides") renderGuides(gh, raw, T); else renderIssues(view === "other" ? infos : probs, raw, T, view === "other");
  // header of the selected tab with the three content buttons
  const c = counts(curTab);
  const segs = [["issues", "المشاكل والحلول", c.issues], ["guides", "آلية الاستخدام وطريقة الإدخال", c.guides], ["other", "حالات أخرى", c.other]];
  const head = `<div class="tabhead"><div class="th"><div class="crumb">${curTab ? esc(TABGRP[curTab]) : esc(SYS.title)}</div><div class="tt">${esc(curTab ? TABNAME[curTab] : "كل التبويبات")}</div></div>
    <div class="seg" role="tablist">${segs.map(([v, l, n]) => `<button type="button" role="tab" class="segb${n ? "" : " zero"}" data-v="${v}" aria-selected="${view === v}">${l} <span class="n">${n}</span></button>`).join("")}</div></div>`;
  $("#list").insertAdjacentHTML("afterbegin", head);
}

const PLAY = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;
function card(d, T, here){
  const others = d.tabs.filter(t => t !== here).map(t => TABNAME[t]);
  const ext = d.elsewhere.map(e => `${e.sys} (${e.tab})`);
  const also = [...others, ...ext];
  return `<article data-s="${esc(d.status)}" class="${d.b ? "isnew" : ""}">
    <div class="meta">${pill(d.b)}<span class="pill ${ST[d.status]}">${esc(d.status)}</span>
      <span class="num">#${d.n}</span><span class="num"><bdi>${esc(d.date.split(" ")[0])}</bdi> · <bdi>${esc(d.date.split(" ").slice(1).join(" "))}</bdi></span><span>${esc(d.group)}</span>
      ${d.source ? `<span>المصدر: ${esc(d.source)}</span>` : ""}</div>
    <p class="q">${highlight(d.problem, T)}</p>
    ${d.error ? `<p class="err">${highlight(d.error, T)}</p>` : ""}
    <p class="sol"><span class="k">${d.kind === "info" ? "التوضيح" : "الحل"}: </span>${highlight(d.solution, T)}</p>
    ${(d.vid || []).map(v => `<div class="vid"><div class="vh"><span class="vt">${PLAY} من شرح «${esc(v.name)}»، ${esc(v.step)}</span>
      ${v.href ? `<a class="btn" href="${esc(v.href)}" target="_blank" rel="noopener">افتح في ${esc(v.sysname)}</a>` : `<button type="button" data-g="${esc(v.g)}" data-i="${v.i}">افتح الخطوة في الشرح</button>`}</div>
      <p>${highlight(v.text, T)}</p>${v.note ? `<p class="vn">${highlight(v.note, T)}</p>` : ""}</div>`).join("")}
    ${d.notes ? `<p class="note"><span class="k">ملاحظة: </span>${highlight(d.notes, T)}</p>` : ""}
    ${also.length ? `<p class="also">يظهر أيضاً في: <b>${esc(also.join(" · "))}</b></p>` : ""}
  </article>`;
}
function renderIssues(base, raw, T, isOther){
  const tabsToShow = curTab ? [curTab] : TABORDER;
  let html = "", shown = 0;
  for (const tab of tabsToShow){
    // in "all" mode each problem is listed once, under its first tab in this system
    const items = base.filter(d => curTab ? d.tabs.includes(tab) : d.tabs[0] === tab);
    if (!items.length) continue;
    shown += items.length;
    html += `<section class="group"><h2>${esc(TABNAME[tab])} <span>${items.length}</span></h2><div class="cards">${items.map(d => card(d, T, tab)).join("")}</div></section>`;
  }
  $("#count").textContent = `يظهر ${shown} من ${DATA.length}`;
  $("#list").innerHTML = html || `<div class="empty">لا توجد ${isOther ? "حالات أخرى" : "مشكلة"}${raw ? ` فيها «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}${$("#onlynew").checked ? " ضمن الجديد" : ""}.</div>`;
}
function renderGuides(gh, raw, T){
  const list = gh.filter(x => (!curTab || x.g.tabs.includes(curTab)) && x.secs.length);
  const shownSecs = list.reduce((a, x) => a + x.secs.length, 0);
  $("#count").textContent = T.length ? `${shownSecs} خطوة مطابقة` : `${list.length} من ${GUIDES.length} شروحات`;
  if (!list.length){
    $("#list").innerHTML = `<div class="empty">لا يوجد شرح${raw ? ` فيه «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}.</div>`;
    return;
  }
  let html = "";
  for (const {g, secs} of list){
    html += `<section class="guide" id="g-${g.id}"><div class="ghead"><h2>${esc(g.title)}</h2><p class="gs">${esc(g.subtitle)}</p>
      <p class="src">${PLAY}<span>${esc(g.source)}</span></p>
      <div class="gmeta">${pill(g.b)}${g.tabs.map(t => `<span class="newpill upd" style="background:var(--bg);color:var(--muted);border-color:var(--line)">${esc(TABNAME[t])}</span>`).join("")}</div></div>`;
    if (T.length) html += `<div class="hits">${secs.length} من ${g.sections.length} أقسام تطابق البحث</div>`;
    else html += `<nav class="toc" aria-label="محتويات الشرح">${secs.map(s => `<a href="#s-${g.id}-${g.sections.indexOf(s)}">${esc(s.title.replace(/:.*/, ""))}</a>`).join("")}</nav>`;
    secs.forEach(s => {
      const i = g.sections.indexOf(s);
      html += `<div class="sec" id="s-${g.id}-${i}"><h3><span class="st">${esc(s.title)}</span>${s.time ? `<span class="t">في الفيديو ${esc(s.time)}</span>` : ""}</h3>${s.html}</div>`;
    });
    html += `</section>`;
  }
  const L = $("#list"); L.innerHTML = html;
  markEl(L, T);
  L.querySelectorAll(".toc a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1));
    if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
  }));
}
setup(); render(); fromHash();
</script>
</html>
