<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل نظام بولونيا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: sticky search bar, category rail beside a single column of issue cards; rail becomes a chip row on phones */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#13262B; --muted:#5A6E72; --line:#D9E2E0;
  --accent:#0E6B66; --accent-soft:#DDEFEC; --mark:#FFE58A; --err-bg:#FBEEEE; --err-fg:#9B2C2C;
  --ok:#23804A; --ok-bg:#E3F3E8; --sug:#1D5D9B; --sug-bg:#E2EDF9; --part:#A8620E; --part-bg:#FCEFDD; --no:#B8342A; --no-bg:#FBE6E4;
  --display:"Reem Kufi","Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#162427; --ink:#E4EEEC; --muted:#93A8A6; --line:#26393C;
  --accent:#4FC2B8; --accent-soft:#16383A; --mark:#6B5A12; --err-bg:#3A1F1F; --err-fg:#F2AAAA;
  --ok:#6FD08F; --ok-bg:#183223; --sug:#86B8EE; --sug-bg:#172A3F; --part:#F0B565; --part-bg:#3A2A14; --no:#F28F86; --no-bg:#3D1C19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#162427; --ink:#E4EEEC; --muted:#93A8A6; --line:#26393C;
  --accent:#4FC2B8; --accent-soft:#16383A; --mark:#6B5A12; --err-bg:#3A1F1F; --err-fg:#F2AAAA;
  --ok:#6FD08F; --ok-bg:#183223; --sug:#86B8EE; --sug-bg:#172A3F; --part:#F0B565; --part-bg:#3A2A14; --no:#F28F86; --no-bg:#3D1C19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.search{flex:1 1 320px;position:relative;min-width:0}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 40px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:6px}
.search button:focus-visible{outline:2px solid var(--accent)}
select{font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
select:focus-visible{outline:2px solid var(--accent)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:24px 60px}
nav.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.cats .lbl{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 10px 6px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:right;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.cat:hover{background:var(--accent-soft)}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.cat[aria-pressed="true"] .n{color:var(--surface);background:transparent}
.cat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cat .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);background:var(--bg);padding:0 8px;border-radius:999px}
.cat.zero{opacity:.45}
main{min-width:0}
section.group{margin-bottom:34px}
section.group h2{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
section.group h2 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.cards{display:flex;flex-direction:column;gap:12px}
article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-inline-start:4px solid var(--st)}
article[data-s="محلولة"]{--st:var(--ok)} article[data-s="حل مقترح"]{--st:var(--sug)}
article[data-s="حل جزئي"]{--st:var(--part)} article[data-s="بلا حل"]{--st:var(--no)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pill{font-weight:600;font-size:12px;padding:1px 10px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.sug{background:var(--sug-bg);color:var(--sug)}
.pill.part{background:var(--part-bg);color:var(--part)} .pill.no{background:var(--no-bg);color:var(--no)}
.num{font-variant-numeric:tabular-nums}
.q{font-weight:600;font-size:15.5px;margin:0 0 10px}
.err{background:var(--err-bg);color:var(--err-fg);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 10px}
.err::before{content:"رسالة النظام: ";font-weight:600}
.sol{margin:0}
.sol .k,.note .k{font-weight:700;color:var(--accent)}
.note{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-block:16px 30px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  nav.cats{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.cats .lbl{display:none}
  .cat{width:auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
  .bar{position:static}
  .search{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){article{transition:border-color .15s}}
</style>
<style>
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.topic{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.topic .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.topic[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.topic[aria-selected="true"] .n{color:var(--surface)}
.topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.cats .lbl{margin-top:10px}
@media (max-width:820px){body[data-view="guides"] nav.cats{display:none}}
.vid{margin:10px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft);padding:10px 12px}
.vid .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.vid .vt{font-weight:700;color:var(--accent);font-size:13.5px;display:flex;gap:6px;align-items:center}
.vid p{margin:0;font-size:14px}
.vid .vn{margin-top:4px;font-size:12.5px;color:var(--muted)}
.vid button{font:inherit;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:1px 12px;cursor:pointer}
.vid button:hover{background:var(--accent);color:var(--surface)}
.vid button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .n{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;background:var(--surface);color:var(--muted);padding:0 8px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow:hidden}
.ghead{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:linear-gradient(to left,var(--accent-soft),transparent 70%)}
.ghead h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;line-height:1.5;text-wrap:balance}
.ghead .gs{margin:2px 0 0;color:var(--ink);font-weight:500}
.ghead .src{margin:8px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.ghead .src svg{flex:0 0 auto;margin-top:4px;color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.toc a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:2px 10px;border-radius:999px;background:var(--bg)}
.toc a:hover,.toc a:focus-visible{border-color:var(--accent);outline:none}
.sec{padding:16px 20px;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h3 .t{font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:0 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.sec p{margin:0 0 8px}
.sec blockquote{margin:0 0 8px;padding:0 14px 0 0;border-right:2px solid var(--line)}
.sec blockquote p{margin:0 0 4px}
.sec .subh{font-weight:700;color:var(--accent);margin-top:6px}
.sec img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:8px auto;background:#fff}
.tw{overflow-x:auto;margin:6px 0 10px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tw th{background:var(--accent);color:var(--surface);font-weight:600;text-align:right;padding:6px 10px}
.tw tr:not(:first-child) th{background:transparent;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line)}
.tw td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
.tw tr:nth-child(even) td{background:var(--bg)}
.srcline{font-size:12px;color:var(--muted);margin:6px 0 0}
.hits{font-size:12.5px;color:var(--muted);padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
@media (max-width:820px){.bar .tabs{width:100%}.tab{flex:1;justify-content:center}}
</style>
<style>
.sysnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sysnav a,.sysnav span{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--accent);background:var(--surface)}
.sysnav span{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.sysnav a:hover,.sysnav a:focus-visible{border-color:var(--accent);outline:none}
.newpill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--new-bg);color:var(--new);border:1px solid var(--new);white-space:nowrap;line-height:1.7}
.newpill.upd{background:var(--upd-bg);color:var(--upd);border-color:var(--upd)}
.cat .r{display:flex;gap:6px;align-items:center}
.cat[aria-pressed="true"] .newpill{background:var(--surface)}
nav.cats .lbl{margin-top:12px;font-weight:600}
.onlynew{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer}
.onlynew input{accent-color:var(--new);width:16px;height:16px}
article.isnew{box-shadow:0 0 0 2px var(--new-bg)}
.also{font-size:12px;color:var(--muted);margin-top:8px}
.also b{font-weight:600;color:var(--ink)}
.vid a.btn{font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:1px 12px;text-decoration:none}
.vid a.btn:hover{background:var(--accent);color:var(--surface)}
.log{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.log table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
.log th{background:var(--bg);text-align:right;padding:6px 10px;font-weight:600}
.log td{border-top:1px solid var(--line);padding:6px 10px;vertical-align:top}
.log tr.cur td{background:var(--new-bg)}
.ghead .gmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tabhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:3}
.tabhead .crumb{font-size:12px;color:var(--muted)}
.tabhead .tt{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.segb .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.segb[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.segb[aria-selected="true"] .n{color:var(--surface)}
.segb.zero{opacity:.5}
.segb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.tabhead{position:static}}
/* sidebar styled like the application's dark side menu */
nav.cats{background:var(--side-bg);border-radius:14px;padding:10px 8px;gap:0!important;max-height:calc(100vh - 110px);overflow-y:auto}
nav.cats .cat{color:var(--side-fg);padding:7px 10px;font-size:13.5px}
nav.cats .cat:hover{background:var(--side-hover)}
nav.cats .cat[aria-pressed="true"]{background:var(--side-act);color:#fff}
nav.cats .cat .n{background:var(--side-pill);color:var(--side-act);font-weight:600}
nav.cats .cat[aria-pressed="true"] .n{background:#fff;color:var(--side-act)}
nav.cats .cat.zero{opacity:.5}
nav.cats .cat .nm{display:flex;flex-direction:column;align-items:flex-start;text-align:right}
nav.cats .cat .acc{font-size:11px;color:var(--side-mut);font-weight:400}
nav.cats .cat[aria-pressed="true"] .acc{color:#f3d6da}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:13.5px;font-weight:700;color:var(--side-head);background:none;border:0;padding:12px 10px 6px;cursor:pointer;text-align:right}
.grp:focus-visible{outline:2px solid var(--side-head);border-radius:6px}
.grp .r{display:flex;gap:8px;align-items:center}
.grp .chev{transition:transform .15s;display:inline-block;font-size:12px;opacity:.8}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp .gn{font-size:11.5px;font-weight:500;color:var(--side-mut);margin-inline-start:6px}
.gitems{display:flex;flex-direction:column;gap:1px;padding-inline-start:6px}
.gitems[hidden]{display:none!important}
nav.cats .allbtn{margin-bottom:4px}
:root{--side-bg:#1F2433;--side-fg:#E7EAF0;--side-head:#C5CCD8;--side-mut:#9AA3B2;--side-hover:#2C3345;--side-act:#8E2433;--side-pill:#FBEFF0}
@media (max-width:820px){
  nav.cats{flex-direction:column!important;overflow-y:visible!important;max-height:none!important;position:static!important;padding:8px!important}
  body[data-view="guides"] nav.cats{display:flex!important}
  nav.cats .cat{width:100%!important;white-space:normal!important;border:0!important;flex:none!important}
  nav.cats .cat:not([aria-pressed="true"]){background:none!important}
}
:root{--new:#B4530F;--new-bg:#FFF1E2;--upd:#6A3FA0;--upd-bg:#F2ECFA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--new:#F5A35C;--new-bg:#3A2614;--upd:#C3A6F0;--upd-bg:#2A2140}}
:root[data-theme="dark"]{--new:#F5A35C;--new-bg:#3A2614;--upd:#C3A6F0;--upd-bg:#2A2140}
</style>

<header class="top"><div class="wrap">
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
  <nav class="sysnav" id="sysnav" aria-label="الأنظمة"></nav>
</div></header>

<div class="bar"><div class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث بأي كلمة أو جزء من كلمة..." autocomplete="off" aria-label="بحث">
    <button id="clr" type="button" aria-label="مسح البحث" hidden>×</button>
  </div>
  <select id="fs" aria-label="الحالة"><option value="">كل الحالات</option></select>
  <select id="fg" aria-label="المجموعة"><option value="">كل المجموعات</option></select>
  <label class="onlynew"><input type="checkbox" id="onlynew"> الجديد فقط</label>
  <span class="count" id="count"></span>
</div></div>

<div class="wrap layout">
  <nav class="cats" id="cats" aria-label="تبويبات النظام"></nav>
  <main id="list"></main>
</div>

<footer><div class="wrap">
  <div style="font-weight:600;color:var(--ink);margin-bottom:4px">سجل التحديثات</div>
  <div class="log" id="log"></div>
  <p id="foot" style="margin-top:10px"></p>

const DATA = [{"n": 4, "date": "21/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "المواد وقوائم الدرجات", "problem": "إعدادات المقررات الخاصة: مشروع التخرج، والتقويم المستمر، والمواد السنوية في بولونيا.", "error": "", "solution": "في إعدادات المادة يمكن تفعيل (مشروع تخرج) و(مادة تقويم مستمر)، وتفعيل المواد السنوية في نظام بولونيا.", "source": "الورشة الوزارية", "status": "محلولة", "notes": "", "kind": "info", "added": "03/11/2026 مساءً", "updated": "", "tabs": ["bo_sis"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}], "vid": []}, {"n": 13, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "IQ Learn", "problem": "المقرر التجريبي في IQ Learn، واحتساب أوزان السعي.", "error": "", "solution": "أُضيف للتدريسيين (مقرر تجريبي) للتدرّب على رفع المحاضرات والاختبارات وإدارة الأسابيع والأنشطة دون أي أثر على سجلات الطلبة الحقيقية. وصار توزيع درجات التقييم التكويني (التقارير والواجبات والامتحانات) وأوزان السعي يُحتسب تلقائياً عند الإدخال.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["bo_sis"], "elsewhere": [{"sys": "منصة IQ Learn", "tab": "المقررات والمحتوى"}], "vid": []}, {"n": 17, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "المواد وقوائم الدرجات", "problem": "المواد السنوية ضمن النظام الفصلي أو بولونيا (مشروع التخرج، التصميم المعماري).", "error": "", "solution": "يُقسَّم تسجيلها تلقائياً على فصلين. نظام اللجنة الامتحانية ما زال يُحدَّث لدعم درجاتها ومحاولاتها، فلا تُدخل درجاتها ولا تفعّل لها فترة امتحانية حتى يكتمل التحديث.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "إعدادات المادة السنوية في بولونيا ذُكرت أيضاً في ورشة 21-9.", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["bo_sis", "bo_gbx"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}, {"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}], "vid": []}, {"n": 18, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "إدارة الامتحانات والنتائج", "problem": "من يدخل الدور الثاني، والغياب بعذر.", "error": "", "solution": "يُشمل بالدور الثاني: من حضر الدور الأول ورسب، ومن غاب بعذر. الغائب بلا عذر لا يُشمل. الغياب بعذر لا يُقبل إلا بأمر إداري يُرفق في النظام. الطالب الراسب في الامتحان التقويمي ومجموعه ناجح يُؤشَّر عليه راسباً يدوياً ليُشمل بالدور الثاني، ثم (إعادة احتساب النتيجة).", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["bo_gbx"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}, {"sys": "نظام اللجنة الامتحانية", "tab": "معالجة نتائج الطلبة"}], "vid": []}, {"n": 47, "date": "29/10/2026 11:38 ص", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "طلبة بولونيا (ناجح جزئي) أو راسبون في مادة أو أكثر يمنعون ترحيل الدور الأول. هل تُحوّل حالتهم إلى ناجح، أم يُرحَّلون مع الدور الثاني مثل الراسبين، وماذا نختار لهم: غير جاهز أم متجاهل أم قيد الانتظار؟", "error": "توجد مادة واحدة أو أكثر نتيجتها غير مسجلة كناجح / لا يمكن تنفيذ الدور الأول حالياً: الدور الأول يرحّل الطلبة الناجحين بكل المواد فقط. يوجد 54 طالباً جاهزين غير ناجحين يمنعون تنفيذ هذا الدور.", "solution": "اختر لهم (قيد الانتظار). وفي مجموعة المقررين (3-11) ظهرت الرسالة الثانية، والحل الذي نجح: من إدارة الترحيل في SIS حوّل حالة هؤلاء الطلبة إلى (غير جاهز للترحيل)، ثم رحّل الدور الأول.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "طُرح مرتين. الصورة: IMG-20261031-WA0001.jpg الصورة: IMG-20261103-WA0028.jpg", "kind": "problem", "added": "31/10/2026", "updated": "05/11/2026", "tabs": ["bo_sis", "bo_gbx"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "ترحيل الطلبة"}, {"sys": "نظام إدارة معلومات الطالب SIS", "tab": "إدارة الترحيل"}], "vid": [{"g": "promotion", "i": 0, "name": "ترحيل الطلبة إلى 2026-2027", "step": "نظرة عامة", "text": "بعد تفعيل الدور الثاني في الترحيل صار يُرحَّل الجميع دفعة واحدة: الناجحون والراسبون والمؤجلون.", "note": "", "href": "sis.html#s-promotion-0", "sysname": "نظام إدارة معلومات الطالب SIS"}, {"g": "promotion", "i": 3, "name": "ترحيل الطلبة إلى 2026-2027", "step": "الخطوة 2", "text": "ترحيل الدور الأول في بولونيا يشترط النجاح في كل المواد، وأي طالب لديه مادة متبقية أو مؤجل يمنعه.", "note": "", "href": "sis.html#s-promotion-3", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 53, "date": "29/10/2026 12:43 م", "group": "مسجلو الطلبة", "cat": "إدارة الامتحانات والنتائج", "problem": "طالب في المرحلة الثالثة (نظام بولونيا) رسب في مادة واحدة في الدور الأول، وفي الدور الثاني كان في المستشفى يوم الامتحان (عذر مشروع). هل يعيد المادة امتحاناً فقط أم امتحاناً وحضوراً؟", "error": "", "solution": "الراسب الباقي في المرحلة نفسها يحضر محاضرات المواد التي رسب فيها. أما إذا كانت مادة واحدة فهو ناجح بالعبور، ولا يُطالب بحضور المحاضرات، ويؤدي الامتحانات الفصلية والنهائية فقط.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["bo_gbx"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "تعليمات عامة"}], "vid": []}, {"n": 63, "date": "30/10/2026 10:45 ص", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "قسم تحوّل في 2025-2026 من النظام السنوي إلى بولونيا، وبقيت مواد في المرحلة الأولى تولدت من ترحيل 2024-2025، وهي تخفض نسبة الإنجاز في نظام اللجنة الامتحانية.", "error": "", "solution": "لم يُجب في المجموعة.", "source": "شرح فيديو", "status": "حل مقترح", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["bo_sis", "bo_transition"], "elsewhere": [{"sys": "نظام إدارة معلومات الطالب SIS", "tab": "المواد الدراسية"}, {"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": [{"g": "init", "i": 5, "name": "تهيئة العام الدراسي", "step": "الخطوة 4", "text": "المادة التي لم تعد ضمن البرنامج يُحذف توزيعها أولاً، ثم تُحذف المادة من السنة الدراسية.", "note": "الشرح يتكلم عن حذف مواد 2026-2027 الملغاة، وتطبيقه على مواد 2025-2026 لم يُجرَّب.", "href": "sis.html#s-init-5", "sysname": "نظام إدارة معلومات الطالب SIS"}]}, {"n": 92, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "بولونيا: الوحدات الأوروبية (ECTS).", "error": "", "solution": "نظام أوروبي تراكمي لتحويل الرصيد، يقيس حجم التعلم بناءً على مخرجات التعلم والعبء المرتبط بها. لكل مادة عدد وحدات يعادل العبء المطلوب لاجتيازها، والوحدة الواحدة 25 ساعة جهد.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_terms", "bo_ects"], "elsewhere": [], "vid": []}, {"n": 93, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "بولونيا: مخرجات التعلم (LO) والعبء الدراسي (SWL).", "error": "", "solution": "مخرجات التعلم: المعارف والمهارات والكفاءات التي يحصل عليها الطالب بعد إنهاء الفصل أو البرنامج، وتُحدد لكل مادة وفصل بما يخدم أهداف البرنامج. العبء الدراسي: كل الوقت الذي يستغرقه الطالب للتعلم داخل القاعة وخارجها (محاضرات، واجبات، تقارير، سيمنارات، امتحانات)، ويتكون من ساعات مجدولة داخل الصف (SSWL) وغير مجدولة خارجه (USSWL).", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_terms", "bo_lo", "bo_ects"], "elsewhere": [], "vid": []}, {"n": 94, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "بولونيا: المواد الممهدة والمواد المكملة.", "error": "", "solution": "الممهدة: مادة يجب استيفاء متطلباتها قبل التسجيل على المادة المكملة لها في فصل لاحق. المكملة: مادة لا يسجل عليها الطالب ما لم يستوفِ متطلبات الممهدة في فصل سابق، أي الحضور والتكويني والمشاركة في الامتحان النهائي، دون شرط النجاح فيه.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_terms", "bo_reg", "bo_design"], "elsewhere": [], "vid": []}, {"n": 95, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "بولونيا: التقييم التكويني والتقييم التلخيصي.", "error": "", "solution": "التكويني (40%): يكشف نقاط القوة والضعف أثناء الفصل ومدى تقدم الطالب نحو المخرجات، ويتكون من مهام يحددها أستاذ المادة ويقرّها مجلس الكلية (امتحانات يومية، واجبات، تقارير، مشاريع، زيارات ميدانية، مناقشات، متطلبات سريرية). التلخيصي (60%): يجري في منتصف الفصل ونهايته ويتأكد من تحقق المخرجات فعلاً، ويتكون من امتحان نصف الفصل والامتحان النهائي، وقد يشمل امتحاناً عملياً أو سريرياً.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_terms", "bo_dist"], "elsewhere": [], "vid": []}, {"n": 96, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "بولونيا: الإطار الوطني للمؤهلات، وملحق الشهادة، وGPA وCGPA.", "error": "", "solution": "الإطار الوطني للمؤهلات: هيكل رسمي يصف مخرجات التعلم حسب مستوى الدراسة، والبكالوريوس هو المستوى السادس. ملحق الشهادة (Diploma Supplement): يُعطى للخريج بعد جمعه الوحدات المطلوبة، وفيه نظام التعليم والبرنامج والمخرجات والمواد ودرجاتها ووحداتها والمعدل التراكمي، بنموذج الوزارة. GPA: معدل فصل واحد. CGPA: معدل التخرج لكامل البرنامج.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_terms", "bo_lo", "bo_gpa"], "elsewhere": [], "vid": []}, {"n": 97, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "كم ساعة تعادل الوحدة، وما حدود الفصل والسنة؟", "error": "", "solution": "الوحدة = 25 ساعة تعلم. الحد الأعلى 30 وحدة (750 ساعة) للفصل، و60 وحدة (1500 ساعة) للسنة. والفصل 15 أسبوعاً فعلياً عدا الامتحانات، والسنة فصلان (خريفي وربيعي) ويمكن استحداث فصل صيفي، وتوقيتاتها بحسب التقويم الجامعي للوزارة.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_ects"], "elsewhere": [], "vid": []}, {"n": 98, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "كم ساعة مجدولة في الأسبوع؟", "error": "", "solution": "بين 20 و25 ساعة أسبوعياً، ولا تتجاوز 30 إذا كان الجدول يضم مواد نظرية وعملية. وللساعات المجدولة وغير المجدولة الوزن نفسه عند حساب الوحدات.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_ects"], "elsewhere": [], "vid": []}, {"n": 99, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "هل تدخل المواد الوزارية في حد عدد المواد؟", "error": "", "solution": "لا. المواد الوزارية (العربي والإنكليزي والحاسوب وحقوق الإنسان) مستثناة من حد 5 أو 6 مواد في الفصل، لكن وحداتها تُحسب ضمن الـ 30 وحدة.", "source": "ورشة الدليل الشامل لتطبيق بولونيا 2026-2027", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_ects", "bo_design"], "elsewhere": [], "vid": []}, {"n": 100, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "متطلبات التخرج، والحد الأعلى لمدة الدراسة.", "error": "", "solution": "60 وحدة لكل مستوى دراسي، مع استيفاء التدريب الصيفي للتخصصات المشمولة. ويكمل الطالب دراسته في فصول لا تزيد على ثلاثة أضعاف المستويات، ولا تُحسب فصول التأجيل وعدم الرسوب منها: دبلوم (مستويان، 120 وحدة): 6 فصول. بكالوريوس 4 مستويات (240 وحدة): 12 فصلاً، أي 6 سنوات. بكالوريوس 5 مستويات (300): 15 فصلاً. بكالوريوس 6 مستويات (360): 18 فصلاً. ومن استوفى المتطلبات يملأ استمارة التخرج ويقدمها إلى القسم لتأييد إكماله البرنامج.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_gradreq"], "elsewhere": [], "vid": []}, {"n": 101, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "الأدلة الأربعة لتنفيذ بولونيا، ولجنة القسم.", "error": "", "solution": "دليل المنهاج الدراسي، ودليل البرنامج الدراسي، ودليل المواد الدراسية، ونموذج وصف المادة. تعدّها لجنة في القسم لا يقل أعضاؤها عن خمسة تدريسيين (اثنان على الأقل من حملة الدكتوراه) مع موظفين إداريين، ثم تُرفع إلى اللجنة العلمية، فمجلس الكلية، فالوزارة. وتوصي ورشة 2026-2027 بالتركيز الآن على إعداد جدول ملف الإكسل الموحد الذي تُبنى عليه الأدلة الأربعة.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_guides4"], "elsewhere": [], "vid": []}, {"n": 102, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "قواعد عامة لوضع المقررات.", "error": "", "solution": "لا تتكرر المناهج الأسبوعية التي تعطي المخرجات نفسها داخل المادة أو بين مواد البرنامج. يُفضَّل 5 أو 6 مواد في الفصل كحد أعلى. قلّلوا ربط المواد الممهدة والمكملة حتى لا يتعثر الطالب ويتأخر تخرجه. ويمكن أن يستوفي الطالب مادة لها المخرجات والرمز نفسيهما في قسم آخر إذا أمكن ذلك للجامعة.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_design"], "elsewhere": [], "vid": []}, {"n": 103, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "كم مخرج تعلم للبرنامج؟", "error": "", "solution": "يُوصى بـ 10 إلى 12 مخرجاً لبرنامج البكالوريوس: معرفة 3، مهارات ذهنية 2، مهارات مهنية 3، مهارات عامة 3، قيم مهنية 1. وعند المواءمة مع الإطار الوطني (المستوى السادس) تُصنف في ثلاثة أبعاد: معرفة ومهارات وكفاءات، من 3 إلى 4 لكل بعد.", "source": "الدليل الوطني لكتابة مخرجات التعلم", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_lo"], "elsewhere": [], "vid": []}, {"n": 104, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "مدة تسجيل الطلبة الجدد، وحكم التأخر.", "error": "", "solution": "خلال 10 أيام عمل من إعلان نتائج القبول، ولكل القنوات. من سجّل خلال شهر بعد انتهاء المدة يُعد مؤجلاً للفصلين، ومن سجّل بعد أكثر من شهر وحتى 21/5 يُعد راسباً في الفصلين. والطالب الجديد الذي أكمل التسجيل في موعده يُعد مسجلاً على كل مواد الفصل الأول التي أقرّها القسم.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_reg"], "elsewhere": [], "vid": []}, {"n": 105, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "تسجيل الطالب المستمر على المواد، والانسحاب.", "error": "", "solution": "يسجل على المواد قبل بدء الفصل بمدة لا تتجاوز 7 أيام، ومنها المواد المطالب بها من فصول سابقة، بما لا يتجاوز 30 وحدة في الفصل. يحق له الانسحاب من مادة واحدة فقط بموافقة القسم أو المرشد العلمي خلال أسبوعين من بدء الفصل. ويكلّف القسم مرشدين علميين لتوجيه الطلبة في التسجيل. ومن لم يسجل خلال المدة يُعد راسباً بالغياب للفصل.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_reg"], "elsewhere": [], "vid": []}, {"n": 106, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "متى يُرقَّن قيد الطالب في بولونيا؟", "error": "", "solution": "إذا لم يسجل على المواد أربعة فصول متتالية بلا عذر مشروع، أو لم يسجل على البرنامج سنتين متتاليتين، أو استنفد المحاولات الامتحانية المسموحة، أو تجاوز الحد الأعلى لعدد الفصول. ويمكن للمرقّن قيده العودة في السنة اللاحقة والتسجيل على ما لا يزيد على ثلاثة أضعاف الفصول المتبقية، بأجور تعادل التعليم الحكومي الخاص الصباحي لطلبة القنوات المجانية، أو بأجور تلك السنة مضافاً إليها 25% للدارسين على نفقتهم.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_defer"], "elsewhere": [], "vid": []}, {"n": 107, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "توزيع درجة المادة في بولونيا.", "error": "", "solution": "تكويني 40، وامتحان نصف الفصل 10 (في الأسبوع الثامن تقريباً)، والنهائي 50. التكويني لا يعتمد على امتحانات شهرية، بل على أنشطة: كويزات وتقارير وواجبات وتطبيقات. وفي الجامعات التقنية للمواد العملية: التقرير الأسبوعي للمختبر وامتحان المختبر ضمن التكويني بنسبة 15%، والنهائي يُقسم بين العملي والنظري مناصفة أو حسب قرار القسم والكلية.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_dist"], "elsewhere": [], "vid": []}, {"n": 108, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "هل يجوز أن تزيد فقرات التكويني على 40؟", "error": "", "solution": "لا. في الطريقة المعتمدة الآن في SIS يُدخل التكويني من 40 مباشرة، ولا يجبره النظام لاحقاً. يمكن اعتماد 4 فقرات أو أكثر بشرط أن مجموع أوزانها 40 بالضبط، وإلا يرفض النظام الإدخال ويُظهر تحذيراً.", "source": "فيديو التقييم التكويني في SIS", "status": "محلولة", "notes": "التفاصيل والمثال المحلول في شرح (حساب التقييم التكويني وإعداد ملف الإكسل).", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_formative", "bo_dist"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": []}, {"n": 109, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "جدول التقديرات في بولونيا.", "error": "", "solution": "امتياز (A) 90-100. جيد جداً (B) 80 إلى أقل من 90. جيد (C) 70 إلى أقل من 80. متوسط (D) 60 إلى أقل من 70. مقبول (E) 50 إلى أقل من 60. مقبول بقرار (FX): 50 بعد معالجة من حصل على 45-49. ضعيف/راسب (F): أقل من 50. ويُجبر كسر الدرجة النهائية للمادة إلى أقرب عدد صحيح.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_scale"], "elsewhere": [], "vid": []}, {"n": 110, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "المعالجة (القرار) للدرجات بين 45 و49.", "error": "", "solution": "يعالجها أستاذ المادة حصراً، دون تدخل الوزارة أو الجامعة أو الكلية أو القسم، بتكليف الطالب بعمل إضافي (مشروع أو تقرير أو واجب) خلال أسبوع من تبليغه، ويُوثَّق باستمارة خاصة. ولا تتجاوز درجات المعالجة 5 درجات. وفي نظام اللجنة الامتحانية تُطبَّق بعد تحويل حالة الامتحان إلى (الدرجات الإضافية).", "source": "دليل اعتماد مسار بولونيا V13، وورشة الدليل الشامل لتطبيق بولونيا 2026-2027", "status": "محلولة", "notes": "دليل V13 يقول إن الخمس درجات لجميع المقررات التي رسب بها الطالب، وورشة 2026-2027 قالت 5 درجات لكل فصل. اعتمدوا التعميم الأحدث من الجامعة إن صدر.", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_scale", "bo_gbx"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة درجات المعالجة"}], "vid": []}, {"n": 111, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "نسب الغياب في بولونيا.", "error": "", "solution": "تنبيه تحريري وإلكتروني عند غياب 7% من ساعات المادة (ما يعادل ساعاتها في أسبوع). إنذار نهائي ورسوب عند 14% (أسبوعان) بلا عذر رسمي. ولمجلس الكلية رفعها إلى 21% (ثلاثة أسابيع) بعذر مشروع. الراسب بالغياب يعيد المادة دواماً وامتحاناً، ويُسمح له بإكمال السنة وأداء امتحانات المواد الأخرى.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_attend"], "elsewhere": [], "vid": []}, {"n": 112, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "شرط دخول الامتحان النهائي.", "error": "", "solution": "استيفاء نصاب الدوام، والحصول على 35% على الأقل من التكويني، أي 14 من 40. ومن لم يحققها يُعد راسباً في المادة ويعيدها دواماً وامتحاناً في فصل لاحق. والمشاركة في النهائي شرط للنجاح حتى لمن استوفى الدوام والتكويني.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_final", "bo_formative"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}], "vid": []}, {"n": 113, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "المحاولات الامتحانية في بولونيا.", "error": "", "solution": "لكل فصل محاولتان، والثانية لمن رسب في الأولى. وللمادة الواحدة 4 محاولات ضمن الحد الأعلى للفصول، وبعد الرابعة يُرقَّن القيد. في المحاولات اللاحقة تُحتسب له درجتا التكويني ونصف الفصل اللتان استوفاهما، ويمتحن النهائي فقط. ومن غاب عن المحاولة الأولى بعذر يقرّه مجلس الكلية يحتفظ بهما أيضاً. وبعد 4 محاولات يمكن التسجيل لمحاولتين إضافيتين بأجور: طلبة القنوات المجانية بأجور التعليم الحكومي الخاص الصباحي، والدارسون على نفقتهم بأجور المادة مضافاً إليها 25%.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_final"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}], "vid": []}, {"n": 114, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "من يدخل الدور الثاني في بولونيا؟", "error": "", "solution": "من حضر الدور الأول ورسب، ومن غاب بعذر مشروع. الغائب بلا عذر لا يُشمل. ومن رسب في الامتحان التقويمي ومجموعه ناجح يُؤشَّر عليه راسباً يدوياً ثم يُعاد احتساب النتيجة. والدور الثاني في بولونيا لا يُخصم منه 10 درجات عند حساب المعدل.", "source": "ورشة الدليل الشامل لتطبيق بولونيا 2026-2027، والورشة الوزارية 23-9", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_final"], "elsewhere": [], "vid": []}, {"n": 115, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "عقوبة الغش في بولونيا.", "error": "", "solution": "من ثبت غشه أو محاولته في أي امتحان (يومي أو أسبوعي أو شهري أو نصف الفصل أو نهائي) يُعد راسباً في جميع مواد الفصل الحالي فقط، ويعيدها دواماً وامتحاناً، ويحق له التسجيل على مواد الفصل القادم. وإذا تكرر يُفصل ويُرقَّن قيده.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_final"], "elsewhere": [], "vid": []}, {"n": 116, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "التأجيل في بولونيا.", "error": "", "solution": "للطالب تأجيل فصل أو فصلين لأسباب مشروعة يقتنع بها مجلس الكلية، بطلب يُقدَّم قبل 30 يوماً على الأقل من بداية الامتحانات النهائية. ولرئيس الجامعة، بتوصية مجلس الكلية، تأجيل فصل ثالث أو رابع بالشرط نفسه. ولا تُحسب فصول التأجيل من الحد الأعلى للدراسة.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_defer"], "elsewhere": [], "vid": []}, {"n": 117, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "أحكام عامة: الأجور، والسيرة الدراسية، والانتقال.", "error": "", "solution": "أجور الدراسة في الحكومي الخاص الصباحي والمسائي والأهلي تُحدد بعدد الوحدات التي يسجل عليها الطالب في الفصل. لكل طالب سيرة دراسية بالوحدات المنجزة تحدّثها اللجان الامتحانية كل فصل ورقياً وإلكترونياً، وملحق شهادة بنموذج الوزارة. وفي الانتقال والاستضافة بين الجامعات تُجرى المقاصة العلمية على أساس مخرجات التعلم، لا أسماء المواد.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_general"], "elsewhere": [], "vid": []}, {"n": 118, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "الطالب الراسب من نظام سابق والدفعة التي بعده على بولونيا.", "error": "", "solution": "طلبة المرحلة الأولى: يُطالبون بكل المواد مع أقرانهم في نظام الوحدات. طلبة المرحلتين الثانية والثالثة: تختار الجامعة فتح صف لإكمال متطلبات النظام السابق إذا توفرت المستلزمات، أو إجراء مقاصة علمية لما اجتازه الطالب ليُمنح الشهادة وفق نظام الوحدات، على أساس مخرجات التعلم لا أسماء المواد. طلبة المرحلة الرابعة فما فوق: تفتح الكلية صفاً لإكمال متطلبات التخرج وفق النظام السابق.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_transition"], "elsewhere": [], "vid": []}, {"n": 119, "date": "06/11/2026 3:50 م", "group": "أدلة بولونيا", "cat": "تعليمات وكتب رسمية", "problem": "على من تُطبَّق ضوابط دليل V13؟", "error": "", "solution": "ينص الدليل على أنها تُنفَّذ للدراسة الأولية في التخصصات الهندسية والعلوم في الجامعات الحكومية والجامعات والكليات الأهلية، وأن ما لم يرد فيه نص يُرجع فيه إلى دليل إجراءات شؤون الطلبة وضوابط القبول النافذة سنوياً. ويُطبَّق في الجامعات التقنية مع خصوصية توزيع درجة الجانب العملي.", "source": "دليل اعتماد مسار بولونيا V13", "status": "محلولة", "notes": "", "kind": "info", "added": "06/11/2026", "updated": "", "tabs": ["bo_general"], "elsewhere": [], "vid": []}];
const GUIDES = [{"id": "coursedata", "short": "استكمال معلومات المواد (حسب النظام التعليمي)", "title": "استكمال معلومات المواد الدراسية حتى تصبح (مكتملة)", "subtitle": "تبويبات نافذة المادة بالترتيب، وما يخص كل نظام تعليمي: بولونيا، والفصلي، والسنوي", "source": "أُعدّ من فيديو: معالجة النقوصات واستكمال إدخال المواد الدراسية في نظام SIS (6 دقائق تقريباً)، مع ما ورد في شرحي تهيئة العام الدراسي وإضافة المواد", "sections": [{"title": "نظرة عامة وأي التبويبات تخص أي نظام", "time": "", "html": "<p>كل مادة تظهر في النظام بمؤشرات للنواقص. تُكمل معلوماتها تبويباً تبويباً حتى تتحول المؤشرات إلى اللون الأخضر وتصبح حالة المادة <strong>مكتملة<\/strong>. اكتمال كل المواد شرط قبل ترحيل الطلبة.<\/p><div class=\"tw\"><table><tr><th>تبويب نافذة المادة<\/th><th>نظام بولونيا<\/th><th>النظام الفصلي والسنوي<\/th><\/tr><tr><td>معلومات المادة<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>ارتباطات المادة (المتطلب السابق)<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>توزيع المادة الدراسية<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>المنهاج الدراسي (المفردات الأسبوعية)<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>مصادر التعليم<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>وصف المادة الدراسي<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>امتحان نصف الفصل والتقييم التكويني<\/td><td>✔ مطلوب: التقييم التكويني 40%<\/td><td>السعي الفصلي أو السنوي بدلاً من التقييم التكويني<\/td><\/tr><tr><td>الحصص المجدولة وغير المجدولة<\/td><td>✔ مطلوب: ساعات ECTS<\/td><td>خاص بمواد بولونيا<\/td><\/tr><\/table><\/div><blockquote><p><strong>انتبه لنظام التعليم:<\/strong> نظام التعليم (بولونيا أو فصلي أو سنوي أو مقررات) يُحدَّد عند إضافة المادة، ولا يُغيَّر من هذه النافذة. تأكد أنه يطابق نظام البرنامج قبل إكمال التبويبات.<\/p><\/blockquote><blockquote><p><strong>مصدر الجدول:<\/strong> الفيديو يشرح مادة يظهر فيها التقييم التكويني 40% وساعات ECTS، أي مادة بنظام بولونيا. أما عمود الفصلي والسنوي فمأخوذ من شرح تهيئة العام الدراسي، فراجع التبويبات التي تظهر لك فعلاً في مادتك.<\/p><\/blockquote>", "text": "كل مادة تظهر في النظام بمؤشرات للنواقص. تُكمل معلوماتها تبويباً تبويباً حتى تتحول المؤشرات إلى اللون الأخضر وتصبح حالة المادة مكتملة . اكتمال كل المواد شرط قبل ترحيل الطلبة. تبويب نافذة المادة نظام بولونيا النظام الفصلي والسنوي معلومات المادة ✔ مطلوب ✔ مطلوب ارتباطات المادة (المتطلب السابق) ✔ مطلوب ✔ مطلوب توزيع المادة الدراسية ✔ مطلوب ✔ مطلوب المنهاج الدراسي (المفردات الأسبوعية) ✔ مطلوب ✔ مطلوب مصادر التعليم ✔ مطلوب ✔ مطلوب وصف المادة الدراسي ✔ مطلوب ✔ مطلوب امتحان نصف الفصل والتقييم التكويني ✔ مطلوب: التقييم التكويني 40% السعي الفصلي أو السنوي بدلاً من التقييم التكويني الحصص المجدولة وغير المجدولة ✔ مطلوب: ساعات ECTS خاص بمواد بولونيا انتبه لنظام التعليم: نظام التعليم (بولونيا أو فصلي أو سنوي أو مقررات) يُحدَّد عند إضافة المادة، ولا يُغيَّر من هذه النافذة. تأكد أنه يطابق نظام البرنامج قبل إكمال التبويبات. مصدر الجدول: الفيديو يشرح مادة يظهر فيها التقييم التكويني 40% وساعات ECTS، أي مادة بنظام بولونيا. أما عمود الفصلي والسنوي فمأخوذ من شرح تهيئة العام الدراسي، فراجع التبويبات التي تظهر لك فعلاً في مادتك."}, {"title": "قبل البدء: ملفان يجب تحضيرهما", "time": "00:18", "html": "<blockquote><p><strong>1.<\/strong> ملف <strong>الوصف الأكاديمي الشامل<\/strong> للبرنامج.<\/p><p><strong>2.<\/strong> ملف <strong>ملخص المنهاج الدراسي (Curriculum)<\/strong> للفصول (السمسترات).<\/p><\/blockquote><p>منهما تُستخرج كل المعلومات المطلوبة في التبويبات، وعلى أساسهما يظهر ملخص النواقص في كل مادة.<\/p>", "text": "1. ملف الوصف الأكاديمي الشامل للبرنامج. 2. ملف ملخص المنهاج الدراسي (Curriculum) للفصول (السمسترات). منهما تُستخرج كل المعلومات المطلوبة في التبويبات، وعلى أساسهما يظهر ملخص النواقص في كل مادة."}, {"title": "الخطوة 1: فتح المواد الدراسية وتصفيتها", "time": "00:35", "html": "<blockquote><p><strong>1.<\/strong> افتح تبويب <strong>المواد الدراسية<\/strong>.<\/p><p><strong>2.<\/strong> اختر من الفلتر السنة الدراسية الحالية (في الفيديو 2025/2026)، حتى تعمل على مواد هذه السنة فقط ولا تعدّل مواد السنوات السابقة.<\/p><p><strong>3.<\/strong> يظهر عدد المواد الفعلي. للوصول السريع ابحث بـ<strong>رمز المادة<\/strong> (مثل 306).<\/p><\/blockquote>", "text": "1. افتح تبويب المواد الدراسية . 2. اختر من الفلتر السنة الدراسية الحالية (في الفيديو 2025/2026)، حتى تعمل على مواد هذه السنة فقط ولا تعدّل مواد السنوات السابقة. 3. يظهر عدد المواد الفعلي. للوصول السريع ابحث بـ رمز المادة (مثل 306)."}, {"title": "الخطوة 2: قراءة ملخص النواقص", "time": "01:15", "html": "<p>عند فتح المادة يظهر ملخص بالنواقص والمعلومات المطلوب استكمالها. ابدأ منه، وأكمل كل تبويب ناقص اعتماداً على ملفي المنهاج والوصف الأكاديمي.<\/p>", "text": "عند فتح المادة يظهر ملخص بالنواقص والمعلومات المطلوب استكمالها. ابدأ منه، وأكمل كل تبويب ناقص اعتماداً على ملفي المنهاج والوصف الأكاديمي."}, {"title": "الخطوة 3: معلومات المادة", "time": "01:38", "html": "<blockquote><p><strong>1.<\/strong> راجع المراجع والمسؤولين عن المادة.<\/p><p><strong>2.<\/strong> حدد التدريسي المدرّس للمادة، للصباحي والمسائي.<\/p><\/blockquote><blockquote><p><strong>إذا لم يظهر اسم التدريسي:<\/strong> راجع قسم الموارد البشرية لإضافته أو إكمال بياناته.<\/p><\/blockquote>", "text": "1. راجع المراجع والمسؤولين عن المادة. 2. حدد التدريسي المدرّس للمادة، للصباحي والمسائي. إذا لم يظهر اسم التدريسي: راجع قسم الموارد البشرية لإضافته أو إكمال بياناته."}, {"title": "الخطوة 4: ارتباطات المادة", "time": "02:00", "html": "<p>تحقق هل للمادة متطلب سابق، وأضفه إن وُجد، ثم احفظ التغييرات.<\/p>", "text": "تحقق هل للمادة متطلب سابق، وأضفه إن وُجد، ثم احفظ التغييرات."}, {"title": "الخطوة 5: توزيع المادة الدراسية", "time": "02:20", "html": "<blockquote><p><strong>1.<\/strong> وزّع المادة على البرنامج الصباحي والبرنامج المسائي.<\/p><p><strong>2.<\/strong> حدد التدريسي والشعبة.<\/p><p><strong>3.<\/strong> حدد المحاضرة الأساسية والأعباء والساعات الإلكترونية.<\/p><\/blockquote>", "text": "1. وزّع المادة على البرنامج الصباحي والبرنامج المسائي. 2. حدد التدريسي والشعبة. 3. حدد المحاضرة الأساسية والأعباء والساعات الإلكترونية."}, {"title": "الخطوة 6: المنهاج الدراسي", "time": "02:50", "html": "<p>أدخل المفردات الأسبوعية للدروس النظرية: العنوان والمواضيع لكل أسبوع تعليمي بالتتابع، كما في ملف المنهاج.<\/p>", "text": "أدخل المفردات الأسبوعية للدروس النظرية: العنوان والمواضيع لكل أسبوع تعليمي بالتتابع، كما في ملف المنهاج."}, {"title": "الخطوة 7: مصادر التعليم", "time": "03:25", "html": "<p>أدخل المراجع الضرورية، والكتب المقترحة (Recommended)، والمواقع الإلكترونية المعتمدة للمادة.<\/p>", "text": "أدخل المراجع الضرورية، والكتب المقترحة (Recommended)، والمواقع الإلكترونية المعتمدة للمادة."}, {"title": "الخطوة 8: وصف المادة الدراسي", "time": "03:55", "html": "<p>أدخل الأهداف الأكاديمية ومخرجات التعلم.<\/p><blockquote><p><strong>انتبه:<\/strong> للحقول حد أعلى لعدد الكلمات. اختصر النص من ملف الوصف الأكاديمي إذا تجاوز الحد.<\/p><\/blockquote>", "text": "أدخل الأهداف الأكاديمية ومخرجات التعلم. انتبه: للحقول حد أعلى لعدد الكلمات. اختصر النص من ملف الوصف الأكاديمي إذا تجاوز الحد."}, {"title": "الخطوة 9: امتحان نصف الفصل والتقييم التكويني", "time": "04:30", "html": "<p>أدخل توزيع الدرجات: الاختبارات الشفهية والتحريرية، والواجبات، والتقارير، بحيث يكتمل التقييم التكويني (40%).<\/p><blockquote><p><strong>نظام بولونيا:<\/strong> التقييم التكويني 40% هو ما يظهر في الفيديو، وهو خاص بمواد بولونيا.<\/p><\/blockquote><blockquote><p><strong>النظامان الفصلي والسنوي:<\/strong> يُدخل السعي الفصلي أو السنوي بدلاً من التقييم التكويني، حسب شرح تهيئة العام الدراسي.<\/p><\/blockquote>", "text": "أدخل توزيع الدرجات: الاختبارات الشفهية والتحريرية، والواجبات، والتقارير، بحيث يكتمل التقييم التكويني (40%). نظام بولونيا: التقييم التكويني 40% هو ما يظهر في الفيديو، وهو خاص بمواد بولونيا. النظامان الفصلي والسنوي: يُدخل السعي الفصلي أو السنوي بدلاً من التقييم التكويني، حسب شرح تهيئة العام الدراسي."}, {"title": "الخطوة 10: الحصص المجدولة وغير المجدولة", "time": "05:00", "html": "<p>حدد الساعات الدراسية، والساعات الأونلاين، والمناقشات، والتتوريال، فيحسب النظام ساعات ECTS.<\/p><blockquote><p><strong>نظام بولونيا:<\/strong> هذا التبويب خاص بمواد بولونيا، لأن ساعات ECTS جزء من هذا النظام.<\/p><\/blockquote>", "text": "حدد الساعات الدراسية، والساعات الأونلاين، والمناقشات، والتتوريال، فيحسب النظام ساعات ECTS. نظام بولونيا: هذا التبويب خاص بمواد بولونيا، لأن ساعات ECTS جزء من هذا النظام."}, {"title": "الخطوة 11: التأكد من حالة المادة", "time": "05:30", "html": "<p>بعد إكمال كل النواقص تتحول المؤشرات إلى اللون الأخضر، وتصبح حالة المادة <strong>مكتملة<\/strong>. كرر الخطوات لكل مادة حتى تكتمل مواد البرنامج كلها.<\/p>", "text": "بعد إكمال كل النواقص تتحول المؤشرات إلى اللون الأخضر، وتصبح حالة المادة مكتملة . كرر الخطوات لكل مادة حتى تكتمل مواد البرنامج كلها."}, {"title": "قائمة تدقيق لكل مادة", "time": "", "html": "<div class=\"tw\"><table><tr><th>#<\/th><th>البند<\/th><th>بولونيا<\/th><th>فصلي / سنوي<\/th><\/tr><tr><td>1<\/td><td>السنة الدراسية الصحيحة في الفلتر<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>2<\/td><td>نظام تعليم المادة يطابق نظام البرنامج<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>3<\/td><td>التدريسي للصباحي والمسائي<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>4<\/td><td>المتطلب السابق (إن وُجد)<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>5<\/td><td>التوزيع على البرنامجين، والشعبة، والأعباء<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>6<\/td><td>المفردات الأسبوعية<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>7<\/td><td>مصادر التعليم<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>8<\/td><td>الأهداف ومخرجات التعلم ضمن حد الكلمات<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>9<\/td><td>التقييم التكويني 40%<\/td><td>☐<\/td><td>-<\/td><\/tr><tr><td>10<\/td><td>السعي الفصلي أو السنوي<\/td><td>-<\/td><td>☐<\/td><\/tr><tr><td>11<\/td><td>الحصص المجدولة وغير المجدولة وساعات ECTS<\/td><td>☐<\/td><td>-<\/td><\/tr><tr><td>12<\/td><td>حالة المادة: مكتملة<\/td><td>☐<\/td><td>☐<\/td><\/tr><\/table><\/div>", "text": "# البند بولونيا فصلي / سنوي 1 السنة الدراسية الصحيحة في الفلتر ☐ ☐ 2 نظام تعليم المادة يطابق نظام البرنامج ☐ ☐ 3 التدريسي للصباحي والمسائي ☐ ☐ 4 المتطلب السابق (إن وُجد) ☐ ☐ 5 التوزيع على البرنامجين، والشعبة، والأعباء ☐ ☐ 6 المفردات الأسبوعية ☐ ☐ 7 مصادر التعليم ☐ ☐ 8 الأهداف ومخرجات التعلم ضمن حد الكلمات ☐ ☐ 9 التقييم التكويني 40% ☐ - 10 السعي الفصلي أو السنوي - ☐ 11 الحصص المجدولة وغير المجدولة وساعات ECTS ☐ - 12 حالة المادة: مكتملة ☐ ☐"}], "tabs": ["bo_sis", "bo_mdf", "bo_ects"], "added": "03/11/2026", "updated": ""}, {"id": "bo_intro", "short": "مدخل إلى بولونيا", "title": "مدخل إلى مسار بولونيا", "subtitle": "ما هو، ولماذا اعتمدته الوزارة، والأرقام التي تحتاجها كل يوم", "source": "أُعدّ من دليل اعتماد مسار بولونيا في الجامعات العراقية (الإصدار V13)، وعرض (تطبيق مسار بولونيا في الجامعات العراقية)، وورشة الدليل الشامل لتطبيق مسار بولونيا 2026-2027", "sections": [{"title": "ما هو مسار بولونيا؟", "time": "", "html": "<p>إطار تعاون أوروبي بدأ بإعلان بولونيا عام 1999، هدفه أن تصير الشهادات الجامعية متقاربة وقابلة للمقارنة والاعتراف بين الجامعات والدول، وأن يسهل انتقال الطلبة بينها.<\/p><p>اعتمدته وزارة التعليم العالي والبحث العلمي إطاراً لإصلاح الجامعات العراقية وربطها بمعايير الجودة والاعتراف الدولي. وهو لا يعني أن تتوحد المناهج كلها؛ المقصود الشفافية والاتساق مع بقاء خصوصية كل برنامج.<\/p><blockquote><p><strong>الفكرة الأساسية:<\/strong> الطالب يُقاس بما يتعلمه ويقدر على أدائه (مخرجات التعلم) وبالجهد الذي يبذله (الوحدات ECTS)، لا بعدد ساعات المحاضرة وحدها.<\/p><\/blockquote>", "text": "إطار تعاون أوروبي بدأ بإعلان بولونيا عام 1999، هدفه أن تصير الشهادات الجامعية متقاربة وقابلة للمقارنة والاعتراف بين الجامعات والدول، وأن يسهل انتقال الطلبة بينها. اعتمدته وزارة التعليم العالي والبحث العلمي إطاراً لإصلاح الجامعات العراقية وربطها بمعايير الجودة والاعتراف الدولي. وهو لا يعني أن تتوحد المناهج كلها؛ المقصود الشفافية والاتساق مع بقاء خصوصية كل برنامج. الفكرة الأساسية: الطالب يُقاس بما يتعلمه ويقدر على أدائه (مخرجات التعلم) وبالجهد الذي يبذله (الوحدات ECTS)، لا بعدد ساعات المحاضرة وحدها."}, {"title": "أهدافه", "time": "", "html": "<blockquote><p><strong>◂<\/strong> تحسين الشفافية: كل التوقيتات والواجبات والاختبارات معروفة مسبقاً في وصف المادة.<\/p><p><strong>◂<\/strong> ترصين سمعة الجامعات العراقية دولياً، باعتماد نظام الوحدات الأوروبي ECTS.<\/p><p><strong>◂<\/strong> تقليص الفجوة بين التعليم وسوق العمل، وتصميم مناهج تزيد فرص عمل الخريجين.<\/p><p><strong>◂<\/strong> تعلّم متمحور حول الطالب، عملي وجماعي.<\/p><p><strong>◂<\/strong> تسهيل انتقال الطلبة بين الجامعات والبلدان التي تعتمد المسار، بنظام درجات قابل للمقارنة.<\/p><\/blockquote>", "text": "◂ تحسين الشفافية: كل التوقيتات والواجبات والاختبارات معروفة مسبقاً في وصف المادة. ◂ ترصين سمعة الجامعات العراقية دولياً، باعتماد نظام الوحدات الأوروبي ECTS. ◂ تقليص الفجوة بين التعليم وسوق العمل، وتصميم مناهج تزيد فرص عمل الخريجين. ◂ تعلّم متمحور حول الطالب، عملي وجماعي. ◂ تسهيل انتقال الطلبة بين الجامعات والبلدان التي تعتمد المسار، بنظام درجات قابل للمقارنة."}, {"title": "أعمدته الأربعة", "time": "", "html": "<div class=\"tw\"><table><tr><th>العمود<\/th><th>معناه باختصار<\/th><\/tr><tr><td>مخرجات التعلم (LO)<\/td><td>ما يُتوقع أن يعرفه الطالب ويقدر على فعله بعد المادة أو البرنامج<\/td><\/tr><tr><td>الوحدات الأوروبية (ECTS)<\/td><td>مقياس جهد الطالب: الوحدة الواحدة = 25 ساعة تعلم<\/td><\/tr><tr><td>العبء الدراسي (SWL)<\/td><td>كل وقت التعلم: داخل القاعة (مجدول) وخارجها (غير مجدول)<\/td><\/tr><tr><td>ضمان الجودة<\/td><td>متابعة تحقق المخرجات ومراجعة البرنامج دورياً<\/td><\/tr><\/table><\/div>", "text": "العمود معناه باختصار مخرجات التعلم (LO) ما يُتوقع أن يعرفه الطالب ويقدر على فعله بعد المادة أو البرنامج الوحدات الأوروبية (ECTS) مقياس جهد الطالب: الوحدة الواحدة = 25 ساعة تعلم العبء الدراسي (SWL) كل وقت التعلم: داخل القاعة (مجدول) وخارجها (غير مجدول) ضمان الجودة متابعة تحقق المخرجات ومراجعة البرنامج دورياً"}, {"title": "الأرقام الأساسية في جدول واحد", "time": "", "html": "<div class=\"tw\"><table><tr><th>البند<\/th><th>القيمة<\/th><\/tr><tr><td>مدة الفصل<\/td><td>15 أسبوعاً فعلياً عدا الامتحانات<\/td><\/tr><tr><td>الوحدة الواحدة<\/td><td>25 ساعة جهد طالب<\/td><\/tr><tr><td>وحدات الفصل / السنة<\/td><td>30 / 60 وحدة كحد أعلى<\/td><\/tr><tr><td>العبء في الفصل / السنة<\/td><td>750 / 1500 ساعة كحد أعلى<\/td><\/tr><tr><td>الساعات المجدولة أسبوعياً<\/td><td>20 إلى 25 ساعة، وحتى 30 مع المواد العملية<\/td><\/tr><tr><td>البكالوريوس (4 سنوات)<\/td><td>240 وحدة، وأقصى مدة 12 فصلاً<\/td><\/tr><tr><td>توزيع الدرجة<\/td><td>تكويني 40 + نصف الفصل 10 + نهائي 50<\/td><\/tr><tr><td>شرط دخول النهائي<\/td><td>14 من 40 في التكويني (35%) مع عدم الرسوب بالغياب<\/td><\/tr><tr><td>درجة النجاح<\/td><td>50<\/td><\/tr><tr><td>المعالجة (القرار)<\/td><td>للدرجات 45 إلى 49، بحد أقصى 5 درجات<\/td><\/tr><tr><td>الغياب<\/td><td>تنبيه 7%، إنذار نهائي ورسوب 14%، وحتى 21% بعذر<\/td><\/tr><tr><td>المحاولات<\/td><td>محاولتان لكل فصل، و4 محاولات للمادة الواحدة<\/td><\/tr><\/table><\/div><blockquote><p><strong>ملاحظة:<\/strong> هذه الأرقام من دليل الوزارة V13 وورشة 2026-2027. التفاصيل والاستثناءات في تبويباتها.<\/p><\/blockquote>", "text": "البند القيمة مدة الفصل 15 أسبوعاً فعلياً عدا الامتحانات الوحدة الواحدة 25 ساعة جهد طالب وحدات الفصل / السنة 30 / 60 وحدة كحد أعلى العبء في الفصل / السنة 750 / 1500 ساعة كحد أعلى الساعات المجدولة أسبوعياً 20 إلى 25 ساعة، وحتى 30 مع المواد العملية البكالوريوس (4 سنوات) 240 وحدة، وأقصى مدة 12 فصلاً توزيع الدرجة تكويني 40 + نصف الفصل 10 + نهائي 50 شرط دخول النهائي 14 من 40 في التكويني (35%) مع عدم الرسوب بالغياب درجة النجاح 50 المعالجة (القرار) للدرجات 45 إلى 49، بحد أقصى 5 درجات الغياب تنبيه 7%، إنذار نهائي ورسوب 14%، وحتى 21% بعذر المحاولات محاولتان لكل فصل، و4 محاولات للمادة الواحدة ملاحظة: هذه الأرقام من دليل الوزارة V13 وورشة 2026-2027. التفاصيل والاستثناءات في تبويباتها."}, {"title": "ماذا تقرأ أولاً حسب عملك؟", "time": "", "html": "<div class=\"tw\"><table><tr><th>أنت<\/th><th>اقرأ<\/th><\/tr><tr><td>عضو لجنة علمية أو مسؤول مناهج<\/td><td>الأدلة الأربعة، ومخرجات التعلم، وبناء المنهج، ونموذج وصف المادة، والوحدات والعبء<\/td><\/tr><tr><td>تدريسي<\/td><td>توزيع درجة المادة، والتقييم التكويني وملف الإكسل، والتقديرات والمعالجة، والغياب<\/td><\/tr><tr><td>لجنة امتحانية<\/td><td>التقييم التكويني وملف الإكسل، والامتحان النهائي والمحاولات، وفي نظام اللجنة الامتحانية<\/td><\/tr><tr><td>مسجل أو مقرر قسم<\/td><td>التسجيل على البرنامج والمواد، والتأجيل وترقين القيد، وفي نظام SIS<\/td><\/tr><\/table><\/div>", "text": "أنت اقرأ عضو لجنة علمية أو مسؤول مناهج الأدلة الأربعة، ومخرجات التعلم، وبناء المنهج، ونموذج وصف المادة، والوحدات والعبء تدريسي توزيع درجة المادة، والتقييم التكويني وملف الإكسل، والتقديرات والمعالجة، والغياب لجنة امتحانية التقييم التكويني وملف الإكسل، والامتحان النهائي والمحاولات، وفي نظام اللجنة الامتحانية مسجل أو مقرر قسم التسجيل على البرنامج والمواد، والتأجيل وترقين القيد، وفي نظام SIS"}], "tabs": ["bo_about"], "added": "06/11/2026", "updated": ""}, {"id": "bo_ects", "short": "حساب الوحدات والعبء", "title": "حساب الوحدات (ECTS) والعبء الدراسي", "subtitle": "كيف تحوّل أنشطة المادة إلى ساعات ثم إلى وحدات", "source": "أُعدّ من دليل اعتماد مسار بولونيا في الجامعات العراقية (الإصدار V13) (الفصل الثاني)، ونموذج وصف مادة نظرية السيطرة، وورشة 2026-2027", "sections": [{"title": "القواعد", "time": "", "html": "<blockquote><p><strong>1.<\/strong> لكل مادة عدد وحدات يحدده القسم العلمي. الوحدة الواحدة = <strong>25 ساعة<\/strong> من جهد الطالب.<\/p><p><strong>2.<\/strong> لا يزيد مجموع الفصل على <strong>30 وحدة<\/strong> (750 ساعة)، ولا السنة على <strong>60 وحدة<\/strong> (1500 ساعة).<\/p><p><strong>3.<\/strong> العبء الدراسي SWL = الساعات المجدولة داخل الصف (<strong>SSWL<\/strong>) + الساعات غير المجدولة خارجه (<strong>USSWL<\/strong>)، ولكل منهما الوزن نفسه في حساب الوحدات.<\/p><p><strong>4.<\/strong> الساعات المجدولة أسبوعياً بين <strong>20 و25<\/strong> ساعة، ولا تتجاوز <strong>30<\/strong> إذا كان في الجدول مواد نظرية وعملية.<\/p><p><strong>5.<\/strong> أستاذ المادة يحدد الواجبات والأنشطة خارج الصف، ويقرّها القسم، وتصادق عليها اللجنة العلمية.<\/p><\/blockquote>", "text": "1. لكل مادة عدد وحدات يحدده القسم العلمي. الوحدة الواحدة = 25 ساعة من جهد الطالب. 2. لا يزيد مجموع الفصل على 30 وحدة (750 ساعة)، ولا السنة على 60 وحدة (1500 ساعة). 3. العبء الدراسي SWL = الساعات المجدولة داخل الصف ( SSWL ) + الساعات غير المجدولة خارجه ( USSWL )، ولكل منهما الوزن نفسه في حساب الوحدات. 4. الساعات المجدولة أسبوعياً بين 20 و25 ساعة، ولا تتجاوز 30 إذا كان في الجدول مواد نظرية وعملية. 5. أستاذ المادة يحدد الواجبات والأنشطة خارج الصف، ويقرّها القسم، وتصادق عليها اللجنة العلمية."}, {"title": "أنواع الساعات المجدولة", "time": "", "html": "<p>تُقسَّم ساعات المادة المجدولة بحسب التخصص إلى: ساعات صف (class)، ومحاضرات أونلاين (lecture)، وسيمنارات (seminar)، وساعات عملية (practical)، ومختبر (lab)، ومراجعة (tutorial)، وسريرية (clinical).<\/p>", "text": "تُقسَّم ساعات المادة المجدولة بحسب التخصص إلى: ساعات صف (class)، ومحاضرات أونلاين (lecture)، وسيمنارات (seminar)، وساعات عملية (practical)، ومختبر (lab)، ومراجعة (tutorial)، وسريرية (clinical)."}, {"title": "المعادلة", "time": "", "html": "<p><strong>عدد الوحدات = العبء الكلي للمادة في الفصل ÷ 25<\/strong><\/p><p>والعبء الكلي = (الساعات المجدولة أسبوعياً × 15) + الساعات غير المجدولة في الفصل.<\/p><blockquote><p><strong>مثال سريع:<\/strong> مادة عبؤها 150 ساعة في الفصل = 150 ÷ 25 = 6 وحدات.<\/p><\/blockquote>", "text": "عدد الوحدات = العبء الكلي للمادة في الفصل ÷ 25 والعبء الكلي = (الساعات المجدولة أسبوعياً × 15) + الساعات غير المجدولة في الفصل. مثال سريع: مادة عبؤها 150 ساعة في الفصل = 150 ÷ 25 = 6 وحدات."}, {"title": "مثال 1: مادة بـ 8 وحدات (200 ساعة)", "time": "", "html": "<div class=\"tw\"><table><tr><th>النشاط<\/th><th>مجدولة/أسبوع<\/th><th>غير مجدولة/أسبوع<\/th><th>الأسابيع<\/th><th>المجموع<\/th><\/tr><tr><td>محاضرات<\/td><td>2<\/td><td><\/td><td>15<\/td><td>30<\/td><\/tr><tr><td>مختبر<\/td><td>2<\/td><td><\/td><td>15<\/td><td>30<\/td><\/tr><tr><td>مناقشات<\/td><td>1<\/td><td><\/td><td>15<\/td><td>15<\/td><\/tr><tr><td>التهيئة للمشروع<\/td><td><\/td><td>1<\/td><td>9<\/td><td>9<\/td><\/tr><tr><td>تحضير الدروس اليومي<\/td><td><\/td><td>5<\/td><td>15<\/td><td>75<\/td><\/tr><tr><td>التهيئة للعرض التقديمي<\/td><td><\/td><td>4<\/td><td>2<\/td><td>8<\/td><\/tr><tr><td>التهيئة للامتحانات اليومية<\/td><td><\/td><td>4<\/td><td>3<\/td><td>12<\/td><\/tr><tr><td>التهيئة لامتحان نصف الفصل<\/td><td><\/td><td>6<\/td><td>1<\/td><td>6<\/td><\/tr><tr><td>امتحان نهاية الفصل<\/td><td>3<\/td><td><\/td><td>1<\/td><td>3<\/td><\/tr><tr><td>التهيئة للامتحان النهائي<\/td><td><\/td><td>12<\/td><td>1<\/td><td>12<\/td><\/tr><tr><td><strong>المجموع<\/strong><\/td><td><\/td><td><\/td><td><\/td><td><strong>200 ساعة = 8 وحدات<\/strong><\/td><\/tr><\/table><\/div><p>المشروع والعرض التقديمي وامتحان نصف الفصل ليست لها ساعات مجدولة مستقلة هنا، لأنها تُنفَّذ ضمن الصفوف.<\/p>", "text": "النشاط مجدولة/أسبوع غير مجدولة/أسبوع الأسابيع المجموع محاضرات 2 15 30 مختبر 2 15 30 مناقشات 1 15 15 التهيئة للمشروع 1 9 9 تحضير الدروس اليومي 5 15 75 التهيئة للعرض التقديمي 4 2 8 التهيئة للامتحانات اليومية 4 3 12 التهيئة لامتحان نصف الفصل 6 1 6 امتحان نهاية الفصل 3 1 3 التهيئة للامتحان النهائي 12 1 12 المجموع 200 ساعة = 8 وحدات المشروع والعرض التقديمي وامتحان نصف الفصل ليست لها ساعات مجدولة مستقلة هنا، لأنها تُنفَّذ ضمن الصفوف."}, {"title": "مثال 2: نظرية السيطرة (6 وحدات)", "time": "", "html": "<div class=\"tw\"><table><tr><th>البند<\/th><th>القيمة<\/th><\/tr><tr><td>الحمل المنتظم (المجدول) في الفصل<\/td><td>109 ساعات (7 أسبوعياً)<\/td><\/tr><tr><td>الحمل غير المنتظم في الفصل<\/td><td>41 ساعة (2 أسبوعياً تقريباً)<\/td><\/tr><tr><td>الحمل الكلي<\/td><td>150 ساعة<\/td><\/tr><tr><td>الوحدات<\/td><td>150 ÷ 25 = 6 ECTS<\/td><\/tr><\/table><\/div><p>هذه الأرقام من نموذج وصف مادة حقيقي، وتُدخل بالشكل نفسه في خطوة (الحصص المجدولة وغير المجدولة) عند إدخال بيانات المادة في SIS.<\/p>", "text": "البند القيمة الحمل المنتظم (المجدول) في الفصل 109 ساعات (7 أسبوعياً) الحمل غير المنتظم في الفصل 41 ساعة (2 أسبوعياً تقريباً) الحمل الكلي 150 ساعة الوحدات 150 ÷ 25 = 6 ECTS هذه الأرقام من نموذج وصف مادة حقيقي، وتُدخل بالشكل نفسه في خطوة (الحصص المجدولة وغير المجدولة) عند إدخال بيانات المادة في SIS."}, {"title": "المواد الوزارية وعدد المواد", "time": "", "html": "<blockquote><p><strong>◂<\/strong> يُفضَّل ألا يزيد عدد مواد الفصل على 5 أو 6 مواد؛ الجودة بتحقيق المخرجات لا بعدد المواد.<\/p><p><strong>◂<\/strong> المواد الوزارية (العربي والإنكليزي والحاسوب وحقوق الإنسان) لا تدخل في حد عدد المواد، لكن وحداتها تُحسب ضمن الـ 30 وحدة للفصل (ورشة 2026-2027).<\/p><\/blockquote><blockquote><p><strong>تنبيه:<\/strong> دليل ECTS الأوروبي يذكر 25 إلى 30 ساعة للوحدة، لكن المعتمد في العراق 25 ساعة. لا تنقل أرقاماً أوروبية دون مواءمتها مع تعليمات الوزارة.<\/p><\/blockquote>", "text": "◂ يُفضَّل ألا يزيد عدد مواد الفصل على 5 أو 6 مواد؛ الجودة بتحقيق المخرجات لا بعدد المواد. ◂ المواد الوزارية (العربي والإنكليزي والحاسوب وحقوق الإنسان) لا تدخل في حد عدد المواد، لكن وحداتها تُحسب ضمن الـ 30 وحدة للفصل (ورشة 2026-2027). تنبيه: دليل ECTS الأوروبي يذكر 25 إلى 30 ساعة للوحدة، لكن المعتمد في العراق 25 ساعة. لا تنقل أرقاماً أوروبية دون مواءمتها مع تعليمات الوزارة."}], "tabs": ["bo_ects", "bo_mdf"], "added": "06/11/2026", "updated": ""}, {"id": "bo_lo", "short": "كتابة مخرجات التعلم", "title": "كتابة مخرجات التعلم", "subtitle": "من مخرجات البرنامج (PLO) إلى مخرجات المقرر (CLO) ومصفوفة المواءمة", "source": "أُعدّ من الدليل الوطني لكتابة مخرجات التعلم في الجامعات العراقية (دائرة الدراسات والتخطيط والمتابعة)، وعرض (كتابة مخرجات التعلم لبرنامج دراسي)", "sections": [{"title": "ما هي مخرجات التعلم؟", "time": "", "html": "<p>عبارات تصف ما يُتوقع أن يعرفه الطالب أو يفهمه أو يقدر على أدائه بعد إكمال برنامج أو مقرر. هي الأساس الذي تُبنى عليه المناهج وطرق التدريس والتقييم، ومعيار تقييم البرامج واعتمادها.<\/p><div class=\"tw\"><table><tr><th>المستوى<\/th><th>الرمز<\/th><th>مثال<\/th><\/tr><tr><td>البرنامج<\/td><td>PLO<\/td><td>يحلل المشكلات الكيميائية باستخدام الأساليب العلمية<\/td><\/tr><tr><td>المقرر<\/td><td>CLO<\/td><td>يحسب الكميات الكيميائية باستخدام الحسابات الستوكيومترية<\/td><\/tr><\/table><\/div>", "text": "عبارات تصف ما يُتوقع أن يعرفه الطالب أو يفهمه أو يقدر على أدائه بعد إكمال برنامج أو مقرر. هي الأساس الذي تُبنى عليه المناهج وطرق التدريس والتقييم، ومعيار تقييم البرامج واعتمادها. المستوى الرمز مثال البرنامج PLO يحلل المشكلات الكيميائية باستخدام الأساليب العلمية المقرر CLO يحسب الكميات الكيميائية باستخدام الحسابات الستوكيومترية"}, {"title": "المجالات والعدد المقترح", "time": "", "html": "<div class=\"tw\"><table><tr><th>المجال<\/th><th>الوصف<\/th><th>العدد المقترح<\/th><\/tr><tr><td>المعرفة والفهم<\/td><td>المفاهيم والنظريات العلمية في التخصص<\/td><td>3<\/td><\/tr><tr><td>المهارات الذهنية<\/td><td>التفكير النقدي والتحليل وحل المشكلات<\/td><td>2<\/td><\/tr><tr><td>المهارات المهنية<\/td><td>تطبيق المعرفة في الممارسة العملية<\/td><td>3<\/td><\/tr><tr><td>المهارات العامة<\/td><td>التواصل والعمل الجماعي واستخدام التكنولوجيا<\/td><td>3<\/td><\/tr><tr><td>القيم المهنية<\/td><td>الالتزام بأخلاقيات المهنة<\/td><td>1<\/td><\/tr><\/table><\/div><blockquote><p><strong>المجموع الموصى به للبكالوريوس:<\/strong> من 10 إلى 12 مخرجاً للبرنامج.<\/p><\/blockquote>", "text": "المجال الوصف العدد المقترح المعرفة والفهم المفاهيم والنظريات العلمية في التخصص 3 المهارات الذهنية التفكير النقدي والتحليل وحل المشكلات 2 المهارات المهنية تطبيق المعرفة في الممارسة العملية 3 المهارات العامة التواصل والعمل الجماعي واستخدام التكنولوجيا 3 القيم المهنية الالتزام بأخلاقيات المهنة 1 المجموع الموصى به للبكالوريوس: من 10 إلى 12 مخرجاً للبرنامج."}, {"title": "أبعاد الإطار الوطني للمؤهلات (المستوى السادس: بكالوريوس)", "time": "", "html": "<div class=\"tw\"><table><tr><th>البعد<\/th><th>يشمل<\/th><th>العدد<\/th><th>مثال<\/th><\/tr><tr><td>المعرفة (K)<\/td><td>مفاهيم ونظريات ومبادئ، معرفة نظرية وعملية متقدمة<\/td><td>3 إلى 4<\/td><td>K1: يفسر المفاهيم والنظريات الأساسية في مجال التخصص<\/td><\/tr><tr><td>المهارات (S)<\/td><td>تطبيق المعرفة وتحليل المشكلات والتقنيات المهنية<\/td><td>3 إلى 4<\/td><td>S1: يحلل المشكلات العلمية أو المهنية باستخدام الأساليب المناسبة<\/td><\/tr><tr><td>الكفاءات (C)<\/td><td>الاستقلالية والعمل الجماعي والقيم المهنية<\/td><td>3 إلى 4<\/td><td>C1: يعمل بفاعلية ضمن فريق متعدد التخصصات<\/td><\/tr><\/table><\/div><p>الكفاءات هي المستوى الأعلى، لأنها توظف المعرفة والمهارات معاً في بيئة العمل.<\/p>", "text": "البعد يشمل العدد مثال المعرفة (K) مفاهيم ونظريات ومبادئ، معرفة نظرية وعملية متقدمة 3 إلى 4 K1: يفسر المفاهيم والنظريات الأساسية في مجال التخصص المهارات (S) تطبيق المعرفة وتحليل المشكلات والتقنيات المهنية 3 إلى 4 S1: يحلل المشكلات العلمية أو المهنية باستخدام الأساليب المناسبة الكفاءات (C) الاستقلالية والعمل الجماعي والقيم المهنية 3 إلى 4 C1: يعمل بفاعلية ضمن فريق متعدد التخصصات الكفاءات هي المستوى الأعلى، لأنها توظف المعرفة والمهارات معاً في بيئة العمل."}, {"title": "خصائص المخرج الجيد", "time": "", "html": "<div class=\"tw\"><table><tr><th>الخاصية<\/th><th>المعنى<\/th><th>مثال<\/th><\/tr><tr><td>الوضوح<\/td><td>صياغة مباشرة<\/td><td>يشرح مبادئ الإدارة الحديثة<\/td><\/tr><tr><td>قابل للقياس<\/td><td>تقيسه أداة تقييم<\/td><td>يحلل البيانات الإحصائية<\/td><\/tr><tr><td>قابل للتقييم<\/td><td>يُقيَّم بأكثر من وسيلة<\/td><td>يصمم نموذجاً هندسياً<\/td><\/tr><tr><td>مرتبط بالمهنة<\/td><td>له صلة بسوق العمل<\/td><td>يستخدم البرمجيات المتخصصة<\/td><\/tr><\/table><\/div><blockquote><p><strong>اختبار سريع:<\/strong> اسأل نفسك أمام أي صياغة: كيف سأقيس هذا؟ إذا لم تجد جواباً فالصياغة تحتاج مراجعة.<\/p><\/blockquote>", "text": "الخاصية المعنى مثال الوضوح صياغة مباشرة يشرح مبادئ الإدارة الحديثة قابل للقياس تقيسه أداة تقييم يحلل البيانات الإحصائية قابل للتقييم يُقيَّم بأكثر من وسيلة يصمم نموذجاً هندسياً مرتبط بالمهنة له صلة بسوق العمل يستخدم البرمجيات المتخصصة اختبار سريع: اسأل نفسك أمام أي صياغة: كيف سأقيس هذا؟ إذا لم تجد جواباً فالصياغة تحتاج مراجعة."}, {"title": "خطوات الكتابة", "time": "", "html": "<blockquote><p><strong>1.<\/strong> حدد مستوى المؤهل: دبلوم، بكالوريوس، ماجستير، دكتوراه.<\/p><p><strong>2.<\/strong> حدد المجال: معرفة، مهارات ذهنية، مهارات مهنية، مهارات عامة.<\/p><p><strong>3.<\/strong> اختر فعلاً قابلاً للقياس يناسب مستوى التفكير المطلوب.<\/p><p><strong>4.<\/strong> صغ العبارة: <strong>فعل + محتوى التعلم + سياق التطبيق<\/strong>.<\/p><\/blockquote><blockquote><p><strong>مثال:<\/strong> يحلل الطالب [البيانات الاقتصادية] باستخدام [الأساليب الإحصائية]. وبدل (يفهم الطالب مبادئ انتقال الحرارة) نكتب: يحسب الطالب معدل انتقال الحرارة بالتوصيل خلال جدار مستوٍ باستخدام قانون فورييه.<\/p><\/blockquote>", "text": "1. حدد مستوى المؤهل: دبلوم، بكالوريوس، ماجستير، دكتوراه. 2. حدد المجال: معرفة، مهارات ذهنية، مهارات مهنية، مهارات عامة. 3. اختر فعلاً قابلاً للقياس يناسب مستوى التفكير المطلوب. 4. صغ العبارة: فعل + محتوى التعلم + سياق التطبيق . مثال: يحلل الطالب [البيانات الاقتصادية] باستخدام [الأساليب الإحصائية]. وبدل (يفهم الطالب مبادئ انتقال الحرارة) نكتب: يحسب الطالب معدل انتقال الحرارة بالتوصيل خلال جدار مستوٍ باستخدام قانون فورييه."}, {"title": "الأفعال حسب تصنيف بلوم", "time": "", "html": "<div class=\"tw\"><table><tr><th>مستوى التفكير<\/th><th>أفعال<\/th><\/tr><tr><td>المعرفة<\/td><td>يذكر، يعرّف، يصف، يعدد<\/td><\/tr><tr><td>الفهم<\/td><td>يشرح، يفسر، يلخص، يوضح<\/td><\/tr><tr><td>التطبيق<\/td><td>يطبق، يستخدم، يحسب، ينفذ<\/td><\/tr><tr><td>التحليل<\/td><td>يحلل، يقارن، يميز<\/td><\/tr><tr><td>التقييم<\/td><td>يقيّم، ينتقد، يبرر<\/td><\/tr><tr><td>الإبداع<\/td><td>يصمم، يطور، يبتكر<\/td><\/tr><\/table><\/div><p>أفعال المعرفة والفهم تناسب السنوات الأولى، والتحليل والتقييم والإبداع تناسب السنوات المتقدمة.<\/p><blockquote><p><strong>تجنب:<\/strong> يفهم، يعرف، يتقن، يدرك، يلمّ: أفعال لا تُقاس.<\/p><\/blockquote>", "text": "مستوى التفكير أفعال المعرفة يذكر، يعرّف، يصف، يعدد الفهم يشرح، يفسر، يلخص، يوضح التطبيق يطبق، يستخدم، يحسب، ينفذ التحليل يحلل، يقارن، يميز التقييم يقيّم، ينتقد، يبرر الإبداع يصمم، يطور، يبتكر أفعال المعرفة والفهم تناسب السنوات الأولى، والتحليل والتقييم والإبداع تناسب السنوات المتقدمة. تجنب: يفهم، يعرف، يتقن، يدرك، يلمّ: أفعال لا تُقاس."}, {"title": "أخطاء شائعة وتصحيحها", "time": "", "html": "<div class=\"tw\"><table><tr><th>الخطأ<\/th><th>الصياغة الخاطئة<\/th><th>التصحيح<\/th><\/tr><tr><td>غير قابل للقياس<\/td><td>يفهم الاقتصاد<\/td><td>يشرح مبادئ الاقتصاد<\/td><\/tr><tr><td>غامض<\/td><td>يعرف الإدارة<\/td><td>يفسر نظريات الإدارة<\/td><\/tr><tr><td>واسع جداً<\/td><td>يتقن العلوم<\/td><td>يطبق مبادئ الفيزياء<\/td><\/tr><\/table><\/div><blockquote><p><strong>◂<\/strong> وجود مخرج في التوصيف لا يظهر في التدريس أو التقييم الفعلي.<\/p><p><strong>◂<\/strong> نسخ مخرجات عامة دون ربطها بتخصص البرنامج.<\/p><p><strong>◂<\/strong> تكرار المخرجات نفسها في أسابيع المادة الواحدة أو بين مواد البرنامج.<\/p><\/blockquote>", "text": "الخطأ الصياغة الخاطئة التصحيح غير قابل للقياس يفهم الاقتصاد يشرح مبادئ الاقتصاد غامض يعرف الإدارة يفسر نظريات الإدارة واسع جداً يتقن العلوم يطبق مبادئ الفيزياء ◂ وجود مخرج في التوصيف لا يظهر في التدريس أو التقييم الفعلي. ◂ نسخ مخرجات عامة دون ربطها بتخصص البرنامج. ◂ تكرار المخرجات نفسها في أسابيع المادة الواحدة أو بين مواد البرنامج."}, {"title": "من البرنامج إلى المقرر: مصفوفة المواءمة", "time": "", "html": "<p>كل مقرر يسهم في جزء من مخرجات البرنامج. تُوضَّح مساهمته في مصفوفة برموز ثلاثة:<\/p><div class=\"tw\"><table><tr><th>الرمز<\/th><th>المعنى<\/th><th>أين يظهر غالباً<\/th><\/tr><tr><td>I<\/td><td>تقديم المفهوم (Introduce)<\/td><td>مقررات السنة الأولى<\/td><\/tr><tr><td>D<\/td><td>تطوير المهارة (Develop)<\/td><td>السنتان الثانية والثالثة<\/td><\/tr><tr><td>M<\/td><td>إتقان المهارة (Master)<\/td><td>مشروع التخرج والتدريب الصناعي<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>المقرر<\/th><th>PLO1<\/th><th>PLO2<\/th><th>PLO3<\/th><th>PLO4<\/th><th>PLO5<\/th><\/tr><tr><td>الكيمياء العامة 1<\/td><td>I<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>مختبر الكيمياء العامة<\/td><td><\/td><td><\/td><td>I<\/td><td>I<\/td><td><\/td><\/tr><tr><td>الكيمياء التحليلية 2<\/td><td>D<\/td><td>D<\/td><td><\/td><td><\/td><td>I<\/td><\/tr><tr><td>مشروع التخرج<\/td><td>M<\/td><td>M<\/td><td>M<\/td><td>M<\/td><td>M<\/td><\/tr><\/table><\/div><blockquote><p><strong>القاعدة:<\/strong> لا يكفي أن يُكتب المخرج في التوصيف؛ يجب أن يقابله نشاط تعليمي وأداة تقييم ودليل على تحققه.<\/p><\/blockquote>", "text": "كل مقرر يسهم في جزء من مخرجات البرنامج. تُوضَّح مساهمته في مصفوفة برموز ثلاثة: الرمز المعنى أين يظهر غالباً I تقديم المفهوم (Introduce) مقررات السنة الأولى D تطوير المهارة (Develop) السنتان الثانية والثالثة M إتقان المهارة (Master) مشروع التخرج والتدريب الصناعي المقرر PLO1 PLO2 PLO3 PLO4 PLO5 الكيمياء العامة 1 I مختبر الكيمياء العامة I I الكيمياء التحليلية 2 D D I مشروع التخرج M M M M M القاعدة: لا يكفي أن يُكتب المخرج في التوصيف؛ يجب أن يقابله نشاط تعليمي وأداة تقييم ودليل على تحققه."}], "tabs": ["bo_lo", "bo_design"], "added": "06/11/2026", "updated": ""}, {"id": "bo_design", "short": "تصميم البرنامج والأدلة الأربعة", "title": "تصميم البرنامج الدراسي والأدلة الأربعة", "subtitle": "التصميم العكسي، وبناء الخطة، والأدلة المطلوبة ومسار إقرارها", "source": "أُعدّ من دليل اعتماد مسار بولونيا في الجامعات العراقية (الإصدار V13) (الفصلان الثاني والخامس والملاحق)، وعرض (تصميم المناهج الدراسية المتوافقة مع معايير مسار بولونيا)، وورشة 2026-2027", "sections": [{"title": "التصميم العكسي: ابدأ من النهاية", "time": "", "html": "<blockquote><p><strong>1.<\/strong> حدد احتياجات المجتمع وسوق العمل.<\/p><p><strong>2.<\/strong> صغ مخرجات البرنامج (PLOs).<\/p><p><strong>3.<\/strong> اشتق منها مخرجات المقررات (CLOs).<\/p><p><strong>4.<\/strong> اختر المحتوى وأنشطة التعلم التي تحقق المخرجات.<\/p><p><strong>5.<\/strong> صمم أدوات التقييم ومعايير النجاح.<\/p><p><strong>6.<\/strong> قِس النتائج وحسّن باستمرار.<\/p><\/blockquote><blockquote><p><strong>القاعدة:<\/strong> المنهج يبدأ من مخرجات واضحة، لا من قائمة موضوعات.<\/p><\/blockquote>", "text": "1. حدد احتياجات المجتمع وسوق العمل. 2. صغ مخرجات البرنامج (PLOs). 3. اشتق منها مخرجات المقررات (CLOs). 4. اختر المحتوى وأنشطة التعلم التي تحقق المخرجات. 5. صمم أدوات التقييم ومعايير النجاح. 6. قِس النتائج وحسّن باستمرار. القاعدة: المنهج يبدأ من مخرجات واضحة، لا من قائمة موضوعات."}, {"title": "بناء الخطة الدراسية", "time": "", "html": "<blockquote><p><strong>◂<\/strong> وزّع المقررات: متطلبات جامعة، ومتطلبات كلية، وتخصص، واختيارية، ومشاريع وتدريب.<\/p><p><strong>◂<\/strong> تدرّج من الأساسيات إلى التطبيق والتصميم والاستقلالية.<\/p><p><strong>◂<\/strong> وازن العبء بين الفصول، ولا تجمع الاختبارات والمشاريع في فترة واحدة.<\/p><p><strong>◂<\/strong> حدد المواد الممهدة والمكملة لمنع الفجوات والتكرار، وقلّل ربط المواد ببعضها حتى لا يتعثر الطالب ويتأخر تخرجه.<\/p><p><strong>◂<\/strong> 5 أو 6 مواد في الفصل كحد أعلى (عدا المواد الوزارية).<\/p><p><strong>◂<\/strong> وثّق مساهمة كل مقرر في مخرجات البرنامج بمصفوفة المواءمة.<\/p><\/blockquote>", "text": "◂ وزّع المقررات: متطلبات جامعة، ومتطلبات كلية، وتخصص، واختيارية، ومشاريع وتدريب. ◂ تدرّج من الأساسيات إلى التطبيق والتصميم والاستقلالية. ◂ وازن العبء بين الفصول، ولا تجمع الاختبارات والمشاريع في فترة واحدة. ◂ حدد المواد الممهدة والمكملة لمنع الفجوات والتكرار، وقلّل ربط المواد ببعضها حتى لا يتعثر الطالب ويتأخر تخرجه. ◂ 5 أو 6 مواد في الفصل كحد أعلى (عدا المواد الوزارية). ◂ وثّق مساهمة كل مقرر في مخرجات البرنامج بمصفوفة المواءمة."}, {"title": "الأدلة الأربعة المطلوبة", "time": "", "html": "<div class=\"tw\"><table><tr><th>الدليل<\/th><th>ماذا فيه<\/th><\/tr><tr><td>1. دليل المنهاج الدراسي (Curriculum)<\/td><td>توزيع المواد ووحداتها على مستويات البرنامج وفصوله كلها<\/td><\/tr><tr><td>2. دليل البرنامج الدراسي (Program Catalogue)<\/td><td>الرؤية والرسالة، مواصفات البرنامج وأهدافه، مخرجات تعلم الطالب، الهيئة التدريسية، الاعتمادات والدرجات والمعدل، المواد، الاتصال<\/td><\/tr><tr><td>3. دليل المواد الدراسية (Modules Catalogue)<\/td><td>تعريف موجز بكل مادة: الرمز، الوحدات، الفصل، ووصف مختصر<\/td><\/tr><tr><td>4. نموذج وصف المادة (Module Description Form)<\/td><td>تفاصيل كل مادة: الأهداف والمخرجات والمحتوى والعبء والتقييم والخطة الأسبوعية<\/td><\/tr><\/table><\/div><blockquote><p><strong>توصية الورشة:<\/strong> ركّزوا هذا الشهر على إعداد جدول ملف الإكسل الموحد، لأنه الأساس الذي تُبنى عليه الأدلة الأربعة.<\/p><\/blockquote>", "text": "الدليل ماذا فيه 1. دليل المنهاج الدراسي (Curriculum) توزيع المواد ووحداتها على مستويات البرنامج وفصوله كلها 2. دليل البرنامج الدراسي (Program Catalogue) الرؤية والرسالة، مواصفات البرنامج وأهدافه، مخرجات تعلم الطالب، الهيئة التدريسية، الاعتمادات والدرجات والمعدل، المواد، الاتصال 3. دليل المواد الدراسية (Modules Catalogue) تعريف موجز بكل مادة: الرمز، الوحدات، الفصل، ووصف مختصر 4. نموذج وصف المادة (Module Description Form) تفاصيل كل مادة: الأهداف والمخرجات والمحتوى والعبء والتقييم والخطة
