 الأسبوعية توصية الورشة: ركّزوا هذا الشهر على إعداد جدول ملف الإكسل الموحد، لأنه الأساس الذي تُبنى عليه الأدلة الأربعة."}, {"title": "من يعدّها ومن يقرّها", "time": "", "html": "<blockquote><p><strong>1.<\/strong> تُشكَّل في كل قسم لجنة لا يقل أعضاؤها عن خمسة تدريسيين، اثنان منهم على الأقل من حملة الدكتوراه، مع موظفين إداريين.<\/p><p><strong>2.<\/strong> تتابع اللجنة تسجيل الطلبة ورقياً وإلكترونياً، وتتسلم تقارير التدريسيين وجداول الملاحق.<\/p><p><strong>3.<\/strong> ترفع الجداول إلى اللجنة العلمية في القسم للمراجعة والإقرار.<\/p><p><strong>4.<\/strong> ثم إلى مجلس الكلية للمصادقة، ومنه إلى الوزارة.<\/p><\/blockquote><p>وتصدر الكلية دليلاً سنوياً لبرامجها، والجامعة دليلاً عاماً لكلياتها.<\/p>", "text": "1. تُشكَّل في كل قسم لجنة لا يقل أعضاؤها عن خمسة تدريسيين، اثنان منهم على الأقل من حملة الدكتوراه، مع موظفين إداريين. 2. تتابع اللجنة تسجيل الطلبة ورقياً وإلكترونياً، وتتسلم تقارير التدريسيين وجداول الملاحق. 3. ترفع الجداول إلى اللجنة العلمية في القسم للمراجعة والإقرار. 4. ثم إلى مجلس الكلية للمصادقة، ومنه إلى الوزارة. وتصدر الكلية دليلاً سنوياً لبرامجها، والجامعة دليلاً عاماً لكلياتها."}, {"title": "ضمان الجودة والتحسين", "time": "", "html": "<blockquote><p><strong>◂<\/strong> اجمع بيانات الأداء: نتائج الطلبة ونسب النجاح واستبيانات الطلبة وملاحظات التدريسيين وأصحاب العمل.<\/p><p><strong>◂<\/strong> قارن النتائج بالمستهدف وفسّر الفجوات، ثم وثّق قرار التحسين وأعد القياس في الدورة التالية.<\/p><p><strong>◂<\/strong> دورة التحسين: خطّط ← نفّذ ← قيّم ← حسّن (PDCA).<\/p><p><strong>◂<\/strong> تتابع تشكيلات ضمان الجودة تنفيذ الأدلة الأربعة والمعايير الستة في دليل ESG، وحقيبة الأستاذ، وتحقق المخرجات في السجل التقييمي للطالب.<\/p><\/blockquote>", "text": "◂ اجمع بيانات الأداء: نتائج الطلبة ونسب النجاح واستبيانات الطلبة وملاحظات التدريسيين وأصحاب العمل. ◂ قارن النتائج بالمستهدف وفسّر الفجوات، ثم وثّق قرار التحسين وأعد القياس في الدورة التالية. ◂ دورة التحسين: خطّط ← نفّذ ← قيّم ← حسّن (PDCA). ◂ تتابع تشكيلات ضمان الجودة تنفيذ الأدلة الأربعة والمعايير الستة في دليل ESG، وحقيبة الأستاذ، وتحقق المخرجات في السجل التقييمي للطالب."}, {"title": "أخطاء شائعة", "time": "", "html": "<blockquote><p><strong>◂<\/strong> اعتبار بولونيا تغييراً في عدد الساعات أو أسماء المقررات فقط.<\/p><p><strong>◂<\/strong> حساب الوحدات من ساعات المحاضرة وحدها وإهمال الدراسة الذاتية.<\/p><p><strong>◂<\/strong> قياس كل أنواع المعرفة والمهارات باختبار واحد.<\/p><p><strong>◂<\/strong> تعديلات شكلية دون إشراك الطلبة والتدريسيين وأصحاب العمل.<\/p><\/blockquote>", "text": "◂ اعتبار بولونيا تغييراً في عدد الساعات أو أسماء المقررات فقط. ◂ حساب الوحدات من ساعات المحاضرة وحدها وإهمال الدراسة الذاتية. ◂ قياس كل أنواع المعرفة والمهارات باختبار واحد. ◂ تعديلات شكلية دون إشراك الطلبة والتدريسيين وأصحاب العمل."}], "tabs": ["bo_design", "bo_guides4"], "added": "06/11/2026", "updated": ""}, {"id": "bo_mdf", "short": "نموذج وصف المادة", "title": "نموذج وصف المادة الدراسية (Module Description Form)", "subtitle": "حقول النموذج مع مثال حقيقي: نظرية السيطرة", "source": "أُعدّ من دليل اعتماد مسار بولونيا في الجامعات العراقية (الإصدار V13) (الملحق 4)، ونموذج وصف مادة نظرية السيطرة (STUTTC362)", "sections": [{"title": "معلومات المادة", "time": "", "html": "<div class=\"tw\"><table><tr><th>الحقل<\/th><th>معناه<\/th><th>مثال<\/th><\/tr><tr><td>Module Title<\/td><td>اسم المادة<\/td><td>Control Theory<\/td><\/tr><tr><td>Module Type<\/td><td>نوعها: أساسية (Core) أو غيرها<\/td><td>Core<\/td><\/tr><tr><td>Module Code<\/td><td>رمز المادة<\/td><td>STUTTC362<\/td><\/tr><tr><td>ECTS Credits<\/td><td>الوحدات<\/td><td>6<\/td><\/tr><tr><td>SWL (hr/sem)<\/td><td>العبء الكلي في الفصل<\/td><td>150<\/td><\/tr><tr><td>Module Level / Semester<\/td><td>المستوى وفصل التدريس<\/td><td>المستوى 3، الفصل 6<\/td><\/tr><tr><td>Module Delivery<\/td><td>طرق التقديم<\/td><td>Lecture, Lab, Tutorial...<\/td><\/tr><tr><td>Administering Department / College<\/td><td>القسم والكلية<\/td><td><\/td><\/tr><tr><td>Module Leader / Tutor<\/td><td>مسؤول المادة ومدرّسها<\/td><td><\/td><\/tr><tr><td>Scientific Committee Approval Date / Version<\/td><td>تاريخ إقرار اللجنة العلمية ورقم النسخة<\/td><td>1.0<\/td><\/tr><\/table><\/div>", "text": "الحقل معناه مثال Module Title اسم المادة Control Theory Module Type نوعها: أساسية (Core) أو غيرها Core Module Code رمز المادة STUTTC362 ECTS Credits الوحدات 6 SWL (hr/sem) العبء الكلي في الفصل 150 Module Level / Semester المستوى وفصل التدريس المستوى 3، الفصل 6 Module Delivery طرق التقديم Lecture, Lab, Tutorial... Administering Department / College القسم والكلية Module Leader / Tutor مسؤول المادة ومدرّسها Scientific Committee Approval Date / Version تاريخ إقرار اللجنة العلمية ورقم النسخة 1.0"}, {"title": "العلاقة مع المواد الأخرى", "time": "", "html": "<p><strong>Prerequisite<\/strong>: المادة الممهدة التي يجب استيفاء متطلباتها أولاً. <strong>Co-requisite<\/strong>: مادة تُدرس بالتزامن.<\/p><blockquote><p><strong>مثال:<\/strong> نظرية السيطرة تتطلب الرياضيات (المعادلات التفاضلية وتحويلات لابلاس والجبر الخطي) والدوائر الكهربائية.<\/p><\/blockquote>", "text": "Prerequisite : المادة الممهدة التي يجب استيفاء متطلباتها أولاً. Co-requisite : مادة تُدرس بالتزامن. مثال: نظرية السيطرة تتطلب الرياضيات (المعادلات التفاضلية وتحويلات لابلاس والجبر الخطي) والدوائر الكهربائية."}, {"title": "الأهداف ومخرجات التعلم والمحتوى", "time": "", "html": "<p>تُكتب أهداف المادة، ثم مخرجاتها بأفعال قابلة للقياس (بعد إكمال المادة يستطيع الطالب أن...)، ثم المحتوى الإرشادي، واستراتيجيات التعلم والتعليم.<\/p>", "text": "تُكتب أهداف المادة، ثم مخرجاتها بأفعال قابلة للقياس (بعد إكمال المادة يستطيع الطالب أن...)، ثم المحتوى الإرشادي، واستراتيجيات التعلم والتعليم."}, {"title": "العبء الدراسي (محسوب لـ 15 أسبوعاً)", "time": "", "html": "<div class=\"tw\"><table><tr><th>البند<\/th><th>في الفصل<\/th><th>أسبوعياً<\/th><\/tr><tr><td>الحمل المنتظم (SSWL)<\/td><td>109<\/td><td>7<\/td><\/tr><tr><td>الحمل غير المنتظم (USSWL)<\/td><td>41<\/td><td>2<\/td><\/tr><tr><td>الحمل الكلي<\/td><td>150<\/td><td><\/td><\/tr><\/table><\/div>", "text": "البند في الفصل أسبوعياً الحمل المنتظم (SSWL) 109 7 الحمل غير المنتظم (USSWL) 41 2 الحمل الكلي 150"}, {"title": "تقييم المادة: مثال كامل", "time": "", "html": "<div class=\"tw\"><table><tr><th>النوع<\/th><th>الأداة<\/th><th>العدد<\/th><th>الوزن<\/th><th>الأسبوع<\/th><th>المخرج<\/th><\/tr><tr><td>تكويني<\/td><td>اختبارات قصيرة<\/td><td>1<\/td><td>5<\/td><td>5<\/td><td>LO 3، 6<\/td><\/tr><tr><td>تكويني<\/td><td>واجبات<\/td><td>1<\/td><td>5<\/td><td>6<\/td><td>LO 3، 5<\/td><\/tr><tr><td>تكويني<\/td><td>مشروع<\/td><td>1<\/td><td>5<\/td><td>مستمر<\/td><td>الكل<\/td><\/tr><tr><td>تكويني<\/td><td>تقرير<\/td><td>1<\/td><td>10<\/td><td>13<\/td><td>LO 4<\/td><\/tr><tr><td>تكويني<\/td><td>تقارير المختبر + امتحان عملي<\/td><td>15 تقريراً + 1<\/td><td>10 + 5<\/td><td>1-15 و 8<\/td><td>الكل<\/td><\/tr><tr><td>تلخيصي<\/td><td>امتحان نصف الفصل<\/td><td>ساعة<\/td><td>10<\/td><td>7<\/td><td>LO 1-7<\/td><\/tr><tr><td>تلخيصي<\/td><td>الامتحان النهائي<\/td><td>4 ساعات<\/td><td>50 (35 نظري + 15 عملي)<\/td><td>15<\/td><td>الكل<\/td><\/tr><tr><td><\/td><td><strong>المجموع<\/strong><\/td><td><\/td><td><strong>100<\/strong><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>لاحظ أن التكويني مجموعه 40 بالضبط (5+5+5+10+15)، وأن فقراته أكثر من أربع، وهذا مسموح ما دام المجموع 40.<\/p>", "text": "النوع الأداة العدد الوزن الأسبوع المخرج تكويني اختبارات قصيرة 1 5 5 LO 3، 6 تكويني واجبات 1 5 6 LO 3، 5 تكويني مشروع 1 5 مستمر الكل تكويني تقرير 1 10 13 LO 4 تكويني تقارير المختبر + امتحان عملي 15 تقريراً + 1 10 + 5 1-15 و 8 الكل تلخيصي امتحان نصف الفصل ساعة 10 7 LO 1-7 تلخيصي الامتحان النهائي 4 ساعات 50 (35 نظري + 15 عملي) 15 الكل المجموع 100 لاحظ أن التكويني مجموعه 40 بالضبط (5+5+5+10+15)، وأن فقراته أكثر من أربع، وهذا مسموح ما دام المجموع 40."}, {"title": "الخطة الأسبوعية والمصادر", "time": "", "html": "<p>جدول بالموضوع النظري لكل أسبوع من 15، وجدول مماثل للمختبر، ثم المصادر المطلوبة والمواقع، مع بيان توفرها في المكتبة.<\/p>", "text": "جدول بالموضوع النظري لكل أسبوع من 15، وجدول مماثل للمختبر، ثم المصادر المطلوبة والمواقع، مع بيان توفرها في المكتبة."}, {"title": "مخطط الدرجات", "time": "", "html": "<p>يُنسخ جدول التقديرات المعتمد كما هو في كل نموذج. التفاصيل في تبويب (التقديرات والمعالجة).<\/p>", "text": "يُنسخ جدول التقديرات المعتمد كما هو في كل نموذج. التفاصيل في تبويب (التقديرات والمعالجة)."}], "tabs": ["bo_mdf", "bo_guides4"], "added": "06/11/2026", "updated": ""}, {"id": "bo_formative", "short": "التقييم التكويني وملف الإكسل", "title": "حساب التقييم التكويني وإعداد ملف الإكسل", "subtitle": "الفرق بين الطريقة السابقة والمعتمدة الآن في SIS، مع مثال محلول", "source": "أُعدّ من فيديو: شروط ومعادلة فقرات التقييم التكويني وفق بولونيا ونظام SIS (3:43 دقيقة)، ودليل اعتماد مسار بولونيا في الجامعات العراقية (الإصدار V13)", "sections": [{"title": "ما الذي تغيّر؟", "time": "00:11", "html": "<div class=\"tw\"><table><tr><th><\/th><th>الطريقة السابقة<\/th><th>المعتمدة الآن<\/th><\/tr><tr><td>مجموع الفقرات<\/td><td>يُسمح بأكثر من 100<\/td><td>40 فقط، لا يُسمح بتجاوزه<\/td><\/tr><tr><td>الجبر<\/td><td>النظام يحوّل المجموع تلقائياً إلى 40<\/td><td>لا جبر؛ الدرجة تُدخل من 40 مباشرة<\/td><\/tr><tr><td>عدد الفقرات<\/td><td>غالباً 7 فقرات أو أكثر<\/td><td>4 فقرات أو أكثر، بشرط أن مجموع أوزانها 40<\/td><\/tr><\/table><\/div>", "text": "الطريقة السابقة المعتمدة الآن مجموع الفقرات يُسمح بأكثر من 100 40 فقط، لا يُسمح بتجاوزه الجبر النظام يحوّل المجموع تلقائياً إلى 40 لا جبر؛ الدرجة تُدخل من 40 مباشرة عدد الفقرات غالباً 7 فقرات أو أكثر 4 فقرات أو أكثر، بشرط أن مجموع أوزانها 40"}, {"title": "الفقرات المسموحة", "time": "", "html": "<p>التقييم التكويني لا يعتمد على امتحانات شهرية، بل على أنشطة يحددها أستاذ المادة ويقرّها مجلس الكلية، مثل: الاختبارات القصيرة (كويزات)، والتقارير، والواجبات، والتطبيقات والمشاريع، والزيارات الميدانية، والمناقشات.<\/p><blockquote><p><strong>الجامعات التقنية:<\/strong> للمواد العملية يدخل التقرير الأسبوعي للمختبر وامتحان المختبر ضمن التكويني بنسبة 15%، ويُقسم الامتحان النهائي بين العملي والنظري مناصفة أو حسب ما يقرره القسم.<\/p><\/blockquote>", "text": "التقييم التكويني لا يعتمد على امتحانات شهرية، بل على أنشطة يحددها أستاذ المادة ويقرّها مجلس الكلية، مثل: الاختبارات القصيرة (كويزات)، والتقارير، والواجبات، والتطبيقات والمشاريع، والزيارات الميدانية، والمناقشات. الجامعات التقنية: للمواد العملية يدخل التقرير الأسبوعي للمختبر وامتحان المختبر ضمن التكويني بنسبة 15%، ويُقسم الامتحان النهائي بين العملي والنظري مناصفة أو حسب ما يقرره القسم."}, {"title": "المعادلة", "time": "01:29", "html": "<p>لكل فقرة: <strong>الدرجة المجبورة = (مجموع درجات الطالب في الفقرة ÷ مجموع درجات الفقرة) × وزن الفقرة<\/strong><\/p><p>ثم تُجمع درجات الفقرات كلها، فيكون الناتج التقييم التكويني من 40، ويُقرَّب إلى أقرب عدد صحيح.<\/p>", "text": "لكل فقرة: الدرجة المجبورة = (مجموع درجات الطالب في الفقرة ÷ مجموع درجات الفقرة) × وزن الفقرة ثم تُجمع درجات الفقرات كلها، فيكون الناتج التقييم التكويني من 40، ويُقرَّب إلى أقرب عدد صحيح."}, {"title": "مثال محلول", "time": "01:00", "html": "<div class=\"tw\"><table><tr><th>البند<\/th><th>القيمة<\/th><\/tr><tr><td>فقرة الاختبارات: وزنها<\/td><td>20 درجة<\/td><\/tr><tr><td>عدد الاختبارات<\/td><td>4، كل واحد من 20 (مجموع الفقرة 80)<\/td><\/tr><tr><td>درجات الطالب<\/td><td>11 + 7 + 20 + 16 = 54<\/td><\/tr><tr><td>الدرجة المجبورة للفقرة<\/td><td>(54 ÷ 80) × 20 = 13.5<\/td><\/tr><\/table><\/div><p>وبالطريقة نفسها تُحسب بقية الفقرات. في هذا المثال كان مجموع الطالب 27.5 فقرّبه النظام إلى <strong>28 من 40<\/strong>. وبما أن 28 أكبر من 14 فالطالب مؤهل للامتحان النهائي.<\/p>", "text": "البند القيمة فقرة الاختبارات: وزنها 20 درجة عدد الاختبارات 4، كل واحد من 20 (مجموع الفقرة 80) درجات الطالب 11 + 7 + 20 + 16 = 54 الدرجة المجبورة للفقرة (54 ÷ 80) × 20 = 13.5 وبالطريقة نفسها تُحسب بقية الفقرات. في هذا المثال كان مجموع الطالب 27.5 فقرّبه النظام إلى 28 من 40 . وبما أن 28 أكبر من 14 فالطالب مؤهل للامتحان النهائي."}, {"title": "إعداد ملف الإكسل خطوة بخطوة", "time": "02:17", "html": "<blockquote><p><strong>1.<\/strong> اكتب فقرات التكويني أعمدةً، ولكل فقرة وزنها، مثلاً المشاريع 10، والتقارير 10، والواجبات 10، والاختبارات 10.<\/p><p><strong>2.<\/strong> إذا كانت درجات الفقرة الأصلية من غير وزنها، حوّلها داخل الإكسل بالمعادلة أعلاه حتى تصير من وزن الفقرة.<\/p><p><strong>3.<\/strong> اجمع الفقرات: الناتج يجب أن يكون من 40 مباشرة، دون أي جبر لاحق.<\/p><p><strong>4.<\/strong> قرّب الناتج إلى عدد صحيح.<\/p><p><strong>5.<\/strong> يُجمع التكويني (40) مع امتحان نصف الفصل (10) فيظهر سعي الطالب الكلي (50).<\/p><\/blockquote><blockquote><p><strong>تحذير النظام:<\/strong> عند إدخال 4 فقرات أو أكثر يرفض النظام الإدخال ويُظهر تحذيراً إذا تجاوز مجموع الأوزان 40.<\/p><\/blockquote>", "text": "1. اكتب فقرات التكويني أعمدةً، ولكل فقرة وزنها، مثلاً المشاريع 10، والتقارير 10، والواجبات 10، والاختبارات 10. 2. إذا كانت درجات الفقرة الأصلية من غير وزنها، حوّلها داخل الإكسل بالمعادلة أعلاه حتى تصير من وزن الفقرة. 3. اجمع الفقرات: الناتج يجب أن يكون من 40 مباشرة، دون أي جبر لاحق. 4. قرّب الناتج إلى عدد صحيح. 5. يُجمع التكويني (40) مع امتحان نصف الفصل (10) فيظهر سعي الطالب الكلي (50). تحذير النظام: عند إدخال 4 فقرات أو أكثر يرفض النظام الإدخال ويُظهر تحذيراً إذا تجاوز مجموع الأوزان 40."}, {"title": "بعد الإدخال: الأهلية للنهائي", "time": "", "html": "<blockquote><p><strong>◂<\/strong> من حصل على 14 من 40 فأكثر (35%) ولم يرسب بالغياب يحق له دخول الامتحان النهائي.<\/p><p><strong>◂<\/strong> من حصل على أقل من 14 يُستبعد تلقائياً في نظام اللجنة الامتحانية (غير مؤهل) ويعيد المادة دواماً وامتحاناً.<\/p><p><strong>◂<\/strong> من استوفى 14 من 40 يحتفظ بسعيه في الدور الثاني والسنة القادمة، ويمتحن النهائي فقط.<\/p><\/blockquote>", "text": "◂ من حصل على 14 من 40 فأكثر (35%) ولم يرسب بالغياب يحق له دخول الامتحان النهائي. ◂ من حصل على أقل من 14 يُستبعد تلقائياً في نظام اللجنة الامتحانية (غير مؤهل) ويعيد المادة دواماً وامتحاناً. ◂ من استوفى 14 من 40 يحتفظ بسعيه في الدور الثاني والسنة القادمة، ويمتحن النهائي فقط."}], "tabs": ["bo_formative", "bo_dist", "bo_gbx"], "added": "06/11/2026", "updated": ""}, {"id": "bo_gb", "short": "رفع درجات بولونيا في G.B", "title": "رفع درجات بولونيا في نظام اللجنة الامتحانية (G.B)", "subtitle": "السعي، والنهائي، والتدقيق، والمصادقات، ودرجات القرار، في خمس مراحل", "source": "أُعدّ من دليل خطوات رفع درجات السعي والامتحان النهائي والمعالجات والمصادقات الهرمية (G.B)", "sections": [{"title": "الدورة كاملة", "time": "", "html": "<div class=\"tw\"><table><tr><th>المرحلة<\/th><th>ماذا يحدث<\/th><th>المسؤول<\/th><\/tr><tr><td>1<\/td><td>تهيئة قوائم الدرجات ورفع السعي (تكويني 40 + منتصف 10)<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>2<\/td><td>إنشاء الامتحان النهائي ورفع درجاته (50)<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>3<\/td><td>التدقيق والمصادقات وإعلان النتائج الأولية<\/td><td>اللجنة التدقيقية ثم رئيس اللجنة ثم رئيس القسم ثم العميد<\/td><\/tr><tr><td>4<\/td><td>تطبيق درجات المعالجة (القرار: 5 درجات)<\/td><td>رئيس اللجنة الامتحانية<\/td><\/tr><tr><td>5<\/td><td>إعادة التدقيق والمصادقة النهائية وطباعة النتائج المعدلة<\/td><td>اللجنة التدقيقية والعميد<\/td><\/tr><\/table><\/div>", "text": "المرحلة ماذا يحدث المسؤول 1 تهيئة قوائم الدرجات ورفع السعي (تكويني 40 + منتصف 10) رئيس اللجنة الامتحانية 2 إنشاء الامتحان النهائي ورفع درجاته (50) رئيس اللجنة الامتحانية 3 التدقيق والمصادقات وإعلان النتائج الأولية اللجنة التدقيقية ثم رئيس اللجنة ثم رئيس القسم ثم العميد 4 تطبيق درجات المعالجة (القرار: 5 درجات) رئيس اللجنة الامتحانية 5 إعادة التدقيق والمصادقة النهائية وطباعة النتائج المعدلة اللجنة التدقيقية والعميد"}, {"title": "المرحلة 1: السعي", "time": "", "html": "<blockquote><p><strong>1.<\/strong> ادخل بحساب رئيس اللجنة الامتحانية، واختر نوع الدراسة (صباحي أو مسائي) والمرحلة والنظام (<strong>بولونيا<\/strong> أو الفصلي).<\/p><p><strong>2.<\/strong> صدّر ملف إكسل لكل مادة على حدة حتى لا تتداخل البيانات، وسمِّ الملف باسم المادة. طابق أسماء الطلبة وتسلسلاتهم وعددهم.<\/p><p><strong>3.<\/strong> املأ التكويني (من 40) والمنتصف (من 10) فيصير السعي من 50، ثم استورد الملف وتأكد أنه لا توجد خانة فارغة.<\/p><\/blockquote>", "text": "1. ادخل بحساب رئيس اللجنة الامتحانية، واختر نوع الدراسة (صباحي أو مسائي) والمرحلة والنظام ( بولونيا أو الفصلي). 2. صدّر ملف إكسل لكل مادة على حدة حتى لا تتداخل البيانات، وسمِّ الملف باسم المادة. طابق أسماء الطلبة وتسلسلاتهم وعددهم. 3. املأ التكويني (من 40) والمنتصف (من 10) فيصير السعي من 50، ثم استورد الملف وتأكد أنه لا توجد خانة فارغة."}, {"title": "المرحلة 2: الامتحان النهائي", "time": "", "html": "<blockquote><p><strong>1.<\/strong> من <strong>إدارة الامتحانات ← إضافة امتحان<\/strong>: حدد السنة الدراسية والدور (الأول) ونوع الدراسة واللجنة الامتحانية وكل المراحل المشمولة.<\/p><p><strong>2.<\/strong> راجع قائمة المؤهلين. من تكوينيه أقل من 14 يُستبعد تلقائياً (غير مؤهل). إذا كان هناك نقص فأضف السعي أولاً، ثم اضغط <strong>تحديث عدد حساب درجات القسم<\/strong>.<\/p><p><strong>3.<\/strong> افتح كل مادة وأدخل درجة النهائي (من 50) مباشرة، أو بتصدير ملف إكسل واستيراده.<\/p><\/blockquote>", "text": "1. من إدارة الامتحانات ← إضافة امتحان : حدد السنة الدراسية والدور (الأول) ونوع الدراسة واللجنة الامتحانية وكل المراحل المشمولة. 2. راجع قائمة المؤهلين. من تكوينيه أقل من 14 يُستبعد تلقائياً (غير مؤهل). إذا كان هناك نقص فأضف السعي أولاً، ثم اضغط تحديث عدد حساب درجات القسم . 3. افتح كل مادة وأدخل درجة النهائي (من 50) مباشرة، أو بتصدير ملف إكسل واستيراده."}, {"title": "المرحلة 3: التدقيق والمصادقات", "time": "", "html": "<blockquote><p><strong>1.<\/strong> في كل مادة اختر <strong>إرسال إلى اللجنة التدقيقية<\/strong>، فتصير الحالة (إلى التدقيق) ويُقفل التعديل.<\/p><p><strong>2.<\/strong> رئيس اللجنة التدقيقية يطابق الدرجات مع الماستر شيت الورقي، ويحدد الدرجات كلها ويختار (موافق)، ثم (انتهاء التدقيق).<\/p><p><strong>3.<\/strong> انقل حالة الامتحان إلى (الموافقات): رئيس اللجنة، ثم رئيس القسم، ثم العميد بعد مراجعة نسب النجاح والغياب.<\/p><p><strong>4.<\/strong> من تبويب (طباعة النتائج) تُعلن النتائج الأولية بكشوف جماعية أو فردية.<\/p><\/blockquote><blockquote><p><strong>للتفصيل:<\/strong> شرح (تدقيق الدرجات والموافقات) في دليل نظام اللجنة الامتحانية.<\/p><\/blockquote>", "text": "1. في كل مادة اختر إرسال إلى اللجنة التدقيقية ، فتصير الحالة (إلى التدقيق) ويُقفل التعديل. 2. رئيس اللجنة التدقيقية يطابق الدرجات مع الماستر شيت الورقي، ويحدد الدرجات كلها ويختار (موافق)، ثم (انتهاء التدقيق). 3. انقل حالة الامتحان إلى (الموافقات): رئيس اللجنة، ثم رئيس القسم، ثم العميد بعد مراجعة نسب النجاح والغياب. 4. من تبويب (طباعة النتائج) تُعلن النتائج الأولية بكشوف جماعية أو فردية. للتفصيل: شرح (تدقيق الدرجات والموافقات) في دليل نظام اللجنة الامتحانية."}, {"title": "المرحلة 4: درجات المعالجة (القرار)", "time": "", "html": "<blockquote><p><strong>1.<\/strong> من إدارة الامتحانات غيّر حالة الامتحان من العرض إلى <strong>(الدرجات الإضافية)<\/strong>.<\/p><p><strong>2.<\/strong> طبّق درجات المعالجة للراسبين بين 45 و49 لتصير 50، حسب الماستر شيت الورقي، واحفظ.<\/p><\/blockquote>", "text": "1. من إدارة الامتحانات غيّر حالة الامتحان من العرض إلى (الدرجات الإضافية) . 2. طبّق درجات المعالجة للراسبين بين 45 و49 لتصير 50، حسب الماستر شيت الورقي، واحفظ."}, {"title": "المرحلة 5: إعادة التدقيق والنتائج النهائية", "time": "", "html": "<blockquote><p><strong>1.<\/strong> من <strong>إدارة الدرجات الإضافية<\/strong> أرسل المواد المعدلة فقط إلى اللجنة التدقيقية.<\/p><p><strong>2.<\/strong> تدقيق رئيس اللجنة التدقيقية وتأييده، ثم الموافقات: رئيس اللجنة، فرئيس القسم، فالعميد.<\/p><p><strong>3.<\/strong> اطبع النتائج النهائية بعد أن تتعدل حالة المشمولين بالقرار إلى (ناجح / مقبول).<\/p><\/blockquote>", "text": "1. من إدارة الدرجات الإضافية أرسل المواد المعدلة فقط إلى اللجنة التدقيقية. 2. تدقيق رئيس اللجنة التدقيقية وتأييده، ثم الموافقات: رئيس اللجنة، فرئيس القسم، فالعميد. 3. اطبع النتائج النهائية بعد أن تتعدل حالة المشمولين بالقرار إلى (ناجح / مقبول)."}, {"title": "قائمة تدقيق", "time": "", "html": "<div class=\"tw\"><table><tr><th>المرحلة<\/th><th>المهمة<\/th><th>الجهة<\/th><th>تم<\/th><\/tr><tr><td>1<\/td><td>تصدير الإكسل واستيراد التكويني (40) والمنتصف (10)<\/td><td>رئيس اللجنة الامتحانية<\/td><td>☐<\/td><\/tr><tr><td>2<\/td><td>إنشاء الامتحان النهائي ورفع النظري (50)<\/td><td>رئيس اللجنة الامتحانية<\/td><td>☐<\/td><\/tr><tr><td>3<\/td><td>التدقيق الإلكتروني ومصادقة رئيس اللجنة ورئيس القسم والعميد<\/td><td>اللجنة التدقيقية والقيادات<\/td><td>☐<\/td><\/tr><tr><td>4<\/td><td>تحويل الحالة للدرجات ا ong>30<\/strong><\/td><td><\/td><td><strong>2490<\/strong><\/td><\/tr><\/table><\/div><p>معدل الفصل = 2490 ÷ 30 = <strong>83%<\/strong><\/p>", "text": "المادة الوحدات الدرجة الوحدات × الدرجة المادة 1 5 80 400 المادة 2 6 70 420 المادة 3 7 90 630 المادة 4 4 80 320 المادة 5 8 90 720 المجموع 30 2490 معدل الفصل = 2490 ÷ 30 = 83%"}, {"title": "قواعد مهمة", "time": "", "html": "<blockquote><p><strong>◂<\/strong> درجة المادة النهائية يُجبر كسرها إلى أقرب عدد صحيح (54.5 تصير 55، و54.4 تصير 54).<\/p><p><strong>◂<\/strong> <strong>المعدل لا يُجبر كسره<\/strong> إلى عدد صحيح.<\/p><p><strong>◂<\/strong> أوزان المراحل متساوية: مادة بخمس وحدات في المرحلة الأولى تساوي مادة بخمس وحدات في الرابعة، فالوزن للوحدات فقط.<\/p><p><strong>◂<\/strong> الدور الثاني في بولونيا لا يُخصم منه 10 درجات عند حساب المعدل؛ الدرجة تنزل كاملة (ورشة 2026-2027).<\/p><p><strong>◂<\/strong> الطالب المقبول في صف أعلى من الأول (كأوائل المعاهد) يُحسب معدله على وحدات المستويات التي درسها بعد قبوله فقط.<\/p><\/blockquote>", "text": "◂ درجة المادة النهائية يُجبر كسرها إلى أقرب عدد صحيح (54.5 تصير 55، و54.4 تصير 54). ◂ المعدل لا يُجبر كسره إلى عدد صحيح. ◂ أوزان المراحل متساوية: مادة بخمس وحدات في المرحلة الأولى تساوي مادة بخمس وحدات في الرابعة، فالوزن للوحدات فقط. ◂ الدور الثاني في بولونيا لا يُخصم منه 10 درجات عند حساب المعدل؛ الدرجة تنزل كاملة (ورشة 2026-2027). ◂ الطالب المقبول في صف أعلى من الأول (كأوائل المعاهد) يُحسب معدله على وحدات المستويات التي درسها بعد قبوله فقط."}], "tabs": ["bo_gpa", "bo_scale"], "added": "06/11/2026", "updated": ""}];

const ST = {"محلولة":"ok","حل مقترح":"sug","حل جزئي":"part","بلا حل":"no"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Arabic-tolerant normalisation: drop diacritics/tatweel, unify alef, ya, ta marbuta, hamza seats
const MAP = {"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه","ـ":""};
function norm(s){
  let out = "", idx = [];
  for (let i = 0; i < s.length; i++){
    let ch = s[i];
    if (/[ً-ْٰ]/.test(ch)) continue;
    ch = (MAP[ch] !== undefined ? MAP[ch] : ch).toLowerCase();
    for (const c of ch){ out += c; idx.push(i); }
  }
  return {out, idx};
}
DATA.forEach(d => { d.hay = norm([d.problem, d.error, d.solution, d.notes, d.cat, d.group].join(" ")).out; });

function highlight(text, terms){
  if (!text) return "";
  if (!terms.length) return esc(text);
  const {out, idx} = norm(text);
  const marks = new Array(text.length).fill(false);
  for (const t of terms){
    let p = out.indexOf(t);
    while (p !== -1){
      const a = idx[p], b = idx[p + t.length - 1];
      for (let i = a; i <= b; i++) marks[i] = true;
      p = out.indexOf(t, p + 1);
    }
  }
  let html = "", open = false;
  for (let i = 0; i < text.length; i++){
    if (marks[i] && !open){ html += "<mark>"; open = true; }
    if (!marks[i] && open){ html += "</mark>"; open = false; }
    html += esc(text[i]);
  }
  return html + (open ? "</mark>" : "");
}

const badge = it => it.updated === META.latest ? "upd" : (it.added === META.latest ? "new" : "");
const pill = b => b === "new" ? `<span class="newpill">جديد</span>` : b === "upd" ? `<span class="newpill upd">محدّث</span>` : "";
DATA.forEach(d => { d.hay = norm([d.problem, d.error, d.solution, d.notes, d.cat, d.group, ...(d.vid || []).map(v => v.text + " " + v.note)].join(" ")).out; d.b = badge(d); });
GUIDES.forEach(g => { g.b = badge(g); g.sections.forEach(s => { s.hay = norm(g.title + " " + s.title + " " + s.text).out; }); });

function markEl(root, terms){
  if (!terms.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue; if (!text.trim()) continue;
    const h = highlight(text, terms);
    if (h.indexOf("<mark>") === -1) continue;
    const span = document.createElement("span"); span.innerHTML = h;
    node.replaceWith(...span.childNodes);
  }
}

let view = (SYS.labels ? "guides" : "issues"), curTab = "", OPEN = {}, autoView = false;
const LB = Object.assign({issues: "المشاكل والحلول", guides: "آلية الاستخدام وطريقة الإدخال", other: "حالات أخرى"}, SYS.labels || {});
const KEY = "sis-kb2-" + SYS.id;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({q:$("#q").value, s:$("#fs").value, g:$("#fg").value, t:curTab, v:view, n:$("#onlynew").checked, o:OPEN})); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; } }
const terms = () => { const r = $("#q").value.trim(); return r ? norm(r).out.split(/\s+/).filter(Boolean) : []; };

function setup(){
  document.title = SYS.short;
  $("#ttl").textContent = SYS.title;
  $("#sub").textContent = SYS.desc + " التبويبات ثابتة، وكل ما أُضيف أو عُدّل في آخر تحديث (" + META.latest + ") عليه علامة.";
  const nNew = DATA.filter(d => d.b).length + GUIDES.filter(g => g.b).length;
  const nInfo = DATA.filter(d => d.kind === "info").length;
  let h = `<span class="stat"><b>${DATA.length - nInfo}</b> مشكلة</span><span class="stat"><b>${nInfo}</b> ${LB.other}</span>`;
  for (const s of (SYS.labels ? [] : META.statuses)){
    const n = DATA.filter(d => d.status === s).length;
    if (n) h += `<span class="stat"><span class="dot" style="background:var(--${ST[s]})"></span>${s} <b>${n}</b></span>`;
  }
  h += `<span class="stat"><b>${GUIDES.length}</b> ${SYS.labels ? LB.guides : "شروحات آلية الاستخدام"}</span>`;
  h += `<span class="stat" style="border-color:var(--new)"><span class="newpill">جديد/محدّث</span> <b>${nNew}</b> في تحديث ${META.latest}</span>`;
  $("#stats").innerHTML = h;
  $("#sysnav").innerHTML = SYS.nav.map(s => s.cur ? `<span>${esc(s.title)}</span>` : `<a href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("");
  META.statuses.forEach(s => $("#fs").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
  META.groups.forEach(g => $("#fg").insertAdjacentHTML("beforeend", `<option value="${esc(g)}">${esc(g)}</option>`));
  $("#cats").addEventListener("click", e => {
    const gb = e.target.closest(".grp");
    if (gb){ const g = gb.dataset.grp; OPEN[g] = gb.getAttribute("aria-expanded") === "false"; render(); save(); return; }
    const b = e.target.closest(".cat"); if (!b) return;
    curTab = b.dataset.c; autoView = true; render(); save();
    if (window.innerWidth > 820) window.scrollTo({top: $(".layout").offsetTop - 70, behavior: "smooth"});
  });
  document.addEventListener("click", e => { const b = e.target.closest(".segb"); if (b){ view = b.dataset.v; render(); save(); } });
  // update log
  let lg = `<table><tr><th>التاريخ</th><th>التحديث</th><th>في هذا الملف</th></tr>`;
  for (const [d, txt] of META.updates.slice().reverse()){
    const a = DATA.filter(x => x.added === d).length, u = DATA.filter(x => x.updated === d && x.added !== d).length, g = GUIDES.filter(x => x.added === d).length;
    const parts = []; if (a) parts.push(a + " مشكلة جديدة"); if (u) parts.push(u + " مشكلة محدّثة"); if (g) parts.push(g + " شرح");
    lg += `<tr class="${d === META.latest ? "cur" : ""}"><td class="num">${esc(d)}</td><td>${esc(txt)}</td><td>${parts.join("، ") || "-"}</td></tr>`;
  }
  $("#log").innerHTML = lg + "</table>";
  $("#foot").innerHTML = META.log.map(l => `مجموعة «${esc(l[0])}»: آخر رسالة معالجة ${esc(l[1])}`).join(" · ") + "<br>لا يحتوي الدليل على أسماء الطلبة أو أرقامهم ولا أرقام الهواتف أو التذاكر.";
  const st = load();
  if (st.q) $("#q").value = st.q;
  if (st.s) $("#fs").value = st.s;
  if (st.g) $("#fg").value = st.g;
  if (st.t && TABNAME[st.t]) curTab = st.t;
  if (["guides", "other"].includes(st.v)) view = st.v;
  if (st.n) $("#onlynew").checked = true;
  if (st.o) OPEN = st.o;
  else if (window.innerWidth <= 820) SYS.tree.forEach(([g]) => OPEN[g] = false);   // phones: start collapsed
  let t;
  $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { render(); save(); }, 120); });
  ["#fs", "#fg", "#onlynew"].forEach(s => $(s).addEventListener("change", () => { render(); save(); }));
  $("#clr").addEventListener("click", () => { $("#q").value = ""; render(); save(); $("#q").focus(); });
  document.addEventListener("click", e => {
    const b = e.target.closest(".vid button"); if (!b) return;
    goSection(b.dataset.g, b.dataset.i);
  });
  window.addEventListener("hashchange", fromHash);
}

function goSection(g, i){
  view = "guides"; curTab = ""; $("#q").value = ""; $("#onlynew").checked = false; render(); save();
  const el = document.getElementById(`s-${g}-${i}`);
  if (el){
    document.querySelectorAll("#list img").forEach(x => x.loading = "eager");
    const go = () => el.scrollIntoView({block: "start"});
    go(); setTimeout(go, 350); setTimeout(go, 900);
    el.style.background = "var(--accent-soft)"; setTimeout(() => el.style.background = "", 2200);
  }
}
function fromHash(){
  const m = /^#s-([a-z]+)-(\d+)$/.exec(location.hash);
  if (m && GUIDES.some(g => g.id === m[1])) goSection(m[1], m[2]);
}

function issueBase(T){
  const fs = $("#fs").value, fg = $("#fg").value, nw = $("#onlynew").checked;
  return DATA.filter(d => (!fs || d.status === fs) && (!fg || d.group.includes(fg)) && (!nw || d.b) && T.every(t => d.hay.includes(t)));
}
function guideHits(T){
  const nw = $("#onlynew").checked;
  return GUIDES.filter(g => !nw || g.b).map(g => ({g, secs: g.sections.filter(s => T.every(t => s.hay.includes(t)))}));
}

function render(){
  const raw = $("#q").value.trim(), T = terms();
  $("#clr").hidden = !raw;
  const all = issueBase(T), gh = guideHits(T);
  const probs = all.filter(d => d.kind !== "info"), infos = all.filter(d => d.kind === "info");
  const inTab = (it, tab) => !tab || it.tabs.includes(tab);
  const gIn = tab => gh.filter(x => x.secs.length && inTab(x.g, tab));
  const counts = tab => ({issues: probs.filter(d => inTab(d, tab)).length, guides: gIn(tab).length, other: infos.filter(d => inTab(d, tab)).length});
  if (autoView){
    const c = counts(curTab);
    if (!c[view]) view = ["issues", "guides", "other"].find(v => c[v]) || view;
    autoView = false;
  }
  $("#fs").hidden = $("#fg").hidden = view === "guides";
  document.body.dataset.view = view;
  // rail: app tabs grouped like the application's menu; counts include problems, usage guides and other cases
  const cnt = tab => all.filter(d => inTab(d, tab)).length + gIn(tab).length;
  const newCnt = tab => all.filter(d => inTab(d, tab) && d.b).length + gIn(tab).filter(x => x.g.b).length;
  let rh = `<button class="cat allbtn" data-c="" aria-pressed="${!curTab}"><span>${esc(SYS.home)}</span><span class="r"><span class="n">${cnt("")}</span></span></button>`;
  for (const [grp, tabs] of SYS.tree){
    const ids = tabs.map(t => t[0]);
    const inG = it => it.tabs.some(t => ids.includes(t));
    const gItems = all.filter(inG).length + gh.filter(x => x.secs.length && inG(x.g)).length;
    const gNew = all.filter(d => d.b && inG(d)).length + gh.filter(x => x.secs.length && x.g.b && inG(x.g)).length;
    const open = OPEN[grp] !== false;
    rh += `<button class="grp" type="button" data-grp="${esc(grp)}" aria-expanded="${open}"><span>${esc(grp)}<span class="gn">${gItems}</span></span><span class="r">${gNew ? `<span class="newpill">${gNew} جديد</span>` : ""}<span class="chev">▾</span></span></button><div class="gitems"${open ? "" : " hidden"}>`;
    for (const [id, name, acc] of tabs){
      const n = cnt(id), nn = newCnt(id);
      rh += `<button class="cat${n === 0 ? " zero" : ""}" data-c="${id}" aria-pressed="${curTab === id}"><span class="nm"><span>${esc(name)}</span>${acc ? `<span class="acc">${esc(acc)}</span>` : ""}</span><span class="r">${nn ? `<span class="newpill">${nn} جديد</span>` : ""}<span class="n">${n}</span></span></button>`;
    }
    rh += `</div>`;
  }
  const nav = $("#cats"), keep = nav.scrollTop;
  nav.innerHTML = rh; nav.scrollTop = keep;
  if (view === "guides") renderGuides(gh, raw, T); else renderIssues(view === "other" ? infos : probs, raw, T, view === "other");
  // header of the selected tab with the three content buttons
  const c = counts(curTab);
  const segs = [["issues", LB.issues, c.issues], ["guides", LB.guides, c.guides], ["other", LB.other, c.other]];
  const head = `<div class="tabhead"><div class="th"><div class="crumb">${curTab ? esc(TABGRP[curTab]) : esc(SYS.title)}</div><div class="tt">${esc(curTab ? TABNAME[curTab] : "كل التبويبات")}</div></div>
    <div class="seg" role="tablist">${segs.map(([v, l, n]) => `<button type="button" role="tab" class="segb${n ? "" : " zero"}" data-v="${v}" aria-selected="${view === v}">${l} <span class="n">${n}</span></button>`).join("")}</div></div>`;
  $("#list").insertAdjacentHTML("afterbegin", head);
}

const PLAY = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;
function card(d, T, here){
  const others = d.tabs.filter(t => t !== here).map(t => TABNAME[t]);
  const ext = d.elsewhere.map(e => `${e.sys} (${e.tab})`);
  const also = [...others, ...ext];
  return `<article data-s="${esc(d.status)}" class="${d.b ? "isnew" : ""}">
    <div class="meta">${pill(d.b)}${d.kind === "info" && SYS.labels ? "" : `<span class="pill ${ST[d.status]}">${esc(d.status)}</span>`}
      <span class="num">#${d.n}</span><span class="num"><bdi>${esc(d.date.split(" ")[0])}</bdi> · <bdi>${esc(d.date.split(" ").slice(1).join(" "))}</bdi></span><span>${esc(d.group)}</span>
      ${d.source ? `<span>المصدر: ${esc(d.source)}</span>` : ""}</div>
    <p class="q">${highlight(d.problem, T)}</p>
    ${d.error ? `<p class="err">${highlight(d.error, T)}</p>` : ""}
    <p class="sol"><span class="k">${d.kind === "info" ? "التوضيح" : "الحل"}: </span>${highlight(d.solution, T)}</p>
    ${(d.vid || []).map(v => `<div class="vid"><div class="vh"><span class="vt">${PLAY} من شرح «${esc(v.name)}»، ${esc(v.step)}</span>
      ${v.href ? `<a class="btn" href="${esc(v.href)}" target="_blank" rel="noopener">افتح في ${esc(v.sysname)}</a>` : `<button type="button" data-g="${esc(v.g)}" data-i="${v.i}">افتح الخطوة في الشرح</button>`}</div>
      <p>${highlight(v.text, T)}</p>${v.note ? `<p class="vn">${highlight(v.note, T)}</p>` : ""}</div>`).join("")}
    ${d.notes ? `<p class="note"><span class="k">ملاحظة: </span>${highlight(d.notes, T)}</p>` : ""}
    ${also.length ? `<p class="also">يظهر أيضاً في: <b>${esc(also.join(" · "))}</b></p>` : ""}
  </article>`;
}
function renderIssues(base, raw, T, isOther){
  const tabsToShow = curTab ? [curTab] : TABORDER;
  let html = "", shown = 0;
  for (const tab of tabsToShow){
    // in "all" mode each problem is listed once, under its first tab in this system
    const items = base.filter(d => curTab ? d.tabs.includes(tab) : d.tabs[0] === tab);
    if (!items.length) continue;
    shown += items.length;
    html += `<section class="group"><h2>${esc(TABNAME[tab])} <span>${items.length}</span></h2><div class="cards">${items.map(d => card(d, T, tab)).join("")}</div></section>`;
  }
  $("#count").textContent = `يظهر ${shown} من ${DATA.length}`;
  $("#list").innerHTML = html || `<div class="empty">لا توجد ${isOther ? LB.other : "مشكلة"}${raw ? ` فيها «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}${$("#onlynew").checked ? " ضمن الجديد" : ""}.</div>`;
}
function renderGuides(gh, raw, T){
  const list = gh.filter(x => (!curTab || x.g.tabs.includes(curTab)) && x.secs.length);
  const shownSecs = list.reduce((a, x) => a + x.secs.length, 0);
  $("#count").textContent = T.length ? `${shownSecs} خطوة مطابقة` : `${list.length} من ${GUIDES.length} شروحات`;
  if (!list.length){
    $("#list").innerHTML = `<div class="empty">لا يوجد شرح${raw ? ` فيه «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}.</div>`;
    return;
  }
  let html = "";
  for (const {g, secs} of list){
    html += `<section class="guide" id="g-${g.id}"><div class="ghead"><h2>${esc(g.title)}</h2><p class="gs">${esc(g.subtitle)}</p>
      <p class="src">${PLAY}<span>${esc(g.source)}</span></p>
      <div class="gmeta">${pill(g.b)}${g.tabs.map(t => `<span class="newpill upd" style="background:var(--bg);color:var(--muted);border-color:var(--line)">${esc(TABNAME[t])}</span>`).join("")}</div></div>`;
    if (T.length) html += `<div class="hits">${secs.length} من ${g.sections.length} أقسام تطابق البحث</div>`;
    else html += `<nav class="toc" aria-label="محتويات الشرح">${secs.map(s => `<a href="#s-${g.id}-${g.sections.indexOf(s)}">${esc(s.title.replace(/:.*/, ""))}</a>`).join("")}</nav>`;
    secs.forEach(s => {
      const i = g.sections.indexOf(s);
      html += `<div class="sec" id="s-${g.id}-${i}"><h3><span class="st">${esc(s.title)}</span>${s.time ? `<span class="t">في الفيديو ${esc(s.time)}</span>` : ""}</h3>${s.html}</div>`;
    });
    html += `</section>`;
  }
  const L = $("#list"); L.innerHTML = html;
  markEl(L, T);
  L.querySelectorAll(".toc a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1));
    if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
  }));
}
setup(); render(); fromHash();
</script>
</html>
