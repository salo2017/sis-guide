<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل نظام SIS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: sticky search bar, category rail beside a single column of issue cards; rail becomes a chip row on phones */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#13262B; --muted:#5A6E72; --line:#D9E2E0;
  --accent:#0E6B66; --accent-soft:#DDEFEC; --mark:#FFE58A; --err-bg:#FBEEEE; --err-fg:#9B2C2C;
  --ok:#23804A; --ok-bg:#E3F3E8; --sug:#1D5D9B; --sug-bg:#E2EDF9; --part:#A8620E; --part-bg:#FCEFDD; --no:#B8342A; --no-bg:#FBE6E4;
  --display:"Reem Kufi","Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#162427; --ink:#E4EEEC; --muted:#93A8A6; --line:#26393C;
  --accent:#4FC2B8; --accent-soft:#16383A; --mark:#6B5A12; --err-bg:#3A1F1F; --err-fg:#F2AAAA;
  --ok:#6FD08F; --ok-bg:#183223; --sug:#86B8EE; --sug-bg:#172A3F; --part:#F0B565; --part-bg:#3A2A14; --no:#F28F86; --no-bg:#3D1C19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#162427; --ink:#E4EEEC; --muted:#93A8A6; --line:#26393C;
  --accent:#4FC2B8; --accent-soft:#16383A; --mark:#6B5A12; --err-bg:#3A1F1F; --err-fg:#F2AAAA;
  --ok:#6FD08F; --ok-bg:#183223; --sug:#86B8EE; --sug-bg:#172A3F; --part:#F0B565; --part-bg:#3A2A14; --no:#F28F86; --no-bg:#3D1C19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-block:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.search{flex:1 1 320px;position:relative;min-width:0}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 40px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:6px}
.search button:focus-visible{outline:2px solid var(--accent)}
select{font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
select:focus-visible{outline:2px solid var(--accent)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:24px 60px}
nav.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.cats .lbl{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 10px 6px}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:right;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.cat:hover{background:var(--accent-soft)}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.cat[aria-pressed="true"] .n{color:var(--surface);background:transparent}
.cat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cat .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);background:var(--bg);padding:0 8px;border-radius:999px}
.cat.zero{opacity:.45}
main{min-width:0}
section.group{margin-bottom:34px}
section.group h2{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
section.group h2 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.cards{display:flex;flex-direction:column;gap:12px}
article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-inline-start:4px solid var(--st)}
article[data-s="محلولة"]{--st:var(--ok)} article[data-s="حل مقترح"]{--st:var(--sug)}
article[data-s="حل جزئي"]{--st:var(--part)} article[data-s="بلا حل"]{--st:var(--no)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pill{font-weight:600;font-size:12px;padding:1px 10px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.sug{background:var(--sug-bg);color:var(--sug)}
.pill.part{background:var(--part-bg);color:var(--part)} .pill.no{background:var(--no-bg);color:var(--no)}
.num{font-variant-numeric:tabular-nums}
.q{font-weight:600;font-size:15.5px;margin:0 0 10px}
.err{background:var(--err-bg);color:var(--err-fg);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 10px}
.err::before{content:"رسالة النظام: ";font-weight:600}
.sol{margin:0}
.sol .k,.note .k{font-weight:700;color:var(--accent)}
.note{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-block:16px 30px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  nav.cats{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.cats .lbl{display:none}
  .cat{width:auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
  .bar{position:static}
  .search{flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){article{transition:border-color .15s}}
</style>
<style>
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.topic{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.topic .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.topic[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.topic[aria-selected="true"] .n{color:var(--surface)}
.topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.cats .lbl{margin-top:10px}
@media (max-width:820px){body[data-view="guides"] nav.cats{display:none}}
.vid{margin:10px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft);padding:10px 12px}
.vid .vh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.vid .vt{font-weight:700;color:var(--accent);font-size:13.5px;display:flex;gap:6px;align-items:center}
.vid p{margin:0;font-size:14px}
.vid .vn{margin-top:4px;font-size:12.5px;color:var(--muted)}
.vid button{font:inherit;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:1px 12px;cursor:pointer}
.vid button:hover{background:var(--accent);color:var(--surface)}
.vid button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .n{font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;background:var(--surface);color:var(--muted);padding:0 8px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow:hidden}
.ghead{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:linear-gradient(to left,var(--accent-soft),transparent 70%)}
.ghead h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;line-height:1.5;text-wrap:balance}
.ghead .gs{margin:2px 0 0;color:var(--ink);font-weight:500}
.ghead .src{margin:8px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.ghead .src svg{flex:0 0 auto;margin-top:4px;color:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.toc a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:2px 10px;border-radius:999px;background:var(--bg)}
.toc a:hover,.toc a:focus-visible{border-color:var(--accent);outline:none}
.sec{padding:16px 20px;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h3 .t{font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:0 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.sec p{margin:0 0 8px}
.sec blockquote{margin:0 0 8px;padding:0 14px 0 0;border-right:2px solid var(--line)}
.sec blockquote p{margin:0 0 4px}
.sec .subh{font-weight:700;color:var(--accent);margin-top:6px}
.sec img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:8px auto;background:#fff}
.tw{overflow-x:auto;margin:6px 0 10px}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tw th{background:var(--accent);color:var(--surface);font-weight:600;text-align:right;padding:6px 10px}
.tw tr:not(:first-child) th{background:transparent;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line)}
.tw td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
.tw tr:nth-child(even) td{background:var(--bg)}
.srcline{font-size:12px;color:var(--muted);margin:6px 0 0}
.hits{font-size:12.5px;color:var(--muted);padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
@media (max-width:820px){.bar .tabs{width:100%}.tab{flex:1;justify-content:center}}
</style>
<style>
.sysnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sysnav a,.sysnav span{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--accent);background:var(--surface)}
.sysnav span{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.sysnav a:hover,.sysnav a:focus-visible{border-color:var(--accent);outline:none}
.newpill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--new-bg);color:var(--new);border:1px solid var(--new);white-space:nowrap;line-height:1.7}
.newpill.upd{background:var(--upd-bg);color:var(--upd);border-color:var(--upd)}
.cat .r{display:flex;gap:6px;align-items:center}
.cat[aria-pressed="true"] .newpill{background:var(--surface)}
nav.cats .lbl{margin-top:12px;font-weight:600}
.onlynew{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer}
.onlynew input{accent-color:var(--new);width:16px;height:16px}
article.isnew{box-shadow:0 0 0 2px var(--new-bg)}
.also{font-size:12px;color:var(--muted);margin-top:8px}
.also b{font-weight:600;color:var(--ink)}
.vid a.btn{font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:1px 12px;text-decoration:none}
.vid a.btn:hover{background:var(--accent);color:var(--surface)}
.log{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.log table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
.log th{background:var(--bg);text-align:right;padding:6px 10px;font-weight:600}
.log td{border-top:1px solid var(--line);padding:6px 10px;vertical-align:top}
.log tr.cur td{background:var(--new-bg)}
.ghead .gmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tabhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:3}
.tabhead .crumb{font-size:12px;color:var(--muted)}
.tabhead .tt{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{font:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.segb .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.segb[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.segb[aria-selected="true"] .n{color:var(--surface)}
.segb.zero{opacity:.5}
.segb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.tabhead{position:static}}
/* sidebar styled like the application's dark side menu */
nav.cats{background:var(--side-bg);border-radius:14px;padding:10px 8px;gap:0!important;max-height:calc(100vh - 110px);overflow-y:auto}
nav.cats .cat{color:var(--side-fg);padding:7px 10px;font-size:13.5px}
nav.cats .cat:hover{background:var(--side-hover)}
nav.cats .cat[aria-pressed="true"]{background:var(--side-act);color:#fff}
nav.cats .cat .n{background:var(--side-pill);color:var(--side-act);font-weight:600}
nav.cats .cat[aria-pressed="true"] .n{background:#fff;color:var(--side-act)}
nav.cats .cat.zero{opacity:.5}
nav.cats .cat .nm{display:flex;flex-direction:column;align-items:flex-start;text-align:right}
nav.cats .cat .acc{font-size:11px;color:var(--side-mut);font-weight:400}
nav.cats .cat[aria-pressed="true"] .acc{color:#f3d6da}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:13.5px;font-weight:700;color:var(--side-head);background:none;border:0;padding:12px 10px 6px;cursor:pointer;text-align:right}
.grp:focus-visible{outline:2px solid var(--side-head);border-radius:6px}
.grp .r{display:flex;gap:8px;align-items:center}
.grp .chev{transition:transform .15s;display:inline-block;font-size:12px;opacity:.8}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.grp .gn{font-size:11.5px;font-weight:500;color:var(--side-mut);margin-inline-start:6px}
.gitems{display:flex;flex-direction:column;gap:1px;padding-inline-start:6px}
.gitems[hidden]{display:none!important}
nav.cats .allbtn{margin-bottom:4px}
:root{--side-bg:#1F2433;--side-fg:#E7EAF0;--side-head:#C5CCD8;--side-mut:#9AA3B2;--side-hover:#2C3345;--side-act:#8E2433;--side-pill:#FBEFF0}
@media (max-width:820px){
  nav.cats{flex-direction:column!important;overflow-y:visible!important;max-height:none!important;position:static!important;padding:8px!important}
  body[data-view="guides"] nav.cats{display:flex!important}
  nav.cats .cat{width:100%!important;white-space:normal!important;border:0!important;flex:none!important}
  nav.cats .cat:not([aria-pressed="true"]){background:none!important}
}
:root{--new:#B4530F;--new-bg:#FFF1E2;--upd:#6A3FA0;--upd-bg:#F2ECFA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--new:#F5A35C;--new-bg:#3A2614;--upd:#C3A6F0;--upd-bg:#2A2140}}
:root[data-theme="dark"]{--new:#F5A35C;--new-bg:#3A2614;--upd:#C3A6F0;--upd-bg:#2A2140}
</style>

<header class="top"><div class="wrap">
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
  <nav class="sysnav" id="sysnav" aria-label="الأنظمة"></nav>
</div></header>

<div class="bar"><div class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث بأي كلمة أو جزء من كلمة..." autocomplete="off" aria-label="بحث">
    <button id="clr" type="button" aria-label="مسح البحث" hidden>×</button>
  </div>
  <select id="fs" aria-label="الحالة"><option value="">كل الحالات</option></select>
  <select id="fg" aria-label="المجموعة"><option value="">كل المجموعات</option></select>
  <label class="onlynew"><input type="checkbox" id="onlynew"> الجديد فقط</label>
  <span class="count" id="count"></span>
</div></div>

<div class="wrap layout">
  <nav class="cats" id="cats" aria-label="تبويبات النظام"></nav>
  <main id="list"></main>
</div>

<footer><div class="wrap">
  <div style="font-weight:600;color:var(--ink);margin-bottom:4px">سجل التحديثات</div>
  <div class="log" id="log"></div>
  <p id="foot" style="margin-top:10px"></p>

 "updated": "", "tabs": ["stu_reg", "fees_pending"], "elsewhere": [], "vid": []}, {"n": 17, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "المواد وقوائم الدرجات", "problem": "المواد السنوية ضمن النظام الفصلي أو بولونيا (مشروع التخرج، التصميم المعماري).", "error": "", "solution": "يُقسَّم تسجيلها تلقائياً على فصلين. نظام اللجنة الامتحانية ما زال يُحدَّث لدعم درجاتها ومحاولاتها، فلا تُدخل درجاتها ولا تفعّل لها فترة امتحانية حتى يكتمل التحديث.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "إعدادات المادة السنوية في بولونيا ذُكرت أيضاً في ورشة 21-9.", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["courses"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}], "vid": []}, {"n": 22, "date": "23/09/2026 9:00 ص", "group": "الورشة الوزارية", "cat": "تعليمات وكتب رسمية", "problem": "من يرى الإحصائيات والتقارير؟", "error": "", "solution": "حسب الصلاحية: مدير التسجيل يرى إحصائيات النقل. ورئيس القسم والعميد ورئاسة الجامعة يرون تقارير الدرجات والحضور ونسب الإنجاز للدراسات الأولية والعليا، مع فلاتر الفصل والمرحلة ونوع الدراسة والبرنامج، ويمكن تصديرها للمطابقة.", "source": "الورشة الوزارية 23-9-2026", "status": "محلولة", "notes": "", "kind": "info", "added": "03/11/2026 ليلاً", "updated": "", "tabs": ["stats"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة التقارير"}], "vid": []}, {"n": 24, "date": "27/10/2026 10:25 م", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "طالب مسجل على برنامج دراسي لعام 2025-2026، ولا يمكن حذف المواد المرتبطة به لكي يُحذف البرنامج. وطُلب أيضاً تفعيل حذف البرنامج المكرر المضاف بالخطأ.", "error": "", "solution": "لم يُجب في المجموعة.", "source": "شرح فيديو", "status": "حل مقترح", "notes": "إذا كان سبب المنع ارتباط المادة بنظام اللجنة الامتحانية فانظر: حذف الطلبة من مادة مرتبطة باللجنة.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["programs", "courses"], "elsewhere": [], "vid": [{"g": "init", "i": 5, "name": "تهيئة العام الدراسي", "step": "الخطوة 4", "text": "المادة الملغاة يُحذف توزيعها أولاً (توزيع المادة الدراسية)، ثم تُحذف المادة نفسها. وإذا رفض النظام حذفها لارتباطها باللجنة الامتحانية، فاحذف الطلبة من قوائم درجات المادة في نظام إدارة الامتحانات أولاً.", "note": ""}, {"g": "build", "i": 4, "name": "الدليل الشامل: البرنامج والقاعات", "step": "الخطوة 3", "text": "البرنامج الذي فيه خطأ بالسنة الدراسية أو نظام التعليم أو الرمز لا يُعدَّل، والحل حذفه وإنشاؤه من جديد، ولهذا تُحذف المواد المرتبطة به أولاً.", "note": ""}, {"g": "complete", "i": 4, "name": "استكمال تسجيل الطلاب (سنة الترحيل)", "step": "سجل العمليات السابقة والتراجع", "text": "إذا كان الطالب سُجّل في البرنامج من خاصية استكمال التسجيل، فسجل العمليات يسمح بالتراجع: السيرة أولاً ثم البرنامج، ما لم تكن له بيانات في نظام اللجنة الامتحانية. وإدارة تسجيل المواد تحذف المواد من سيرته إن لم تكن له نتائج.", "note": ""}]}, {"n": 25, "date": "27/10/2026 10:31 م", "group": "مجموعة SIS", "cat": "التخرج", "problem": "طالب متخرج من الدور الأول تظهر حالته (جديد) عند الترحيل، وتحديث النتيجة لم يغيّرها.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم + شرح فيديو", "status": "حل مقترح", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["graduation", "grad_data"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "ترحيل الطلبة"}], "vid": [{"g": "poly", "i": 5, "name": "تسجيل طلبة البوليتكنك", "step": "الخطوة 5", "text": "تأكد أن حالة الطالب حُدّثت إلى متخرج: من إدارة التخرج اختر الطالب، ثم (تحديث حالة التسجيل) إلى (متخرج).", "note": "الشرح لم يتناول هذه الحالة بعينها، فإن بقيت المشكلة راسل الدعم."}]}, {"n": 26, "date": "28/10/2026 12:17 ص", "group": "مجموعة SIS", "cat": "معلومات الطلبة وحالة التسجيل", "problem": "بعض الطلبة لا تظهر أرقامهم الجامعية في حسابات المقررين، مع أنها ظاهرة في حساب المسجل ومدير الكلية.", "error": "", "solution": "لم يُجب في المجموعة.", "source": "", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["stu_info"], "elsewhere": [], "vid": []}, {"n": 28, "date": "28/10/2026 10:36 ص", "group": "مجموعة SIS", "cat": "الحسابات وتسجيل الدخول", "problem": "الدراسات العليا: عند رفع الطلبة بملف إكسل لا تظهر معلومات تسجيل الدخول (الباركود)، ولا يقبل حقل البطاقة الموحدة الرقم الامتحاني، ولا يمكن تغيير طريقة تسجيل الدخول أو الإيميل بعد إضافته.", "error": "", "solution": "الدعم: تعديل معلومات تسجيل الدخول متاح لطلبة الدراسات الأولية. أما الدراسات العليا فتواصل الدعم مع صاحب السؤال على الخاص.", "source": "فريق الدعم", "status": "حل جزئي", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["stu_info", "accounts"], "elsewhere": [], "vid": []}, {"n": 29, "date": "28/10/2026 11:42 ص", "group": "مجموعة SIS", "cat": "الهوية الطلابية (هيبك / سوبر كي)", "problem": "هل يمكن تغيير صورة الطالب بعد رفض الهوية؟", "error": "", "solution": "نعم، يمكن ذلك.", "source": "فريق الدعم", "status": "محلولة", "notes": "", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["id_rejected"], "elsewhere": [], "vid": []}, {"n": 30, "date": "28/10/2026 12:42 م", "group": "مجموعة SIS", "cat": "معلومات الطلبة وحالة التسجيل", "problem": "كيف يُحذف طالب من النظام، ومنهم الطلبة غير المباشرين؟", "error": "", "solution": "لا يمكن حذف الطالب من النظام. يُعدَّل وضعه من (حالة التسجيل) بما يناسب حالته الفعلية. الطالب غير المباشر تُحدد حالته (إلغاء قبول لعدم المباشرة) من حساب المسجل.", "source": "فريق الدعم + شرح فيديو", "status": "محلولة", "notes": "طُرح السؤال مرتين وأجاب الدعم في المرتين.", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["stu_info"], "elsewhere": [], "vid": [{"g": "poly", "i": 9, "name": "تسجيل طلبة البوليتكنك", "step": "التراجع عن تسجيل خاطئ", "text": "يمكن إزالة الطالب من برنامج دراسي (طلاب البرنامج ← إزالة من البرنامج الدراسي)، لكن ذلك يحذف معلومات القبول المرتبطة بهذا البرنامج ولا يمكن استعادتها. هذا ليس حذفاً للطالب من النظام.", "note": ""}]}, {"n": 31, "date": "28/10/2026 12:48 م", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "مواد أُنشئت في 2024-2025 وانتقلت تلقائياً مع الترحيل إلى 2025-2026، وفي هذه السنة حُوّلت بعض المواد من الكورس الأول إلى الثاني وبالعكس، فظهرت مشكلة في النتائج بعد التحويل.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["courses"], "elsewhere": [], "vid": []}, {"n": 32, "date": "28/10/2026 12:54 م", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "لا يمكن حذف الطلبة من المادة الدراسية لأنهم مرتبطون بنظام اللجنة الامتحانية.", "error": "", "solution": "يجب فك ارتباط الطالب من اللجنة أولاً، وذلك بحذف الطلبة من قوائم درجات المادة في نظام إدارة الامتحانات، ثم الحذف من المادة.", "source": "فريق الدعم", "status": "محلولة", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["courses"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": []}, {"n": 36, "date": "28/10/2026 6:11 م", "group": "مجموعة SIS", "cat": "الهوية الطلابية (هيبك / سوبر كي)", "problem": "الطلاب يرفضون الهوية بسبب نقص بعض المعلومات، لكن الطلبات المرفوضة لا تظهر في حساب مدير تسجيل الكلية، فكيف يعدّل الطالب معلوماته؟", "error": "", "solution": "الدعم: ارفض الطلب واختر سبب الرفض (مثلاً الصورة)، فيرجع الطلب إلى الطالب ليعدّله. ولطلبة الدراسات العليا: تأكد أن الطالب مسدد أجور التطبيق ولديه سيرة دراسية بحثية (حالي).", "source": "فريق الدعم", "status": "محلولة", "notes": "طُرحت مجدداً في 2-11.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 ليلاً", "tabs": ["id_rejected"], "elsewhere": [], "vid": []}, {"n": 37, "date": "28/10/2026 8:14 م", "group": "مجموعة SIS", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طلبة 2026/2027 نُقل قيدهم من الدراسة الصباحية إلى المسائية، ولا يوجد خيار نقل قيد في SIS. هل يبقون على البرنامج الصباحي أم يُغيَّر البرنامج إلى المسائي؟", "error": "", "solution": "غيّر قناة قبول الطالب إلى (مسائي)، ثم غيّر برنامجه الدراسي إلى المسائي دون إضافة قبول جديد، فتبقى السير الصباحية القديمة فعالة إلى جانب المسائية.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["hosting", "programs"], "elsewhere": [], "vid": [{"g": "build", "i": 4, "name": "الدليل الشامل: البرنامج والقاعات", "step": "الخطوة 3", "text": "الدراسة الصباحية والمسائية لكل منهما برنامج دراسي مستقل، وهذا يوافق تغيير برنامج الطالب إلى البرنامج المسائي.", "note": ""}]}, {"n": 38, "date": "28/10/2026 8:15 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "عند ترحيل الدور الأول لعام 2025-2026 يظهر تنبيه بسبب طلبة لا توجد لهم نتائج مواد، وهم ليسوا ضمن الهيكل لأنهم نُقلوا أو باشروا في كليات أخرى. تكررت عند أكثر من مستخدم.", "error": "لا يمكن تنفيذ الدور الأول حاليًا ... لا توجد نتائج مواد مسجلة لهم في هذه السنة", "solution": "أرسل الأرقام الامتحانية لهؤلاء الطلبة إلى الدعم على الخاص، وهم يعالجون الحالة. الدعم أكد لاحقاً أن المشكلة حُلّت. والإجراء المعتمد الآن: ارفع تذكرة بعنوان (حذف سيرة طالب منقول) فيها أسماء الطلبة وأرقامهم الامتحانية، والدعم يحذف السيرة.", "source": "فريق الدعم", "status": "محلولة", "notes": "قريبة منها في مجموعة مسجلي الطلبة: ترحيل لا يكتمل بسبب طالبة غيّرت جهة قبولها. ومثلها (2-11): طلبة نقل لهم سيرتان في السنة نفسها، والدعم حذف السير المرسلة إليه.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 ليلاً", "tabs": ["transfer"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "ترحيل الطلبة"}], "vid": []}, {"n": 39, "date": "28/10/2026 9:05 م", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "طلبة العام الدراسي 2026/2027 لم تُولَّد لهم قوائم في نظام اللجنة الامتحانية.", "error": "", "solution": "الدعم: الفريق المختص يعمل على معالجة الموضوع.", "source": "فريق الدعم + شرح فيديو", "status": "بلا حل", "notes": "قيد المعالجة لدى الفريق.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["courses"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": [{"g": "init", "i": 6, "name": "تهيئة العام الدراسي", "step": "الخطوة 5", "text": "تأكد أن كل مواد 2026-2027 بحالة (مكتمل): وصف المقرر، والتدريسي وتوزيعه، والمسؤول عن الدرجات في IQ Learn، والتقييم، وعدد الوحدات.", "note": "اقتراح من الشرح، والدعم قال إن الفريق يعالج المشكلة."}, {"g": "coursedata", "i": 0, "name": "استكمال معلومات المواد", "step": "نظرة عامة", "text": "خطوات إكمال كل تبويب في نافذة المادة حتى تصبح حالتها مكتملة، مع ما يخص بولونيا (التقييم التكويني وساعات ECTS) وما يخص الفصلي والسنوي (السعي).", "note": ""}]}, {"n": 40, "date": "29/10/2026 10:18 ص", "group": "مسجلو الطلبة + مجموعة SIS", "cat": "الهوية الطلابية (هيبك / سوبر كي)", "problem": "من أين يستخرج الطالب الهوية الطلابية: من تطبيق (كي كارد / سوبر كي) أم من تطبيق (هيبك)؟", "error": "", "solution": "لا يحتاج تطبيق كي. من تطبيق هيبك مباشرة يختار الطالب (هوية الطالب) الموجود أسفل خيار (التالي)، ثم يؤكد معلوماته ويقدّم الطلب دون دفع.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "في مجموعة SIS طُرح السؤال نفسه وطُلب فيديو يشرح إصدار الهوية، ولم يُجب علناً.", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["id_print"], "elsewhere": [], "vid": []}, {"n": 41, "date": "29/10/2026 10:20 ص", "group": "مسجلو الطلبة", "cat": "الهوية الطلابية (هيبك / سوبر كي)", "problem": "تظهر للطالب رسالة عند طلب الهوية (الصورة لم تُصدَّر مع المحادثة).", "error": "", "solution": "التشخيص: اسم الطالب القابل للطباعة على الهوية غير مُدرج في ملفه الإلكتروني. صاحبة السؤال أكدت أن الاسم موجود، فاقتُرح التأكد من وجود برنامج دراسي وسيرة دراسية للطالب، وإن وُجدا يُعمل له (إعادة تحقق). أفادت بعدها أن الطالب لا ينقصه شيء، ولم يُطرح حل آخر.", "source": "عضو في المجموعة", "status": "حل جزئي", "notes": "إذا تكررت عندك: تحقق من الاسم القابل للطباعة، ثم البرنامج والسيرة، ثم (إعادة تحقق).", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["id_print", "id_rejected"], "elsewhere": [], "vid": []}, {"n": 42, "date": "29/10/2026 10:42 ص", "group": "مسجلو الطلبة", "cat": "تعليمات وكتب رسمية", "problem": "هل يحق للطالب المشمول بسنة عدم الرسوب أن يؤجل السنة الدراسية 2026-2027، علماً أن الكتاب اشترط النجاح في سنة الإعلان؟", "error": "", "solution": "لم يُجب أحد.", "source": "", "status": "بلا حل", "notes": "", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["general"], "elsewhere": [], "vid": []}, {"n": 43, "date": "29/10/2026 10:57 ص", "group": "مسجلو الطلبة + مجموعة SIS", "cat": "الهوية الطلابية (هيبك / سوبر كي)", "problem": "عند سحب البطاقة الطلابية من (سوبر كي) تظهر رسالة خطأ للطالب. تكررت في المجموعتين ولدى أكثر من مستخدم.", "error": "حدث خطأ أثناء التحقق. أنت غير مؤهل لإصدار البطاقة الطلابية لأن رقمك الوطني غير مرتبط بسجل طالب.", "solution": "اقتُرح استخراج الهوية من تطبيق هيبك مباشرة دون الحاجة إلى سوبر كي. في مجموعة SIS لم يُجب على السؤال.", "source": "عضو في المجموعة", "status": "حل مقترح", "notes": "نص الرسالة يشير إلى أن الرقم الوطني غير مرتبط بسجل الطالب، فقد يلزم التحقق من الرقم الوطني في ملفه.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["id_print"], "elsewhere": [], "vid": []}, {"n": 45, "date": "29/10/2026 11:14 ص", "group": "مجموعة SIS", "cat": "المواد وقوائم الدرجات", "problem": "تكليف تدريسي بمادة في قسم آخر ضمن الكلية نفسها.", "error": "", "solution": "حسب الورشة الوزارية (21-9-2026): التكليف الخارجي للتدريسيين من أقسام أو كليات أخرى يتم إدارياً في نظام الموارد البشرية (HR)، من تبويب (أماكن العمل الخارجية)، وبعدها يظهر التدريسي لاختياره في المادة.", "source": "الورشة الوزارية", "status": "محلولة", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 مساءً", "tabs": ["courses"], "elsewhere": [], "vid": []}, {"n": 46, "date": "29/10/2026 11:18 ص", "group": "مجموعة SIS", "cat": "الهوية الطلابية (هيبك / سوبر كي)", "problem": "طلاب وافقوا من جهتهم ووصلوا إلى مرحلة الطباعة، وطلاب آخرون لا تظهر طلباتهم في (طلبات الطباعة).", "error": "", "solution": "لم يُجب في المجموعة.", "source": "", "status": "بلا حل", "notes": "تكررت في مجموعة المقررين (2-11): طالبة معلوماتها صحيحة ووافقت على القبول، ولا يظهر اسمها في (طلبات الطباعة) للتأكيد. ولم يُجب أيضاً.", "kind": "problem", "added": "31/10/2026", "updated": "05/11/2026", "tabs": ["id_print", "id_status"], "elsewhere": [], "vid": []}, {"n": 47, "date": "29/10/2026 11:38 ص", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "طلبة بولونيا (ناجح جزئي) أو راسبون في مادة أو أكثر يمنعون ترحيل الدور الأول. هل تُحوّل حالتهم إلى ناجح، أم يُرحَّلون مع الدور الثاني مثل الراسبين، وماذا نختار لهم: غير جاهز أم متجاهل أم قيد الانتظار؟", "error": "توجد مادة واحدة أو أكثر نتيجتها غير مسجلة كناجح / لا يمكن تنفيذ الدور الأول حالياً: الدور الأول يرحّل الطلبة الناجحين بكل المواد فقط. يوجد 54 طالباً جاهزين غير ناجحين يمنعون تنفيذ هذا الدور.", "solution": "اختر لهم (قيد الانتظار). وفي مجموعة المقررين (3-11) ظهرت الرسالة الثانية، والحل الذي نجح: من إدارة الترحيل في SIS حوّل حالة هؤلاء الطلبة إلى (غير جاهز للترحيل)، ثم رحّل الدور الأول.", "source": "عضو في المجموعة + شرح فيديو", "status": "محلولة", "notes": "طُرح مرتين. الصورة: IMG-20261031-WA0001.jpg الصورة: IMG-20261103-WA0028.jpg", "kind": "problem", "added": "31/10/2026", "updated": "05/11/2026", "tabs": ["stu_promo"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "ترحيل الطلبة"}], "vid": [{"g": "promotion", "i": 0, "name": "ترحيل الطلبة إلى 2026-2027", "step": "نظرة عامة", "text": "بعد تفعيل الدور الثاني في الترحيل صار يُرحَّل الجميع دفعة واحدة: الناجحون والراسبون والمؤجلون.", "note": ""}, {"g": "promotion", "i": 3, "name": "ترحيل الطلبة إلى 2026-2027", "step": "الخطوة 2", "text": "ترحيل الدور الأول في بولونيا يشترط النجاح في كل المواد، وأي طالب لديه مادة متبقية أو مؤجل يمنعه.", "note": ""}]}, {"n": 48, "date": "29/10/2026 11:58 ص", "group": "مسجلو الطلبة", "cat": "معلومات الطلبة وحالة التسجيل", "problem": "طالبة لا يظهر اسمها عند البحث في (معلومات الطلاب) من حساب مسجل الكلية، وتظهر (لا يوجد معلومات الطالب) في كل السنوات. وعند إنشاء طلب إضافة جديد يظهر إشعار بأنها موجودة مسبقاً في التشكيل منذ 2022-2023.", "error": "لا يوجد معلومات الطالب", "solution": "الحل الذي نجح: تصفير الفلتر في صفحة معلومات الطلاب. اقتراحات أخرى طُرحت: البحث في جميع الهياكل بالرقم الامتحاني لأن الاسم قد يكون مكتوباً بصيغة مختلفة، وتسجيل الخروج والدخول، والتأكد من وجودها في خانة الخريجين.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "صاحبة السؤال أكدت أن المشكلة حُلّت بعد تصفير الفلتر.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["stu_info"], "elsewhere": [], "vid": []}, {"n": 50, "date": "29/10/2026 12:17 م", "group": "مجموعة SIS", "cat": "الحسابات وتسجيل الدخول", "problem": "كيف تُستخرج حسابات العاملين على نظام الأقسام الداخلية؟ لا يوجد ما يخصه في نظام الأدوار والصلاحيات (جامعة).", "error": "", "solution": "لم يُجب في المجموعة.", "source": "", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["accounts"], "elsewhere": [], "vid": []}, {"n": 54, "date": "29/10/2026 1:25 م", "group": "مجموعة SIS", "cat": "معلومات الطلبة وحالة التسجيل", "problem": "خاصية (استكمال تسجيل الطلاب) الجديدة تُظهر طلاباً تخرجوا في 2024-2025. وتكررت (2-11): المتخرجون يظهرون في استكمال متطلبات التسجيل بلا سيرة دراسية، ونسبة الترحيل 81.90% مع أن كل الطلبة رُحّلوا.", "error": "", "solution": "الدعم تواصل مع صاحب السؤال على الخاص، ولم يُنشر الحل في المجموعة.", "source": "فريق الدعم + شرح فيديو", "status": "بلا حل", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["stu_complete", "stu_info"], "elsewhere": [], "vid": [{"g": "complete", "i": 0, "name": "استكمال تسجيل الطلاب (سنة الترحيل)", "step": "ما هي الخاصية ولمن", "text": "حسب شرح الخاصية لا يظهر فيها الخريجون ولا المقبولون بعد 2025-2026. ظهور خريجي 2024-2025 يرجّح أن حالتهم لم تُحدَّث إلى متخرج.", "note": ""}, {"g": "poly", "i": 5, "name": "تسجيل طلبة البوليتكنك", "step": "الخطوة 5", "text": "تحقق أن هؤلاء الطلبة حالتهم (متخرج) في إدارة التخرج، فإن لم تكن، حدّث حالة التسجيل إلى متخرج.", "note": "اقتراح مبني على الشرح، ولم يُؤكَّد أنه يحل المشكلة."}]}, {"n": 55, "date": "29/10/2026 3:15 م", "group": "مجموعة SIS", "cat": "التخرج", "problem": "نسبة الإنجاز في إحصائيات الترحيل أقل من المطلوب مع أن كل الطلبة رُحّلوا.", "error": "", "solution": "حرّك المؤشر في جدول الإحصائيات إلى اليمين لترى عدد المقبولين مقابل عدد المرحّلين، والفرق هم من يحتاجون معالجة. إذا كان الفرق هو الخريجين: من حساب مقرر القسم ← إدارة التخرج ← إضافة معدل تراكمي للطلبة، ثم من حساب مسجل الكلية ← إدارة بيانات التخرج ← تغيير الحالة إلى (متخرج). وقيل إن حساب الجامعة يجب أن يضيف الأمر الجامعي بالتخرج.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "صاحب السؤال أكمل الخطوات وبقيت النسبة ناقصة، ثم تواصل معه الدعم على الخاص. الصورة: IMG-20261029-WA0017.jpg", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["stats", "graduation"], "elsewhere": [], "vid": [{"g": "poly", "i": 5, "name": "تسجيل طلبة البوليتكنك", "step": "الخطوة 5", "text": "تحويل الطالب إلى متخرج يكون من إدارة التخرج: اختر الطالب، ثم (تحديث حالة التسجيل) إلى (متخرج).", "note": ""}]}, {"n": 56, "date": "29/10/2026 5:48 م", "group": "مجموعة SIS", "cat": "تعليمات وكتب رسمية", "problem": "تمديد نافذة الترحيل في SIS.", "error": "", "solution": "النافذة مفتوحة من 2026/08/31 إلى 2026/11/07.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["stu_promo"], "elsewhere": [], "vid": []}, {"n": 57, "date": "29/10/2026 6:05 م", "group": "مجموعة SIS + مقررو الأقسام", "cat": "إدارة الامتحانات والنتائج", "problem": "تعذر إنشاء فترة امتحانية للدور الثاني لأن طلبة مؤهلين للمحاولة الثانية ليس لديهم سجل امتحان في الدور الأول. من الحالات: طالب مؤجل، وطلاب راسبون بالغياب، وطلاب أدوا الدور الأول ونجحوا. وفي مجموعة مقرري الأقسام: طالبان (مرحلة ثانية مسائي) أُجّل لهما الكورس الأول وسيرتهما (تأجيل)، والنظام يرفض الدور الثاني لأن لهما مواد بلا سعي أو درجة دفتر. هل تُحذف موادهما؟ وحالة أخرى (1-11): مواد أُضيفت تلقائياً لطلبة ناجحين دور أول بعد إعلان الجاهزية، فتظهر أسماؤهم بخلل وتمنع إنشاء الدور الثاني. هل تُحذف موادهم؟", "error": "تعذر إنشاء الفترة الامتحانية للدور 2 أو إعادة احتسابها، لوجود طلبة مسجلين فيها دون وجود سجل امتحان لهم في الدور 1 / الطالب ليس لديه سجل درجات في الدور الأول", "solution": "ادخل إلى الفترة الامتحانية للدور الأول واضغط تحديث (رفرش) للمواد التي ظهرت عندك، ثم أدخل درجات الدور الأول للطالب أو اجعله غائباً حسب حالته، وبعدها يمكن إضافة الدور الثاني.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "تواصل الدعم أيضاً مع أصحاب السؤال على الخاص. سؤال حذف مواد الطالبين المؤجلين لم يُجب. الصورة: IMG-20261030-WA0009.jpg سؤال حذف المواد المضافة تلقائياً لم يُجب أيضاً.", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026 ليلاً", "tabs": ["stu_promo"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}], "vid": [{"g": "complete", "i": 3, "name": "استكمال تسجيل الطلاب (سنة الترحيل)", "step": "إدارة تسجيل المواد", "text": "للطالب المؤجل الذي له مواد بلا درجات: إدارة تسجيل المواد تسمح بحذف المواد من سيرته، بشرط ألا تكون له نتائج في نظام اللجنة الامتحانية.", "note": "اقتراح مبني على الشرح، ولم يُجرَّب على هذه الحالة."}]}, {"n": 58, "date": "29/10/2026 10:50 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "إحصائيات جاهزية الترحيل لا تتحدث إلا يدوياً من الدعم، وقد تتأخر 17 ساعة أو أكثر، فلا يعرف المستخدم هل نجح تعديله.", "error": "", "solution": "الدعم: سيتم التحديث في أقرب وقت. المستخدمون طلبوا تحديثاً تلقائياً كل ساعة.", "source": "فريق الدعم", "status": "حل جزئي", "notes": "الصورة: IMG-20261029-WA0029.jpg", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["stats"], "elsewhere": [], "vid": []}, {"n": 59, "date": "29/10/2026 11:37 م", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "هل يمكن إلغاء الاستضافة ثم إجراء الترحيل ثم إعادة الاستضافة؟ الاستضافة رُفعت قبل الترحيل (من الدراسة المسائية إلى الصباحية في المعهد والقسم نفسيهما)، والطلاب لا يترحلون.", "error": "", "solution": "الرد: الاستضافة مغلقة ولا يمكن رفع طلب جديد. بعض المستخدمين أُبلغوا بأنه سيُفتح ملحق لاحقاً لرفع طلبات النقل والاستضافة والطلبة الذين لم يدفعوا. سؤال صاحبة المشكلة عن إلغاء الاستضافة من المنصة والاعتماد على الورقي فقط لم يُجب.", "source": "عضو في المجموعة", "status": "بلا حل", "notes": "بانتظار فتح الملحق.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["hosting"], "elsewhere": [], "vid": []}, {"n": 60, "date": "30/10/2026 12:00 ص", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طالب ثُبّت نقله بالخطأ قبل إكمال الترحيل، فتحوّل هيكله إلى الجامعة الجديدة، ولم يعد بالإمكان ترحيله، والكلية الجديدة غير مسؤولة عن ترحيله. الدعم لم يقدّم حلاً.", "error": "", "solution": "حل جرّبه أحد المستخدمين مع جامعة واسط ونجح: إلغاء النقل، ثم إكمال إجراءات الطالب في الكلية الأصلية ورفعها في المنصة، ثم عمل (تغيير جهة قبول). مستخدم آخر سجّل الطالب مباشرة في برنامج دراسي لسنة 2026-2027.", "source": "عضو في المجموعة", "status": "حل مقترح", "notes": "للوقاية: لا تثبّت طلبات النقل من الكلية الناقلة إلا بعد إكمال الترحيل.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["transfer"], "elsewhere": [], "vid": []}, {"n": 61, "date": "30/10/2026 8:31 ص", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طالب نُقل في 2025-2026 إلى جامعة أخرى ثم عاد إلى جامعته الأم. سيرته مرتبطة بهيكل الجامعتين، ولا يظهر خيار اختيار المواد عند إدخال درجاته.", "error": "", "solution": "اجعل معلومات القبول لديكم بحالة (حالي)، وأكمل إجراءاته، ثم أعده (حالي) في جامعته الأم. تعديل حالة معلومات القبول يكون من حساب مسجل الكلية، وإن لم يتوفر فبالتواصل مع الدعم. مستخدمة أخرى بالمشكلة نفسها راسلت الدعم فحذفوا السير الزائدة وانحلت المشكلة.", "source": "فريق الدعم", "status": "محلولة", "notes": "الحل الأول من عضو في المجموعة، والثاني عن طريق الدعم.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["transfer"], "elsewhere": [], "vid": []}, {"n": 62, "date": "30/10/2026 9:46 ص", "group": "مسجلو الطلبة", "cat": "الترحيل", "problem": "الترحيل في الكلية لا يكتمل بسبب طالبة عُمل لها تغيير جهة قبول، وجامعتها الجديدة أكملت ترحيلها.", "error": "", "solution": "اجعل الطالبة (غير جاهز) ثم رحّل. هذه حالة دور ثانٍ، ولا تُرحَّل في الدور الأول.", "source": "عضو في المجموعة", "status": "حل مقترح", "notes": "قريبة منها مشكلة (لا يمكن تنفيذ الدور الأول حالياً) بسبب طلبة منقولين.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["change_adm"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "ترحيل الطلبة"}], "vid": []}, {"n": 63, "date": "30/10/2026 10:45 ص", "group": "مجموعة SIS", "cat": "إدارة الامتحانات والنتائج", "problem": "قسم تحوّل في 2025-2026 من النظام السنوي إلى بولونيا، وبقيت مواد في المرحلة الأولى تولدت من ترحيل 2024-2025، وهي تخفض نسبة الإنجاز في نظام اللجنة الامتحانية.", "error": "", "solution": "لم يُجب في المجموعة.", "source": "شرح فيديو", "status": "حل مقترح", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["courses"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": [{"g": "init", "i": 5, "name": "تهيئة العام الدراسي", "step": "الخطوة 4", "text": "المادة التي لم تعد ضمن البرنامج يُحذف توزيعها أولاً، ثم تُحذف المادة من السنة الدراسية.", "note": "الشرح يتكلم عن حذف مواد 2026-2027 الملغاة، وتطبيقه على مواد 2025-2026 لم يُجرَّب."}]}, {"n": 64, "date": "30/10/2026 12:21 م", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طلبات تغيير جهة القبول معلّقة بانتظار موافقة الكليات الأخرى (أحد المستخدمين لديه 96 طلباً معلقاً).", "error": "", "solution": "تواصل مع الكلية المعنية. إن لم تستجب، أرسل ملف الطلبات إلى الدعم الفني. ملاحظة طُرحت: الطرف الآخر لا يستطيع تأكيد الطلب قبل إكمال موافقة الطالب.", "source": "عضو في المجموعة", "status": "حل مقترح", "notes": "", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["change_adm"], "elsewhere": [], "vid": []}, {"n": 65, "date": "30/10/2026 1:01 م", "group": "مسجلو الطلبة", "cat": "تعليمات وكتب رسمية", "problem": "طلب الكتاب الذي يمنع الموظفين من التقديم على الدراسة المسائية.", "error": "", "solution": "أُرسلت صورة الكتاب: وزارة التعليم العالي، دائرة الدراسات والتخطيط والمتابعة، قسم القبول المركزي، بتاريخ 15/7/2026، بخصوص القبول في الدراسة المسائية، استناداً إلى قرار مجلس الوزراء رقم 11 لسنة 2026.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "الصورة غير واضحة بما يكفي لنقل نصها بدقة، والفئات المشمولة يجب التأكد منها من نص الكتاب نفسه. الصورة: IMG-20261030-WA0004.jpg", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["general"], "elsewhere": [], "vid": []}, {"n": 66, "date": "30/10/2026 2:17 م", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طالب نُقل ووافقت الكلية على نقله، لكنه لم يُرحَّل بعد، والكلية المنقول إليها ترد (الرسالة الأصلية غير واضحة).", "error": "", "solution": "التشخيص: النقل لم يتم بصورة صحيحة. في نافذة النقل، عند فتح التفاصيل يظهر الطالب منقولاً دون تحديد نوع النقل وسنة النقل، وغالباً لأن النقل تم بعد غلق الفترة المسموحة. لذلك يظهر الطالب لديكم لكن برنامجه الدراسي ما زال على جامعته السابقة، فلا توجد صلاحية تغيير أو إضافة.", "source": "عضو في المجموعة", "status": "حل جزئي", "notes": "التشخيص واضح، لكن لم يُذكر الإجراء المطلوب. الأرجح التواصل مع الدعم.", "kind": "problem", "added": "31/10/2026", "updated": "", "tabs": ["transfer"], "elsewhere": [], "vid": []}, {"n": 67, "date": "30/10/2026 3:31 م", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "الطالب المؤجل أو الغائب سنة دراسية كاملة: هل يظهر في الترحيل أم يُترك؟ وهل يُرحَّل كل الطلبة؟", "error": "", "solution": "الدعم: يُحدَّد ذلك من السيرة الدراسية للطالب، وتُجعل حالة الترحيل لهؤلاء (قيد الانتظار) فيبقى الطالب في سنته الحالية. رأي عضو: يُرحَّل جميع الطلبة إلى 2026-2027 حتى المرقنين والمنقولين والراسبين والمؤجلين، ثم تُحذف سيرة وبرنامج 2026-2027 للمرقنين والمنقولين.", "source": "فريق الدعم + شرح فيديو", "status": "محلولة", "notes": "بعد تفعيل الترحيل بالدور الثاني صار الترحيل يشمل الناجحين والراسبين والمؤجلين معاً، وتُنشأ للراسب والمؤجل سيرة في المرحلة نفسها (انظر شرح ترحيل الطلبة).", "kind": "info", "added": "31/10/2026", "updated": "03/11/2026 مساءً", "tabs": ["stu_promo"], "elsewhere": [], "vid": [{"g": "promotion", "i": 4, "name": "ترحيل الطلبة إلى 2026-2027", "step": "النتيجة حسب النظام", "text": "الترحيل بالدور الثاني يشمل الجميع، وتُنشأ للطالب الراسب أو المؤجل سيرة في المرحلة نفسها.", "note": ""}]}, {"n": 68, "date": "30/10/2026 5:06 م", "group": "مجموعة SIS", "cat": "معلومات الطلبة وحالة التسجيل", "problem": "ما الفرق بين إلغاء القبول وترقين القيد؟ (شرح عضو)", "error": "", "solution": "إلغاء القبول يكون في السنة الأولى ولا يُرحَّل: لعدم المباشرة بعد عشرة أيام من بدء الدوام، أو لعدم جلب الوثيقة حتى الشهر الخامس تقريباً (وقد تمدد الوزارة)، أو للتزوير بعد طلب صحة الصدور. ترقين القيد: بطلب الطالب في أي سنة، أو للوفاة مع الاحتفاظ بالسجل، أو للرسوب في مواد التحميل للمرة الثانية، أو للرسوب سنتين متتاليتين، أو لتجاوز السقف الزمني (خصوصاً في بولونيا والمقررات).", "source": "عضو في المجموعة", "status": "محلولة", "notes": "شرح من عضو وليس تعليمات رسمية. اقترح أيضاً تسميات للنتائج في بولونيا والمقررات: ناجح، ناجح مؤهل للانتقال، مؤهل للانتقال.", "kind": "info", "added": "31/10/2026", "updated": "", "tabs": ["stu_info"], "elsewhere": [], "vid": []}, {"n": 70, "date": "31/10/2026 10:26 ص", "group": "مسجلو الطلبة", "cat": "المواد وقوائم الدرجات", "problem": "كيف تتغير (الحالة النهائية للنتيجة) للمادة من (قيد الدراسة) إلى (قيد الانتظار)؟ المواد لسنة 2026-2027. ثلاثة طلاب بهذه الحالة لم تظهر أسماؤهم عند توليد قوائم درجات المرحلة الثانية، الكورس الأول.", "error": "", "solution": "تبقى المادة (قيد الدراسة) وتتغير عند رفع النتيجة النهائية للكورس. رد آخر: تتغير عند توليد قوائم الدرجات. سبب عدم ظهور الطلاب الثلاثة في القوائم لم يُحل. لاحقاً رجّح عضو أن هؤلاء الطلاب غير مُدخلين في الامتحان أو ليس لهم درجات فيه، وقال إن النظام لا يربط المواد بالسير تلقائياً.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل جزئي", "notes": "صاحب السؤال أوضح أن الترحيل ربط المواد بالسير تلقائياً، وأن المشكلة ظهرت عند توليد قوائم الدرجات. الصورة: IMG-20261031-WA0004.jpg", "kind": "problem", "added": "31/10/2026", "updated": "03/11/2026", "tabs": ["courses", "stu_complete"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": [{"g": "complete", "i": 3, "name": "استكمال تسجيل الطلاب (سنة الترحيل)", "step": "إدارة تسجيل المواد", "text": "إذا كانت المواد غير مربوطة بسير هؤلاء الطلاب، فإدارة تسجيل المواد في خاصية استكمال التسجيل تضيفها إلى السيرة، ما دام الطالب بلا نتائج مسجلة.", "note": "اقتراح مبني على الشرح."}]}, {"n": 72, "date": "31/10/2026 11:53 ص", "group": "مجموعة SIS", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "هل ما زال إلغاء القبول مطلوباً مع النظام الجديد لاختيار القبول؟ (طالب قُبل في أكثر من جهة، مباشر وغير مباشر)", "error": "", "solution": "في منصة (قدم) تظهر للطالب جميع قبولاته، ويحق له تثبيت قبول واحد فقط، فتتحول بقية القبولات إلى (ملغاة) ويصبح القبول المثبت هو الحالي وينتقل إلى نظام معلومات الطلبة. هذا لقبولات 2026-2027 فقط، أما السنوات السابقة فتُعالج بتغيير جهة القبول.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "سُئل أيضاً عن رفع براءة ذمة للكليات الأهلية والمسائية قبل التغيير، ولم يُجب.", "kind": "info", "added": "01/11/2026", "updated": "", "tabs": ["change_adm"], "elsewhere": [], "vid": []}, {"n": 73, "date": "31/10/2026 1:13 م", "group": "مجموعة SIS", "cat": "معلومات الطلبة وحالة التسجيل", "problem": "الدراسات العليا: كيف يُضاف طالب قادم من جهة أخرى، وكيف يُضاف الطلبة الأوائل؟ (شرح عضو)", "error": "", "solution": "في الدراسات العليا لا يظهر الطالب في تغيير جهات القبول، بل يُضاف من (المؤهلات الأكاديمية السابقة) بوضع الرقم الموحد مكان الرقم الامتحاني ثم الإضافة. الطلبة الأوائل لا يُضافون إلا بعد تخرجهم: كلية الطالب تضيف معدله ثم يوافق مدير الكلية، وبعدها يمكن إضافته في الدراسات العليا لدى الجهة الأخرى.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "شرح من عضو وليس تعليمات رسمية.", "kind": "info", "added": "01/11/2026", "updated": "", "tabs": ["stu_info"], "elsewhere": [], "vid": []}, {"n": 75, "date": "31/10/2026 4:07 م", "group": "مسجلو الطلبة + مجموعة SIS", "cat": "IQ Learn", "problem": "الطلبة لا يظهرون في IQ Learn مع أن العمل في SIS اكتمل 100%.", "error": "", "solution": "اربط طلبة 2026-2027 بمواد السنة الدراسية 2026-2027، ثم أدخلهم في الشعب والمجاميع الدراسية، فيظهرون تلقائياً في IQ Learn. ويجب أيضاً إضافة الجدول الأسبوعي.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "في مجموعة مسجلي الطلبة تبيّن أن الجدول الأسبوعي لم يكن مضافاً عند صاحب السؤال.", "kind": "problem", "added": "01/11/2026", "updated": "03/11/2026 مساءً", "tabs": ["sections"], "elsewhere": [{"sys": "منصة IQ Learn", "tab": "ظهور الطلبة والربط مع SIS"}], "vid": [{"g": "postpromo", "i": 0, "name": "إجراءات ما بعد الترحيل", "step": "الترتيب", "text": "بعد الترحيل: القاعات، ثم الشعب والمجاميع، ثم توزيع الطلبة على الشعب، ثم تسجيل طلبة بولونيا على المواد، ثم الجدول الأسبوعي ونشره. بعدها تظهر المواد والطلبة في IQ Learn.", "note": ""}]}, {"n": 76, "date": "31/10/2026 5:34 م", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "طلبة مستضافون من الدراسة المسائية إلى الصباحية: بعد الترحيل النهائي وتغيير برنامجهم إلى الصباحي، اختفت أسماؤهم من سجل درجات السنة السابقة في نظام الدرجات، مع بقاء معلوماتهم في SIS.", "error": "", "solution": "حسب التعليمات لا يُوافق على الاستضافة ولا تُثبَّت إلا بعد إكمال الترحيل النهائي لعام 2025/2026. إجراء الاستضافة (تسكين الطالب): من ملف الطالب ← معلومات القبول ← زر (البرنامج الدراسي)، اختر السنة الدراسية والبرنامج المستضاف فيه ثم احفظ، فتظهر حالة المعلومات (استضافة في نوع دراسة مختلف). رأي عضو: الطالب يبقى على قبوله المسائي لأن امتحاناته ونتائجه تُثبت على المسائي.", "source": "عضو في المجموعة", "status": "حل جزئي", "notes": "صاحب السؤال كان قد أكمل الترحيل قبل الاستضافة، وسبب اختفاء الأسماء من سجل الدرجات لم يُحل. الصورة: IMG-20261031-WA0016.jpg", "kind": "problem", "added": "01/11/2026", "updated": "", "tabs": ["hosting"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "قوائم درجات الطلاب"}], "vid": []}, {"n": 77, "date": "31/10/2026 6:42 م", "group": "مسجلو الطلبة", "cat": "النقل والاستضافة وتغيير جهة القبول", "problem": "الطلبة الذين صدرت لهم أوامر إدارية بالنقل إلى جامعة أخرى: متى يُثبَّت النقل؟", "error": "", "solution": "بعد الترحيل من القسمين المتناظرين (الناقل والمنقول إليه). وأكدت الورشة الوزارية: الموافقة الأولى على الطلب، ولا تثبيت نهائي إلا بعد إكمال كل نتائج الطالب وسيرته الدراسية في الكلية الأصلية.", "source": "عضو في المجموعة", "status": "محلولة", "notes": "يوافق ما ذُكر في مشكلة الطالب الذي ثُبّت نقله بالخطأ قبل الترحيل.", "kind": "info", "added": "01/11/2026", "updated": "03/11/2026 مساءً", "tabs": ["transfer"], "elsewhere": [], "vid": []}, {"n": 78, "date": "31/10/2026 9:31 م", "group": "مقررو الأقسام", "cat": "المواد وقوائم الدرجات", "problem": "طالب درجته 50 يظهر راسباً ويُحوَّل إلى الدور الثاني. السبب أن (أقل درجة للنجاح) في إعدادات المادة كانت 51، والحقل باهت ولا يقبل التعديل.", "error": "", "solution": "الطريقة التي طُرحت: من إدارة الامتحانات احذف قيد الطلاب من امتحان هذه المادة، ثم من SIS احذف تسجيلهم على المادة، وعدّل أقل درجة للنجاح إلى 50، ثم ولّد قوائم الدرجات من جديد (ستعود السعيات)، ثم ارجع للامتحان واعمل (إعادة احتساب) وأضف النهائي.", "source": "عضو في المجموعة + شرح فيديو", "status": "حل مقترح", "notes": "الطريقة للمادة المعنية فقط، ولم يؤكد صاحب السؤال نجاحها. للوقاية: راجع أقل درجة للنجاح عند إضافة المادة.", "kind": "problem", "added": "01/11/2026", "updated": "02/11/2026", "tabs": ["courses"], "elsewhere": [{"sys": "نظام اللجنة الامتحانية", "tab": "إدارة الامتحانات (الفترات الامتحانية)"}], "vid": [{"g": "build", "i": 11, "name": "الدليل الشامل: البرنامج والقاعات", "step": "المواد الدراسية للبرنامج", "text": "عند إضافة المادة يكون نوع النتيجة درجة من 100 والدرجة الصغرى للنجاح 50، فراجع هذا الحقل قبل ربط الطلاب بالمادة.", "note": ""}]}, {"n": 79, "date": "01/11/2026 9:08 ص", "group": "مجموعة SIS", "cat": "الترحيل", "problem": "عند إعلان جاهزية القسم للترحيل تظهر رسالة خطأ.", "error": "خطأ في القسم: الهيكل ال const GUIDES = [{"id": "promotion", "short": "ترحيل الطلبة (الدور الثاني)", "title": "ترحيل الطلبة إلى 2026-2027", "subtitle": "جاهزية في نظام SIS، ثم تنفيذ الترحيل بالدور الثاني في نظام اللجنة الامتحانية", "source": "أُعدّ من فيديو: ترحيل الطلبة من 2025-2026 إلى 2026-2027 (4 دقائق تقريباً)، ومن الورشة الوزارية 21-9-2026، ومن فيديو: التراجع عن التهيئة وإعلان جاهزية القسم للترحيل", "sections": [{"title": "نظرة عامة", "time": "00:25", "html": "<p>فُعّل خيار <strong>الدور الثاني<\/strong> في الترحيل، فصار يُرحَّل الطلبة جميعاً دفعة واحدة: الناجحون والراسبون والمؤجلون. سابقاً كان الترحيل للناجحين فقط.<\/p><div class=\"tw\"><table><tr><th>#<\/th><th>الخطوة<\/th><th>النظام والحساب<\/th><\/tr><tr><td>1<\/td><td>مطابقة النتائج مع الماستر شيت<\/td><td>نظام اللجنة الامتحانية<\/td><\/tr><tr><td>2<\/td><td>تغيير حالة الطلبة إلى جاهز للترحيل<\/td><td>SIS، مقرر القسم، إدارة الترحيل<\/td><\/tr><tr><td>3<\/td><td>ترحيل الطلاب بالدور الثاني<\/td><td>نظام اللجنة الامتحانية (GB)<\/td><\/tr><tr><td>4<\/td><td>مراجعة السير الجديدة<\/td><td>SIS<\/td><\/tr><\/table><\/div>", "text": "فُعّل خيار الدور الثاني في الترحيل، فصار يُرحَّل الطلبة جميعاً دفعة واحدة: الناجحون والراسبون والمؤجلون. سابقاً كان الترحيل للناجحين فقط. # الخطوة النظام والحساب 1 مطابقة النتائج مع الماستر شيت نظام اللجنة الامتحانية 2 تغيير حالة الطلبة إلى جاهز للترحيل SIS، مقرر القسم، إدارة الترحيل 3 ترحيل الطلاب بالدور الثاني نظام اللجنة الامتحانية (GB) 4 مراجعة السير الجديدة SIS"}, {"title": "قبل البدء", "time": "01:06", "html": "<blockquote><p><strong>◂<\/strong> طابق نتائج الطلبة مع الماستر شيت في نظام اللجنة الامتحانية، حسب نظام القسم: بولونيا أو سنوي أو فصلي أو مقررات.<\/p><p><strong>◂<\/strong> في النظام الفصلي تُضاف مواد المرحلة ومواد العبور تلقائياً عند الترحيل، فجهّز المواد وكلّف التدريسيين قبل الترحيل.<\/p><\/blockquote><blockquote><p><strong>الأفضل:<\/strong> أكمل معلومات كل مواد 2026-2027 (الوحدات وتكليف التدريسيين) قبل الترحيل، لأن الترحيل يربط الطلبة بها.<\/p><\/blockquote>", "text": "◂ طابق نتائج الطلبة مع الماستر شيت في نظام اللجنة الامتحانية، حسب نظام القسم: بولونيا أو سنوي أو فصلي أو مقررات. ◂ في النظام الفصلي تُضاف مواد المرحلة ومواد العبور تلقائياً عند الترحيل، فجهّز المواد وكلّف التدريسيين قبل الترحيل. الأفضل: أكمل معلومات كل مواد 2026-2027 (الوحدات وتكليف التدريسيين) قبل الترحيل، لأن الترحيل يربط الطلبة بها."}, {"title": "الخطوة 1: الجاهزية في SIS", "time": "01:20", "html": "<blockquote><p><strong>1.<\/strong> ادخل SIS بحساب مقرر القسم وافتح <strong>إدارة الترحيل<\/strong>.<\/p><p><strong>2.<\/strong> حدد جميع الطلبة.<\/p><p><strong>3.<\/strong> من <strong>الإجراءات<\/strong> اختر <strong>تغيير حالة الترحيل<\/strong> إلى <strong>جاهز للترحيل<\/strong>، ثم تأكيد.<\/p><\/blockquote><blockquote><p><strong>من الورشة الوزارية:<\/strong> إعلان جاهزية القسم يرفع نسبة الإنجاز إلى 67%، وتُنقل البيانات إلى نظام اللجنة الامتحانية.<\/p><\/blockquote><p><strong>إعلان جاهزية القسم للترحيل<\/strong> (زر في إدارة الترحيل بجانب زر التهيئة):<\/p><blockquote><p><strong>1.<\/strong> اضغط <strong>إعلان جاهزية القسم للترحيل<\/strong>.<\/p><p><strong>2.<\/strong> أدخل كلمة المرور وأكّد.<\/p><p><strong>3.<\/strong> تصبح نسبة الإنجاز <strong>67%<\/strong>.<\/p><\/blockquote><p>يمكن إعلان الجاهزية قبل انتهاء امتحانات الدور الثاني. ويمكن أيضاً الانتظار حتى تنتهي، ثم تحويل الطلبة كلهم إلى (جاهز للترحيل) وترحيلهم مرة واحدة.<\/p><blockquote><p><strong>من المجموعة:<\/strong> إذا ظهرت رسالة <strong>(خطأ في القسم: الهيكل التنظيمي ليس قسماً)<\/strong> فأنت داخل بحساب ليس حساب قسم. الترحيل وإعلان الجاهزية يتمّان من حساب <strong>مقرر القسم<\/strong>.<\/p><\/blockquote>", "text": "1. ادخل SIS بحساب مقرر القسم وافتح إدارة الترحيل . 2. حدد جميع الطلبة. 3. من الإجراءات اختر تغيير حالة الترحيل إلى جاهز للترحيل ، ثم تأكيد. من الورشة الوزارية: إعلان جاهزية القسم يرفع نسبة الإنجاز إلى 67%، وتُنقل البيانات إلى نظام اللجنة الامتحانية. إعلان جاهزية القسم للترحيل (زر في إدارة الترحيل بجانب زر التهيئة): 1. اضغط إعلان جاهزية القسم للترحيل . 2. أدخل كلمة المرور وأكّد. 3. تصبح نسبة الإنجاز 67% . يمكن إعلان الجاهزية قبل انتهاء امتحانات الدور الثاني. ويمكن أيضاً الانتظار حتى تنتهي، ثم تحويل الطلبة كلهم إلى (جاهز للترحيل) وترحيلهم مرة واحدة. من المجموعة: إذا ظهرت رسالة (خطأ في القسم: الهيكل التنظيمي ليس قسماً) فأنت داخل بحساب ليس حساب قسم. الترحيل وإعلان الجاهزية يتمّان من حساب مقرر القسم ."}, {"title": "الخطوة 2: الترحيل في نظام اللجنة الامتحانية", "time": "01:55", "html": "<blockquote><p><strong>1.<\/strong> ادخل نظام اللجنة الامتحانية (GB) واختر <strong>ترحيل الطلاب<\/strong>.<\/p><p><strong>2.<\/strong> حدد <strong>الدور الثاني<\/strong>.<\/p><p><strong>3.<\/strong> تظهر إحصائية: المنتقلون لمرحلة أعلى، والباقون في مرحلتهم، والمؤهلون للتخرج.<\/p><p><strong>4.<\/strong> اضغط <strong>تأكيد<\/strong>.<\/p><\/blockquote><blockquote><p><strong>الفلاتر في واجهة ترحيل الطلاب:<\/strong> حدد <strong>البرنامج<\/strong> و<strong>النظام الدراسي<\/strong> (فصلي أو بولونيا) و<strong>الدراسة<\/strong> (صباحي أو مسائي) بدقة، وإلا لن يظهر الطلبة.<\/p><\/blockquote><blockquote><p><strong>بولونيا والدور الأول:<\/strong> ترحيل الدور الأول يشترط أن يكون الطالب ناجحاً في <strong>كل<\/strong> المواد. وجود طالب لديه مادة متبقية أو طالب مؤجل ضمن المحددين يمنع الترحيل وتظهر رسالة. لذلك حدد في SIS الناجحين تماماً فقط، أو انتظر نتائج الدور الثاني وأرحّل الجميع.<\/p><\/blockquote>", "text": "1. ادخل نظام اللجنة الامتحانية (GB) واختر ترحيل الطلاب . 2. حدد الدور الثاني . 3. تظهر إحصائية: المنتقلون لمرحلة أعلى، والباقون في مرحلتهم، والمؤهلون للتخرج. 4. اضغط تأكيد . الفلاتر في واجهة ترحيل الطلاب: حدد البرنامج و النظام الدراسي (فصلي أو بولونيا) و الدراسة (صباحي أو مسائي) بدقة، وإلا لن يظهر الطلبة. بولونيا والدور الأول: ترحيل الدور الأول يشترط أن يكون الطالب ناجحاً في كل المواد. وجود طالب لديه مادة متبقية أو طالب مؤجل ضمن المحددين يمنع الترحيل وتظهر رسالة. لذلك حدد في SIS الناجحين تماماً فقط، أو انتظر نتائج الدور الثاني وأرحّل الجميع."}, {"title": "النتيجة حسب النظام التعليمي", "time": "02:30", "html": "<p>بعد الترحيل تُنشأ لكل طالب سيرة دراسية جديدة للفصل الأول 2026-2027.<\/p><div class=\"tw\"><table><tr><th>النظام<\/th><th>ما يحدث<\/th><\/tr><tr><td>الفصلي<\/td><td>تُضاف مواد المرحلة ومواد العبور تلقائياً مع التأشير عليها. الراسب أو المؤجل تُنشأ له سيرة في المرحلة نفسها.<\/td><\/tr><tr><td>بولونيا<\/td><td>تُنشأ السيرة فقط، وتسجيل المواد يتم بعدها وفق دليل مسار بولونيا.<\/td><\/tr><tr><td>السنوي وبقية الأنظمة<\/td><td>يربط النظام الطلاب الناجحين بمواد مراحلهم تلقائياً.<\/td><\/tr><\/table><\/div><blockquote><p><strong>اختلاف بين الفيديوهات:<\/strong> فيديو الترحيل يذكر أن طالب بولونيا يسجل بنفسه على المواد، وفيديو ما بعد الترحيل يجعل تسجيلهم على المواد ومواد المحاولات من عمل القسم.<\/p><\/blockquote><div class=\"tw\"><table><tr><th>الحالة<\/th><th>بولونيا<\/th><th>الفصلي القديم<\/th><\/tr><tr><td>طالب لديه مواد في الدور الثاني<\/td><td>يظهر (ناجح دور أول) إذا كان تقييمه التكويني 14 فأكثر، ويُعد مؤهلاً للمرحلة الأعلى<\/td><td>يظهر (راسب)<\/td><\/tr><\/table><\/div>", "text": "بعد الترحيل تُنشأ لكل طالب سيرة دراسية جديدة للفصل الأول 2026-2027. النظام ما يحدث الفصلي تُضاف مواد المرحلة ومواد العبور تلقائياً مع التأشير عليها. الراسب أو المؤجل تُنشأ له سيرة في المرحلة نفسها. بولونيا تُنشأ السيرة فقط، وتسجيل المواد يتم بعدها وفق دليل مسار بولونيا. السنوي وبقية الأنظمة يربط النظام الطلاب الناجحين بمواد مراحلهم تلقائياً. اختلاف بين الفيديوهات: فيديو الترحيل يذكر أن طالب بولونيا يسجل بنفسه على المواد، وفيديو ما بعد الترحيل يجعل تسجيلهم على المواد ومواد المحاولات من عمل القسم. الحالة بولونيا الفصلي القديم طالب لديه مواد في الدور الثاني يظهر (ناجح دور أول) إذا كان تقييمه التكويني 14 فأكثر، ويُعد مؤهلاً للمرحلة الأعلى يظهر (راسب)"}, {"title": "التراجع (التهيئة، والجاهزية، والترحيل)", "time": "", "html": "<p><strong>التراجع عن تهيئة السنة الدراسية:<\/strong> زر جديد في <strong>إدارة الترحيل<\/strong>. استعمله إذا هيّأت 2026-2027 ثم اكتشفت خطأ، مثل مادة ناقصة عند طالب أو طالب ناقص. تراجع، وصحّح، ثم هيّئ من جديد.<\/p><p>حسب الورشة الوزارية: يمكن التراجع عن الجاهزية والترحيل لطالب محدد أو للقسم كاملاً من حساب اللجنة الامتحانية، لإصلاح الأخطاء.<\/p><blockquote><p><strong>انظر أيضاً:<\/strong> شرح (تصحيح درجات طالب بعد الإعلان أو الترحيل) في دليل نظام اللجنة الامتحانية.<\/p><\/blockquote><blockquote><p><strong>التراجع عن الترحيل:<\/strong> يعيد الطالب إلى مرحلته السابقة ويحذف المواد التي سُجّلت له تلقائياً مع الترحيل (من الورشة الوزارية 23-9-2026).<\/p><\/blockquote>", "text": "التراجع عن تهيئة السنة الدراسية: زر جديد في إدارة الترحيل . استعمله إذا هيّأت 2026-2027 ثم اكتشفت خطأ، مثل مادة ناقصة عند طالب أو طالب ناقص. تراجع، وصحّح، ثم هيّئ من جديد. حسب الورشة الوزارية: يمكن التراجع عن الجاهزية والترحيل لطالب محدد أو للقسم كاملاً من حساب اللجنة الامتحانية، لإصلاح الأخطاء. انظر أيضاً: شرح (تصحيح درجات طالب بعد الإعلان أو الترحيل) في دليل نظام اللجنة الامتحانية. التراجع عن الترحيل: يعيد الطالب إلى مرحلته السابقة ويحذف المواد التي سُجّلت له تلقائياً مع الترحيل (من الورشة الوزارية 23-9-2026)."}, {"title": "بعد الترحيل", "time": "", "html": "<p>القاعات والشعب وتوزيع الطلبة وتسجيل مواد بولونيا والجدول الأسبوعي: في شرح (إجراءات ما بعد الترحيل).<\/p>", "text": "القاعات والشعب وتوزيع الطلبة وتسجيل مواد بولونيا والجدول الأسبوعي: في شرح (إجراءات ما بعد الترحيل)."}], "tabs": ["stu_promo", "stats"], "added": "03/11/2026 مساءً", "updated": "03/11/2026 ليلاً"}, {"id": "postpromo", "short": "إجراءات ما بعد الترحيل", "title": "إجراءات ما بعد الترحيل لتفعيل الدراسة على IQ Learn", "subtitle": "القاعات، والشعب، وتوزيع الطلبة، وتسجيل طلبة بولونيا على المواد، والجدول الأسبوعي", "source": "أُعدّ من فيديو: الإجراءات المطلوبة بعد ترحيل الطلبة للعام 2026-2027 (13 دقيقة تقريباً)", "sections": [{"title": "الترتيب", "time": "00:45", "html": "<div class=\"tw\"><table><tr><th>#<\/th><th>الإجراء<\/th><th>الحساب<\/th><\/tr><tr><td>1<\/td><td>إضافة القاعات الدراسية<\/td><td>مدير القسم<\/td><\/tr><tr><td>2<\/td><td>إضافة الشعب والمجاميع<\/td><td>مقرر القسم<\/td><\/tr><tr><td>3<\/td><td>توزيع الطلبة على الشعب<\/td><td>مقرر القسم<\/td><\/tr><tr><td>4<\/td><td>تسجيل طلبة بولونيا على المواد ومواد المحاولات<\/td><td>مقرر القسم<\/td><\/tr><tr><td>5<\/td><td>الجدول الأسبوعي لكل المراحل<\/td
