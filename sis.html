على البكالوريوس. لكي يُنقل هذا الطالب\nفي النظام دون انقطاع في سيرته الدراسية، يُنشأ للبكالوريوس برنامج تكميلي\nمرتبط ببرنامج الدبلوم، ولا يُنشأ برنامج بكالوريوس منفصل. الخطوات أدناه بالترتيب الذي جاءت به في الفيديو، ومع\nكل خطوة توقيتها التقريبي. تنبيه مهم: الكليات التي أنشأت برنامج\nبكالوريوس منفصلاً لن تستطيع ربط خريجي الدبلوم به. هذه البرامج يجب حذفها\nواعتماد آلية البرنامج التكميلي بدلاً منها."}, {"title": "الخطوة 1: إنشاء برنامج الدبلوم", "time": "00:45", "html": "<p>يُنشأ من صفحة البرامج الدراسية بالطريقة المعتادة. أغلب\nالكليات أنشأته مسبقاً، فيكفي التأكد من صحة إعداداته:<\/p><blockquote>\n<p><strong>1.<\/strong> اختيار السنة الدراسية (مثلاً\n2025-2026) ونظام التعليم (مثلاً فصلي) ونوع الدراسة.<\/p>\n<p><strong>2.<\/strong> نوع البرنامج: <strong>جامعية\nأولية<\/strong>.<\/p>\n<p><strong>3.<\/strong> الشهادة الممنوحة:\n<strong>دبلوم<\/strong> (حقل إلزامي لهذه الآلية).<\/p>\n<p><strong>4.<\/strong> إدخال رمز البرنامج ثم الضغط على\nإضافة.<\/p>\n<\/blockquote><p>برنامج الدبلوم لا يقبل إلا المرحلة الأولى والثانية،\nولا يمكن أن تُضاف إليه مرحلة ثالثة أو رابعة.<\/p>", "text": "يُنشأ من صفحة البرامج الدراسية بالطريقة المعتادة. أغلب\nالكليات أنشأته مسبقاً، فيكفي التأكد من صحة إعداداته: 1. اختيار السنة الدراسية (مثلاً\n2025-2026) ونظام التعليم (مثلاً فصلي) ونوع الدراسة. 2. نوع البرنامج: جامعية\nأولية . 3. الشهادة الممنوحة: دبلوم (حقل إلزامي لهذه الآلية). 4. إدخال رمز البرنامج ثم الضغط على\nإضافة. برنامج الدبلوم لا يقبل إلا المرحلة الأولى والثانية،\nولا يمكن أن تُضاف إليه مرحلة ثالثة أو رابعة."}, {"title": "الخطوة 2: إنشاء البرنامج التكميلي", "time": "02:19", "html": "<blockquote>\n<p><strong>1.<\/strong> فتح برنامج الدبلوم من البرامج\nالدراسية، واختيار <strong>إنشاء برنامج تكميلي<\/strong>. هذا الخيار يظهر\nلكليات البوليتكنك فقط.<\/p>\n<p><strong>2.<\/strong> مراجعة الحقول الثابتة التي ينقلها\nالنظام من برنامج الدبلوم (الجدول أدناه).<\/p>\n<p><strong>3.<\/strong> إدخال الحقول المتغيرة الخاصة\nبالبرنامج التكميلي.<\/p>\n<p><strong>4.<\/strong> إدخال تفاصيل التدريب الصيفي إن\nوُجد، ثم الضغط على إضافة.<\/p>\n<\/blockquote><p><strong>شروط ظهور الخيار:<\/strong> أن يكون البرنامج\nالأصلي من نوع دبلوم، وأن يحتوي على مرحلتين فقط. إذا كان النوع غير محدد\nأو خاطئاً، أو كان عدد المراحل غير مرحلتين، يُعدَّل البرنامج الأصلي\nأولاً.<\/p><div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>حقول ثابتة (تُؤخذ من برنامج\nالدبلوم)<\/strong><\/th>\n<th><strong>حقول متغيرة (تُدخل لكل\nسنة)<\/strong><\/th>\n<\/tr>\n<tr>\n<th>الهيكل التنظيمي<\/th>\n<th>اسم البرنامج بالعربية<\/th>\n<\/tr>\n<tr>\n<th>السنة الدراسية<\/th>\n<th>اسم البرنامج بالإنجليزية<\/th>\n<\/tr>\n<tr>\n<th>نظام التعليم<\/th>\n<th>رمز البرنامج<\/th>\n<\/tr>\n<tr>\n<th>نوع القبول<\/th>\n<th>الطاقة الاستيعابية<\/th>\n<\/tr>\n<tr>\n<th>نوع الدراسة (صباحي يبقى صباحي)<\/th>\n<th>منسق البرنامج<\/th>\n<\/tr>\n<tr>\n<th>نوع البرنامج: جامعية أولية<\/th>\n<th>مدير البرنامج<\/th>\n<\/tr>\n<tr>\n<th>الشهادة الممنوحة: بكالوريوس<\/th>\n<th>التدريب الصيفي والتفاصيل الأخرى<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div><p>بعد الإضافة يظهر البرنامجان في القائمة متتاليين\nوبينهما علامة ربط: الدبلوم أولاً ثم التكميلي. مراحل البرنامج التكميلي هي\nالثالثة والرابعة، ويمكن أن تُضاف إليه الخامسة والسادسة عند\nالحاجة.<\/p><blockquote>\n<p><strong>ملاحظة:<\/strong> أي خطأ في بيانات الحقول\nالثابتة يُصحَّح من برنامج الدبلوم نفسه قبل إنشاء البرنامج التكميلي، لأنها\nلا تُعدَّل من داخل التكميلي.<\/p>\n<\/blockquote>", "text": "1. فتح برنامج الدبلوم من البرامج\nالدراسية، واختيار إنشاء برنامج تكميلي . هذا الخيار يظهر\nلكليات البوليتكنك فقط. 2. مراجعة الحقول الثابتة التي ينقلها\nالنظام من برنامج الدبلوم (الجدول أدناه). 3. إدخال الحقول المتغيرة الخاصة\nبالبرنامج التكميلي. 4. إدخال تفاصيل التدريب الصيفي إن\nوُجد، ثم الضغط على إضافة. شروط ظهور الخيار: أن يكون البرنامج\nالأصلي من نوع دبلوم، وأن يحتوي على مرحلتين فقط. إذا كان النوع غير محدد\nأو خاطئاً، أو كان عدد المراحل غير مرحلتين، يُعدَّل البرنامج الأصلي\nأولاً. حقول ثابتة (تُؤخذ من برنامج\nالدبلوم) حقول متغيرة (تُدخل لكل\nسنة) الهيكل التنظيمي اسم البرنامج بالعربية السنة الدراسية اسم البرنامج بالإنجليزية نظام التعليم رمز البرنامج نوع القبول الطاقة الاستيعابية نوع الدراسة (صباحي يبقى صباحي) منسق البرنامج نوع البرنامج: جامعية أولية مدير البرنامج الشهادة الممنوحة: بكالوريوس التدريب الصيفي والتفاصيل الأخرى بعد الإضافة يظهر البرنامجان في القائمة متتاليين\nوبينهما علامة ربط: الدبلوم أولاً ثم التكميلي. مراحل البرنامج التكميلي هي\nالثالثة والرابعة، ويمكن أن تُضاف إليه الخامسة والسادسة عند\nالحاجة. ملاحظة: أي خطأ في بيانات الحقول\nالثابتة يُصحَّح من برنامج الدبلوم نفسه قبل إنشاء البرنامج التكميلي، لأنها\nلا تُعدَّل من داخل التكميلي."}, {"title": "الخطوة 3: تسجيل الطلبة في برنامج الدبلوم", "time": "06:23", "html": "<blockquote>\n<p><strong>1.<\/strong> الدخول إلى <strong>معلومات\nالطلاب<\/strong> والبحث عن الطلبة غير المسجلين في برامج\nدراسية.<\/p>\n<p><strong>2.<\/strong> تحديد الطلبة المطلوبين (في\nالفيديو اختير أول 10 طلاب).<\/p>\n<p><strong>3.<\/strong> تسجيلهم في برنامج الدبلوم للعام\n2025-2026.<\/p>\n<p><strong>4.<\/strong> من <strong>طلاب البرنامج\nالدراسي<\/strong> يمكن إضافة سيرة دراسية لهم، مثلاً على المرحلة\nالأولى.<\/p>\n<\/blockquote>", "text": "1. الدخول إلى معلومات\nالطلاب والبحث عن الطلبة غير المسجلين في برامج\nدراسية. 2. تحديد الطلبة المطلوبين (في\nالفيديو اختير أول 10 طلاب). 3. تسجيلهم في برنامج الدبلوم للعام\n2025-2026. 4. من طلاب البرنامج\nالدراسي يمكن إضافة سيرة دراسية لهم، مثلاً على المرحلة\nالأولى."}, {"title": "الخطوة 4: إضافة سيرة دراسية على المرحلة الأخيرة", "time": "07:10", "html": "<p>خيار <strong>تسجيل الطلاب في البرنامج\nالتكميلي<\/strong> موجود في صفحة طلاب البرنامج الدراسي، لكنه يبقى غير\nمفعّل ما لم يكن للطالب سيرة دراسية على المرحلة الأخيرة من الدبلوم\n(المرحلة الثانية).<\/p><blockquote>\n<p><strong>1.<\/strong> فتح ملف الطالب، أو استخدام\nالإضافة الجماعية للسيرة الدراسية لعدة طلاب.<\/p>\n<p><strong>2.<\/strong> إضافة سيرة دراسية على المرحلة\nالثانية.<\/p>\n<\/blockquote>", "text": "خيار تسجيل الطلاب في البرنامج\nالتكميلي موجود في صفحة طلاب البرنامج الدراسي، لكنه يبقى غير\nمفعّل ما لم يكن للطالب سيرة دراسية على المرحلة الأخيرة من الدبلوم\n(المرحلة الثانية). 1. فتح ملف الطالب، أو استخدام\nالإضافة الجماعية للسيرة الدراسية لعدة طلاب. 2. إضافة سيرة دراسية على المرحلة\nالثانية."}, {"title": "الخطوة 5: تحويل حالة الطالب إلى متخرج", "time": "08:12", "html": "<blockquote>\n<p><strong>1.<\/strong> الدخول إلى <strong>إدارة\nالتخرج<\/strong>.<\/p>\n<p><strong>2.<\/strong> اختيار الطالب وتنفيذ\n<strong>تحديث حالة التسجيل<\/strong> إلى\n<strong>متخرج<\/strong>.<\/p>\n<\/blockquote><p>في الواقع العملي تحدد الكلية الطلبة المتخرجين من\nالدبلوم، ومن يطلب منهم إكمال البكالوريوس يكون متخرجاً بطبيعة الحال.\nالنظام لا يقبل في البرنامج التكميلي إلا الطالب المتخرج.<\/p>", "text": "1. الدخول إلى إدارة\nالتخرج . 2. اختيار الطالب وتنفيذ تحديث حالة التسجيل إلى متخرج . في الواقع العملي تحدد الكلية الطلبة المتخرجين من\nالدبلوم، ومن يطلب منهم إكمال البكالوريوس يكون متخرجاً بطبيعة الحال.\nالنظام لا يقبل في البرنامج التكميلي إلا الطالب المتخرج."}, {"title": "الخطوة 6: تهيئة السنة الدراسية الأعلى", "time": "09:16", "html": "<p>حتى بعد التخرج يبقى الخيار غير مفعّل، لأن الطالب\nالمتخرج في 2025-2026 يحتاج برنامجاً تكميلياً على السنة التالية 2026-2027\nليبدأ فيه المرحلة الثالثة. هذه النسخة لا تُنشأ يدوياً، وتأتي من تهيئة\nالسنة الدراسية:<\/p><blockquote>\n<p><strong>1.<\/strong> الدخول إلى <strong>إدارة\nالترحيل<\/strong> بصلاحية <strong>مقرر القسم<\/strong>.<\/p>\n<p><strong>2.<\/strong> الضغط على <strong>تهيئة السنة\nالدراسية<\/strong>، وإدخال الرمز (كلمة مرور الحساب) والتأكيد.<\/p>\n<p><strong>3.<\/strong> بعد اكتمال العملية، فتح البرامج\nالدراسية والبحث عن برنامج البوليتكنيك.<\/p>\n<p><strong>4.<\/strong> التأكد من وجود نسخة 2026-2027 من\nبرنامج الدبلوم ومن البرنامج التكميلي المرتبط به.<\/p>\n<\/blockquote><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRsCkAABXRUJQVlA4ILSkAAAQlwKdASpMBLcCPnk6mUkkoyKhI5Iq2JAPCWdu/APoahQZPUS3/p/nf1VjNZ290rhn6DzB/gPIBjH5h6/eoly/5Df0vwfrO/3vGH37/yeWt7H/Geen/gep3+1+oN/l/Lj9T/+E/7PqL/pH+ bJX6mtuAubJX6RmEzELPAnEwh/SzycAbY9fibA+sGdjs1Ldgg+rxKAAAAAAAAAAAAAAAAAAAAAAAA==\"/><\/p>", "text": "حتى بعد التخرج يبقى الخيار غير مفعّل، لأن الطالب\nالمتخرج في 2025-2026 يحتاج برنامجاً تكميلياً على السنة التالية 2026-2027\nليبدأ فيه المرحلة الثالثة. هذه النسخة لا تُنشأ يدوياً، وتأتي من تهيئة\nالسنة الدراسية: 1. الدخول إلى إدارة\nالترحيل بصلاحية مقرر القسم . 2. الضغط على تهيئة السنة\nالدراسية ، وإدخال الرمز (كلمة مرور الحساب) والتأكيد. 3. بعد اكتمال العملية، فتح البرامج\nالدراسية والبحث عن برنامج البوليتكنيك. 4. التأكد من وجود نسخة 2026-2027 من\nبرنامج الدبلوم ومن البرنامج التكميلي المرتبط به."}, {"title": "الخطوة 7: تسجيل الطالب المتخرج في البرنامج التكميلي", "time": "11:24", "html": "<blockquote>\n<p><strong>1.<\/strong> العودة إلى طلاب برنامج الدبلوم\n2025-2026 وتحديد الطالب المتخرج (أو مجموعة متخرجين).<\/p>\n<p><strong>2.<\/strong> الضغط على <strong>تسجيل الطلاب في\nالبرنامج التكميلي<\/strong>، وسيكون مفعّلاً الآن.<\/p>\n<p><strong>3.<\/strong> الضغط على <strong>تأكيد<\/strong>،\nثم انتظار الإشعار.<\/p>\n<p><strong>4.<\/strong> تنزيل <strong>ملف Excel<\/strong>\nالذي يبيّن نتيجة التسجيل. الطلبة غير المؤهلين، كغير المتخرجين، يرفضهم\nالنظام ويظهرون في هذا الملف.<\/p>\n<p><strong>قاعدة:<\/strong> يُسجَّل الطالب في نسخة السنة\nالأعلى من البرنامج نفسه فقط. لو وُجد برنامجان أو ثلاثة على 2026-2027، لا\nيُقبل إلا البرنامج التكميلي المرتبط ببرنامج الدبلوم الذي تخرج\nمنه.<\/p>\n<\/blockquote><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRgZiAABXRUJQVlA4IPphAABwmAGdASpMBL0BPnk6mUkkoyKhI5IK2JAPCWVu/Cc0DSXmvzXxs/2f8B4M8h+5fXT0veYfHj+r9w9b7Ax7R6S86v/H9R/9Y9RD/IeWr6lv8R/2fUN+6vq5f8b9s/eP/ff+P7CX9M/0Xra+qZ6HX7senl7OX+N8+jr++lX6d/13+z/sT8Ee9H7X/cv2i/ej13/HfmX79/b/2y/vntcf5Xiy9Q/of/F/nfUv+RfZv83/aP8x/0P8X8y/3T/X/3r+9f8z/OejfxA/q/8f+UXyC/kn8v/xH9o/cz+4eqzseNW/3HoBerP0D/cf3//Mftn6M/9d/hv3k9yPz7+5f63/L/k59gP8t/r//R9e/+Z4SX33/eftL8AX9B/v3/r/zX5i/TN/Zf/H/a+gb9F/1f/y/1nwGfzv+5/9r/J+3h7LPSSJmxvudrma7/433O1zNd/8b7na5mu/+N9ztczXf/G+52uZrv/jfc7XM13/xvudrma7/ // Arabic-tolerant normalisation: drop diacritics/tatweel, unify alef, ya, ta marbuta, hamza seats
const MAP = {"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه","ـ":""};
function norm(s){
  let out = "", idx = [];
  for (let i = 0; i < s.length; i++){
    let ch = s[i];
    if (/[ً-ْٰ]/.test(ch)) continue;
    ch = (MAP[ch] !== undefined ? MAP[ch] : ch).toLowerCase();
    for (const c of ch){ out += c; idx.push(i); }
  }
  return {out, idx};
}

function highlight(text, terms){
  if (!text) return "";
  if (!terms.length) return esc(text);
  const {out, idx} = norm(text);
  const marks = new Array(text.length).fill(false);
  for (const t of terms){
    let p = out.indexOf(t);
    while (p !== -1){
      const a = idx[p], b = idx[p + t.length - 1];
      for (let i = a; i <= b; i++) marks[i] = true;
      p = out.indexOf(t, p + 1);
    }
  }
  let html = "", open = false;
  for (let i = 0; i < text.length; i++){
    if (marks[i] && !open){ html += "<mark>"; open = true; }
    if (!marks[i] && open){ html += "</mark>"; open = false; }
    html += esc(text[i]);
  }
  return html + (open ? "</mark>" : "");
}

  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue; if (!text.trim()) continue;
    const h = highlight(text, terms);
    if (h.indexOf("<mark>") === -1) continue;
    const span = document.createElement("span"); span.innerHTML = h;
    node.replaceWith(...span.childNodes);
  }
}

let view = "issues", curTab = "", OPEN = {}, autoView = false;
const KEY = "sis-kb2-" + SYS.id;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({q:$("#q").value, s:$("#fs").value, g:$("#fg").value, t:curTab, v:view, n:$("#onlynew").checked, o:OPEN})); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; } }
const terms = () => { const r = $("#q").value.trim(); return r ? norm(r).out.split(/\s+/).filter(Boolean) : []; };

function setup(){
  document.title = SYS.short;
  $("#ttl").textContent = SYS.title;
  $("#sub").textContent = SYS.desc + " التبويبات ثابتة، وكل ما أُضيف أو عُدّل في آخر تحديث (" + META.latest + ") عليه علامة.";
  const nNew = DATA.filter(d => d.b).length + GUIDES.filter(g => g.b).length;
  const nInfo = DATA.filter(d => d.kind === "info").length;
  let h = `<span class="stat"><b>${DATA.length - nInfo}</b> مشكلة</span><span class="stat"><b>${nInfo}</b> حالات أخرى</span>`;
  for (const s of META.statuses){
    const n = DATA.filter(d => d.status === s).length;
    if (n) h += `<span class="stat"><span class="dot" style="background:var(--${ST[s]})"></span>${s} <b>${n}</b></span>`;
  }
  h += `<span class="stat"><b>${GUIDES.length}</b> شروحات آلية الاستخدام</span>`;
  h += `<span class="stat" style="border-color:var(--new)"><span class="newpill">جديد/محدّث</span> <b>${nNew}</b> في تحديث ${META.latest}</span>`;
  $("#stats").innerHTML = h;
  $("#sysnav").innerHTML = SYS.nav.map(s => s.cur ? `<span>${esc(s.title)}</span>` : `<a href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("");
  META.statuses.forEach(s => $("#fs").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
  META.groups.forEach(g => $("#fg").insertAdjacentHTML("beforeend", `<option value="${esc(g)}">${esc(g)}</option>`));
  $("#cats").addEventListener("click", e => {
    const gb = e.target.closest(".grp");
    if (gb){ const g = gb.dataset.grp; OPEN[g] = gb.getAttribute("aria-expanded") === "false"; render(); save(); return; }
    const b = e.target.closest(".cat"); if (!b) return;
    curTab = b.dataset.c; autoView = true; render(); save();
    if (window.innerWidth > 820) window.scrollTo({top: $(".layout").offsetTop - 70, behavior: "smooth"});
  });
  document.addEventListener("click", e => { const b = e.target.closest(".segb"); if (b){ view = b.dataset.v; render(); save(); } });
  // update log
  let lg = `<table><tr><th>التاريخ</th><th>التحديث</th><th>في هذا الملف</th></tr>`;
  for (const [d, txt] of META.updates.slice().reverse()){
    const a = DATA.filter(x => x.added === d).length, u = DATA.filter(x => x.updated === d && x.added !== d).length, g = GUIDES.filter(x => x.added === d).length;
    const parts = []; if (a) parts.push(a + " مشكلة جديدة"); if (u) parts.push(u + " مشكلة محدّثة"); if (g) parts.push(g + " شرح");
    lg += `<tr class="${d === META.latest ? "cur" : ""}"><td class="num">${esc(d)}</td><td>${esc(txt)}</td><td>${parts.join("، ") || "-"}</td></tr>`;
  }
  $("#log").innerHTML = lg + "</table>";
  $("#foot").innerHTML = META.log.map(l => `مجموعة «${esc(l[0])}»: آخر رسالة معالجة ${esc(l[1])}`).join(" · ") + "<br>لا يحتوي الدليل على أسماء الطلبة أو أرقامهم ولا أرقام الهواتف أو التذاكر.";
  const st = load();
  if (st.q) $("#q").value = st.q;
  if (st.s) $("#fs").value = st.s;
  if (st.g) $("#fg").value = st.g;
  if (st.t && TABNAME[st.t]) curTab = st.t;
  if (["guides", "other"].includes(st.v)) view = st.v;
  if (st.n) $("#onlynew").checked = true;
  if (st.o) OPEN = st.o;
  else if (window.innerWidth <= 820) SYS.tree.forEach(([g]) => OPEN[g] = false);   // phones: start collapsed
  let t;
  $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { render(); save(); }, 120); });
  ["#fs", "#fg", "#onlynew"].forEach(s => $(s).addEventListener("change", () => { render(); save(); }));
  $("#clr").addEventListener("click", () => { $("#q").value = ""; render(); save(); $("#q").focus(); });
  document.addEventListener("click", e => {
    const b = e.target.closest(".vid button"); if (!b) return;
    goSection(b.dataset.g, b.dataset.i);
  });
  window.addEventListener("hashchange", fromHash);
}

function goSection(g, i){
  view = "guides"; curTab = ""; $("#q").value = ""; $("#onlynew").checked = false; render(); save();
  const el = document.getElementById(`s-${g}-${i}`);
  if (el){
    document.querySelectorAll("#list img").forEach(x => x.loading = "eager");
    const go = () => el.scrollIntoView({block: "start"});
    go(); setTimeout(go, 350); setTimeout(go, 900);
    el.style.background = "var(--accent-soft)"; setTimeout(() => el.style.background = "", 2200);
  }
}
function fromHash(){
  const m = /^#s-([a-z]+)-(\d+)$/.exec(location.hash);
  if (m && GUIDES.some(g => g.id === m[1])) goSection(m[1], m[2]);
}

function issueBase(T){
  const fs = $("#fs").value, fg = $("#fg").value, nw = $("#onlynew").checked;
  return DATA.filter(d => (!fs || d.status === fs) && (!fg || d.group.includes(fg)) && (!nw || d.b) && T.every(t => d.hay.includes(t)));
}
function guideHits(T){
  const nw = $("#onlynew").checked;
  return GUIDES.filter(g => !nw || g.b).map(g => ({g, secs: g.sections.filter(s => T.every(t => s.hay.includes(t)))}));
}

function render(){
  const raw = $("#q").value.trim(), T = terms();
  $("#clr").hidden = !raw;
  const all = issueBase(T), gh = guideHits(T);
  const probs = all.filter(d => d.kind !== "info"), infos = all.filter(d => d.kind === "info");
  const inTab = (it, tab) => !tab || it.tabs.includes(tab);
  const gIn = tab => gh.filter(x => x.secs.length && inTab(x.g, tab));
  const counts = tab => ({issues: probs.filter(d => inTab(d, tab)).length, guides: gIn(tab).length, other: infos.filter(d => inTab(d, tab)).length});
  if (autoView){
    const c = counts(curTab);
    if (!c[view]) view = ["issues", "guides", "other"].find(v => c[v]) || view;
    autoView = false;
  }
  $("#fs").hidden = $("#fg").hidden = view === "guides";
  document.body.dataset.view = view;
  // rail: app tabs grouped like the application's menu; counts include problems, usage guides and other cases
  const cnt = tab => all.filter(d => inTab(d, tab)).length + gIn(tab).length;
  const newCnt = tab => all.filter(d => inTab(d, tab) && d.b).length + gIn(tab).filter(x => x.g.b).length;
  let rh = `<button class="cat allbtn" data-c="" aria-pressed="${!curTab}"><span>${esc(SYS.home)}</span><span class="r"><span class="n">${cnt("")}</span></span></button>`;
  for (const [grp, tabs] of SYS.tree){
    const ids = tabs.map(t => t[0]);
    const inG = it => it.tabs.some(t => ids.includes(t));
    const gItems = all.filter(inG).length + gh.filter(x => x.secs.length && inG(x.g)).length;
    const gNew = all.filter(d => d.b && inG(d)).length + gh.filter(x => x.secs.length && x.g.b && inG(x.g)).length;
    const open = OPEN[grp] !== false;
    rh += `<button class="grp" type="button" data-grp="${esc(grp)}" aria-expanded="${open}"><span>${esc(grp)}<span class="gn">${gItems}</span></span><span class="r">${gNew ? `<span class="newpill">${gNew} جديد</span>` : ""}<span class="chev">▾</span></span></button><div class="gitems"${open ? "" : " hidden"}>`;
    for (const [id, name, acc] of tabs){
      const n = cnt(id), nn = newCnt(id);
      rh += `<button class="cat${n === 0 ? " zero" : ""}" data-c="${id}" aria-pressed="${curTab === id}"><span class="nm"><span>${esc(name)}</span>${acc ? `<span class="acc">${esc(acc)}</span>` : ""}</span><span class="r">${nn ? `<span class="newpill">${nn} جديد</span>` : ""}<span class="n">${n}</span></span></button>`;
    }
    rh += `</div>`;
  }
  const nav = $("#cats"), keep = nav.scrollTop;
  nav.innerHTML = rh; nav.scrollTop = keep;
  if (view === "guides") renderGuides(gh, raw, T); else renderIssues(view === "other" ? infos : probs, raw, T, view === "other");
  // header of the selected tab with the three content buttons
  const c = counts(curTab);
  const segs = [["issues", "المشاكل والحلول", c.issues], ["guides", "آلية الاستخدام وطريقة الإدخال", c.guides], ["other", "حالات أخرى", c.other]];
  const head = `<div class="tabhead"><div class="th"><div class="crumb">${curTab ? esc(TABGRP[curTab]) : esc(SYS.title)}</div><div class="tt">${esc(curTab ? TABNAME[curTab] : "كل التبويبات")}</div></div>
    <div class="seg" role="tablist">${segs.map(([v, l, n]) => `<button type="button" role="tab" class="segb${n ? "" : " zero"}" data-v="${v}" aria-selected="${view === v}">${l} <span class="n">${n}</span></button>`).join("")}</div></div>`;
  $("#list").insertAdjacentHTML("afterbegin", head);
}

const PLAY = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;
function card(d, T, here){
  const others = d.tabs.filter(t => t !== here).map(t => TABNAME[t]);
  const ext = d.elsewhere.map(e => `${e.sys} (${e.tab})`);
  const also = [...others, ...ext];
  return `<article data-s="${esc(d.status)}" class="${d.b ? "isnew" : ""}">
    <div class="meta">${pill(d.b)}<span class="pill ${ST[d.status]}">${esc(d.status)}</span>
      <span class="num">#${d.n}</span><span class="num"><bdi>${esc(d.date.split(" ")[0])}</bdi> · <bdi>${esc(d.date.split(" ").slice(1).join(" "))}</bdi></span><span>${esc(d.group)}</span>
      ${d.source ? `<span>المصدر: ${esc(d.source)}</span>` : ""}</div>
    <p class="q">${highlight(d.problem, T)}</p>
    ${d.error ? `<p class="err">${highlight(d.error, T)}</p>` : ""}
    <p class="sol"><span class="k">${d.kind === "info" ? "التوضيح" : "الحل"}: </span>${highlight(d.solution, T)}</p>
    ${(d.vid || []).map(v => `<div class="vid"><div class="vh"><span class="vt">${PLAY} من شرح «${esc(v.name)}»، ${esc(v.step)}</span>
      ${v.href ? `<a class="btn" href="${esc(v.href)}" target="_blank" rel="noopener">افتح في ${esc(v.sysname)}</a>` : `<button type="button" data-g="${esc(v.g)}" data-i="${v.i}">افتح الخطوة في الشرح</button>`}</div>
      <p>${highlight(v.text, T)}</p>${v.note ? `<p class="vn">${highlight(v.note, T)}</p>` : ""}</div>`).join("")}
    ${d.notes ? `<p class="note"><span class="k">ملاحظة: </span>${highlight(d.notes, T)}</p>` : ""}
    ${also.length ? `<p class="also">يظهر أيضاً في: <b>${esc(also.join(" · "))}</b></p>` : ""}
  </article>`;
}
function renderIssues(base, raw, T, isOther){
  const tabsToShow = curTab ? [curTab] : TABORDER;
  let html = "", shown = 0;
  for (const tab of tabsToShow){
    // in "all" mode each problem is listed once, under its first tab in this system
    const items = base.filter(d => curTab ? d.tabs.includes(tab) : d.tabs[0] === tab);
    if (!items.length) continue;
    shown += items.length;
    html += `<section class="group"><h2>${esc(TABNAME[tab])} <span>${items.length}</span></h2><div class="cards">${items.map(d => card(d, T, tab)).join("")}</div></section>`;
  }
  $("#count").textContent = `يظهر ${shown} من ${DATA.length}`;
  $("#list").innerHTML = html || `<div class="empty">لا توجد ${isOther ? "حالات أخرى" : "مشكلة"}${raw ? ` فيها «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}${$("#onlynew").checked ? " ضمن الجديد" : ""}.</div>`;
}
function renderGuides(gh, raw, T){
  const list = gh.filter(x => (!curTab || x.g.tabs.includes(curTab)) && x.secs.length);
  const shownSecs = list.reduce((a, x) => a + x.secs.length, 0);
  $("#count").textContent = T.length ? `${shownSecs} خطوة مطابقة` : `${list.length} من ${GUIDES.length} شروحات`;
  if (!list.length){
    $("#list").innerHTML = `<div class="empty">لا يوجد شرح${raw ? ` فيه «${esc(raw)}»` : ""} في ${curTab ? "تبويب «" + esc(TABNAME[curTab]) + "»" : "هذا الملف"}.</div>`;
    return;
  }
  let html = "";
  for (const {g, secs} of list){
    html += `<section class="guide" id="g-${g.id}"><div class="ghead"><h2>${esc(g.title)}</h2><p class="gs">${esc(g.subtitle)}</p>
      <p class="src">${PLAY}<span>${esc(g.source)}</span></p>
      <div class="gmeta">${pill(g.b)}${g.tabs.map(t => `<span class="newpill upd" style="background:var(--bg);color:var(--muted);border-color:var(--line)">${esc(TABNAME[t])}</span>`).join("")}</div></div>`;
    if (T.length) html += `<div class="hits">${secs.length} من ${g.sections.length} أقسام تطابق البحث</div>`;
    else html += `<nav class="toc" aria-label="محتويات الشرح">${secs.map(s => `<a href="#s-${g.id}-${g.sections.indexOf(s)}">${esc(s.title.replace(/:.*/, ""))}</a>`).join("")}</nav>`;
    secs.forEach(s => {
      const i = g.sections.indexOf(s);
      html += `<div class="sec" id="s-${g.id}-${i}"><h3><span class="st">${esc(s.title)}</span>${s.time ? `<span class="t">في الفيديو ${esc(s.time)}</span>` : ""}</h3>${s.html}</div>`;
    });
    html += `</section>`;
  }
  const L = $("#list"); L.innerHTML = html;
  markEl(L, T);
  L.querySelectorAll(".toc a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1));
    if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
  }));
}
setup(); render(); fromHash();
</script>
</html>
