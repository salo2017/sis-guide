ة ☐ 3 الطلبة موزعون على الشعب ☐ 4 طلبة بولونيا مسجلون على المواد ومواد المحاولات ☐ 5 الجدول الأسبوعي لكل المراحل مع القاعات ☐ 6 الجدول منشور ☐"}], "tabs": ["sections", "schedule", "halls", "stu_info"], "added": "03/11/2026 مساءً", "updated": ""}, {"id": "sections", "short": "إضافة الشعب والمجاميع", "title": "إضافة الشعب والمجاميع الدراسية", "subtitle": "خطوة إجبارية قبل تسجيل الطلبة على المواد وتكوين الماستر شيت", "source": "أُعدّ من فيديو: إضافة الشعب والمجاميع في نظام SIS (3 دقائق تقريباً)، ومن الورشة الوزارية 21-9-2026", "sections": [{"title": "لماذا الشعب أولاً", "time": "00:10", "html": "<p>لا يمكن تسجيل الطلاب على المواد ولا تكوين الماستر شيت إلا بعد إنشاء الشعب وإضافة الطلبة إليها.<\/p><blockquote><p><strong>إذا تعذّر تسجيل الطلبة على المواد:<\/strong> السبب الغالب أن الشعب والمجاميع لم تُنشأ لهم.<\/p><\/blockquote>", "text": "لا يمكن تسجيل الطلاب على المواد ولا تكوين الماستر شيت إلا بعد إنشاء الشعب وإضافة الطلبة إليها. إذا تعذّر تسجيل الطلبة على المواد: السبب الغالب أن الشعب والمجاميع لم تُنشأ لهم."}, {"title": "الخطوة 1: فتح الشعب والمجاميع", "time": "00:35", "html": "<blockquote><p><strong>1.<\/strong> من (إدارة البرنامج الدراسي) افتح <strong>الشعب والمجاميع<\/strong>.<\/p><p><strong>2.<\/strong> اضغط <strong>إضافة الشعب والمجاميع<\/strong>.<\/p><\/blockquote>", "text": "1. من (إدارة البرنامج الدراسي) افتح الشعب والمجاميع . 2. اضغط إضافة الشعب والمجاميع ."}, {"title": "الخطوة 2: بيانات الشعبة", "time": "00:48", "html": "<blockquote><p><strong>1.<\/strong> اسم الشعبة أو المجموعة، مثل: المرحلة الأولى - الدراسة الصباحية.<\/p><p><strong>2.<\/strong> السنة الدراسية.<\/p><p><strong>3.<\/strong> البرنامج الدراسي للقسم.<\/p><p><strong>4.<\/strong> المرحلة والفصل الدراسي.<\/p><p><strong>5.<\/strong> الهيكل التنظيمي للكلية أو القسم، وانتظر حتى يُحمَّل.<\/p><p><strong>6.<\/strong> اضغط <strong>إضافة<\/strong>.<\/p><\/blockquote>", "text": "1. اسم الشعبة أو المجموعة، مثل: المرحلة الأولى - الدراسة الصباحية. 2. السنة الدراسية. 3. البرنامج الدراسي للقسم. 4. المرحلة والفصل الدراسي. 5. الهيكل التنظيمي للكلية أو القسم، وانتظر حتى يُحمَّل. 6. اضغط إضافة ."}, {"title": "الخطوة 3: شعبة الدراسة المسائية", "time": "01:58", "html": "<blockquote><p><strong>1.<\/strong> كرر الخطوات مع اختيار البرنامج الدراسي المسائي.<\/p><p><strong>2.<\/strong> نوع الدراسة: مسائي، ثم المرحلة والفصل والهيكل، ثم إضافة.<\/p><p><strong>3.<\/strong> حدّث الصفحة للتأكد من ظهور الشعب الجديدة.<\/p><\/blockquote>", "text": "1. كرر الخطوات مع اختيار البرنامج الدراسي المسائي. 2. نوع الدراسة: مسائي، ثم المرحلة والفصل والهيكل، ثم إضافة. 3. حدّث الصفحة للتأكد من ظهور الشعب الجديدة."}, {"title": "بعد إنشاء الشعب", "time": "", "html": "<blockquote><p><strong>◂<\/strong> وزّع الطلبة على الشعب من (معلومات الطلاب)، كما في شرح (إجراءات ما بعد الترحيل).<\/p><p><strong>◂<\/strong> في الورشة الوزارية أُشير إلى إمكانية استنساخ الشعب من السنة السابقة.<\/p><\/blockquote>", "text": "◂ وزّع الطلبة على الشعب من (معلومات الطلاب)، كما في شرح (إجراءات ما بعد الترحيل). ◂ في الورشة الوزارية أُشير إلى إمكانية استنساخ الشعب من السنة السابقة."}], "tabs": ["sections"], "added": "03/11/2026 مساءً", "updated": ""}, {"id": "coursedata", "short": "استكمال معلومات المواد (حسب النظام التعليمي)", "title": "استكمال معلومات المواد الدراسية حتى تصبح (مكتملة)", "subtitle": "تبويبات نافذة المادة بالترتيب، وما يخص كل نظام تعليمي: بولونيا، والفصلي، والسنوي", "source": "أُعدّ من فيديو: معالجة النقوصات واستكمال إدخال المواد الدراسية في نظام SIS (6 دقائق تقريباً)، مع ما ورد في شرحي تهيئة العام الدراسي وإضافة المواد", "sections": [{"title": "نظرة عامة وأي التبويبات تخص أي نظام", "time": "", "html": "<p>كل مادة تظهر في النظام بمؤشرات للنواقص. تُكمل معلوماتها تبويباً تبويباً حتى تتحول المؤشرات إلى اللون الأخضر وتصبح حالة المادة <strong>مكتملة<\/strong>. اكتمال كل المواد شرط قبل ترحيل الطلبة.<\/p><div class=\"tw\"><table><tr><th>تبويب نافذة المادة<\/th><th>نظام بولونيا<\/th><th>النظام الفصلي والسنوي<\/th><\/tr><tr><td>معلومات المادة<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>ارتباطات المادة (المتطلب السابق)<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>توزيع المادة الدراسية<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>المنهاج الدراسي (المفردات الأسبوعية)<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>مصادر التعليم<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>وصف المادة الدراسي<\/td><td>✔ مطلوب<\/td><td>✔ مطلوب<\/td><\/tr><tr><td>امتحان نصف الفصل والتقييم التكويني<\/td><td>✔ مطلوب: التقييم التكويني 40%<\/td><td>السعي الفصلي أو السنوي بدلاً من التقييم التكويني<\/td><\/tr><tr><td>الحصص المجدولة وغير المجدولة<\/td><td>✔ مطلوب: ساعات ECTS<\/td><td>خاص بمواد بولونيا<\/td><\/tr><\/table><\/div><blockquote><p><strong>انتبه لنظام التعليم:<\/strong> نظام التعليم (بولونيا أو فصلي أو سنوي أو مقررات) يُحدَّد عند إضافة المادة، ولا يُغيَّر من هذه النافذة. تأكد أنه يطابق نظام البرنامج قبل إكمال التبويبات.<\/p><\/blockquote><blockquote><p><strong>مصدر الجدول:<\/strong> الفيديو يشرح مادة يظهر فيها التقييم التكويني 40% وساعات ECTS، أي مادة بنظام بولونيا. أما عمود الفصلي والسنوي فمأخوذ من شرح تهيئة العام الدراسي، فراجع التبويبات التي تظهر لك فعلاً في مادتك.<\/p><\/blockquote>", "text": "كل مادة تظهر في النظام بمؤشرات للنواقص. تُكمل معلوماتها تبويباً تبويباً حتى تتحول المؤشرات إلى اللون الأخضر وتصبح حالة المادة مكتملة . اكتمال كل المواد شرط قبل ترحيل الطلبة. تبويب نافذة المادة نظام بولونيا النظام الفصلي والسنوي معلومات المادة ✔ مطلوب ✔ مطلوب ارتباطات المادة (المتطلب السابق) ✔ مطلوب ✔ مطلوب توزيع المادة الدراسية ✔ مطلوب ✔ مطلوب المنهاج الدراسي (المفردات الأسبوعية) ✔ مطلوب ✔ مطلوب مصادر التعليم ✔ مطلوب ✔ مطلوب وصف المادة الدراسي ✔ مطلوب ✔ مطلوب امتحان نصف الفصل والتقييم التكويني ✔ مطلوب: التقييم التكويني 40% السعي الفصلي أو السنوي بدلاً من التقييم التكويني الحصص المجدولة وغير المجدولة ✔ مطلوب: ساعات ECTS خاص بمواد بولونيا انتبه لنظام التعليم: نظام التعليم (بولونيا أو فصلي أو سنوي أو مقررات) يُحدَّد عند إضافة المادة، ولا يُغيَّر من هذه النافذة. تأكد أنه يطابق نظام البرنامج قبل إكمال التبويبات. مصدر الجدول: الفيديو يشرح مادة يظهر فيها التقييم التكويني 40% وساعات ECTS، أي مادة بنظام بولونيا. أما عمود الفصلي والسنوي فمأخوذ من شرح تهيئة العام الدراسي، فراجع التبويبات التي تظهر لك فعلاً في مادتك."}, {"title": "قبل البدء: ملفان يجب تحضيرهما", "time": "00:18", "html": "<blockquote><p><strong>1.<\/strong> ملف <strong>الوصف الأكاديمي الشامل<\/strong> للبرنامج.<\/p><p><strong>2.<\/strong> ملف <strong>ملخص المنهاج الدراسي (Curriculum)<\/strong> للفصول (السمسترات).<\/p><\/blockquote><p>منهما تُستخرج كل المعلومات المطلوبة في التبويبات، وعلى أساسهما يظهر ملخص النواقص في كل مادة.<\/p>", "text": "1. ملف الوصف الأكاديمي الشامل للبرنامج. 2. ملف ملخص المنهاج الدراسي (Curriculum) للفصول (السمسترات). منهما تُستخرج كل المعلومات المطلوبة في التبويبات، وعلى أساسهما يظهر ملخص النواقص في كل مادة."}, {"title": "الخطوة 1: فتح المواد الدراسية وتصفيتها", "time": "00:35", "html": "<blockquote><p><strong>1.<\/strong> افتح تبويب <strong>المواد الدراسية<\/strong>.<\/p><p><strong>2.<\/strong> اختر من الفلتر السنة الدراسية الحالية (في الفيديو 2025/2026)، حتى تعمل على مواد هذه السنة فقط ولا تعدّل مواد السنوات السابقة.<\/p><p><strong>3.<\/strong> يظهر عدد المواد الفعلي. للوصول السريع ابحث بـ<strong>رمز المادة<\/strong> (مثل 306).<\/p><\/blockquote>", "text": "1. افتح تبويب المواد الدراسية . 2. اختر من الفلتر السنة الدراسية الحالية (في الفيديو 2025/2026)، حتى تعمل على مواد هذه السنة فقط ولا تعدّل مواد السنوات السابقة. 3. يظهر عدد المواد الفعلي. للوصول السريع ابحث بـ رمز المادة (مثل 306)."}, {"title": "الخطوة 2: قراءة ملخص النواقص", "time": "01:15", "html": "<p>عند فتح المادة يظهر ملخص بالنواقص والمعلومات المطلوب استكمالها. ابدأ منه، وأكمل كل تبويب ناقص اعتماداً على ملفي المنهاج والوصف الأكاديمي.<\/p>", "text": "عند فتح المادة يظهر ملخص بالنواقص والمعلومات المطلوب استكمالها. ابدأ منه، وأكمل كل تبويب ناقص اعتماداً على ملفي المنهاج والوصف الأكاديمي."}, {"title": "الخطوة 3: معلومات المادة", "time": "01:38", "html": "<blockquote><p><strong>1.<\/strong> راجع المراجع والمسؤولين عن المادة.<\/p><p><strong>2.<\/strong> حدد التدريسي المدرّس للمادة، للصباحي والمسائي.<\/p><\/blockquote><blockquote><p><strong>إذا لم يظهر اسم التدريسي:<\/strong> راجع قسم الموارد البشرية لإضافته أو إكمال بياناته.<\/p><\/blockquote>", "text": "1. راجع المراجع والمسؤولين عن المادة. 2. حدد التدريسي المدرّس للمادة، للصباحي والمسائي. إذا لم يظهر اسم التدريسي: راجع قسم الموارد البشرية لإضافته أو إكمال بياناته."}, {"title": "الخطوة 4: ارتباطات المادة", "time": "02:00", "html": "<p>تحقق هل للمادة متطلب سابق، وأضفه إن وُجد، ثم احفظ التغييرات.<\/p>", "text": "تحقق هل للمادة متطلب سابق، وأضفه إن وُجد، ثم احفظ التغييرات."}, {"title": "الخطوة 5: توزيع المادة الدراسية", "time": "02:20", "html": "<blockquote><p><strong>1.<\/strong> وزّع المادة على البرنامج الصباحي والبرنامج المسائي.<\/p><p><strong>2.<\/strong> حدد التدريسي والشعبة.<\/p><p><strong>3.<\/strong> حدد المحاضرة الأساسية والأعباء والساعات الإلكترونية.<\/p><\/blockquote>", "text": "1. وزّع المادة على البرنامج الصباحي والبرنامج المسائي. 2. حدد التدريسي والشعبة. 3. حدد المحاضرة الأساسية والأعباء والساعات الإلكترونية."}, {"title": "الخطوة 6: المنهاج الدراسي", "time": "02:50", "html": "<p>أدخل المفردات الأسبوعية للدروس النظرية: العنوان والمواضيع لكل أسبوع تعليمي بالتتابع، كما في ملف المنهاج.<\/p>", "text": "أدخل المفردات الأسبوعية للدروس النظرية: العنوان والمواضيع لكل أسبوع تعليمي بالتتابع، كما في ملف المنهاج."}, {"title": "الخطوة 7: مصادر التعليم", "time": "03:25", "html": "<p>أدخل المراجع الضرورية، والكتب المقترحة (Recommended)، والمواقع الإلكترونية المعتمدة للمادة.<\/p>", "text": "أدخل المراجع الضرورية، والكتب المقترحة (Recommended)، والمواقع الإلكترونية المعتمدة للمادة."}, {"title": "الخطوة 8: وصف المادة الدراسي", "time": "03:55", "html": "<p>أدخل الأهداف الأكاديمية ومخرجات التعلم.<\/p><blockquote><p><strong>انتبه:<\/strong> للحقول حد أعلى لعدد الكلمات. اختصر النص من ملف الوصف الأكاديمي إذا تجاوز الحد.<\/p><\/blockquote>", "text": "أدخل الأهداف الأكاديمية ومخرجات التعلم. انتبه: للحقول حد أعلى لعدد الكلمات. اختصر النص من ملف الوصف الأكاديمي إذا تجاوز الحد."}, {"title": "الخطوة 9: امتحان نصف الفصل والتقييم التكويني", "time": "04:30", "html": "<p>أدخل توزيع الدرجات: الاختبارات الشفهية والتحريرية، والواجبات، والتقارير، بحيث يكتمل التقييم التكويني (40%).<\/p><blockquote><p><strong>نظام بولونيا:<\/strong> التقييم التكويني 40% هو ما يظهر في الفيديو، وهو خاص بمواد بولونيا.<\/p><\/blockquote><blockquote><p><strong>النظامان الفصلي والسنوي:<\/strong> يُدخل السعي الفصلي أو السنوي بدلاً من التقييم التكويني، حسب شرح تهيئة العام الدراسي.<\/p><\/blockquote>", "text": "أدخل توزيع الدرجات: الاختبارات الشفهية والتحريرية، والواجبات، والتقارير، بحيث يكتمل التقييم التكويني (40%). نظام بولونيا: التقييم التكويني 40% هو ما يظهر في الفيديو، وهو خاص بمواد بولونيا. النظامان الفصلي والسنوي: يُدخل السعي الفصلي أو السنوي بدلاً من التقييم التكويني، حسب شرح تهيئة العام الدراسي."}, {"title": "الخطوة 10: الحصص المجدولة وغير المجدولة", "time": "05:00", "html": "<p>حدد الساعات الدراسية، والساعات الأونلاين، والمناقشات، والتتوريال، فيحسب النظام ساعات ECTS.<\/p><blockquote><p><strong>نظام بولونيا:<\/strong> هذا التبويب خاص بمواد بولونيا، لأن ساعات ECTS جزء من هذا النظام.<\/p><\/blockquote>", "text": "حدد الساعات الدراسية، والساعات الأونلاين، والمناقشات، والتتوريال، فيحسب النظام ساعات ECTS. نظام بولونيا: هذا التبويب خاص بمواد بولونيا، لأن ساعات ECTS جزء من هذا النظام."}, {"title": "الخطوة 11: التأكد من حالة المادة", "time": "05:30", "html": "<p>بعد إكمال كل النواقص تتحول المؤشرات إلى اللون الأخضر، وتصبح حالة المادة <strong>مكتملة<\/strong>. كرر الخطوات لكل مادة حتى تكتمل مواد البرنامج كلها.<\/p>", "text": "بعد إكمال كل النواقص تتحول المؤشرات إلى اللون الأخضر، وتصبح حالة المادة مكتملة . كرر الخطوات لكل مادة حتى تكتمل مواد البرنامج كلها."}, {"title": "قائمة تدقيق لكل مادة", "time": "", "html": "<div class=\"tw\"><table><tr><th>#<\/th><th>البند<\/th><th>بولونيا<\/th><th>فصلي / سنوي<\/th><\/tr><tr><td>1<\/td><td>السنة الدراسية الصحيحة في الفلتر<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>2<\/td><td>نظام تعليم المادة يطابق نظام البرنامج<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>3<\/td><td>التدريسي للصباحي والمسائي<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>4<\/td><td>المتطلب السابق (إن وُجد)<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>5<\/td><td>التوزيع على البرنامجين، والشعبة، والأعباء<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>6<\/td><td>المفردات الأسبوعية<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>7<\/td><td>مصادر التعليم<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>8<\/td><td>الأهداف ومخرجات التعلم ضمن حد الكلمات<\/td><td>☐<\/td><td>☐<\/td><\/tr><tr><td>9<\/td><td>التقييم التكويني 40%<\/td><td>☐<\/td><td>-<\/td><\/tr><tr><td>10<\/td><td>السعي الفصلي أو السنوي<\/td><td>-<\/td><td>☐<\/td><\/tr><tr><td>11<\/td><td>الحصص المجدولة وغير المجدولة وساعات ECTS<\/td><td>☐<\/td><td>-<\/td><\/tr><tr><td>12<\/td><td>حالة المادة: مكتملة<\/td><td>☐<\/td><td>☐<\/td><\/tr><\/table><\/div>", "text": "# البند بولونيا فصلي / سنوي 1 السنة الدراسية الصحيحة في الفلتر ☐ ☐ 2 نظام تعليم المادة يطابق نظام البرنامج ☐ ☐ 3 التدريسي للصباحي والمسائي ☐ ☐ 4 المتطلب السابق (إن وُجد) ☐ ☐ 5 التوزيع على البرنامجين، والشعبة، والأعباء ☐ ☐ 6 المفردات الأسبوعية ☐ ☐ 7 مصادر التعليم ☐ ☐ 8 الأهداف ومخرجات التعلم ضمن حد الكلمات ☐ ☐ 9 التقييم التكويني 40% ☐ - 10 السعي الفصلي أو السنوي - ☐ 11 الحصص المجدولة وغير المجدولة وساعات ECTS ☐ - 12 حالة المادة: مكتملة ☐ ☐"}], "tabs": ["courses", "stu_promo"], "added": "03/11/2026", "updated": ""}, {"id": "complete", "short": "استكمال تسجيل الطلاب (سنة الترحيل)", "title": "استكمال تسجيل الطلاب لسنة الترحيل 2025-2026", "subtitle": "إكمال البرنامج الدراسي والسيرة الدراسية والمواد للطلبة قبل ترحيلهم إلى 2026-2027، مع سجل العمليات والتراجع", "source": "أُعدّ من ملخص فيديو تعليمي عن خاصية استكمال تسجيل الطلاب. الملخص مترجم، فقد تختلف أسماء الأزرار والقوائم قليلاً عما في النظام", "sections": [{"title": "ما هي الخاصية ولمن", "time": "", "html": "<p>خاصية جديدة في نظام SIS لإكمال بيانات الطلبة في سنة الترحيل 2025-2026: البرنامج الدراسي، والسيرة الدراسية، وتسجيل المواد. الغرض ألا يبقى عند الطالب نقص يمنع ترحيله إلى 2026-2027.<\/p><div class=\"tw\"><table><tr><th>البند<\/th><th>التفصيل<\/th><\/tr><tr><td>المستخدمون<\/td><td>مقررو الأقسام، ومسجلو الكليات ذوو الصلاحيات المحدودة<\/td><\/tr><tr><td>من يظهر فيها<\/td><td>طلبة سنة 2025-2026 فقط (سنة القبول 2025 أو قبلها)<\/td><\/tr><tr><td>من لا يظهر<\/td><td>المقبولون بعد 2025-2026، والخريجون<\/td><\/tr><tr><td>قسماها<\/td><td>تسجيل البرنامج والسيرة الدراسية، وإدارة تسجيل المواد<\/td><\/tr><tr><td>الفلاتر<\/td><td>الجامعة والكلية والقسم، وسنة القبول، وحالة التسجيل، ونوع المشكلة (بلا برنامج، بلا سيرة، سيرة ناقصة)<\/td><\/tr><\/table><\/div>", "text": "خاصية جديدة في نظام SIS لإكمال بيانات الطلبة في سنة الترحيل 2025-2026: البرنامج الدراسي، والسيرة الدراسية، وتسجيل المواد. الغرض ألا يبقى عند الطالب نقص يمنع ترحيله إلى 2026-2027. البند التفصيل المستخدمون مقررو الأقسام، ومسجلو الكليات ذوو الصلاحيات المحدودة من يظهر فيها طلبة سنة 2025-2026 فقط (سنة القبول 2025 أو قبلها) من لا يظهر المقبولون بعد 2025-2026، والخريجون قسماها تسجيل البرنامج والسيرة الدراسية، وإدارة تسجيل المواد الفلاتر الجامعة والكلية والقسم، وسنة القبول، وحالة التسجيل، ونوع المشكلة (بلا برنامج، بلا سيرة، سيرة ناقصة)"}, {"title": "تسجيل البرنامج والسيرة الدراسية", "time": "", "html": "<p>تظهر هنا قائمة الطلبة الذين ليس لهم برنامج دراسي أو سيرة دراسية في سنة الترحيل.<\/p><blockquote><p><strong>1.<\/strong> استخدم الفلتر (نوع المشكلة) لعرض الطلبة بلا برنامج أو بلا سيرة.<\/p><p><strong>2.<\/strong> حدد الطلبة، وسجّلهم في برنامج دراسي من برامج 2025-2026.<\/p><p><strong>3.<\/strong> أضف لهم السيرة الدراسية: فصلية أو سنوية حسب نظام الطالب.<\/p><p><strong>4.<\/strong> اختر الحالة الدراسية المناسبة، مثل مستمر أو أكمل الفصل.<\/p><p><strong>5.<\/strong> بعد ذلك يظهر الطالب مكتمل التسجيل بلا نقص.<\/p><\/blockquote><blockquote><p><strong>قيود:<\/strong> الطلبة المحددون في العملية الواحدة يجب أن يكونوا من القسم نفسه. السيرة الدراسية لا تُضاف إلا لطالب له برنامج في تلك السنة. ولا يسمح النظام بخلط طلبة من برامج مختلفة أو فصول مختلفة في عملية سيرة واحدة.<\/p><\/blockquote>", "text": "تظهر هنا قائمة الطلبة الذين ليس لهم برنامج دراسي أو سيرة دراسية في سنة الترحيل. 1. استخدم الفلتر (نوع المشكلة) لعرض الطلبة بلا برنامج أو بلا سيرة. 2. حدد الطلبة، وسجّلهم في برنامج دراسي من برامج 2025-2026. 3. أضف لهم السيرة الدراسية: فصلية أو سنوية حسب نظام الطالب. 4. اختر الحالة الدراسية المناسبة، مثل مستمر أو أكمل الفصل. 5. بعد ذلك يظهر الطالب مكتمل التسجيل بلا نقص. قيود: الطلبة المحددون في العملية الواحدة يجب أن يكونوا من القسم نفسه. السيرة الدراسية لا تُضاف إلا لطالب له برنامج في تلك السنة. ولا يسمح النظام بخلط طلبة من برامج مختلفة أو فصول مختلفة في عملية سيرة واحدة."}, {"title": "استكمال السيرة الناقصة", "time": "", "html": "<p>تكشف الخاصية الطلبة الذين سيرتهم ناقصة، مثل سيرة فيها فصل واحد بدل فصلين. حدد الطلبة وأضف الفصل الناقص لتكتمل سيرة السنة.<\/p><blockquote><p><strong>قيد:<\/strong> الطلبة المحددون يجب أن يكونوا في المرحلة نفسها والفصل نفسه.<\/p><\/blockquote>", "text": "تكشف الخاصية الطلبة الذين سيرتهم ناقصة، مثل سيرة فيها فصل واحد بدل فصلين. حدد الطلبة وأضف الفصل الناقص لتكتمل سيرة السنة. قيد: الطلبة المحددون يجب أن يكونوا في المرحلة نفسها والفصل نفسه."}, {"title": "إدارة تسجيل المواد", "time": "", "html": "<blockquote><p><strong>◂<\/strong> تعرض فقط الطلبة الذين ليس لهم أي نتيجة أو درجة مسجلة في سيرة 2025-2026.<\/p><p><strong>◂<\/strong> الطالب الذي له نتيجة مادة واحدة على الأقل لا يظهر هنا حتى تُحذف بياناته في نظام اللجنة الامتحانية.<\/p><p><strong>◂<\/strong> يمكن إضافة مواد إلى سيرة الطالب أو حذفها منها، لمعالجة التسجيل الناقص أو الخاطئ الذي يُكتشف عند مراجعة اللجنة الامتحانية.<\/p><p><strong>◂<\/strong> تتوفر فلاتر حسب الوحدة التنظيمية والبرنامج.<\/p><\/blockquote>", "text": "◂ تعرض فقط الطلبة الذين ليس لهم أي نتيجة أو درجة مسجلة في سيرة 2025-2026. ◂ الطالب الذي له نتيجة مادة واحدة على الأقل لا يظهر هنا حتى تُحذف بياناته في نظام اللجنة الامتحانية. ◂ يمكن إضافة مواد إلى سيرة الطالب أو حذفها منها، لمعالجة التسجيل الناقص أو الخاطئ الذي يُكتشف عند مراجعة اللجنة الامتحانية. ◂ تتوفر فلاتر حسب الوحدة التنظيمية والبرنامج."}, {"title": "سجل العمليات السابقة والتراجع", "time": "", "html": "<p>كل عملية تسجيل تُحفظ في سجل يبين من نفذها، وعلى كم طالب، ومتى، مع تفاصيل نتيجة كل طالب. ويمكن التراجع عن العملية إذا كانت خاطئة.<\/p><blockquote><p><strong>ترتيب التراجع:<\/strong> يُتراجع عن تسجيل السيرة الدراسية أولاً، ثم عن تسجيل البرنامج المرتبط بها.<\/p><\/blockquote><blockquote><p><strong>تحذير:<\/strong> لا يمكن التراجع إذا كان للطلبة بيانات في نظام اللجنة الامتحانية، مثل درجات مسجلة.<\/p><\/blockquote>", "text": "كل عملية تسجيل تُحفظ في سجل يبين من نفذها، وعلى كم طالب، ومتى، مع تفاصيل نتيجة كل طالب. ويمكن التراجع عن العملية إذا كانت خاطئة. ترتيب التراجع: يُتراجع عن تسجيل السيرة الدراسية أولاً، ثم عن تسجيل البرنامج المرتبط بها. تحذير: لا يمكن التراجع إذا كان للطلبة بيانات في نظام اللجنة الامتحانية، مثل درجات مسجلة."}, {"title": "التصدير إلى Excel", "time": "", "html": "<p>يمكن تنزيل تقرير Excel مفصل بنتيجة العمليات، يبين الخطأ عند كل طالب لمعالجته.<\/p>", "text": "يمكن تنزيل تقرير Excel مفصل بنتيجة العمليات، يبين الخطأ عند كل طالب لمعالجته."}, {"title": "قواعد مختصرة", "time": "", "html": "<div class=\"tw\"><table><tr><th>القاعدة<\/th><th>التفصيل<\/th><\/tr><tr><td>سنة الترحيل فقط<\/td><td>يظهر الطلبة المقبولون في 2025 أو قبلها<\/td><\/tr><tr><td>القسم نفسه<\/td><td>العمليات الجماعية لطلبة القسم نفسه<\/td><\/tr><tr><td>البرنامج أو المرحلة نفسها<\/td><td>لا خلط بين برامج أو فصول في عملية واحدة<\/td><\/tr><tr><td>السيرة قبل البرنامج في التراجع<\/td><td>يُتراجع عن السيرة ثم عن البرنامج<\/td><\/tr><tr><td>بيانات اللجنة الامتحانية<\/td><td>الطالب الذي له درجات مسجلة لا يُعالج مباشرة ولا يُتراجع عنه<\/td><\/tr><tr><td>تسجيل المواد<\/td><td>للطلبة الذين ليس لهم نتائج مواد فقط<\/td><\/tr><\/table><\/div>", "text": "القاعدة التفصيل سنة الترحيل فقط يظهر الطلبة المقبولون في 2025 أو قبلها القسم نفسه العمليات الجماعية لطلبة القسم نفسه البرنامج أو المرحلة نفسها لا خلط بين برامج أو فصول في عملية واحدة السيرة قبل البرنامج في التراجع يُتراجع عن السيرة ثم عن البرنامج بيانات اللجنة الامتحانية الطالب الذي له درجات مسجلة لا يُعالج مباشرة ولا يُتراجع عنه تسجيل المواد للطلبة الذين ليس لهم نتائج مواد فقط"}, {"title": "ارتباطها بمشاكل مجموعات واتساب", "time": "", "html": "<blockquote><p><strong>◂<\/strong> ظهور خريجي 2024-2025 في الخاصية: حسب الشرح لا يظهر الخريجون فيها، فظهورهم يرجّح أن حالتهم لم تُحدَّث إلى متخرج.<\/p><p><strong>◂<\/strong> طلبة لم تظهر أسماؤهم في قوائم الدرجات لأن المواد لم تُربط بسيرهم: إدارة تسجيل المواد تضيف المواد إلى السيرة، ما دام الطالب بلا نتائج.<\/p><p><strong>◂<\/strong> طلبة مؤجلون لهم مواد بلا درجات تمنع إنشاء الدور الثاني: إدارة تسجيل المواد تحذف المواد من السيرة، ما دام الطالب بلا نتائج.<\/p><\/blockquote>", "text": "◂ ظهور خريجي 2024-2025 في الخاصية: حسب الشرح لا يظهر الخريجون فيها، فظهورهم يرجّح أن حالتهم لم تُحدَّث إلى متخرج. ◂ طلبة لم تظهر أسماؤهم في قوائم الدرجات لأن المواد لم تُربط بسيرهم: إدارة تسجيل المواد تضيف المواد إلى السيرة، ما دام الطالب بلا نتائج. ◂ طلبة مؤجلون لهم مواد بلا درجات تمنع إنشاء الدور الثاني: إدارة تسجيل المواد تحذف المواد من السيرة، ما دام الطالب بلا نتائج."}], "tabs": ["stu_complete", "stu_info", "courses"], "added": "03/11/2026", "updated": ""}, {"id": "init", "short": "تهيئة العام الدراسي", "title": "دليل تهيئة العام الدراسي\n2026-2027", "subtitle": "وإكمال معلومات المواد والقاعات والجدول قبل الترحيل في نظام SIS", "source": "جُمع من ثلاثة فيديوهات عن تهيئة العام الدراسي 2026-2027 (أحدها من قناة Sebyan Tareq Saeed، جامعة الأنبار)، ومن الورشة الوزارية 21-9-2026", "sections": [{"title": "نظرة عامة", "time": "", "html": "<p>يشرح الفيديو تهيئة العام الدراسي الجديد في نظام SIS\nبعد انتهاء الدور الأول، ثم استكمال معلومات البرامج والمواد الدراسية\nللعام 2026-2027. ترحيل الطلبة نفسه لا يجري في هذه المرحلة، بل بعد إكمال\nمعلومات الدور الثاني ونتائجه، حتى للطلبة الناجحين من الدور\nالأول.<\/p><p>الخطوات أدناه مرتبة بحسب ورودها في الفيديو، وبجانب كل\nخطوة توقيتها التقريبي للرجوع إليه عند الحاجة.<\/p><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRrbxAABXRUJQVlA4IKrxAABQtQOdASokBEwEPnk6mUokoyWhovKZwLAPCWdu/EVwym9Zd6f84s6Ccbwf9n/I+FTQPuX+T/hv8j6/PKffnwT/lPgA/kd43un/b8vnpXz8/7P9tPc3/W/9X7AH9t/y3qN/+nqm/xP/h9Qn9X/6n7ye7P/pf3J/5 لجدول الأسبوعي رئيس القسم (إدارة القسم) إضافة القاعات الدراسية وربطها بالبناية والهيكل\nالتنظيمي للقسم مدير الكلية إضافة الأبنية والمنشآت (البناية\nالرئيسية)"}, {"title": "الخطوة 1: المتطلبات المسبقة", "time": "00:12", "html": "<p>قبل التهيئة يجب التأكد مما يلي:<\/p><blockquote>\n<p><strong>1.<\/strong> إكمال كافة معلومات الدور الأول في\nنظام اللجنة الامتحانية.<\/p>\n<p><strong>2.<\/strong> التأكد من صحة معلومات المواد\nالدراسية للعام 2025-2026، <strong>وخاصة عدد الوحدات<\/strong>.<\/p>\n<p><strong>3.<\/strong> التأكد من صحة معلومات البرامج\nالدراسية للعام 2025-2026.<\/p>\n<\/blockquote>", "text": "قبل التهيئة يجب التأكد مما يلي: 1. إكمال كافة معلومات الدور الأول في\nنظام اللجنة الامتحانية. 2. التأكد من صحة معلومات المواد\nالدراسية للعام 2025-2026، وخاصة عدد الوحدات . 3. التأكد من صحة معلومات البرامج\nالدراسية للعام 2025-2026."}, {"title": "الخطوة 2: فتح إدارة الترحيل والتحقق من النتائج", "time": "00:31", "html": "<blockquote>\n<p><strong>1.<\/strong> الدخول إلى نظام SIS\nبـ<strong>حساب مقرر القسم<\/strong>، ثم فتح واجهة <strong>إدارة\nالترحيل<\/strong>.<\/p>\n<p><strong>2.<\/strong> مراجعة نتائج الطلبة وحالة النتيجة\nلكل طالب. هذه النتائج تنتقل إلى SIS آلياً من نظام اللجنة\nالامتحانية.<\/p>\n<p><strong>3.<\/strong> إذا ظهرت واجهة غير متوقعة أو لم\nتكتمل البيانات، تُعاد تحميل الصفحة.<\/p>\n<p><strong>تنبيه:<\/strong> الترحيل يكون بعد نتائج الدور\nالثاني. المطلوب الآن التهيئة وإكمال المعلومات فقط.<\/p>\n<\/blockquote>", "text": "1. الدخول إلى نظام SIS\nبـ حساب مقرر القسم ، ثم فتح واجهة إدارة\nالترحيل . 2. مراجعة نتائج الطلبة وحالة النتيجة\nلكل طالب. هذه النتائج تنتقل إلى SIS آلياً من نظام اللجنة\nالامتحانية. 3. إذا ظهرت واجهة غير متوقعة أو لم\nتكتمل البيانات، تُعاد تحميل الصفحة. تنبيه: الترحيل يكون بعد نتائج الدور\nالثاني. المطلوب الآن التهيئة وإكمال المعلومات فقط."}, {"title": "الخطوة 3: تهيئة السنة الدراسية 2026-2027", "time": "01:49", "html": "<blockquote>\n<p><strong>1.<\/strong> من واجهة إدارة الترحيل، الضغط على\nزر <strong>تهيئة السنة الدراسية 2026-2027<\/strong>.<\/p>\n<p><strong>2.<\/strong> قراءة الملاحظات التي يعرضها\nالنظام.<\/p>\n<p><strong>3.<\/strong> إدخال <strong>كلمة مرور\nالحساب<\/strong> ثم الضغط على <strong>تأكيد<\/strong>.<\/p>\n<p><strong>4.<\/strong> يظهر إشعار <strong>تم تهيئة السنة\nالدراسية بنجاح<\/strong>، وترتفع نسبة الإنجاز من 0% إلى 33%.<\/p>\n<\/blockquote><p class=\"subh\">ما ينتج عن التهيئة:<\/p><blockquote>\n<p><strong>◂<\/strong> إنشاء 4 برامج دراسية: النظام\nالفصلي (صباحي ومسائي) ونظام بولونيا (صباحي ومسائي).<\/p>\n<p><strong>◂<\/strong> نسخ المواد الدراسية من العام\n2025-2026 إلى العام 2026-2027.<\/p>\n<\/blockquote><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRhCLAABXRUJQVlA4IASLAAAwuwKdASpMBN0DPnk6mUmkoyKiIjGagJAPCWdu/D0wsLvCT8ko/Y2NKh1Ihzcs3Hfuv2D9RflvxO4B+/T5dv6vlt295VPQP39e9L/N/s77pf7L/tPYD/xXle/un7pP8D/5/UL/Tf91+7/uu/6P9sf/p8NP7l/tfYN/tX/S9aL1Qv8H/6v/////g3/dz//+vb7NX98/+XrB/8z//9n/0t/Tv+yfj77//AT7h/bP8V/jP716e/j/zr99/uX7W/4H23P7bxyeq/z3/Q/w3qX/JftD+O/un+c/6X+A+bP7H/iv73+2f+n9Ifhp/M/4P9vf8H8gv5R/Lv8J/b/8X/3f8R6p/9V24ux/7n/jeoL60fO/9r/gf8v/8P8p6O397/gPyE+Bv0z+5f8X/Kf4v5AP5d/Xf+j/f/bP/l+GV99/3v7e/AJ/Pv8H/7f85+bv00/23/w/1f+z/eb3GfpH+o/93+r+Av+e/3L/p/4ztU/vR////R8SH7zD6vNFIwDjV5tXmikYBxq82rzRSMA41ebV5opGAcavNq80UjAONXm1eaKRgHGrzavNFIwDjV5tXmikYBxq82rzRSMA41ebV5opGAcavNq80MHsA80UEH1pEfx1BdpbFwvqHvQk8u38zbT5ySA3KSJeGTbUND9BIaRIwDjV5tXmikX8eI5ZeLYM54Twfpf6l3lq4fvmp4w6gjPUtEjOhKmGCWn8ZUoOEEw2pG8vpQlpBqRUApA0AjnqLVlsvKylGnpDvI8WkXduDySq/K4bUcYYm37ogftJV7v/ELjRuxfWBa0p/4v2TyY2f3vfSFxW+2uiOJ+y0/D3puc9aQuFe0Y8t88lPY+g+yBrLrvyMkEGcF1lDZ+QW7dPdrFL+zNZS1NJa5IA2nKxGNcLFkobi3f6BZt1IAZVStO0FWNnK1kBq6u5TccZPTAJUbP/BuVWGPIkYBxq82rzRSMA4ypHXsNZEB+qQExuBEpT612iEnfmuiHFP7bbF4/woXwRAQAznSUu70H2ASRfQ36voxQJqjpkEAtljLr4yBBuYlhCScJEhjHn8DHmuEhP3hpElpHowpXLH7zGEljtBH8qQDIr05ap2cgGtimsFbcvcRu2MGyFLfwlfvhieRWkX2ukfcSs9FWzyQyWGFwfCTtSGFopk92bH/q4uaa9PidYc8b4nG98y3I64BlyqyjEm4PhdX4OncpVYznJ3CK+IQONXm1eaKRgHGrzavOP6+Eij5pWd0xMCRUstM0A5PN5adFtTbP9aSLSJGAcavNq80UjAONXm1eaKRgHGrzavNFIwDjV 477xeFm+yKDzHAhDp0KWWypBo7viA4dqAog4zxfNMADHO706libQhK1SeObxflsveyrrBl12XQ0WqemStFI+nlmFzu/1hdvuz+I/15WOUe62Rlb1vEELm/IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==\"/><\/p><blockquote><p><strong>بعد التأكيد:<\/strong> تظهر رسالة (طلبك قيد المعالجة)، ويصل إشعار عند اكتمال النسخ. عند تحديث الصفحة يظهر مؤشر الإنجاز (33% ثم 100%) وتتحول الحالة إلى (تم التنفيذ بنجاح).<\/p><\/blockquote><blockquote><p><strong>تحديث:<\/strong> أُضيف زر <strong>التراجع عن تهيئة السنة الدراسية<\/strong> في إدارة الترحيل. إذا اكتشفت بعد التهيئة نقصاً في مادة أو طالب، تراجع وصحّح ثم هيّئ من جديد. التفاصيل في شرح ترحيل الطلبة.<\/p><\/blockquote>", "text": "1. من واجهة إدارة الترحيل، الضغط على\nزر تهيئة السنة الدراسية 2026-2027 . 2. قراءة الملاحظات التي يعرضها\nالنظام. 3. إدخال كلمة مرور\nالحساب ثم الضغط على تأكيد . 4. يظهر إشعار تم تهيئة السنة\nالدراسية بنجاح ، وترتفع نسبة الإنجاز من 0% إلى 33%. ما ينتج عن التهيئة: ◂ إنشاء 4 برامج دراسية: النظام\nالفصلي (صباحي ومسائي) ونظام بولونيا (صباحي ومسائي). ◂ نسخ المواد الدراسية من العام\n2025-2026 إلى العام 2026-2027. بعد التأكيد: تظهر رسالة (طلبك قيد المعالجة)، ويصل إشعار عند اكتمال النسخ. عند تحديث الصفحة يظهر مؤشر الإنجاز (33% ثم 100%) وتتحول الحالة إلى (تم التنفيذ بنجاح). تحديث: أُضيف زر التراجع عن تهيئة السنة الدراسية في إدارة الترحيل. إذا اكتشفت بعد التهيئة نقصاً في مادة أو طالب، تراجع وصحّح ثم هيّئ من جديد. التفاصيل في شرح ترحيل الطلبة."}, {"title": "الخطوة 4: مراجعة البرامج والمواد المنسوخة", "time": "02:27", "html": "<blockquote>\n<p><strong>1.<\/strong> الذهاب إلى <strong>البرامج\nالدراسية<\/strong> واختيار السنة 2026-2027، والتأكد من ظهور البرامج\nالأربعة.<\/p>\n<p><strong>2.<\/strong> تعديل معلومات البرامج إن وُجدت\nتغييرات، مثل مخرجات التعلم والرؤية والرسالة.<\/p>\n<p><strong>3.<\/strong> الذهاب إلى <strong>المواد\nالدراسية<\/strong> واختيار السنة 2026-2027 من أعلى الصفحة لعرض المواد\nالمنسوخة.<\/p>\n<p><strong>4.<\/strong> تعديل معلومات أي مادة\nتغيّرت.<\/p>\n<p><strong>5.<\/strong> إذا أُلغيت مادة في نظام أو برنامج\nمعيّن: <strong>يُحذف توزيعها أولاً<\/strong>، ثم تُحذف المادة من العام\n2026-2027.<\/p>\n<\/blockquote><blockquote><p><strong>يمكن الآن:<\/strong> تعديل رموز المواد، وإضافة المواد المستحدثة، وحذف غير المطلوبة (التوزيع أولاً ثم المادة)، وتغيير تكليف الأساتذة.<\/p><\/blockquote>", "text": "1. الذهاب إلى البرامج\nالدراسية واختيار السنة 2026-2027، والتأكد من ظهور البرامج\nالأربعة. 2. تعديل معلومات البرامج إن وُجدت\nتغييرات، مثل مخرجات التعلم والرؤية والرسالة. 3. الذهاب إلى المواد\nالدراسية واختيار السنة 2026-2027 من أعلى الصفحة لعرض المواد\nالمنسوخة. 4. تعديل معلومات أي مادة\nتغيّرت. 5. إذا أُلغيت مادة في نظام أو برنامج\nمعيّن: يُحذف توزيعها أولاً ، ثم تُحذف المادة من العام\n2026-2027. يمكن الآن: تعديل رموز المواد، وإضافة المواد المستحدثة، وحذف غير المطلوبة (التوزيع أولاً ثم المادة)، وتغيير تكليف الأساتذة."}, {"title": "الخطوة 5: إكمال معلومات كل مادة دراسية", "time": "03:20", "html": "<p>كل مادة تظهر بحالة <strong>غير مكتمل<\/strong> يجب\nإكمال معلوماتها حتى تتحول إلى <strong>مكتمل<\/strong> مع علامة صح خضراء.\nالمعلومات المطلوبة:<\/p><blockquote>\n<p><strong>1.<\/strong> وصف المقرر للمادة.<\/p>\n<p><strong>2.<\/strong> إضافة التدريسي للمادة.<\/p>\n<p><strong>3.<\/strong> توزيع التدريسي: من <strong>توزيع\nالمادة الدراسية ← مدرسو المادة<\/strong>.<\/p>\n<p><strong>4.<\/strong> تحديد التدريسي المسؤول عن إدخال\nدرجات السعي وتقديمها في <strong>IQ Learn<\/strong> (من التحديثات الجديدة\nفي النظام).<\/p>\n<p><strong>5.<\/strong> الحصص المجدولة وغير المجدولة\n(لمواد نظام بولونيا).<\/p>\n<p><strong>6.<\/strong> التقييم التكويني لمواد بولونيا،\nأو السعي السنوي والفصلي للنظام الفصلي.<\/p>\n<p><strong>7.<\/strong> التأكد من عدد الوحدات، وبقية\nالحقول الموجودة في الخيار نفسه.<\/p>\n<\/blockquote><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRi5iAABXRUJQVlA4ICJiAAAwpwGdASpMBOYBPnk6mUokoyKhorHZyJAPCWdu9yFn/nHqA/qf9+xkrYbQB/KN4ER/8QT/zm1/+Pja/ZseSOWn/ek+2YZT0DP51gE1HH/C8n//Z5/+m0TeRz799bvTv5Z8eH2PC/tjymugPOr/q/UV/XPUJ/xvQU/vfoH/dP9pPd0/5P7w+8z+/eoP/XPSh/9Xsf+jv+vHp1ezJ/e//P+6ftlde70s/T صح خضراء.\nالمعلومات المطلوبة: 1. وصف المقرر للمادة. 2. إضافة التدريسي للمادة. 3. توزيع التدريسي: من توزيع\nالمادة الدراسية ← مدرسو المادة . 4. تحديد التدريسي المسؤول عن إدخال\nدرجات السعي وتقديمها في IQ Learn (من التحديثات الجديدة\nفي النظام). 5. الحصص المجدولة وغير المجدولة\n(لمواد نظام بولونيا). 6. التقييم التكويني لمواد بولونيا،\nأو السعي السنوي والفصلي للنظام الفصلي. 7. التأكد من عدد الوحدات، وبقية\nالحقول الموجودة في الخيار نفسه. شرط: يجب أن تظهر جميع المواد بحالة\n(مكتمل) قبل البدء بترحيل الطلبة. ◂ حدد ساعات الامتحان النهائي، والحد الأدنى لدرجة النجاح (50). ◂ وزّع درجة السعي (40%) على الامتحانات والعملي والواجبات والتقارير والحلقات النقاشية حتى تكتمل الـ40. ◂ عندما تصبح المادة (مكتمل) تظهر بتفاصيلها لأستاذها في IQ Learn، فيبدأ برفع المحاضرات. التفاصيل: خطوات كل تبويب في نافذة المادة، وما يخص كل نظام تعليمي، في شرح (استكمال معلومات المواد)."}, {"title": "الخطوة 6: إضافة الأبنية والقاعات الدراسية", "time": "04:37", "html": "<p>هذه الخطوة لازمة لتفعيل نظام IQ Learn بشكل كامل، لأن\nالجدول الأسبوعي يعتمد على القاعات، والقاعات تعتمد على البناية التي توجد\nفيها.<\/p><blockquote>\n<p><strong>1.<\/strong> من <strong>حساب مدير\nالكلية<\/strong>: إضافة البناية الرئيسية من الأبنية والمنشآت.<\/p>\n<p><strong>2.<\/strong> من <strong>حساب رئيس القسم (إدارة\nالقسم)<\/strong>: إضافة القاعات الدراسية التابعة لهذه البناية.<\/p>\n<p><strong>3.<\/strong> تسمية القاعة باللغة العربية\nوالإنجليزية وتحديد الهيكل التابع لها.<\/p>\n<p><strong>4.<\/strong> إدخال كود القاعة وتاريخ\nتأسيسها.<\/p>\n<p><strong>5.<\/strong> ربط القاعة بالهيكل التنظيمي\nللقسم.<\/p>\n<\/blockquote><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRj5yAABXRUJQVlA4IDJyAABwtQGdASpMBKIBPnk6mEkkoyKhI9NbQJAPCWVu/DJY3BPa4eG1XP2nzh/Q/EPlf4NfT84ZN9854Tkr+5fwPnL/2/qr/uXqDf7Py6P2Z9339//7vqF/lP+f9Wb/p/uZ71f7n6h/9A9I31Pf89/6vZj/cL1mP/j7NP+a9LTq8ul/6cf2L8lffJ3nfbf8T+2X949Nfx75z+5/lP/gfaXyH+qfy37Qepf8i+2H5f+4/53/qf4j2f/3X9g/un/d80fy/9d/1X+A/dX/X/IL+Q/zD/Hf3v92P8PwvGvf6f/1eoL6g/RP+D/ev8n+zPon/1n+Y9 g>2.<\/strong> ربط جدول كل مرحلة أو شعبة بالقاعة\nالخاصة بها.<\/p>\n<p><strong>الترتيب إلزامي:<\/strong> الأبنية أولاً، ثم\nالقاعات، ثم الجدول الأسبوعي.<\/p>\n<\/blockquote><blockquote><p><strong>مهم:<\/strong> ربط القاعات بالجدول ضروري قبل ترحيل الطلبة وبدء الدراسة على منصة IQ Learn.<\/p><\/blockquote>", "text": "1. من حساب مقرر\nالقسم ، إضافة الجدول الأسبوعي لكافة المراحل والبرامج\nالدراسية. 2. ربط جدول كل مرحلة أو شعبة بالقاعة\nالخاصة بها. الترتيب إلزامي: الأبنية أولاً، ثم\nالقاعات، ثم الجدول الأسبوعي. مهم: ربط القاعات بالجدول ضروري قبل ترحيل الطلبة وبدء الدراسة على منصة IQ Learn."}, {"title": "الخطوة 8: ترحيل الطلبة (لاحقاً)", "time": "01:04", "html": "<p>صار الترحيل يتم بالدور الثاني ويشمل الناجحين والراسبين والمؤجلين معاً: جاهزية في SIS ثم تنفيذ في نظام اللجنة الامتحانية. خطواته في شرح (ترحيل الطلبة إلى 2026-2027)، وما بعده في شرح (إجراءات ما بعد الترحيل).<\/p><blockquote><p><strong>تحديث:<\/strong> زر <strong>إعلان جاهزية القسم للترحيل<\/strong> صار بجانب زر التهيئة، ويرفع نسبة الإنجاز إلى 67%.<\/p><\/blockquote>", "text": "صار الترحيل يتم بالدور الثاني ويشمل الناجحين والراسبين والمؤجلين معاً: جاهزية في SIS ثم تنفيذ في نظام اللجنة الامتحانية. خطواته في شرح (ترحيل الطلبة إلى 2026-2027)، وما بعده في شرح (إجراءات ما بعد الترحيل). تحديث: زر إعلان جاهزية القسم للترحيل صار بجانب زر التهيئة، ويرفع نسبة الإنجاز إلى 67%."}, {"title": "قائمة تدقيق قبل الترحيل", "time": "", "html": "<p>يمكن طباعة هذه القائمة والتأشير عليها أثناء\nالتنفيذ:<\/p><div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>#<\/strong><\/th>\n<th><strong>البند<\/strong><\/th>\n<th><strong>الحساب<\/strong><\/th>\n<th><strong>تم<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>إكمال معلومات الدور الأول في نظام اللجنة\nالامتحانية<\/th>\n<th>اللجنة الامتحانية<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>التحقق من مواد وبرامج 2025-2026 وعدد\nالوحدات<\/th>\n<th>مقرر القسم<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>التحقق من حالة نتائج مال معلومات ونتائج الدور الثاني، ثم\nالترحيل مقرر القسم ☐"}], "tabs": ["stu_promo", "stats", "courses", "halls", "schedule"], "added": "31/10/2026", "updated": "03/11/2026 ليلاً"}, {"id": "build", "short": "الدليل الشامل: البرنامج والقاعات", "title": "الدليل الشامل لإنشاء البرنامج الدراسي وإضافة القاعات", "subtitle": "مع برنامج الدبلوم والبرنامج التكميلي لكليات البوليتكنك", "source": "جُمع من سبعة فيديوهات: إضافة البرنامج، والبرنامج والمواد، ودور مدير الكلية (نسختان)، وإضافة القاعات، والبوليتكنك، وتهيئة العام الدراسي، ومن مشاكل مجموعات واتساب", "sections": [{"title": "ترتيب العمل", "time": "", "html": "<p>العمل يسير بهذا الترتيب، وكل مرحلة تعتمد على التي قبلها:<\/p><div class=\"tw\"><table><tr><th>#<\/th><th>المرحلة<\/th><th>الحساب<\/th><th>القسم في هذا الدليل<\/th><\/tr><tr><td>1<\/td><td>إنشاء البرنامج الدراسي<\/td><td>مدير الكلية (مدير الأنظمة في الكلية)<\/td><td>الخطوات 1 إلى 6<\/td><\/tr><tr><td>2<\/td><td>للبوليتكنك: ضبط برنامج الدبلوم ثم إنشاء البرنامج التكميلي منه<\/td><td>مدير الكلية<\/td><td>البوليتكنك 1 و2<\/td><\/tr><tr><td>3<\/td><td>إضافة المواد وتوزيعها على البرنامج<\/td><td>مقرر القسم أو رئيس القسم (المواد العامة: مدير الكلية)<\/td><td>المواد الدراسية<\/td><\/tr><tr><td>4<\/td><td>إضافة الأبنية<\/td><td>مدير الكلية<\/td><td>الأبنية والقاعات<\/td><\/tr><tr><td>5<\/td><td>إضافة القاعات الدراسية<\/td><td>حساب القسم (مقرر القسم أو رئيس القسم)<\/td><td>الأبنية والقاعات<\/td><\/tr><tr><td>6<\/td><td>الجدول الأسبوعي وربطه بالقاعات<\/td><td>مقرر القسم<\/td><td>الجدول الأسبوعي<\/td><\/tr><tr><td>7<\/td><td>للبوليتكنك: تسجيل خريجي الدبلوم في التكميلي بعد تهيئة السنة الجديدة<\/td><td>مقرر القسم<\/td><td>البوليتكنك 3<\/td><\/tr><\/table><\/div><blockquote><p><strong>قبل أن تبدأ:<\/strong> حضّر اسم البرنامج بالعربية والإنجليزية، ورمز البرنامج، ونظام التعليم، والطاقة الاستيعابية، واسمي منسق البرنامج ومديره، والرؤية والرسالة والأهداف ومخرجات التعلم كما أقرتها اللجنة العلمية في القسم. ثلاثة من هذه الحقول لا تُعدَّل بعد الإنشاء (الخطوة 3).<\/p><\/blockquote>", "text": "العمل يسير بهذا الترتيب، وكل مرحلة تعتمد على التي قبلها: # المرحلة الحساب القسم في هذا الدليل 1 إنشاء البرنامج الدراسي مدير الكلية (مدير الأنظمة في الكلية) الخطوات 1 إلى 6 2 للبوليتكنك: ضبط برنامج الدبلوم ثم إنشاء البرنامج التكميلي منه مدير الكلية البوليتكنك 1 و2 3 إضافة المواد وتوزيعها على البرنامج مقرر القسم أو رئيس القسم (المواد العامة: مدير الكلية) المواد الدراسية 4 إضافة الأبنية مدير الكلية الأبنية والقاعات 5 إضافة القاعات الدراسية حساب القسم (مقرر القسم أو رئيس القسم) الأبنية والقاعات 6 الجدول الأسبوعي وربطه بالقاعات مقرر القسم الجدول الأسبوعي 7 للبوليتكنك: تسجيل خريجي الدبلوم في التكميلي بعد تهيئة السنة الجديدة مقرر القسم البوليتكنك 3 قبل أن تبدأ: حضّر اسم البرنامج بالعربية والإنجليزية، ورمز البرنامج، ونظام التعليم، والطاقة الاستيعابية، واسمي منسق البرنامج ومديره، والرؤية والرسالة والأهداف ومخرجات التعلم كما أقرتها اللجنة العلمية في القسم. ثلاثة من هذه الحقول لا تُعدَّل بعد الإنشاء (الخطوة 3)."}, {"title": "من يملك صلاحية ماذا", "time": "", "html": "<div class=\"tw\"><table><tr><th>العمل<\/th><th>الحساب<\/th><th>ملاحظة<\/th><\/tr><tr><td>إضافة برنامج دراسي<\/td><td>مدير الكلية، ويسميه أحد الفيديوهات (مدير الأنظمة في الكلية)<\/td><td>مسجل الكلية ومقرر القسم لا يملكان صلاحية إضافة برنامج<\/td><\/tr><tr><td>إضافة مواد القسم<\/td><td>مقرر القسم أو رئيس القسم<\/td><td>على مستوى قسمهم فقط<\/td><\/tr><tr><td>إضافة المواد العامة المشتركة وتوزيعها<\/td><td>مدير الكلية<\/td><td>مثل حقوق الإنسان والرياضيات<\/td><\/tr><tr><td>إضافة الأبنية<\/td><td>مدير الكلية<\/td><td><\/td><\/tr><tr><td>إضافة القاعات<\/td><td>حساب كل قسم<\/td><td>ربط القاعة بالبناية (تابعة لـ) يقوم به مسؤول النظام<\/td><\/tr><tr><td>الجدول الأسبوعي وتهيئة السنة<\/td><td>مقرر القسم<\/td><td><\/td><\/tr><\/table><\/div><blockquote><p><strong>اختلاف بين الفيديوهات:<\/strong> فيديو إضافة البرنامج القديم يذكر أن رئيس القسم يستطيع إضافة البرنامج أيضاً، أما الفيديوهات الأحدث فتحصرها في حساب مدير الكلية. إذا لم يظهر زر (إضافة برنامج دراسي) في حسابك فالإضافة من حساب مدير الكلية.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو إضافة البرنامج والمواد، فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج الدراسي، فيديو إضافة القاعات<\/p>", "text": "العمل الحساب ملاحظة إضافة برنامج دراسي مدير الكلية، ويسميه أحد الفيديوهات (مدير الأنظمة في الكلية) مسجل الكلية ومقرر القسم لا يملكان صلاحية إضافة برنامج إضافة مواد القسم مقرر القسم أو رئيس القسم على مستوى قسمهم فقط إضافة المواد العامة المشتركة وتوزيعها مدير الكلية مثل حقوق الإنسان والرياضيات إضافة الأبنية مدير الكلية إضافة القاعات حساب كل قسم ربط القاعة بالبناية (تابعة لـ) يقوم به مسؤول النظام الجدول الأسبوعي وتهيئة السنة مقرر القسم اختلاف بين الفيديوهات: فيديو إضافة البرنامج القديم يذكر أن رئيس القسم يستطيع إضافة البرنامج أيضاً، أما الفيديوهات الأحدث فتحصرها في حساب مدير الكلية. إذا لم يظهر زر (إضافة برنامج دراسي) في حسابك فالإضافة من حساب مدير الكلية. المصدر: فيديو إضافة البرنامج والمواد، فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج الدراسي، فيديو إضافة القاعات"}, {"title": "الخطوة 1: فتح صفحة البرامج الدراسية", "time": "", "html": "<blockquote><p><strong>1.<\/strong> ادخل إلى نظام SIS بحساب <strong>مدير الكلية<\/strong>.<\/p><p><strong>2.<\/strong> افتح <strong>البرامج الدراسية<\/strong>.<\/p><p><strong>3.<\/strong> اختر السنة الدراسية والقسم إذا طُلب منك ذلك، ثم اضغط <strong>إضافة برنامج دراسي<\/strong>.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد، فيديو إضافة البرنامج الدراسي<\/p>", "text": "1. ادخل إلى نظام SIS بحساب مدير الكلية . 2. افتح البرامج الدراسية . 3. اختر السنة الدراسية والقسم إذا طُلب منك ذلك، ثم اضغط إضافة برنامج دراسي . المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد، فيديو إضافة البرنامج الدراسي"}, {"title": "الخطوة 2: اسم البرنامج والهيكل التنظيمي", "time": "", "html": "<blockquote><p><strong>1.<\/strong> اكتب اسم البرنامج بالعربية ثم بالإنجليزية، مثل: بكالوريوس هندسة الحاسوب.<\/p><p><strong>2.<\/strong> في الهيكل التنظيمي اختر الكلية ثم <strong>القسم<\/strong>، واضغط (اختر).<\/p><\/blockquote><blockquote><p><strong>مهم:<\/strong> البرنامج يُربط على مستوى القسم دائماً، وليس على مستوى الكلية، حتى في الكلية ذات القسم الواحد مثل كلية الصيدلة.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد<\/p>", "text": "1. اكتب اسم البرنامج بالعربية ثم بالإنجليزية، مثل: بكالوريوس هندسة الحاسوب. 2. في الهيكل التنظيمي اختر الكلية ثم القسم ، واضغط (اختر). مهم: البرنامج يُربط على مستوى القسم دائماً، وليس على مستوى الكلية، حتى في الكلية ذات القسم الواحد مثل كلية الصيدلة. المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد"}, {"title": "الخطوة 3: السنة الدراسية ونظام التعليم ورمز البرنامج", "time": "", "html": "<blockquote><p><strong>1.<\/strong> السنة الدراسية، مثل 2025-2026.<\/p><p><strong>2.<\/strong> نظام التعليم: بولونيا أو فصلي أو سنوي أو مقررات.<\/p><p><strong>3.<\/strong> رمز البرنامج.<\/p><p><strong>4.<\/strong> نوع الدراسة: صباحي أو مسائي.<\/p><\/blockquote><div class=\"tw\"><table><tr><th>القاعدة<\/th><th>التفصيل<\/th><\/tr><tr><td>الرمز فريد داخل الكلية<\/td><td>لا يتكرر لبرنامجين في الكلية نفسها، ويمكن أن يتكرر في كلية أخرى<\/td><\/tr><tr><td>الاستثناء<\/td><td>يُستخدم الرمز نفسه للقسم نفسه إذا اختلف نوع الدراسة (صباحي ومسائي)<\/td><\/tr><tr><td>برنامج لكل نوع دراسة<\/td><td>يُنشأ برنامج مستقل للصباحي وآخر للمسائي<\/td><\/tr><\/table><\/div><blockquote><p><strong>لا يُعدَّل بعد الإنشاء:<\/strong> السنة الدراسية ونظام التعليم ورمز البرنامج. الخطأ في أي منها يعني حذف البرنامج وإنشاءه من جديد، وحذف البرنامج يتطلب حذف المواد المرتبطة به أولاً. راجع هذه الحقول قبل الضغط على إضافة.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد، فيديو إضافة البرنامج الدراسي<\/p>", "text": "1. السنة الدراسية، مثل 2025-2026. 2. نظام التعليم: بولونيا أو فصلي أو سنوي أو مقررات. 3. رمز البرنامج. 4. نوع الدراسة: صباحي أو مسائي. القاعدة التفصيل الرمز فريد داخل الكلية لا يتكرر لبرنامجين في الكلية نفسها، ويمكن أن يتكرر في كلية أخرى الاستثناء يُستخدم الرمز نفسه للقسم نفسه إذا اختلف نوع الدراسة (صباحي ومسائي) برنامج لكل نوع دراسة يُنشأ برنامج مستقل للصباحي وآخر للمسائي لا يُعدَّل بعد الإنشاء: السنة الدراسية ونظام التعليم ورمز البرنامج. الخطأ في أي منها يعني حذف البرنامج وإنشاءه من جديد، وحذف البرنامج يتطلب حذف المواد المرتبطة به أولاً. راجع هذه الحقول قبل الضغط على إضافة. المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد، فيديو إضافة البرنامج الدراسي"}, {"title": "الخطوة 4: القبول والطاقة الاستيعابية ومنسق البرنامج ومديره", "time": "", "html": "<blockquote><p><strong>1.<\/strong> نوع القبول: مباشر أو غير مباشر (قبول مركزي).<\/p><p><strong>2.<\/strong> الطاقة الاستيعابية حسب خطة القبول.<\/p><p><strong>3.<\/strong> آلية اختيار المواد وإنشاء الحسابات: بواسطة الكلية.<\/p><p><strong>4.<\/strong> منسق البرنامج ومدير البرنامج (عادة رئيس القسم) من كادر الموارد البشرية.<\/p><\/blockquote><blockquote><p><strong>حقول البحث:<\/strong> قائمة التدريسيين لا تظهر حتى تكتب جزءاً من الاسم في مربع البحث.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد، فيديو إضافة البرنامج الدراسي<\/p>", "text": "1. نوع القبول: مباشر أو غير مباشر (قبول مركزي). 2. الطاقة الاستيعابية حسب خطة القبول. 3. آلية اختيار المواد وإنشاء الحسابات: بواسطة الكلية. 4. منسق البرنامج ومدير البرنامج (عادة رئيس القسم) من كادر الموارد البشرية. حقول البحث: قائمة التدريسيين لا تظهر حتى تكتب جزءاً من الاسم في مربع البحث. المصدر: فيديو دور مدير الكلية (النسختان)، فيديو إضافة البرنامج والمواد، فيديو إضافة البرنامج الدراسي"}, {"title": "الخطوة 5: نوع البرنامج والشهادة والتسجيل", "time": "", "html": "<blockquote><p><strong>1.<\/strong> نوع البرنامج (المستوى التعليمي): جامعية أولية، أو جامعية عليا.<\/p><p><strong>2.<\/strong> الشهادة الممنوحة: بكالوريوس أو دبلوم.<\/p><p><strong>3.<\/strong> بدء التسجيل وانتهاؤه.<\/p><p><strong>4.<\/strong> حالة التدريب الصيفي.<\/p><\/blockquote><blockquote><p><strong>للبوليتكنك:<\/strong> برنامج الدبلوم يكون: جامعية أولية، والشهادة <strong>دبلوم<\/strong>. هذا شرط لظهور خيار إنشاء البرنامج التكميلي لاحقاً.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو إضافة البرنامج الدراسي، فيديو إضافة البرنامج والمواد، فيديو آلية كليات البوليتكنك<\/p>", "text": "1. نوع البرنامج (المستوى التعليمي): جامعية أولية، أو جامعية عليا. 2. الشهادة الممنوحة: بكالوريوس أو دبلوم. 3. بدء التسجيل وانتهاؤه. 4. حالة التدريب الصيفي. للبوليتكنك: برنامج الدبلوم يكون: جامعية أولية، والشهادة دبلوم . هذا شرط لظهور خيار إنشاء البرنامج التكميلي لاحقاً. المصدر: فيديو إضافة البرنامج الدراسي، فيديو إضافة البرنامج والمواد، فيديو آلية كليات البوليتكنك"}, {"title": "الخطوة 6: الرؤية والرسالة والأهداف ثم الحفظ", "time": "", "html": "<blockquote><p><strong>1.<\/strong> رؤية القسم ورسالته.<\/p><p><strong>2.<\/strong> أهداف البرنامج ووصفه الأكاديمي ومواصفات الخريج.<\/p><p><strong>3.<\/strong> مخرجات التعلم والمهارات المستهدفة.<\/p><p><strong>4.<\/strong> اضغط <strong>إضافة<\/strong>، فيظهر البرنامج في قائمة البرامج الدراسية.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو إضافة البرنامج الدراسي، فيديو إضافة البرنامج والمواد<\/p>", "text": "1. رؤية القسم ورسالته. 2. أهداف البرنامج ووصفه الأكاديمي ومواصفات الخريج. 3. مخرجات التعلم والمهارات المستهدفة. 4. اضغط إضافة ، فيظهر البرنامج في قائمة البرامج الدراسية. المصدر: فيديو إضافة البرنامج الدراسي، فيديو إضافة البرنامج والمواد"}, {"title": "البوليتكنك 1: برنامج الدبلوم", "time": "", "html": "<p>برامج كليات البوليتكنك الحالية برامج دبلوم بمرحلتين. الطالب الذي يكمل البكالوريوس ينتقل إلى برنامج تكميلي مرتبط بالدبلوم، حتى تبقى سيرته الدراسية متصلة.<\/p><div class=\"tw\"><table><tr><th>الحقل<\/th><th>القيمة في برنامج الدبلوم<\/th><\/tr><tr><td>نوع البرنامج<\/td><td>جامعية أولية<\/td><\/tr><tr><td>الشهادة الممنوحة<\/td><td>دبلوم<\/td><\/tr><tr><td>المراحل<\/td><td>الأولى والثانية فقط<\/td><\/tr><tr><td>السنة ونظام التعليم والرمز<\/td><td>تُراجع جيداً، لأنها لا تُعدَّل وتنتقل كما هي إلى البرنامج التكميلي<\/td><\/tr><\/table><\/div><blockquote><p><strong>لا تنشئ برنامج بكالوريوس منفصلاً:<\/strong> الكليات التي أنشأت برنامج بكالوريوس مستقلاً لن تستطيع ربط خريجي الدبلوم به، ويجب حذفه واعتماد البرنامج التكميلي.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو آلية كليات البوليتكنك<\/p>", "text": "برامج كليات البوليتكنك الحالية برامج دبلوم بمرحلتين. الطالب الذي يكمل البكالوريوس ينتقل إلى برنامج تكميلي مرتبط بالدبلوم، حتى تبقى سيرته الدراسية متصلة. الحقل القيمة في برنامج الدبلوم نوع البرنامج جامعية أولية الشهادة الممنوحة دبلوم المراحل الأولى والثانية فقط السنة ونظام التعليم والرمز تُراجع جيداً، لأنها لا تُعدَّل وتنتقل كما هي إلى البرنامج التكميلي لا تنشئ برنامج بكالوريوس منفصلاً: الكليات التي أنشأت برنامج بكالوريوس مستقلاً لن تستطيع ربط خريجي الدبلوم به، ويجب حذفه واعتماد البرنامج التكميلي. المصدر: فيديو آلية كليات البوليتكنك"}, {"title": "البوليتكنك 2: إنشاء البرنامج التكميلي", "time": "", "html": "<blockquote><p><strong>1.<\/strong> افتح برنامج الدبلوم من البرامج الدراسية، واختر <strong>إنشاء برنامج تكميلي<\/strong>. يظهر هذا الخيار لكليات البوليتكنك فقط.<\/p><p><strong>2.<\/strong> راجع الحقول الثابتة التي ينقلها النظام من الدبلوم.<\/p><p><strong>3.<\/strong> أدخل الحقول المتغيرة.<\/p><p><strong>4.<\/strong> أدخل التدريب الصيفي إن وُجد، ثم اضغط إضافة.<\/p><\/blockquote><div class=\"tw\"><table><tr><th>حقول ثابتة (من الدبلوم)<\/th><th>حقول تُدخلها للتكميلي<\/th><\/tr><tr><td>الهيكل التنظيمي<\/td><td>اسم البرنامج بالعربية<\/td><\/tr><tr><td>السنة الدراسية<\/td><td>اسم البرنامج بالإنجليزية<\/td><\/tr><tr><td>نظام التعليم<\/td><td>رمز البرنامج<\/td><\/tr><tr><td>نوع القبول<\/td><td>الطاقة الاستيعابية<\/td><\/tr><tr><td>نوع الدراسة (صباحي يبقى صباحي)<\/td><td>منسق البرنامج<\/td><\/tr><tr><td>نوع البرنامج: جامعية أولية<\/td><td>مدير البرنامج<\/td><\/tr><tr><td>الشهادة: بكالوريوس<\/td><td>التدريب الصيفي والتفاصيل الأخرى<\/td><\/tr><\/table><\/div><blockquote><p><strong>◂<\/strong> إذا لم يظهر الخيار: تأكد أن البرنامج الأصلي شهادته دبلوم وأن فيه مرحلتين فقط، وعدّله إن لزم.<\/p><p><strong>◂<\/strong> الحقول الثابتة لا تُعدَّل من داخل التكميلي، فصحّحها في الدبلوم قبل الإنشاء.<\/p><p><strong>◂<\/strong> بعد الإضافة يظهر البرنامجان متتاليين وبينهما علامة ربط، ومراحل التكميلي هي الثالثة والرابعة (ويمكن إضافة الخامسة والسادسة عند الحاجة).<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو آلية كليات البوليتكنك<\/p>", "text": "1. افتح برنامج الدبلوم من البرامج الدراسية، واختر إنشاء برنامج تكميلي . يظهر هذا الخيار لكليات البوليتكنك فقط. 2. راجع الحقول الثابتة التي ينقلها النظام من الدبلوم. 3. أدخل الحقول المتغيرة. 4. أدخل التدريب الصيفي إن وُجد، ثم اضغط إضافة. حقول ثابتة (من الدبلوم) حقول تُدخلها للتكميلي الهيكل التنظيمي اسم البرنامج بالعربية السنة الدراسية اسم البرنامج بالإنجليزية نظام التعليم رمز البرنامج نوع القبول الطاقة الاستيعابية نوع الدراسة (صباحي يبقى صباحي) منسق البرنامج نوع البرنامج: جامعية أولية مدير البرنامج الشهادة: بكالوريوس التدريب الصيفي والتفاصيل الأخرى ◂ إذا لم يظهر الخيار: تأكد أن البرنامج الأصلي شهادته دبلوم وأن فيه مرحلتين فقط، وعدّله إن لزم. ◂ الحقول الثابتة لا تُعدَّل من داخل التكميلي، فصحّحها في الدبلوم قبل الإنشاء. ◂ بعد الإضافة يظهر البرنامجان متتاليين وبينهما علامة ربط، ومراحل التكميلي هي الثالثة والرابعة (ويمكن إضافة الخامسة والسادسة عند الحاجة). المصدر: فيديو آلية كليات البوليتكنك"}, {"title": "البوليتكنك 3: متى يُستخدم البرنامج التكميلي", "time": "", "html": "<p>تسجيل الطالب في التكميلي لا يعمل إلا باجتماع ثلاثة أمور:<\/p><blockquote><p><strong>1.<\/strong> برنامج دبلوم بمرحلتين أُنشئ منه البرنامج التكميلي.<\/p><p><strong>2.<\/strong> طالب له سيرة دراسية على المرحلة الثانية، وحالته <strong>متخرج<\/strong> (من إدارة التخرج ← تحديث حالة التسجيل).<\/p><p><strong>3.<\/strong> نسخة السنة الأعلى من التكميلي (مثلاً 2026-2027)، وهذه لا تُنشأ يدوياً بل تأتي من <strong>تهيئة السنة الدراسية<\/strong> في إدارة الترحيل.<\/p><\/blockquote><p>بعدها من طلاب برنامج الدبلوم يُحدد المتخرجون ويُضغط <strong>تسجيل الطلاب في البرنامج التكميلي<\/strong>، ويُراجع ملف Excel الذي يبين من قُبل ومن رُفض. التفاصيل الكاملة في شرح تسجيل طلبة البوليتكنك.<\/p><p class=\"srcline\">المصدر: فيديو آلية كليات البوليتكنك، فيديو تهيئة العام الدراسي<\/p>", "text": "تسجيل الطالب في التكميلي لا يعمل إلا باجتماع ثلاثة أمور: 1. برنامج دبلوم بمرحلتين أُنشئ منه البرنامج التكميلي. 2. طالب له سيرة دراسية على المرحلة الثانية، وحالته متخرج (من إدارة التخرج ← تحديث حالة التسجيل). 3. نسخة السنة الأعلى من التكميلي (مثلاً 2026-2027)، وهذه لا تُنشأ يدوياً بل تأتي من تهيئة السنة الدراسية في إدارة الترحيل. بعدها من طلاب برنامج الدبلوم يُحدد المتخرجون ويُضغط تسجيل الطلاب في البرنامج التكميلي ، ويُراجع ملف Excel الذي يبين من قُبل ومن رُفض. التفاصيل الكاملة في شرح تسجيل طلبة البوليتكنك. المصدر: فيديو آلية كليات البوليتكنك، فيديو تهيئة العام الدراسي"}, {"title": "المواد الدراسية للبرنامج", "time": "", "html": "<blockquote><p><strong>1.<\/strong> المواد تُضاف من (المواد الدراسية ← إضافة المواد الدراسية)، مادةً مادة.<\/p><p><strong>2.<\/strong> نظام التعليم ورقم الإصدار، والاسم بالعربية والإنجليزية، والرمز، وعدد الوحدات (ECTS في بولونيا).<\/p><p><strong>3.<\/strong> التصنيف: أساسية أو رئيسية أو ساندة أو اختيارية.<\/p><p><strong>4.<\/strong> نوع النتيجة: درجة من 100، و<strong>الدرجة الصغرى للنجاح 50<\/strong>.<\/p><p><strong>5.<\/strong> ساعات الامتحان النهائي (غالباً 3)، والحالة <strong>منشور<\/strong> لتظهر للطالب.<\/p><p><strong>6.<\/strong> مستوى التوزيع: الكلية للمواد العامة المشتركة، والقسم للمواد التخصصية.<\/p><p><strong>7.<\/strong> مسؤول المادة وعدد الطلبة التقديري، ثم الحفظ.<\/p><\/blockquote><blockquote><p><strong>المواد المشتركة:<\/strong> مادة مثل حقوق الإنسان موجودة أصلاً على مستوى الكلية، فلا تُنشأ من جديد للقسم المستحدث. يكفي أن يضيف مدير الكلية مستوى توزيع لها على البرنامج الجديد.<\/p><\/blockquote><blockquote><p><strong>تحقق من درجة النجاح:<\/strong> في إحدى الحالات كانت الدرجة الصغرى للنجاح 51 فظهر الطالب الحاصل على 50 راسباً، والحقل لم يعد قابلاً للتعديل بعد ربط الطلاب. راجعها عند الإضافة.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو إضافة البرنامج والمواد، فيديو إضافة المواد الدراسية، فيديو دور مدير الكلية (النسختان)، مجموعات واتساب<\/p>", "text": "1. المواد تُضاف من (المواد الدراسية ← إضافة المواد الدراسية)، مادةً مادة. 2. نظام التعليم ورقم الإصدار، والاسم بالعربية والإنجليزية، والرمز، وعدد الوحدات (ECTS في بولونيا). 3. التصنيف: أساسية أو رئيسية أو ساندة أو اختيارية. 4. نوع النتيجة: درجة من 100، و الدرجة الصغرى للنجاح 50 . 5. ساعات الامتحان النهائي (غالباً 3)، والحالة منشور لتظهر للطالب. 6. مستوى التوزيع: الكلية للمواد العامة المشتركة، والقسم للمواد التخصصية. 7. مسؤول المادة وعدد الطلبة التقديري، ثم الحفظ. المواد المشتركة: مادة مثل حقوق الإنسان موجودة أصلاً على مستوى الكلية، فلا تُنشأ من جديد للقسم المستحدث. يكفي أن يضيف مدير الكلية مستوى توزيع لها على البرنامج الجديد. تحقق من درجة النجاح: في إحدى الحالات كانت الدرجة الصغرى للنجاح 51 فظهر الطالب الحاصل على 50 راسباً، والحقل لم يعد قابلاً للتعديل بعد ربط الطلاب. راجعها عند الإضافة. المصدر: فيديو إضافة البرنامج والمواد، فيديو إضافة المواد الدراسية، فيديو دور مدير الكلية (النسختان)، مجموعات واتساب"}, {"title": "الأبنية والقاعات الدراسية", "time": "", "html": "<p>الجدول الأسبوعي يعتمد على القاعات، والقاعة تتبع بناية، لذلك تُضاف البناية أولاً.<\/p><p class=\"subh\">أ. البناية (حساب مدير الكلية)<\/p><blockquote><p><strong>1.<\/strong> من قائمة <strong>الأبنية والمنشآت<\/strong> تُضاف البناية الرئيسية للكلية.<\/p><\/blockquote><p class=\"subh\">ب. القاعة (حساب القسم)<\/p><blockquote><p><strong>1.<\/strong> ادخل بحساب القسم، وافتح <strong>الأبنية والمنشآت<\/strong> ← إضافة أبنية ومنشآت جديدة.<\/p><p><strong>2.<\/strong> اسم القاعة بالعربية والإنجليزية، مثل: قاعة المرحلة الثانية.<\/p><p><strong>3.<\/strong> رمز القاعة (الكود)، مثل CO42.<\/p><p><strong>4.<\/strong> الهيكل التنظيمي: القسم الأكاديمي.<\/p><p><strong>5.<\/strong> تاريخ التأسيس، ثم <strong>إضافة<\/strong>.<\/p><\/blockquote><blockquote><p><strong>حقل (تابعة لـ):<\/strong> ربط القاعة بالبناية لا يملكه مقرر القسم ولا مدير الكلية، بل يربطه مسؤول النظام لاحقاً. بعد الربط تظهر القاعة في القائمة مرتبطة بالبناية، مثل بناية B1.<\/p><\/blockquote><blockquote><p><strong>المطلوب مبدئياً:<\/strong> أربع قاعات لكل قسم.<\/p><\/blockquote><blockquote><p><strong>اختلاف بين الفيديوهات:<\/strong> شرح تهيئة العام الدراسي ينسب إضافة القاعات إلى حساب رئيس القسم، وفيديو القاعات إلى حساب كل قسم. استخدم حساب القسم الذي يظهر فيه خيار الإضافة.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو إضافة القاعات، فيديو تهيئة العام الدراسي<\/p>", "text": "الجدول الأسبوعي يعتمد على القاعات، والقاعة تتبع بناية، لذلك تُضاف البناية أولاً. أ. البناية (حساب مدير الكلية) 1. من قائمة الأبنية والمنشآت تُضاف البناية الرئيسية للكلية. ب. القاعة (حساب القسم) 1. ادخل بحساب القسم، وافتح الأبنية والمنشآت ← إضافة أبنية ومنشآت جديدة. 2. اسم القاعة بالعربية والإنجليزية، مثل: قاعة المرحلة الثانية. 3. رمز القاعة (الكود)، مثل CO42. 4. الهيكل التنظيمي: القسم الأكاديمي. 5. تاريخ التأسيس، ثم إضافة . حقل (تابعة لـ): ربط القاعة بالبناية لا يملكه مقرر القسم ولا مدير الكلية، بل يربطه مسؤول النظام لاحقاً. بعد الربط تظهر القاعة في القائمة مرتبطة بالبناية، مثل بناية B1. المطلوب مبدئياً: أربع قاعات لكل قسم. اختلاف بين الفيديوهات: شرح تهيئة العام الدراسي ينسب إضافة القاعات إلى حساب رئيس القسم، وفيديو القاعات إلى حساب كل قسم. استخدم حساب القسم الذي يظهر فيه خيار الإضافة. المصدر: فيديو إضافة القاعات، فيديو تهيئة العام الدراسي"}, {"title": "الجدول الأسبوعي وربط القاعات", "time": "", "html": "<blockquote><p><strong>1.<\/strong> من حساب <strong>مقرر القسم<\/strong> يُضاف الجدول الأسبوعي لكل المراحل والبرامج.<\/p><p><strong>2.<\/strong> يُربط جدول كل مرحلة أو شعبة بقاعتها.<\/p><\/blockquote><blockquote><p><strong>الترتيب إلزامي:<\/strong> الأبنية، ثم القاعات، ثم الجدول الأسبوعي.<\/p><\/blockquote><blockquote><p><strong>علاقته بـ IQ Learn:<\/strong> الطلبة لا يظهرون في IQ Learn حتى يُربطوا بمواد السنة الجديدة، ويُدخلوا في الشعب والمجاميع، ويُضاف الجدول الأسبوعي.<\/p><\/blockquote><p class=\"srcline\">المصدر: فيديو تهيئة العام الدراسي، مجموعات واتساب<\/p>", "text": "1. من حساب مقرر القسم يُضاف الجدول الأسبوعي لكل المراحل والبرامج. 2. يُربط جدول كل مرحلة أو شعبة بقاعتها. الترتيب إلزامي: الأبنية، ثم القاعات، ثم الجدول الأسبوعي. علاقته بـ IQ Learn: الطلبة لا يظهرون في IQ Learn حتى يُربطوا بمواد السنة الجديدة، ويُدخلوا في الشعب والمجاميع، ويُضاف الجدول الأسبوعي. المصدر: فيديو تهيئة العام الدراسي، مجموعات واتساب"}, {"title": "أخطاء شائعة وحلولها", "time": "", "html": "<div class=\"tw\"><table><tr><th>الخطأ<\/th><th>ما يحدث<\/th><th>الحل أو الوقاية<\/th><\/tr><tr><td>خطأ في السنة أو نظام التعليم أو رمز البرنامج<\/td><td>لا يمكن التعديل<\/td><td>حذف البرنامج وإنشاؤه من جديد، بعد حذف المواد المرتبطة<\/td><\/tr><tr><td>حذف برنامج مرتبط بمواد<\/td><td>النظام يرفض الحذف<\/td><td>يُحذف توزيع المادة أولاً ثم المادة، وإن كانت مرتبطة باللجنة الامتحانية تُحذف من قوائم درجات المادة في نظام الامتحانات<\/td><\/tr><tr><td>برنامج بكالوريوس منفصل في البوليتكنك<\/td><td>لا يمكن ربط خريجي الدبلوم به<\/td><td>حذفه وإنشاء برنامج تكميلي من داخل الدبلوم<\/td><\/tr><tr><td>خيار البرنامج التكميلي لا يظهر<\/td><td><\/td><td>شهادة الأصل دبلوم، ومرحلتان فقط<\/td><\/tr><tr><td>الهيكل التنظيمي على مستوى الكلية<\/td><td><\/td><td>يجب أن يكون على مستوى القسم<\/td><\/tr><tr><td>الدرجة الصغرى للنجاح غير 50<\/td><td>الحاصل على 50 يظهر راسباً<\/td><td>مراجعتها عند إضافة المادة<\/td><\/tr><tr><td>الطلبة لا يظهرون في IQ Learn<\/td><td><\/td><td>ربط المواد، والشعب والمجاميع، والجدول الأسبوعي<\/td><\/tr><\/table><\/div><p class=\"srcline\">المصدر: فيديو دور مدير الكلية (النسختان)، فيديو آلية كليات البوليتكنك، مجموعات واتساب<\/p>", "text": "الخطأ ما يحدث الحل أو الوقاية خطأ في السنة أو نظام التعليم أو رمز البرنامج لا يمكن التعديل حذف البرنامج وإنشاؤه من جديد، بعد حذف المواد المرتبطة حذف برنامج مرتبط بمواد النظام يرفض الحذف يُحذف توزيع المادة أولاً ثم المادة، وإن كانت مرتبطة باللجنة الامتحانية تُحذف من قوائم درجات المادة في نظام الامتحانات برنامج بكالوريوس منفصل في البوليتكنك لا يمكن ربط خريجي الدبلوم به حذفه وإنشاء برنامج تكميلي من داخل الدبلوم خيار البرنامج التكميلي لا يظهر شهادة الأصل دبلوم، ومرحلتان فقط الهيكل التنظيمي على مستوى الكلية يجب أن يكون على مستوى القسم الدرجة الصغرى للنجاح غير 50 الحاصل على 50 يظهر راسباً مراجعتها عند إضافة المادة الطلبة لا يظهرون في IQ Learn ربط المواد، والشعب والمجاميع، والجدول الأسبوعي المصدر: فيديو دور مدير الكلية (النسختان)، فيديو آلية كليات البوليتكنك، مجموعات واتساب"}, {"title": "قائمة تدقيق", "time": "", "html": "<div class=\"tw\"><table><tr><th>#<\/th><th>البند<\/th><th>الحساب<\/th><\/tr><tr><td>1<\/td><td>الهيكل التنظيمي على مستوى القسم<\/td><td>مدير الكلية<\/td><\/tr><tr><td>2<\/td><td>السنة ونظام التعليم والرمز صحيحة قبل الحفظ<\/td><td>مدير الكلية<\/td><\/tr><tr><td>3<\/td><td>برنامج مستقل للصباحي وآخر للمسائي<\/td><td>مدير الكلية<\/td><\/tr><tr><td>4<\/td><td>القبول والطاقة والمنسق والمدير<\/td><td>مدير الكلية<\/td><\/tr><tr><td>5<\/td><td>البوليتكنك: الدبلوم جامعية أولية، شهادة دبلوم، مرحلتان<\/td><td>مدير الكلية<\/td><\/tr><tr><td>6<\/td><td>البوليتكنك: البرنامج التكميلي أُنشئ من داخل الدبلوم<\/td><td>مدير الكلية<\/td><\/tr><tr><td>7<\/td><td>الرؤية والرسالة والأهداف ومخرجات التعلم<\/td><td>مدير الكلية<\/td><\/tr><tr><td>8<\/td><td>المواد: درجة النجاح 50، الحالة منشور، مستوى التوزيع صحيح<\/td><td>مقرر القسم / رئيس القسم<\/td><\/tr><tr><td>9<\/td><td>المواد المشتركة موزعة على البرنامج الجديد<\/td><td>مدير الكلية<\/td><\/tr><tr><td>10<\/td><td>البناية الرئيسية مضافة<\/td><td>مدير الكلية<\/td><\/tr><tr><td>11<\/td><td>أربع قاعات للقسم بأسمائها ورموزها<\/td><td>حساب القسم<\/td><\/tr><tr><td>12<\/td><td>الجدول الأسبوعي مربوط بالقاعات<\/td><td>مقرر القسم<\/td><\/tr><\/table><\/div>", "text": "# البند الحساب 1 الهيكل التنظيمي على مستوى القسم مدير الكلية 2 السنة ونظام التعليم والرمز صحيحة قبل الحفظ مدير الكلية 3 برنامج مستقل للصباحي وآخر للمسائي مدير الكلية 4 القبول والطاقة والمنسق والمدير مدير الكلية 5 البوليتكنك: الدبلوم جامعية أولية، شهادة دبلوم، مرحلتان مدير الكلية 6 البوليتكنك: البرنامج التكميلي أُنشئ من داخل الدبلوم مدير الكلية 7 الرؤية والرسالة والأهداف ومخرجات التعلم مدير الكلية 8 المواد: درجة النجاح 50، الحالة منشور، مستوى التوزيع صحيح مقرر القسم / رئيس القسم 9 المواد المشتركة موزعة على البرنامج الجديد مدير الكلية 10 البناية الرئيسية مضافة مدير الكلية 11 أربع قاعات للقسم بأسمائها ورموزها حساب القسم 12 الجدول الأسبوعي مربوط بالقاعات مقرر القسم"}], النزول إلى آخر القائمة والضغط على معلومات الطلبة ."}, {"title": "الخطوة 2: فتح واجهة الرفع والمعالجة", "time": "00:10", "html": "<blockquote>\n<p><strong>1.<\/strong> في نافذة معلومات الطلبة، النزول\nإلى <strong>خيارات المعالجة والتصدير<\/strong>.<\/p>\n<p><strong>2.<\/strong> تظهر خياران: رفع ومعالجة، أو\nتصدير. يُختار <strong>رفع ومعالجة<\/strong>.<\/p>\n<p><strong>3.<\/strong> تظهر واجهة <strong>رفع ومعالجة\nبيانات الطالب<\/strong>، وهي تطلب ملف Excel.<\/p>\n<\/blockquote>", "text": "1. في نافذة معلومات الطلبة، النزول\nإلى خيارات المعالجة والتصدير . 2. تظهر خياران: رفع ومعالجة، أو\nتصدير. يُختار رفع ومعالجة . 3. تظهر واجهة رفع ومعالجة\nبيانات الطالب ، وهي تطلب ملف Excel."}, {"title": "الخطوة 3: تحميل نموذج بيانات الطلبة", "time": "00:30", "html": "<p>من الواجهة نفسها يُضغط على <strong>نموذج بيانات\nالطلبة<\/strong> ثم <strong>تحميل<\/strong>. هذا النموذج هو الملف المطلوب\nملؤه، ولا يُستبدل بملف آخر مهما تشابهت أعمدته.<\/p>", "text": "من الواجهة نفسها يُضغط على نموذج بيانات\nالطلبة ثم تحميل . هذا النموذج هو الملف المطلوب\nملؤه، ولا يُستبدل بملف آخر مهما تشابهت أعمدته."}, {"title": "الخطوة 4: ملء حقول النموذج", "time": "00:49", "html": "<p>الحقول التي ذكرها الفيديو وطريقة كتابة كل\nمنها:<\/p><div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>الحقل<\/strong><\/th>\n<th><strong>طريقة الكتابة<\/strong><\/th>\n<th><strong>مثال أو رمز<\/strong><\/th>\n<\/tr>\n<tr>\n<th>أسماء الطالب (الأول، الأب، الجد، الرابع)<\/th>\n<th>كل جزء في حقله<\/th>\n<th>منتظر / جواد / كاظم / سلطان<\/th>\n<\/tr>\n<tr>\n<th>اسم الأم (الأول، الثاني، الثالث)<\/th>\n<th>كل جزء في حقله<\/th>\n<th>نص<\/th>\n<\/tr>\n<tr>\n<th>الجنس<\/th>\n<th>رمز رقمي<\/th>\n<th>ذكر = 1، أنثى = 2<\/th>\n<\/tr>\n<tr>\n<th>المحافظة<\/th>\n<th>رمز رقمي من ورقة الترميز<\/th>\n<th>النجف = 8<\/th>\n<\/tr>\n<tr>\n<th>اسم العائلة<\/th>\n<th>اللقب أو العشيرة<\/th>\n<th>نص<\/th>\n<\/tr>\n<tr>\n<th>الجنسية<\/th>\n<th>رمز رقمي<\/th>\n<th>عراقي = 1، أجنبي = 3<\/th>\n<\/tr>\n<tr>\n<th>رقم الهاتف<\/th>\n<th>هاتف الطالب<\/th>\n<th>يُكتب نصاً<\/th>\n<\/tr>\n<tr>\n<th>البريد الإلكتروني<\/th>\n<th>بريد الطالب<\/th>\n<th>name@example.com<\/th>\n<\/tr>\n<tr>\n<th>الاسم الرباعي<\/th>\n<th>الاسم كاملاً في حقل واحد<\/th>\n<th>منتظر جواد كاظم سلطان<\/th>\n<\/tr>\n<tr>\n<th>الرقم الامتحاني<\/th>\n<th>رقم الطالب الامتحاني<\/th>\n<th>يُكتب نصاً<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div><blockquote>\n<p><strong>ملاحظة:<\/strong> ترتيب الأعمدة وأسماؤها\nالدقيقة هي ما في النموذج المحمّل من النظام. الجدول أعلاه يلخص ما ورد في\nالفيديو، والنموذج هو المرجع عند أي اختلاف.<\/p>\n<\/blockquote>", "text": "الحقول التي ذكرها الفيديو وطريقة كتابة كل\nمنها: الحقل طريقة الكتابة مثال أو رمز أسماء الطالب (الأول، الأب، الجد، الرابع) كل جزء في حقله منتظر / جواد / كاظم / سلطان اسم الأم (الأول، الثاني، الثالث) كل جزء في حقله نص الجنس رمز رقمي ذكر = 1، أنثى = 2 المحافظة رمز رقمي من ورقة الترميز النجف = 8 اسم العائلة اللقب أو العشيرة نص الجنسية رمز رقمي عراقي = 1، أجنبي = 3 رقم الهاتف هاتف الطالب يُكتب نصاً البريد الإلكتروني بريد الطالب name@example.com الاسم الرباعي الاسم كاملاً في حقل واحد منتظر جواد كاظم سلطان الرقم الامتحاني رقم الطالب الامتحاني يُكتب نصاً ملاحظة: ترتيب الأعمدة وأسماؤها\nالدقيقة هي ما في النموذج المحمّل من النظام. الجدول أعلاه يلخص ما ورد في\nالفيديو، والنموذج هو المرجع عند أي اختلاف."}, {"title": "الخطوة 5: ترميز المحافظة والجنس والجنسية", "time": "01:00", "html": "<p>هذه أهم نقطة في الفيديو. لا يُكتب اسم المحافظة (النجف،\nبابل، الديوانية...) ولا كلمة ذكر أو أنثى، بل الرقم المقابل لها في ورقة\nالترميز داخل النموذج. وحتى لو كان جميع الطلبة عراقيين، تُكتب الجنسية\nرمزاً.<\/p><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRrBSAABXRUJQVlA4IKRSAACwnAGdASpMBOIBPnk6mUkkoyWhIxELSLAPCWNu+/v3TAK/T5JnqefuVf+N/eN6L7v/gf3P90P8F8CXIvg7vx64P93zU7Q8qTorzr/7n1H/1X/UewP/k/LT9TH+H/7/qK/q3/M/c73af9j+6Xu9/vfqAf3H0r//b7IH+J/8/slfzj/f///18/Zp/vX/u9ZH/v9fj0o/T7+1f3j9ivB3+5f3P+9f6r0D/G/nH7n/bP7z/pv7t/8vfl/1fGh1X5l/x77Mfiv75+5P+D+ ogle:<\/strong> اجعل حقول المحافظة والجنس قوائم منسدلة حتى تأتي الأسماء\nموحّدة. بعد تنزيل الإجابات بملف Excel، استخدم (بحث واستبدال) لتبديل كل\nاسم برمزه. ملف Excel المرافق لهذا الدليل يقوم بهذا التبديل\nآلياً.<\/p>", "text": "هذه أهم نقطة في الفيديو. لا يُكتب اسم المحافظة (النجف،\nبابل، الديوانية...) ولا كلمة ذكر أو أنثى، بل الرقم المقابل لها في ورقة\nالترميز داخل النموذج. وحتى لو كان جميع الطلبة عراقيين، تُكتب الجنسية\nرمزاً. إذا جُمعت البيانات من الطلبة بنموذج\nGoogle: اجعل حقول المحافظة والجنس قوائم منسدلة حتى تأتي الأسماء\nموحّدة. بعد تنزيل الإجابات بملف Excel، استخدم (بحث واستبدال) لتبديل كل\nاسم برمزه. ملف Excel المرافق لهذا الدليل يقوم بهذا التبديل\nآلياً."}, {"title": "الخطوة 6: الاسم الرباعي والرقم الامتحاني", "time": "02:20", "html": "<p>الاسم يُكتب مرتين في النموذج: مرة موزعاً على حقول\nالأسماء، ومرة كاملاً في حقل الاسم الرباعي. يليه الرقم الامتحاني. إذا\nالتزم الملف بهذه الطريقة يقبله البرنامج، وبغيرها لا يقبله.<\/p>", "text": "الاسم يُكتب مرتين في النموذج: مرة موزعاً على حقول\nالأسماء، ومرة كاملاً في حقل الاسم الرباعي. يليه الرقم الامتحاني. إذا\nالتزم الملف بهذه الطريقة يقبله البرنامج، وبغيرها لا يقبله."}, {"title": "الخطوة 7: تقسيم الطلبة حسب قناة القبول", "time": "02:45", "html": "<p>قناة القبول تُختار عند الرفع لكل ملف، لذلك لا يُخلط\nطلبة القنوات في ملف واحد. يُعدّ ملف Excel مستقل لكل قناة، مثلاً:<\/p><blockquote>\n<p><strong>◂<\/strong> ملف للدراسة الصباحية (القبول\nالمركزي).<\/p>\n<p><strong>◂<\/strong> ملف للدراسة المسائية.<\/p>\n<p><strong>◂<\/strong> ملف للدراسة الموازية في الأقسام\nالتي فيها موازي.<\/p>\n<p><strong>◂<\/strong> ملف لذوي الشهداء، وملف لضحايا\nالإرهاب، وهكذا لكل فئة.<\/p>\n<\/blockquote><p>تظهر في النظام قنوات كثيرة (حكومي، خاص، قناة عامة،\nنخبة، وغيرها)، ويُختار منها ما يطابق طلبة كل ملف. طريقة الرفع واحدة لكل\nالملفات.<\/p><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRhhAAABXRUJQVlA4IAxAAABwVgGdASpMBMQBPnk8mkmkoyWhItIKWLAPCWdu/D65bu+eE/M/KWRv9C9j+/bUY8WOwfMI6A86n+1/7vsg/q/qEf5DoPfu76gP2f9Xr/kf  فيها موازي. ◂ ملف لذوي الشهداء، وملف لضحايا\nالإرهاب، وهكذا لكل فئة. تظهر في النظام قنوات كثيرة (حكومي، خاص، قناة عامة،\nنخبة، وغيرها)، ويُختار منها ما يطابق طلبة كل ملف. طريقة الرفع واحدة لكل\nالملفات."}, {"title": "الخطوة 8: إدخال بيانات الرفع ورفع الملف", "time": "02:50", "html": "<blockquote>\n<p><strong>1.<\/strong> <strong>الهيكل التنظيمي:<\/strong>\nاختيار الجامعة ثم الكلية أو المعهد ثم القسم. المثال في الفيديو: جامعة\nالفرات الأوسط التقنية، المعهد التقني كوفة.<\/p>\n<p><strong>2.<\/strong> <strong>حالة القبول:<\/strong>\nمستمر.<\/p>\n<p><strong>3.<\/strong> <strong>قناة القبول:<\/strong>\nالقناة المطابقة لطلبة هذا الملف.<\/p>\n<p><strong>4.<\/strong> <strong>السنة الدراسية<\/strong>\nو<strong>البرنامج الدراسي<\/strong> و<strong>المرحلة\nالدراسية<\/strong>.<\/p>\n<p><strong>5.<\/strong> اختيار ملف Excel المُعدّ لهذه\nالقناة.<\/p>\n<p><strong>6.<\/strong> الضغط على <strong>رفع<\/strong> ثم\n<strong>إضافة<\/strong>.<\/p>\n<\/blockquote>", "text": "1. الهيكل التنظيمي: اختيار الجامعة ثم الكلية أو المعهد ثم القسم. المثال في الفيديو: جامعة\nالفرات الأوسط التقنية، المعهد التقني كوفة. 2. حالة القبول: مستمر. 3. قناة القبول: القناة المطابقة لطلبة هذا الملف. 4. السنة الدراسية و البرنامج الدراسي و المرحلة\nالدراسية . 5. اختيار ملف Excel المُعدّ لهذه\nالقناة. 6. الضغط على رفع ثم إضافة ."}, {"title": "الخطوة 9: تكرار الرفع لبقية القنوات", "time": "03:21", "html": "<p>تُعاد الخطوة 8 لكل ملف، مع تغيير قناة القبول في كل مرة\nبما يطابق الملف المرفوع.<\/p>", "text": "تُعاد الخطوة 8 لكل ملف، مع تغيير قناة القبول في كل مرة\nبما يطابق الملف المرفوع."}, {"title": "استخدام ملف Excel المرافق", "time": "", "html": "<p>الملف (تحضير_بيانات_الطلبة_SIS.xlsx) ملف مساعد لتجهيز\nالبيانات قبل نقلها إلى النموذج الرسمي، ولا يُرفع بنفسه. يحتوي على خمس\nأوراق:<\/p><div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>الورقة<\/strong><\/th>\n<th><strong>وظيفتها<\/strong><\/th>\n<\/tr>\n<tr>\n<th>التعليمات<\/th>\n<th>خطوات الاستخدام ودليل الألوان.<\/th>\n<\/tr>\n<tr>\n<th>إدخال البيانات<\/th>\n<th>تُكتب فيها بيانات الطلبة، والجنس والمحافظة والجنسية\nوالقناة من قوائم منسدلة. فيها 300 صف.<\/th>\n<\/tr>\n<tr>\n<th>البيانات المرمزة<\/th>\n<th>تُحسب آلياً: تحويل الأسماء إلى رموز، وتكوين الاسم\nالرباعي، وعمود (حالة السجل) يبيّن جاهز أو بيانات ناقصة أو راجع\nالترميز.<\/th>\n<\/tr>\n<tr>\n<th>ملخص القنوات<\/th>\n<th>عدد الطلبة في كل قناة، والجاهز منهم، واسم مقترح لملف\nكل قناة.<\/th>\n<\/tr>\n<tr>\n<th>الترميز<\/th>\n<th>رموز الجنس والجنسية والمحافظات وقائمة\nالقنوات.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div><blockquote>\n<p><strong>1.<\/strong> انقل رموز المحافظات من ورقة\nالترميز في النموذج الرسمي إلى الخلايا الصفراء في ورقة (الترميز). رمز\nالنجف مُدخل مسبقاً.<\/p>\n<p><strong>2.<\/strong> احذف صف المثال في ورقة (إدخال\nالبيانات) واكتب بيانات الطلبة.<\/p>\n<p><strong>3.<\/strong> تأكد أن كل الطلبة بحالة (جاهز) في\nورقة (البيانات المرمزة).<\/p>\n<p><strong>4.<\/strong> صفِّ الورقة حسب قناة القبول، وانسخ\nأعمدة القناة الواحدة.<\/p>\n<p><strong>5.<\/strong> ألصقها في النموذج الرسمي بـ (لصق\nخاص ← قيم فقط)، بنفس ترتيب أعمدته، واحفظ ملفاً لكل قناة.<\/p>\n<p><strong>مهم:<\/strong> الفيديو يذكر رمز النجف فقط. لم\nأضع رموز بقية المحافظات تخميناً، لأن رمزاً واحداً خاطئاً يكفي لرفض الملف.\nتُنقل من النموذج الرسمي مرة واحدة ثم تُستخدم دائماً.<\/p>\n<\/blockquote>", "text": "الملف (تحضير_بيانات_الطلبة_SIS.xlsx) ملف مساعد لتجهيز\nالبيانات قبل نقلها إلى النموذج الرسمي، ولا يُرفع بنفسه. يحتوي على خمس\nأوراق: الورقة وظيفتها التعليمات خطوات الاستخدام ودليل الألوان. إدخال البيانات تُكتب فيها بيانات الطلبة، والجنس والمحافظة والجنسية\nوالقناة من قوائم منسدلة. فيها 300 صف. البيانات المرمزة تُحسب آلياً: تحويل الأسماء إلى رموز، وتكوين الاسم\nالرباعي، وعمود (حالة السجل) يبيّن جاهز أو بيانات ناقصة أو راجع\nالترميز. ملخص القنوات عدد الطلبة في كل قناة، والجاهز منهم، واسم مقترح لملف\nكل قناة. الترميز رموز الجنس والجنسية والمحافظات وقائمة\nالقنوات. 1. انقل رموز المحافظات من ورقة\nالترميز في النموذج الرسمي إلى الخلايا الصفراء في ورقة (الترميز). رمز\nالنجف مُدخل مسبقاً. 2. احذف صف المثال في ورقة (إدخال\nالبيانات) واكتب بيانات الطلبة. 3. تأكد أن كل الطلبة بحالة (جاهز) في\nورقة (البيانات المرمزة). 4. صفِّ الورقة حسب قناة القبول، وانسخ\nأعمدة القناة الواحدة. 5. ألصقها في النموذج الرسمي بـ (لصق\nخاص ← قيم فقط)، بنفس ترتيب أعمدته، واحفظ ملفاً لكل قناة. مهم: الفيديو يذكر رمز النجف فقط. لم\nأضع رموز بقية المحافظات تخميناً، لأن رمزاً واحداً خاطئاً يكفي لرفض الملف.\nتُنقل من النموذج الرسمي مرة واحدة ثم تُستخدم دائماً."}, {"title": "أسباب رفض الملف", "time": "", "html": "<blockquote>\n<p><strong>◂<\/strong> استخدام ملف غير النموذج المحمّل من\nالنظام، أو تغيير ترتيب أعمدته.<\/p>\n<p><strong>◂<\/strong> كتابة اسم المحافظة أو الجنس أو\nالجنسية بدل الرمز.<\/p>\n<p><strong>◂<\/strong> ترك حقل الاسم الرباعي فارغاً أو\nكتابة الاسم فيه ناقصاً.<\/p>\n<p><strong>◂<\/strong> خلط طلبة أكثر من قناة قبول في ملف\nواحد.<\/p>\n<\/blockquote>", "text": "◂ استخدام ملف غير النموذج المحمّل من\nالنظام، أو تغيير ترتيب أعمدته. ◂ كتابة اسم المحافظة أو الجنس أو\nالجنسية بدل الرمز. ◂ ترك حقل الاسم الرباعي فارغاً أو\nكتابة الاسم فيه ناقصاً. ◂ خلط طلبة أكثر من قناة قبول في ملف\nواحد."}, {"title": "قائمة تدقيق قبل الرفع", "time": "", "html": "<div class=\"tw\"><table>\n<colgroup>\n<col/>\n<col/>\n<col/>\n<col/>\n<\/colgroup>\n<thead>\n<tr>\n<th><strong>#<\/strong><\/th>\n<th><strong>البند<\/strong><\/th>\n<th><strong>المكان<\/strong><\/th>\n<th><strong>تم<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>تحميل نموذج بيانات الطلبة من النظام<\/th>\n<th>رفع ومعالجة<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>الأسماء الأربعة واسم الأم الثلاثي مكتملة<\/th>\n<th>النموذج<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>الجنس والمحافظة والجنسية أرقام لا أسماء<\/th>\n<th>النموذج<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>الاسم الرباعي كاملاً في حقل واحد<\/th>\n<th>النموذج<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>الهاتف والبريد والرقم الامتحاني مكتوبة<\/th>\n<th>النموذج<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>ملف مستقل لكل قناة قبول<\/th>\n<th>Excel<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>الهيكل التنظيمي وحالة القبول (مستمر)<\/th>\n<th>واجهة الرفع<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>8<\/th>\n<th>القناة والسنة والبرنامج والمرحلة مطابقة\nللملف<\/th>\n<th>واجهة الرفع<\/th>\n<th>☐<\/th>\n<\/tr>\n<tr>\n<th>9<\/th>\n<th>رفع وإضافة لكل ملف<\/th>\n<th>واجهة الرفع<\/th>\n<th>☐<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>", "text": "# البند المكان تم 1 تحميل نموذج بيانات الطلبة من النظام رفع ومعالجة ☐ 2 الأسماء الأربعة واسم الأم الثلاثي مكتملة النموذج ☐ 3 الجنس والمحافظة والجنسية أرقام لا أسماء النموذج ☐ 4 الاسم الرباعي كاملاً في حقل واحد النموذج ☐ 5 الهاتف والبريد والرقم الامتحاني مكتوبة النموذج ☐ 6 ملف مستقل لكل قناة قبول Excel ☐ 7 الهيكل التنظيمي وحالة القبول (مستمر) واجهة الرفع ☐ 8 القناة والسنة والبرنامج والمرحلة مطابقة\nللملف واجهة الرفع ☐ 9 رفع وإضافة لكل ملف واجهة الرفع ☐"}], "tabs": ["stu_info"], "added": "31/10/2026", "updated": ""}, {"id": "poly", "short": "تسجيل طلبة البوليتكنك", "title": "دليل إدارة تسجيل طلبة كليات البوليتكنك في\nنظام SIS", "subtitle": "إنشاء البرنامج التكميلي وتسجيل خريجي الدبلوم\nفي المرحلة الثالثة", "source": "أُعدّ من فيديو: نظام إدارة معلومات الطلاب - آلية عمل\nكليات البوليتكنك في النظام (16 دقيقة تقريباً)", "sections": [{"title": "نظرة عامة", "time": "", "html": "<p>برامج كليات البوليتكنك الحالية برامج دبلوم بمرحلتين.\nالطالب الذي يتخرج من الدبلوم إما أن يكتفي بشهادة الدبلوم، أو يكمل\nالمرحلتين الثالثة والرابعة للحصول على البكالوريوس. لكي يُنقل هذا الطالب\nفي النظام دون انقطاع في سيرته الدراسية، يُنشأ للبكالوريوس برنامج تكميلي\nمرتبط ببرنامج الدبلوم، ولا يُنشأ برنامج بكالوريوس منفصل.<\/p><p>الخطوات أدناه بالترتيب الذي جاءت به في الفيديو، ومع\nكل خطوة توقيتها التقريبي.<\/p><p><img alt=\"مخطط توضيحي\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRm71AABXRUJQVlA4IGL1AABQ2wOdASoyBEwEPnk8mUmkoysiI5LZiWAPCWdu/FFLTgz5Ae4FzFK+MUpj/0+AvHvwb+3/lfTq5R8MuBPWa/hd7Xun/X8u/o3zq/7f1N/07/bewD/bfLS/dz3Qf4b/zeoP9wf3T91//U/uP
